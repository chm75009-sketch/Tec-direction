<!--
  LE CLASSEUR, EN PREMIER ET SANS CHAPEAU.

  C'est l'écran 5 de la maquette validée le 8 septembre 2026
  (epreuve/maquette.html) : les deux téléchargements en premier, quatre
  champs en tête qui redessinent le classeur à chaque frappe, puis les
  rubriques du décret en vrais tableaux, qui défilent dans leur cadre et
  jamais avec la page. Ici, chaque case se remplit à l'écran et reste sur ce
  poste (localStorage « bdese-base ») : le classeur téléchargé emporte ce qui
  a été saisi. Sous le classeur, deux replis d'action, la paie à reprendre et
  la mise à disposition, puis le repli « Voir le texte de loi ».

  Rien d'autre : ni chapeau, ni étape, ni exposé du droit avant d'agir.

  LA GRILLE N'EST PAS ÉCRITE ICI. Elle est découpée du texte du décret par
  moteur/bdese/contenu-bdese.js, dont la couverture est mesurée à cent pour
  cent sur les deux articles, et servie par docs/moteur-bdese.js. La clé de
  chaque case (thème, section, sujet, rang, année) est celle des versions
  précédentes de cette page : ce qui avait été saisi est retrouvé.

  Rien ne quitte ce poste.

  LES ARTICLES, LUS AU RELAIS LÉGIFRANCE DE L'APPLICATION (filtre par le nom
  du code, lectures espacées et concordantes, contenu vérifié et non le seul
  numéro). Le 8 septembre 2026, deux lectures chacun, puis deux lectures
  espacées de plus dans la journée, mêmes identifiants :

    L. 2312-2   LEGIARTI000035650754   attributions récurrentes à cinquante salariés, douze mois
    L. 2312-18  LEGIARTI000052437125   la base rassemble les informations nécessaires aux consultations
    L. 2312-21  LEGIARTI000043975329   l'accord, et les dix thèmes du plancher (alinéa 3)
    L. 2312-36  LEGIARTI000048533625   à défaut d'accord : accès permanent, thèmes, six années
    R. 2312-10  LEGIARTI000036411580   année en cours, deux précédentes, trois suivantes, tendances
    R. 2312-12  LEGIARTI000036411586   support informatique ou papier selon l'effectif

  Le 7 septembre 2026, trois lectures chacun, relus deux fois le 8 septembre 2026 :

    R. 2312-8   LEGIARTI000049905537   contenu supplétif, moins de trois cents salariés
    R. 2312-9   LEGIARTI000049905524   contenu supplétif, au moins trois cents salariés
-->

<style>
  /* Ce qui est propre à cette page. Tout le reste vient de style.css. */
  main.wrap{padding-bottom:var(--e7)}
  @media (min-width:900px){main.wrap{max-width:1080px}}
  #classeur{margin:var(--e4) 0 0}
  #classeur .barre{margin:0 0 var(--e4)}

  .champs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 var(--e4)}
  .champs label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--texte-2)}
  .champs input,.champs select,.champs textarea{font-size:16px;padding:10px 12px;min-height:44px;width:100%;box-sizing:border-box;
    border-radius:10px;border:1px solid var(--filet-2);background:var(--surface);color:var(--encre);font-family:inherit}
  .champs label.attend input{border-color:var(--accent);background:var(--accent-clair)}
  .champs label.large{grid-column:1/-1}
  .champs textarea{min-height:90px;resize:vertical;line-height:1.45}
  @media (min-width:700px){.champs{grid-template-columns:2fr 1fr 1fr 1fr}.champs.acces{grid-template-columns:1fr 1fr 1fr 1fr}}

  /* Une rubrique : un cadre, son titre, et le tableau qui défile dedans. */
  .rb{border:1px solid var(--filet);border-radius:12px;margin:0 0 12px;background:var(--surface);overflow:hidden}
  .rb>.tt{padding:11px 14px;border-bottom:1px solid var(--filet);display:flex;
    justify-content:space-between;gap:12px;align-items:baseline}
  .rb>.tt h3{margin:0;font:600 16px/1.3 system-ui;color:var(--encre)}
  .rb>.tt .n{font-size:13px;color:var(--texte-2);white-space:nowrap}
  .rb>.tt .n.pleine{color:var(--vert)}
  .grille-tab{overflow:auto;max-height:70vh;-webkit-overflow-scrolling:touch}
  table.g{border-collapse:separate;border-spacing:0;font-size:14px;background:var(--surface);min-width:100%}
  table.g th,table.g td{border-bottom:1px solid var(--filet);border-right:1px solid var(--filet);
    padding:7px 9px;text-align:left;vertical-align:top;line-height:1.35}
  table.g thead th{position:sticky;top:0;z-index:2;background:var(--creux);font:600 12.5px/1.3 system-ui;
    color:var(--texte-2);white-space:nowrap}
  table.g thead th small{display:block;font-weight:400;font-size:11.5px}
  table.g thead th.persp{color:var(--ambre)}
  table.g th.info,table.g td.info{position:sticky;left:0;z-index:1;background:var(--surface);
    min-width:190px;max-width:250px;box-shadow:1px 0 0 var(--filet)}
  table.g thead th.info{z-index:3;background:var(--creux)}
  table.g td.vide{min-width:96px;background:var(--zebre);padding:3px 4px}
  table.g td.vide:last-child{min-width:190px}
  /* 16 px au moins : sous cette taille, l'iPhone zoome de lui-même dès qu'on
     entre dans une case, et le classeur, qui défile déjà de côté, part de
     travers. Mesuré le 15 septembre 2026 sur les cinq cent quarante cases. */
  table.g td.vide input{width:100%;min-width:88px;box-sizing:border-box;font:16px/1.3 system-ui;padding:7px 6px;
    border:1px solid transparent;border-radius:6px;background:transparent;color:var(--encre);font-variant-numeric:tabular-nums}
  table.g td.vide:last-child input{min-width:180px}
  table.g td.vide input:focus{border-color:var(--accent);background:var(--surface);outline:none}
  table.g td.vide input.rempli{background:var(--vert-clair)}
  table.g tr.sec td{background:var(--accent-clair);color:var(--accent);font:600 13.5px/1.35 system-ui;border-right:0}
  table.g tr.suj td{background:var(--creux);font:600 13.5px/1.35 system-ui;color:var(--encre);border-right:0}
  table.g tr.mere td{background:#fff;font:600 13.5px/1.4 system-ui;color:var(--encre);border-right:0}
  table.g tr.tendance td.info{font-weight:600}
  table.g td.info small{display:block;font-weight:400;font-size:11.5px;color:var(--texte-2);margin-top:2px}
  table.g td.hors{min-width:96px;background:var(--creux);color:var(--texte-2);font-size:12.5px;text-align:center}
  table.g td.hors.gauche{min-width:190px;text-align:left;line-height:1.35}
  table.g tr.sous td.info{padding-left:22px;color:var(--texte-2)}
  @media (min-width:700px){
    table.g{font-size:14.5px}
    table.g th.info,table.g td.info{min-width:280px;max-width:420px}
  }

  /* Les replis sous le classeur : la paie, la mise à disposition, la loi. */
  details.repli{border-top:1px solid var(--filet);padding-top:10px;color:var(--texte-2);font-size:15px;margin:var(--e2) 0 0}
  details.repli summary{cursor:pointer;font-weight:600;color:var(--texte-2);min-height:40px;display:flex;align-items:center}
  details.repli .corps{padding:6px 0 var(--e4);color:var(--encre)}
  details.repli p{margin:0 0 10px;line-height:1.5}
  details.repli .vers{font-size:12px;color:var(--texte-2)}
  details.repli.loi{margin-bottom:var(--e6)}
  .paie textarea{width:100%;min-height:120px;box-sizing:border-box;font:16px/1.5 system-ui;padding:12px;
    border:1px solid var(--filet-2);border-radius:10px;background:var(--surface);color:var(--encre);resize:vertical;margin:0 0 10px}
  .paie select{font-size:16px;padding:10px 12px;min-height:44px;border-radius:10px;border:1px solid var(--filet-2);
    background:var(--surface);color:var(--encre);font-family:inherit;margin:0 0 10px;max-width:100%}
  .paie .barre{margin:0 0 var(--e3)}
  .tbl{overflow:auto;border:1px solid var(--filet);border-radius:10px;margin:0 0 12px}
  table.c{border-collapse:collapse;min-width:100%;font-size:14px;background:var(--surface)}
  table.c th,table.c td{border-bottom:1px solid var(--filet);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.35}
  table.c th{background:var(--creux);font:600 12.5px/1.3 system-ui;color:var(--texte-2);white-space:nowrap}
  table.c td small{display:block;color:var(--texte-2);font-size:12px}
  table.c label{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:13px}

  [hidden]{display:none !important}

  @media print{
    header.site,.barre,.champs,details.repli{display:none !important}
    main.wrap{max-width:none;padding:0}
    .grille-tab{max-height:none;overflow:visible}
    .rb{break-inside:avoid;border:0}
    table.g td.vide input{border:0}
  }
</style>

<header class="site">
  <div class="wrap">
    <p class="marque">Ma base de données</p>
    <div class="outils">
      <a href="index.html">Accueil</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">

  <section id="classeur">
    <div class="barre pile">
      <button type="button" id="dl-xlsx">Télécharger le classeur</button>
    </div>

    <form class="champs" id="champs" autocomplete="off" onsubmit="return false">
      <label>Entreprise<input type="text" id="ent" placeholder="dénomination sociale"></label>
      <label>Effectif<input type="number" id="eff" min="0" step="1" placeholder="salariés"></label>
      <label>Année en cours<input type="number" id="an" min="1990" max="2200" step="1"></label>
      <label>Un accord définit la base
        <select id="acc"><option value="non">non</option><option value="oui">oui</option></select></label>
    </form>

    <div id="rubriques"></div>

    <details class="repli paie"><summary>Reprendre la paie ou le registre du personnel</summary>
      <div class="corps">
        <select id="p-annee"></select>
        <!-- LE REGISTRE NOURRIT LA BASE. Les effectifs, la répartition par sexe,
             les contrats, les entrées et les sorties sont déjà écrits dans le
             registre unique du personnel : les retaper ici serait les écrire
             deux fois, et deux fois veut dire deux chiffres différents.
             Demande du 16 septembre 2026. -->
        <div class="barre pile">
          <button type="button" class="second" id="p-registre">Reprendre le registre du personnel</button>
          <!-- CE QUE LE REGISTRE SAIT DÉJÀ N'EST PAS À RETAPER.
               La base s'ouvrait entièrement vide, des centaines de cases à
               remplir à la main, alors que le registre porte les contrats, le
               sexe, la date de naissance et la date d'entrée de chacun.
               Relevé le 26 septembre 2026. Ce bouton remplit les lignes qui se
               calculent sans aucune supposition : effectif au 31 décembre,
               mois par mois, par sexe, par âge, par ancienneté, contrats à
               durée indéterminée et déterminée, embauches et départs de
               l'année. Il ne touche jamais une case déjà remplie. -->
          <button type="button" id="p-poser">Remplir ce que le registre suffit à calculer</button>
        </div>
        <p id="p-dit-poser" class="vers"></p>
        <p id="p-dit-registre" class="vers"></p>
        <textarea id="p-source" placeholder="Un libellé, puis une valeur, par ligne&#10;Effectif total au 31/12&#9;412&#10;Nombre de salariés en contrat à durée indéterminée&#9;376"></textarea>
        <div class="barre pile">
          <button type="button" id="p-analyser">Chercher les correspondances</button>
        </div>
        <div id="p-resultat"></div>
      </div>
    </details>

    <details class="repli"><summary>Mise à disposition</summary>
      <div class="corps">
        <form class="champs acces" id="acces" autocomplete="off" onsubmit="return false">
          <label>Support
            <select id="a-support"><option value=""></option><option>Informatique</option><option>Papier</option><option>Les deux</option></select></label>
          <label>Où elle se consulte<input type="text" id="a-lieu" placeholder="fichier, dossier partagé ou local"></label>
          <label>Accès ouvert depuis le<input type="date" id="a-depuis"></label>
          <label>Accès permanent
            <select id="a-permanent"><option value=""></option><option value="oui">oui</option><option value="non">non</option></select></label>
          <label>Qui tient la base à jour<input type="text" id="a-responsable" placeholder="nom et qualité"></label>
          <label>À quelle fréquence
            <select id="a-frequence"><option value=""></option><option>À chaque changement</option><option>Mensuelle</option>
              <option>Trimestrielle</option><option>Semestrielle</option><option>Annuelle</option></select></label>
          <label class="large">Qui y a accès, nominativement<textarea id="a-personnes" placeholder="un par ligne : nom, qualité, date d'ouverture de l'accès"></textarea></label>
          <label class="large">Informations présentées comme confidentielles<textarea id="a-confidentiel" placeholder="lesquelles, et pourquoi"></textarea></label>
          <label>Durée de la confidentialité<input type="text" id="a-duree" placeholder="jusqu'à quelle date, ou combien de temps"></label>
          <label class="large">Conservation et trace des consultations<textarea id="a-trace" placeholder="où sont gardées les versions successives, et ce qui est noté des consultations"></textarea></label>
        </form>
        <div id="verdict-acces"></div>
      </div>
    </details>

    <details class="repli loi"><summary>Voir le texte de loi</summary><div class="corps" id="loi"></div></details>
  </section>

</main>

<script src="moteur-bdese.js"></script>

<script>
(function () {
  "use strict";
  var AUD = (window.MoteurBDESE && window.MoteurBDESE.audit) || null;
  var P = window.Profil || null;
  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  /* ═══════════════════════════════════ ce qui est saisi reste sur ce poste */
  var CLE = "bdese-base";
  var E = (function () {
    try { return JSON.parse(localStorage.getItem(CLE) || "null") || {}; }
    catch (e) { return {}; }
  })();
  E.cadre = E.cadre || {};
  E.valeurs = E.valeurs || {};      /* clé de ligne : { année : valeur } */
  E.raisons = E.raisons || {};      /* clé de ligne : la raison de R. 2312-10 */
  E.acces = E.acces || {};
  function garder() { try { localStorage.setItem(CLE, JSON.stringify(E)); } catch (e) {} }

  /* La fiche entreprise sert de source : on ne redemande pas ce qui est su. */
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}
  if ((!profil || !profil.denomination) && P) profil = P.lire();
  if (!profil) profil = {};
  if (!E.cadre.nom) E.cadre.nom = profil.denomination || profil.entreprise || "";
  if ((E.cadre.effectif == null || E.cadre.effectif === "") && profil.effectif != null && profil.effectif !== "")
    E.cadre.effectif = profil.effectif;
  if (!E.cadre.annee) E.cadre.annee = new Date().getFullYear();

  var CTX = null;

  /* ---------------------------------------------------------------- */
  function nombre(v) {
    var s = String(v == null ? "" : v).trim();
    return s !== "" && isFinite(+s) ? Number(s) : null;
  }

  function contexte() {
    var c = {
      ent: $("#ent").value.trim(),
      eff: nombre($("#eff").value),
      an: nombre($("#an").value) || new Date().getFullYear(),
      accord: $("#acc").value === "oui",
    };
    /* Ce que la fiche d'entreprise dit de la forme juridique et du groupe :
       deux rubriques du décret y sont soumises, et elles sont alors écartées
       plutôt que demandées pour rien. Rien n'est deviné : une fiche muette
       laisse la ligne due. */
    c.fiche = { formeJuridique: profil.formeJuridique || "", groupe: profil.groupe || "" };
    c.mil = AUD ? AUD.millesimes(c.an) : [];
    /* L'effectif commande la grille : R. 2312-8 en deçà de trois cents
       salariés, R. 2312-9 à partir de trois cents. La grille du décret n'est
       due qu'à défaut d'accord. Sous accord, ou tant que l'effectif n'est pas
       connu, restent les dix thèmes de L. 2312-21, alinéa 3. */
    c.grille = AUD ? AUD.grilleDue(c.eff, c.accord) : null;
    c.plancher = (AUD && AUD.plancher) || [];
    return c;
  }

  /* Chaque ligne a une clé stable : le numéro du thème, la lettre de la
     section, celle du sujet, puis le rang de l'information. Elle survit à un
     rechargement, et elle ne bouge pas si le décret ne bouge pas. */
  /* CE QUE LE TEXTE DEMANDE, L'ÉCRAN LE DEMANDE AUSSI.

     Une information qui se lit « mois par mois » n'a pas une case par année
     mais douze ; une information qui se lit « par sexe » en a deux. La ligne
     du décret reste en tête, sans case, et les cases sont sur les lignes
     qu'elle appelle. Demande du 15 septembre 2026 : « il faut une cohérence
     entre ce qu'on demande et ce qu'on affiche ». */
  var MOIS_BDESE = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
    "août", "septembre", "octobre", "novembre", "décembre"];
  /* CE QUE LA LIGNE SE DÉCOMPOSE, QUAND LE DÉCRET LE DIT.

     Une information qui demande une répartition « par sexe » se déplie en
     deux lignes, Femmes et Hommes ; « mois par mois » en douze. Une relecture
     du 25 septembre 2026 a relevé que les répartitions par catégorie
     professionnelle, par âge et par ancienneté restaient, elles, sur une
     seule ligne : le client n'avait nulle part où porter le détail que le
     décret réclame pourtant dans la même phrase. On ne déplie que ce que la
     ligne demande, et rien de plus. */
  var CATEGORIES = ["Ouvriers", "Employés", "Techniciens et agents de maîtrise", "Cadres"];
  var AGES = ["Moins de 25 ans", "De 25 à 29 ans", "De 30 à 39 ans", "De 40 à 49 ans",
    "De 50 à 54 ans", "55 ans et plus"];
  var ANCIENNETES = ["Moins d'un an", "De 1 à moins de 3 ans", "De 3 à moins de 6 ans",
    "De 6 à moins de 10 ans", "10 ans et plus"];
  /* LES DOUZE MOIS NE SE DEMANDENT PAS POUR LES ANNÉES À VENIR.

     R. 2312-10 (LEGIARTI000036411580, relu le 25 septembre 2026) : les
     informations « sont présentées sous forme de données chiffrées ou, à
     défaut, pour les années suivantes, sous forme de grandes tendances ».
     Un effectif mois par mois en 2029 n'est ni l'un ni l'autre : la relecture
     du même jour a relevé que l'écran et le classeur le demandaient quand
     même, douze cases par année de perspective. Le détail mensuel reste donc
     sur les années réalisées et l'année en cours, et la ligne du décret
     elle-même reçoit la tendance des trois années suivantes.               */
  function mensuelle(info) { return /mois par mois/i.test(String(info || "")); }
  function prend(l, m) {
    if (!l.bornes) return true;
    var avenir = m.nature === "perspective";
    return l.bornes === "avenir" ? avenir : !avenir;
  }
  /* Une ligne porte des cases dès qu'elle n'est pas un simple intertitre. */
  function aCases(l) { return !l.mere || !!l.bornes; }

  /* Les quatre répartitions que le décret demande, et le mot qui les appelle.
     Une ligne peut en porter plusieurs : « par sexe et par qualification ». */
  var AXES = [
    { cle: "categorie", mot: /par cat[ée]gorie professionnelle|par cat[ée]gorie socioprofessionnelle|par qualification/i,
      nom: "Répartition par catégorie professionnelle", lib: CATEGORIES },
    /* « par âge » dans R. 2312-8, « selon l'ancienneté » dans R. 2312-9 : le
       décret dit la même chose de deux façons, et n'en reconnaître qu'une
       laissait la répartition sur la ligne qui l'annonce au lieu de celle qui
       la demande. Relevé le 25 septembre 2026. */
    { cle: "age", mot: /par [âa]ge|selon l['’][âa]ge/i, nom: "Répartition par âge", lib: AGES },
    { cle: "anciennete", mot: /par anciennet[ée]|selon l['’]anciennet[ée]/i,
      nom: "Répartition par ancienneté", lib: ANCIENNETES },
    /* Le décret écrit tantôt « par sexe », tantôt le sexe au milieu d'une
       énumération : « les effectifs intéressés par âge, sexe et niveau initial
       de formation ». Ne reconnaître que la première forme laissait ces
       lignes-là sans la distinction entre les femmes et les hommes. Relevé le
       25 septembre 2026. */
    { cle: "sexe", mot: /par sexe|[,:;]\s*sexe\b|\bet sexe\b|respectifs des femmes et des hommes|des femmes et des hommes/i,
      nom: "Répartition par sexe", lib: ["Femmes", "Hommes"] },
  ];
  /* DEUX RÉPARTITIONS DANS LA MÊME PHRASE SE CROISENT.

     « Répartition des effectifs par sexe et par qualification » : quatre
     catégories d'un côté, deux sexes de l'autre, cela fait huit cases, non
     six. Rendue en une seule liste — Ouvriers, Employés, TAM, Cadres, puis
     Femmes, Hommes — la ligne demandait deux totaux séparés et perdait
     justement ce que le décret veut voir, la place des femmes dans chaque
     catégorie. Relevé le 25 septembre 2026. Le sexe se croise donc avec ce
     qui l'accompagne, et reste seul quand il est seul. */
  function ventilation(info) {
    var t = String(info || "");
    if (mensuelle(t)) return MOIS_BDESE;
    var L = [], sexe = false;
    AXES.forEach(function (a) {
      if (!a.mot.test(t)) return;
      if (a.cle === "sexe") sexe = true; else L = L.concat(a.lib);
    });
    if (sexe && !L.length) L = ["Femmes", "Hommes"];
    else if (sexe) {
      var croise = [];
      L.forEach(function (lib) { croise.push(lib + ", femmes"); croise.push(lib + ", hommes"); });
      L = croise;
    }
    return L.length ? L : null;
  }

  function rubriques(c) {
    if (c.grille) {
      return c.grille.rubriques.map(function (r) {
        var lignes = [];
        (r.sections || []).forEach(function (s) {
          /* Les répartitions déjà portées, en propre, par une ligne de la
             section : c'est à elles que revient le détail, et non à l'intitulé
             qui les annonce. Dans la grille des trois cents salariés et plus,
             l'intitulé du sujet a) annonce l'âge et l'ancienneté, et c'est le
             sujet i) de la même section qui les demande ligne par ligne. */
          var axesSection = {};
          (s.sujets || []).forEach(function (su) {
            var dues = AUD && AUD.informationsDues ? AUD.informationsDues(su)
              : ((su.informations && su.informations.length) ? su.informations : [su.intitule]);
            dues.forEach(function (x) {
              if (String(x).trim() === String(su.intitule || "").trim()) return;
              AXES.forEach(function (a) { if (a.mot.test(String(x))) axesSection[a.cle] = true; });
            });
          });
          (s.sujets || []).forEach(function (su) {
            /* Ce qui est dû, et rien d'autre : le commentaire du décret, sa
               nomenclature et ses notes de bas de page restent dans les données
               mais ne se demandent pas au client. Et le sujet perd le premier
               indicateur qui lui était collé, celui-ci retrouvant sa ligne.
               Posé le 25 septembre 2026. */
            var infos = AUD && AUD.informationsDues ? AUD.informationsDues(su)
              : ((su.informations && su.informations.length) ? su.informations : [su.intitule]);
            if (!infos.length) return;
            var base = r.n + "/" + (s.lettre || "-") + "/" + (su.lettre || "-") + "/";
            /* Une section sans titre propre ne porte que sa lettre : sa
               « tête » n'est que le début de la première phrase, et l'écrire
               en titre donnait « …des sociétés du » au-dessus de cette même
               phrase. Relevé le 25 septembre 2026. */
            var sec = s.sansTitre ? (s.lettre ? s.lettre + "." : "")
              : ((s.lettre ? s.lettre + ". " : "") + s.titre);
            var titreEntier = String(su.intitule || "");
            /* UNE RÉPARTITION NE SE DEMANDE PAS DEUX FOIS.

               Dans la grille des trois cents salariés et plus, le sujet a)
               s'intitule « Evolution des effectifs par type de contrat, par
               âge, par ancienneté » et ses informations comptent déjà
               « Répartition par âge de l'effectif total au 31/12 ». Les six
               tranches sortaient deux fois, sous l'intitulé puis sous la
               ligne qui les demande vraiment. Relevé le 25 septembre 2026 :
               la ligne qui n'est que l'intitulé cède la répartition à celle
               qui la porte en propre. */
            infos.forEach(function (i, k) {
              var suj = (su.lettre ? su.lettre + ") " : "") +
                (AUD && AUD.intituleDu ? AUD.intituleDu(su) : su.intitule);
              /* Le sujet ne se vide que s'il n'apporte rien : quand il répète
                 mot pour mot son information ET qu'il n'a pas de repère. Le
                 repère, lui, se garde : c'est par lui qu'on retrouve la ligne
                 dans le décret. Relevé le 25 septembre 2026. */
              if (!su.lettre && suj.trim() === String(i).trim()) suj = "";
              else if (su.lettre && suj.replace(/^[a-z]+\)\s*/i, "").trim() === String(i).trim())
                suj = su.lettre + ")";
              /* Une ligne qui commence par l'intitulé de son sujet ne le
                 répète pas, mais elle garde son repère : sans le « c) », on ne
                 retrouve plus la ligne dans le décret. Relevé le 25 septembre
                 2026. */
              else if (su.lettre && amorce(suj, i)) suj = su.lettre + ")";
              var v = ventilation(i);
              if (v && !mensuelle(i) && String(i).trim() === titreEntier.trim()) {
                var reste = [];
                AXES.forEach(function (a) {
                  if (a.mot.test(String(i)) && !axesSection[a.cle]) reste = reste.concat(a.lib);
                });
                v = reste.length ? reste : null;
              }
              var mois = !!v && mensuelle(i);
              /* La raison de R. 2312-10 quand la ligne ne concerne pas
                 l'entreprise : la condition est dans le libellé du décret
                 (« Pour les entreprises soumises à L. 225-115… », « Pour les
                 entreprises appartenant à un groupe… »), et la réponse est
                 dans la fiche. Le titre de la rubrique en fait partie : le
                 9° porte la condition, ses sections ne la répètent pas. */
              var hors = (AUD && AUD.sansObjet)
                ? AUD.sansObjet(r.titre + " ; " + sec + " ; " + suj + " ; " + i, c.fiche) : null;
              lignes.push({ cle: base + k, section: sec, secNue: !!s.sansTitre, sujet: suj, info: i,
                mere: !!v, bornes: mois ? "avenir" : null, hors: hors });
              if (v) v.forEach(function (lib, j) {
                lignes.push({ cle: base + k + "/" + j, section: sec, secNue: !!s.sansTitre,
                  sujet: suj, info: lib, mere2: i, sous: true,
                  bornes: mois ? "passe" : null, hors: hors });
              });
            });
            /* CE QUE LE SUJET DEMANDE ET QUE SES LIGNES NE PORTENT PAS.

               « Evolution des effectifs par type de contrat, par âge, par
               ancienneté » : la répartition vaut pour le sujet entier, et
               aucune de ses huit informations ne répète les mots « par âge »
               ou « par ancienneté ». Les tranches d'âge se sont donc
               retrouvées sur la seule ligne qui les nommait, celle de
               l'alternance, et l'ancienneté n'avait aucune ligne. Relevé le
               25 septembre 2026. Ce qui manque est ajouté ici, une fois par
               sujet, et seulement si aucune de ses lignes ne le porte déjà. */
            var tousTextes = infos.join(" ");
            /* La répartition se cherche dans l'intitulé ENTIER du sujet, non
               dans sa forme courte : « Evolution des effectifs par type de
               contrat, par âge, par ancienneté » s'affiche « Evolution des
               effectifs par type de contrat », et c'est la fin de la phrase
               qui appelle les tranches. */
            var titreSujet = String((AUD && AUD.intituleDu ? AUD.intituleDu(su) : su.intitule) || "");
            AXES.forEach(function (ax, rang) {
              if (!ax.mot.test(titreEntier) || ax.mot.test(tousTextes)) return;
              var suj2 = (su.lettre ? su.lettre + ") " : "") + titreSujet;
              var cle2 = base + "axe" + rang;
              lignes.push({ cle: cle2, section: sec, secNue: !!s.sansTitre, sujet: suj2,
                info: ax.nom, mere: true, hors: null });
              ax.lib.forEach(function (lib, j) {
                lignes.push({ cle: cle2 + "/" + j, section: sec, secNue: !!s.sansTitre,
                  sujet: suj2, info: lib, mere2: ax.nom, sous: true, hors: null });
              });
            });
          });
        });
        if (!lignes.length) lignes.push({ cle: r.n + "/-/-/0", section: "", sujet: "", info: r.titre });
        return { n: r.n,
          titre: (AUD && AUD.titreRubrique) ? AUD.titreRubrique(r) : r.titre,
          onglet: (AUD && AUD.titreOnglet) ? AUD.titreOnglet(r) : r.titre,
          lignes: lignes };
      });
    }
    return c.plancher.map(function (t, i) {
      var titre = t.charAt(0).toUpperCase() + t.slice(1);
      return { n: i + 1, titre: titre, onglet: titre,
        lignes: [{ cle: "p/" + i, section: "", sujet: "", info: titre }] };
    });
  }

  function valeur(cle, annee) {
    var v = E.valeurs[cle];
    return v && v[annee] != null ? String(v[annee]) : "";
  }
  function raison(cle) { return E.raisons[cle] != null ? String(E.raisons[cle]) : ""; }

  /* Un titre de section ou de sujet qui est lui-même la ligne à renseigner
     ne s'écrit qu'une fois : « A. Environnement » puis « Environnement »
     serait la même chose deux fois. */
  function sansLettre(t) { return String(t || "").replace(/^([A-Z]+\.|[a-z]+\))\s*/, ""); }
  function entetes(c) {
    return ["Section", "Sujet", "Information"]
      .concat(c.mil.map(function (m) { return m.annee + " (" + m.nature + ")"; }))
      .concat(["Ne peut être renseigné : raison (R. 2312-10)"]);
  }

  function texteApplicable(c) {
    if (c.grille)
      return c.grille.article === "R2312-9"
        ? "R. 2312-9, à défaut d'accord, au moins trois cents salariés"
        : "R. 2312-8, à défaut d'accord, moins de trois cents salariés";
    return c.accord
      ? "L'accord de l'article L. 2312-21. Les dix thèmes du plancher de son alinéa 3 restent dus."
      : "Les dix thèmes du plancher de L. 2312-21, alinéa 3. L'effectif ouvrira la grille du décret.";
  }

  /* ---------------------------------------------------------------- */
  /* Le classeur à l'écran : un tableau par rubrique, qui défile dans son
     cadre, une case à remplir par année. La colonne de l'information reste
     fixée à gauche pendant que les six années défilent. */
  function rendre() {
    var liste = rubriques(CTX);
    var nbCol = 1 + CTX.mil.length + 1;

    var head = '<tr><th class="info">Information</th>' +
      CTX.mil.map(function (m) {
        return '<th' + (m.nature === "perspective" ? ' class="persp"' : "") + ">" + m.annee +
          "<small>" + ech(m.nature) + "</small></th>";
      }).join("") + "<th>Ne peut être renseigné<small>raison (R. 2312-10)</small></th></tr>";

    $("#rubriques").innerHTML = liste.map(function (r) {
      var corps = "", sec = null, suj = null, pleines = 0;
      r.lignes.forEach(function (l) {
        if (l.section && l.section !== sec) {
          sec = l.section; suj = null;
          if (!l.secNue && !amorce(l.section, l.info))
            corps += '<tr class="sec"><td class="info">' + ech(l.section) + '</td><td colspan="' + (nbCol - 1) + '"></td></tr>';
        }
        if (l.sujet && l.sujet !== suj) {
          suj = l.sujet;
          if (!amorce(l.sujet, l.info))
            corps += '<tr class="suj"><td class="info">' + ech(l.sujet) + '</td><td colspan="' + (nbCol - 1) + '"></td></tr>';
        }
        if (!aCases(l)) {
          corps += '<tr class="mere"><td class="info">' + ech(l.info) + '</td><td colspan="' +
            (nbCol - 1) + '"></td></tr>';
          return;
        }
        var une = false;
        corps += '<tr class="' + (l.mere ? "tendance" : (l.sous ? "sous" : "")) + '"><td class="info">' +
          ech(l.info) +
          (l.bornes === "avenir" ? "<small>les trois années à venir, en grandes tendances (R. 2312-10)</small>" : "") +
          "</td>" +
          CTX.mil.map(function (m) {
            if (l.hors)
              return '<td class="hors" title="' + ech(l.hors) + '">non applicable</td>';
            if (!prend(l, m))
              return '<td class="hors" title="' + ech(l.bornes === "passe"
                ? "Le détail mois par mois porte sur les années réalisées et l'année en cours ; les trois années à venir se présentent en grandes tendances sur la ligne du décret (R. 2312-10)."
                : "Le détail de cette année est porté mois par mois sur les douze lignes qui suivent.") +
                '">sans objet</td>';
            var v = valeur(l.cle, m.annee);
            if (v.trim()) une = true;
            return '<td class="vide"><input data-ligne="' + ech(l.cle) + '" data-annee="' + m.annee + '"' +
              (v.trim() ? ' class="rempli"' : "") + ' value="' + ech(v) + '" aria-label="' + ech(l.info + ", " + m.annee) + '"></td>';
          }).join("") +
          (l.hors
            ? '<td class="hors gauche">' + ech(l.hors) + "</td>"
            : '<td class="vide"><input data-raison="' + ech(l.cle) + '" value="' + ech(raison(l.cle)) + '"' +
              (raison(l.cle).trim() ? ' class="rempli"' : "") + ' aria-label="' + ech(l.info + ", raison") + '"></td>') +
          "</tr>";
        if (l.hors || une || raison(l.cle).trim()) pleines++;
      });
      var aRemplir = r.lignes.filter(aCases).length;
      return '<div class="rb"><div class="tt"><h3>' + r.n + ". " + ech(r.titre) + "</h3>" +
        '<span class="n' + (pleines === aRemplir ? " pleine" : "") + '">' + pleines + " / " + aRemplir + "</span></div>" +
        '<div class="grille-tab"><table class="g"><thead>' + head + "</thead><tbody>" + corps +
        "</tbody></table></div></div>";
    }).join("");

    $("#champs").querySelector("label:nth-child(1)").classList.toggle("attend", !CTX.ent);
    $("#champs").querySelector("label:nth-child(2)").classList.toggle("attend", CTX.eff === null);
    remplirAnnees();
  }

  /* Une case saisie est retenue tout de suite, sans redessiner le classeur :
     le curseur reste où il est. */
  $("#rubriques").addEventListener("input", function (ev) {
    var i = ev.target;
    if (!i || i.tagName !== "INPUT") return;
    var k = i.getAttribute("data-ligne"), a = i.getAttribute("data-annee"), r = i.getAttribute("data-raison");
    if (k && a) {
      E.valeurs[k] = E.valeurs[k] || {};
      if (i.value.trim() === "") delete E.valeurs[k][a]; else E.valeurs[k][a] = i.value;
    } else if (r) {
      if (i.value.trim() === "") delete E.raisons[r]; else E.raisons[r] = i.value;
    } else return;
    i.className = i.value.trim() ? "rempli" : "";
    garder();
  });
  $("#rubriques").addEventListener("change", function () { if (CTX) compter(); });
  /* Le compte en tête de chaque rubrique suit la saisie. */
  function compter() {
    var liste = rubriques(CTX);
    var titres = document.querySelectorAll("#rubriques .rb .n");
    liste.forEach(function (r, i) {
      var n = 0, aRemplir = 0;
      r.lignes.forEach(function (l) {
        if (!aCases(l)) return;
        aRemplir++;
        var v = E.valeurs[l.cle] || {};
        if (l.hors || Object.keys(v).some(function (a) { return String(v[a]).trim() !== ""; }) || raison(l.cle).trim()) n++;
      });
      if (titres[i]) { titres[i].textContent = n + " / " + aRemplir; titres[i].className = "n" + (n === aRemplir ? " pleine" : ""); }
    });
  }

  /* ---------------------------------------------------------------- */
  /* LE CLASSEUR .XLSX, ÉCRIT À LA MAIN.

     Pas de bibliothèque : un .xlsx est une archive zip de quelques fichiers
     XML, et les entrées y sont stockées telles quelles, sans compression.
     Le même procédé est repris dans docs/audit-bdese.html et
     docs/controler-bdese.html. */
  var TABLE = (function () {
    var t = new Uint32Array(256), c, n, k;
    for (n = 0; n < 256; n++) { c = n;
      for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u) { var c = 0xFFFFFFFF;
    for (var i = 0; i < u.length; i++) c = TABLE[(c ^ u[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0; }
  function octets(s) { return new TextEncoder().encode(s); }

  function zip(entrees) {
    var parts = [], centre = [], offset = 0;
    function w16(v) { return [v & 255, (v >> 8) & 255]; }
    function w32(v) { return [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]; }
    entrees.forEach(function (e) {
      var nom = octets(e.nom), data = octets(e.contenu), crc = crc32(data);
      var local = [].concat(w32(0x04034b50), w16(20), w16(0), w16(0), w16(0), w16(0),
        w32(crc), w32(data.length), w32(data.length), w16(nom.length), w16(0));
      parts.push(new Uint8Array(local), nom, data);
      centre.push({ nom: nom, crc: crc, taille: data.length, offset: offset });
      offset += local.length + nom.length + data.length;
    });
    var debutCentre = offset, centreOctets = [];
    centre.forEach(function (c) {
      var h = [].concat(w32(0x02014b50), w16(20), w16(20), w16(0), w16(0), w16(0), w16(0),
        w32(c.crc), w32(c.taille), w32(c.taille), w16(c.nom.length),
        w16(0), w16(0), w16(0), w16(0), w32(0), w32(c.offset));
      centreOctets.push(new Uint8Array(h), c.nom);
      offset += h.length + c.nom.length;
    });
    var fin = new Uint8Array([].concat(w32(0x06054b50), w16(0), w16(0),
      w16(centre.length), w16(centre.length), w32(offset - debutCentre), w32(debutCentre), w16(0)));
    var tout = parts.concat(centreOctets, [fin]);
    var total = tout.reduce(function (n, x) { return n + x.length; }, 0);
    var out = new Uint8Array(total), p = 0;
    tout.forEach(function (x) { out.set(x, p); p += x.length; });
    return out;
  }

  var echX = function (s) {
    return String(s == null ? "" : s)
      .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  function colonne(n) {
    var s = "";
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - r - 1) / 26; }
    return s;
  }
  /* Excel refuse un nom d'onglet de plus de trente et un caractères, et les
     signes : \ / ? * [ ]. On coupe sur un espace pour ne pas laisser un mot
     tranché en deux, et on écarte les doublons. */
  /* Les onglets tiennent en trente et un caractères. Coupés net, ils
     donnaient « 5 Activités sociales et », « 6 Rémunération des », « 7 Flux
     financiers à » : relevé le 25 septembre 2026. On retire donc les mots
     creux de la fin. */
  var MOTS_CREUX = ["et", "de", "des", "du", "à", "au", "aux", "la", "le", "les",
    "en", "dans", "pour", "par", "sur", "un", "une"];
  function nomOnglet(t, pris) {
    var s = String(t || "Feuille").replace(/[\\\/\?\*\[\]:]/g, " ").replace(/\s+/g, " ").trim();
    if (s.length > 31) {
      s = s.slice(0, 31);
      var e = s.lastIndexOf(" ");
      if (e > 12) s = s.slice(0, e);
      var mots = s.split(" ");
      while (mots.length > 2 &&
             MOTS_CREUX.indexOf(mots[mots.length - 1].toLowerCase()) >= 0) mots.pop();
      s = mots.join(" ");
    }
    s = s.replace(/[\s,;.\-]+$/, "");
    if (!s) s = "Feuille";
    var base = s, i = 2;
    while (pris[s.toLowerCase()]) { s = base.slice(0, 26) + " " + i; i++; }
    pris[s.toLowerCase()] = true;
    return s;
  }
  /* La feuille : des cadres sur chaque cellule, l'en-tête en gras sur fond
     gris, le titre de l'onglet en plus grand, le texte qui revient à la
     ligne, et la ligne d'en-tête figée.
     Styles (xl/styles.xml) : 1 = titre, 2 = en-tête, 3 = cellule cadrée. */
  function proprietesXlsx() {
    var d = new Date().toISOString().slice(0, 19) + "Z";
    var e = document.getElementById("ent");
    var qui = (e && e.value.trim()) || "";
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"' +
      ' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"' +
      ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
      "<dc:title>Base de données économiques, sociales et environnementales</dc:title>" +
      "<dc:creator>" + echX(qui) + "</dc:creator>" +
      "<cp:lastModifiedBy>" + echX(qui) + "</cp:lastModifiedBy>" +
      '<dcterms:created xsi:type="dcterms:W3CDTF">' + d + "</dcterms:created>" +
      '<dcterms:modified xsi:type="dcterms:W3CDTF">' + d + "</dcterms:modified>" +
      "</cp:coreProperties>";
  }
  function feuilleXml(lignes, largeurs) {
    var x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>';
    function pleines(l) { return (l || []).filter(function (c) { return c !== null && c !== undefined && c !== ""; }).length; }
    var tete = -1;
    lignes.forEach(function (l, i) { if (tete < 0 && pleines(l) >= 4) tete = i; });
    if (tete >= 0) {
      x += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="' + (tete + 1) +
        '" topLeftCell="A' + (tete + 2) + '" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
    }
    x += '<sheetFormatPr defaultRowHeight="15"/>';
    if (largeurs && largeurs.length) {
      x += "<cols>";
      largeurs.forEach(function (l, i) {
        x += '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + l + '" customWidth="1"/>';
      });
      x += "</cols>";
    }
    x += "<sheetData>";
    var nbCol = Math.max.apply(null, lignes.map(function (l) { return (l || []).length; }).concat([1]));
    lignes.forEach(function (ligne, i) {
      var vide = !(ligne || []).some(function (c) { return c !== null && c !== undefined && c !== ""; });
      if (vide) { x += '<row r="' + (i + 1) + '"/>'; return; }
      var titre = (i === 0 && pleines(ligne) === 1);
      var clair = tete >= 0 && (i - tete) % 2 === 0;
      var ouvre = tete >= 0 && i > tete &&
        ((ligne[0] !== null && ligne[0] !== undefined && ligne[0] !== "") ||
         (ligne[1] !== null && ligne[1] !== undefined && ligne[1] !== ""));

      regle(function (l) {
        return l.sous && String(l.info).trim().toLowerCase() === nom &&
          /effectif/i.test(String(l.mere2 || ""));
      }, presentsAu(L, jour).length);
    });

    /* Les six tranches d'âge et les cinq d'ancienneté, au 31 décembre. */
    var AGES = [[null, 25], [25, 30], [30, 40], [40, 50], [50, 55], [55, null]];
    ["Moins de 25 ans", "De 25 à 29 ans", "De 30 à 39 ans", "De 40 à 49 ans",
     "De 50 à 54 ans", "55 ans et plus"].forEach(function (lib, i) {
      var bas = AGES[i][0], haut = AGES[i][1];
      regle(function (l) { return l.sous && l.info === lib && /[âa]ge/i.test(String(l.mere2 || "")); },
        c(au31, function (s) {
          var a = ageAu(s, fin);
          if (a === null) return false;
          return (bas === null || a >= bas) && (haut === null || a < haut);
        }));
    });
    var ANC = [[null, 1], [1, 3], [3, 6], [6, 10], [10, null]];
    ["Moins d'un an", "De 1 à moins de 3 ans", "De 3 à moins de 6 ans",
     "De 6 à moins de 10 ans", "10 ans et plus"].forEach(function (lib, i) {
      var bas = ANC[i][0], haut = ANC[i][1];
      regle(function (l) { return l.sous && l.info === lib && /anciennet/i.test(String(l.mere2 || "")); },
        c(au31, function (s) {
          var a = ancienneteAu(s, fin);
          if (a === null) return false;
          return (bas === null || a >= bas) && (haut === null || a < haut);
        }));
    });

    /* Les répartitions par sexe : celles dont la ligne mère parle de
       l'effectif, non celles qui portent sur les promotions ou la formation,
       que le registre ne connaît pas. */
    [["Femmes", "f"], ["Hommes", "m"]].forEach(function (x) {
      regle(function (l) {
        return l.sous && l.info === x[0] && /effectif/i.test(String(l.mere2 || ""));
      }, c(au31, sexe(x[1])));
    });

    /* Les lignes entières du décret que le registre suffit à remplir. */
    regle(function (l) { return /nombre de salari[ée]s titulaires d'un contrat de travail à dur[ée]e ind[ée]termin[ée]e/i.test(l.info); },
      c(au31, nat("cdi")));
    regle(function (l) { return /nombre de salari[ée]s titulaires d'un contrat de travail à dur[ée]e d[ée]termin[ée]e/i.test(l.info); },
      c(au31, nat("cdd")));
    regle(function (l) { return /^nombre de salari[ée]s temporaires$/i.test(String(l.info).trim()); },
      c(au31, nat("temporaire")));
    regle(function (l) { return /effectif total au 31\/12|effectif total au 31 d[ée]cembre/i.test(l.info); },
      au31.length);
    regle(function (l) { return /nombre d'embauches/i.test(l.info) && !/cdi|dur[ée]e ind/i.test(l.info); },
      c(L, function (s) { var e = String(s.ent || "").slice(0, 10); return e >= debut && e <= fin; }));
    regle(function (l) { return /total des d[ée]parts|nombre de d[ée]parts/i.test(l.info); },
      c(L, function (s) { var so = String(s.sor || "").slice(0, 10); return so >= debut && so <= fin; }));
    return R;
  }

  $("#p-poser").addEventListener("click", function () {
    var annee = $("#p-annee").value;
    var R = calculsDuRegistre(annee);
    if (!R) {
      $("#p-dit-poser").textContent = "Le registre du personnel ne porte encore aucun salarié : " +
        "il s'ouvre depuis Gérer, puis Registre unique du personnel.";
      return;
    }
    var n = 0, dejà = 0;
    rubriques(CTX).forEach(function (r) {
      r.lignes.forEach(function (l) {
        if (l.mere && !l.bornes) return;
        if (l.hors) return;
        for (var i = 0; i < R.length; i++) {
          if (!R[i].quand(l)) continue;
          E.valeurs[l.cle] = E.valeurs[l.cle] || {};
          if (String(E.valeurs[l.cle][annee] || "").trim()) { dejà++; return; }
          E.valeurs[l.cle][annee] = R[i].valeur;
          n++;
          return;
        }
      });
    });
    if (n) { garder(); rendre(); }
    $("#p-dit-poser").textContent = n
      ? n + " case" + (n > 1 ? "s" : "") + " remplie" + (n > 1 ? "s" : "") + " pour " + annee +
        " à partir du registre" + (dejà ? ", " + dejà + " déjà renseignée" + (dejà > 1 ? "s" : "") + " et laissée" + (dejà > 1 ? "s" : "") + " telle" + (dejà > 1 ? "s" : "") + " quelle" + (dejà > 1 ? "s" : "") : "") +
        ". Le reste, le registre ne le sait pas : il reste à remplir."
      : "Rien à reprendre : ces lignes sont déjà remplies, ou le registre ne les calcule pas.";
  });

  $("#p-registre").addEventListener("click", function () {
    var annee = $("#p-annee").value;
    var t = lignesDuRegistre(annee);
    if (!t) {
      $("#p-dit-registre").textContent = "Le registre du personnel ne porte encore aucun salarié : " +
        "il s'ouvre depuis Gérer, puis Registre unique du personnel.";
      return;
    }
    $("#p-source").value = t;
    $("#p-dit-registre").textContent = "Onze lignes reprises du registre, comptées au 31 décembre " +
      annee + ". Vérifiez-les, puis cherchez les correspondances.";
    $("#p-analyser").click();
  });

  $("#p-analyser").addEventListener("click", function () {
    var annee = $("#p-annee").value;
    var lignes = $("#p-source").value.split("\n").map(function (l) {
      var p = l.split(/\t|;|\|/);
      return p.length >= 2 ? { lib: p[0].trim(), val: p.slice(1).join(" ").trim() } : null;
    }).filter(function (x) { return x && x.lib && x.val; });
    if (!lignes.length) {
      $("#p-resultat").innerHTML = '<div class="avis att"><b>Rien de lisible</b>' +
        "Chaque ligne porte un libellé, puis une valeur, séparés par une tabulation, un point-virgule ou une barre verticale.</div>";
      return;
    }
    var cibles = [];
    rubriques(CTX).forEach(function (r) {
      r.lignes.forEach(function (l) {
        cibles.push({ cle: l.cle, lib: l.info, mots: motsUtiles(l.info), theme: r.n + ". " + r.titre });
      });
    });
    var props = [], sans = [];
    lignes.forEach(function (l, idx) {
      var mots = motsUtiles(l.lib), meilleur = null, score = 0;
      cibles.forEach(function (c) {
        if (!c.mots.length) return;
        var communs = c.mots.filter(function (m) { return mots.indexOf(m) >= 0; }).length;
        var s = communs / Math.max(c.mots.length, mots.length);
        if (s > score) { score = s; meilleur = c; }
      });
      if (meilleur && score >= 0.5) props.push({ i: idx, source: l, cible: meilleur, score: score });
      else sans.push(l);
    });

    var h = "";
    if (props.length) {
      h += '<div class="tbl"><table class="c"><thead><tr><th>Votre libellé</th><th>Valeur</th>' +
        "<th>Ligne de la base</th><th>Proximité</th><th></th></tr></thead><tbody>";
      props.forEach(function (p, k) {
        h += "<tr><td>" + ech(p.source.lib) + "</td><td>" + ech(p.source.val) + "</td>" +
          "<td>" + ech(p.cible.lib) + "<small>" + ech(p.cible.theme) + "</small></td><td>" + Math.round(p.score * 100) + " %</td>" +
          '<td><label><input type="checkbox" data-prop="' + k + '" checked> retenir</label></td></tr>';
      });
      h += "</tbody></table></div>" +
        '<div class="barre pile"><button type="button" id="p-appliquer">Écrire les lignes retenues dans ' + ech(annee) + "</button></div>";
    } else {
      h += '<div class="avis att"><b>Aucune correspondance sûre</b>' +
        "Aucun libellé n'a atteint le seuil de proximité. Ces lignes se renseignent à la main dans le classeur.</div>";
    }
    if (sans.length)
      h += '<div class="avis att"><b>' + sans.length + " ligne" + (sans.length > 1 ? "s" : "") + " sans correspondance</b>" +
        ech(sans.slice(0, 12).map(function (l) { return l.lib; }).join(" · ")) + (sans.length > 12 ? " ..." : "") + "</div>";
    $("#p-resultat").innerHTML = h;

    var appl = $("#p-appliquer");
    if (appl) appl.addEventListener("click", function () {
      var n = 0;
      Array.prototype.forEach.call($("#p-resultat").querySelectorAll("[data-prop]"), function (cb) {
        if (!cb.checked) return;
        var p = props[Number(cb.getAttribute("data-prop"))];
        E.valeurs[p.cible.cle] = E.valeurs[p.cible.cle] || {};
        E.valeurs[p.cible.cle][annee] = p.source.val;
        n++;
      });
      garder();
      rendre();
      $("#p-resultat").innerHTML = '<div class="avis ok"><b>' + n + " ligne" + (n > 1 ? "s" : "") + " écrite" + (n > 1 ? "s" : "") +
        " pour " + ech(annee) + "</b>Elles sont dans le classeur, en vert.</div>";
    });
  });

  /* ---------------------------------------------------------------- */
  /* LA MISE À DISPOSITION : ce qui est saisi va sur la première feuille du
     classeur. Deux points sont relevés tout de suite, l'accès qui n'est pas
     permanent (L. 2312-36) et le papier à partir de trois cents salariés
     (R. 2312-12). */
  var ACCES = ["a-support", "a-lieu", "a-depuis", "a-permanent", "a-responsable",
    "a-frequence", "a-personnes", "a-confidentiel", "a-duree", "a-trace"];
  ACCES.forEach(function (id) {
    var el = document.getElementById(id);
    if (E.acces[id] != null) el.value = E.acces[id];
    el.addEventListener("input", function () { E.acces[id] = el.value; garder(); });
    el.addEventListener("change", function () { E.acces[id] = el.value; garder(); verdictAcces(); });
  });
  function verdictAcces() {
    var a = E.acces, m = [];
    if (a["a-permanent"] === "non")
      m.push('<div class="avis non"><b>L\'accès n\'est pas permanent</b>' +
        "La base est accessible en permanence aux membres de la délégation du personnel du comité, " +
        "à ceux du comité central et aux délégués syndicaux (L. 2312-36).</div>");
    if (a["a-support"] === "Papier" && CTX && CTX.eff !== null && CTX.eff >= 300)
      m.push('<div class="avis non"><b>Le support papier ne convient plus à cette taille</b>' +
        "À partir de trois cents salariés, la base est tenue sur support informatique (R. 2312-12).</div>");
    $("#verdict-acces").innerHTML = m.join("");
  }

  /* ---------------------------------------------------------------- */
  /* Le texte de loi, replié sous le classeur. Les passages cités sont ceux
     lus au relais Légifrance de l'application, avec la version lue. */
  $("#loi").innerHTML =
    "<p><b>L. 2312-36 du code du travail</b> <span class=\"vers\">(LEGIARTI000048533625, lu le 8 septembre 2026, deux lectures espacées)</span> : " +
    "« En l'absence d'accord prévu à l'article L. 2312-21, une base de données économiques, sociales et environnementales, " +
    "mise régulièrement à jour, rassemble un ensemble d'informations que l'employeur met à disposition du comité social et économique. " +
    "La base de données est accessible en permanence aux membres de la délégation du personnel du comité social et économique " +
    "ainsi qu'aux membres de la délégation du personnel du comité social et économique central d'entreprise, et aux délégués syndicaux. » " +
    "Et plus loin : « Ces informations portent sur les deux années précédentes et l'année en cours et intègrent des perspectives " +
    "sur les trois années suivantes. »</p>" +
    "<p><b>R. 2312-10</b> <span class=\"vers\">(LEGIARTI000036411580, lu le 8 septembre 2026, deux lectures espacées)</span> : " +
    "« En l'absence d'accord prévu à l'article L. 2312-21, les informations figurant dans la base de données portent sur l'année en cours, " +
    "sur les deux années précédentes et, telles qu'elles peuvent être envisagées, sur les trois années suivantes. Ces informations sont " +
    "présentées sous forme de données chiffrées ou, à défaut, pour les années suivantes, sous forme de grandes tendances. L'employeur indique, " +
    "pour ces années, les informations qui, eu égard à leur nature ou aux circonstances, ne peuvent pas faire l'objet de données chiffrées " +
    "ou de grandes tendances, pour les raisons qu'il précise. »</p>" +
    "<p><b>R. 2312-12</b> <span class=\"vers\">(LEGIARTI000036411586, lu le 8 septembre 2026, deux lectures espacées)</span> : " +
    "« En l'absence d'accord prévu à l'article L. 2312-21, la base de données est tenue à la disposition des personnes mentionnées au " +
    "dernier alinéa de l'article L. 2312-36 sur un support informatique pour les entreprises d'au moins trois cents salariés, et sur un " +
    "support informatique ou papier pour les entreprises de moins de trois cents salariés. »</p>" +
    "<p><b>L. 2312-21</b> <span class=\"vers\">(LEGIARTI000043975329, lu le 8 septembre 2026, deux lectures espacées)</span> : un accord d'entreprise, ou à défaut " +
    "de délégué syndical un accord entre l'employeur et le comité, « définit : 1° L'organisation, l'architecture et le contenu de la base " +
    "de données économiques, sociales et environnementales ». Et : « La base de données comporte au moins les thèmes suivants : " +
    "l'investissement social, l'investissement matériel et immatériel, l'égalité professionnelle entre les femmes et les hommes au sein " +
    "de l'entreprise, les fonds propres, l'endettement, l'ensemble des éléments de la rémunération des salariés et dirigeants, les " +
    "activités sociales et culturelles, la rémunération des financeurs, les flux financiers à destination de l'entreprise et les " +
    "conséquences environnementales de l'activité de l'entreprise. »</p>" +
    "<p><b>R. 2312-8</b> <span class=\"vers\">(LEGIARTI000049905537)</span> et <b>R. 2312-9</b> " +
    "<span class=\"vers\">(LEGIARTI000049905524)</span>, lus le 7 septembre 2026, relus le 8 : le contenu de la base à défaut d'accord, " +
    "au-dessous et à partir de trois cents salariés. Les rubriques, sections, sujets et lignes du classeur en sont le découpage, mot pour mot.</p>" +
    "<p><b>L. 2312-2</b> <span class=\"vers\">(LEGIARTI000035650754, lu le 8 septembre 2026, deux lectures espacées)</span> : " +
    "« Lorsque, postérieurement à la mise en place du comité social et économique, l'effectif de l'entreprise atteint au moins cinquante " +
    "salariés pendant douze mois consécutifs, le comité exerce l'ensemble des attributions récurrentes d'information et de consultation " +
    "définies par la section 3 à l'expiration d'un délai de douze mois à compter de la date à laquelle le seuil de 50 salariés a été atteint " +
    "pendant douze mois consécutifs. » La base de données, à l'article L. 2312-18 <span class=\"vers\">(LEGIARTI000052437125)</span>, " +
    "est dans cette section.</p>";

  /* ---------------------------------------------------------------- */
  /* Les champs en tête : la fiche entreprise pré-remplit ce qu'elle porte,
     et reçoit en retour ce qui est saisi ici. Chaque frappe redessine le
     classeur, sans perdre une case saisie. */
  (function prealable() {
    $("#ent").value = E.cadre.nom || "";
    $("#eff").value = E.cadre.effectif == null ? "" : E.cadre.effectif;
    $("#an").value = E.cadre.annee || new Date().getFullYear();
    $("#acc").value = E.cadre.accord === "oui" ? "oui" : "non";

    function majour() {
      E.cadre.nom = $("#ent").value.trim();
      E.cadre.effectif = $("#eff").value.trim();
      E.cadre.annee = $("#an").value.trim();
      E.cadre.accord = $("#acc").value;
      garder();
      CTX = contexte();
      rendre();
      verdictAcces();
      if (P) {
        var patch = {};
        if (CTX.ent) patch.denomination = CTX.ent;
        if (CTX.eff !== null) patch.effectif = CTX.eff;
        if (Object.keys(patch).length) P.ecrire(patch);
      }
    }
    $("#champs").addEventListener("input", majour);
    $("#champs").addEventListener("change", majour);

    CTX = contexte();
    rendre();
    verdictAcces();
    garder();
  })();
})();
</script>

  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });

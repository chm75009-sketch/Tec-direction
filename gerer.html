<!--
  Écran 4 et écran 5 de la maquette validée le 8 septembre 2026
  (epreuve/maquette.html).

  Écran 4 : une liste de documents types, groupés (Embaucher, Pendant le
  contrat, Sanctionner, Rompre, Collectif). Un mot, un document.

  Écran 5 : le document seul à l'écran, déjà rempli avec la fiche
  d'entreprise. Deux, trois ou quatre champs en tête, qui se glissent dans
  le texte à chaque frappe. Télécharger en Word, Imprimer, un repli « Voir
  le texte de loi », le bouton Retour.

  Pour les sanctions : la date des faits et la date à laquelle l'employeur
  en a eu connaissance, et le délai de deux mois de l'article L. 1332-4,
  calculé et affiché.

  Trois familles de documents :
  1. ceux que cette page écrit elle-même en blocs (contrats, sanctions,
     licenciements, ruptures, comité, accord) ;
  2. ceux que les générateurs de l'application produisent déjà
     (DocumentsProduits, dans documents-rh.js, documents-cse.js,
     documents-nao.js), chargés à la demande comme le fait parcours.js ;
  3. rien d'autre : un document sans générateur a été écrit ici.

  Les textes. Chaque article cité a été lu au relais Légifrance, deux fois
  à quelques minutes d'intervalle, avec le nom du code en filtre, et son
  identifiant de version LEGIARTI est dans la table TEXTES. Les articles
  déjà cités par la page avant le 8 septembre 2026 gardent l'identifiant
  de leur lecture du 7 septembre ; les autres ont été lus le 8 septembre.
  Les deux articles du code de la sécurité sociale sur la déclaration
  d'accident ont été lus au même relais, avec « Code de la sécurité
  sociale » en filtre, deux fois, et portent leur code à côté.

  Rien ne sort du poste : tout est calculé et rédigé dans le navigateur.
-->

<style>
  body{font-size:18px;line-height:1.45}

  .haut{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 0 10px;

  /* écran 4 : la liste */

  .doc-ligne{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;

  .doc-ligne:hover{background:var(--creux);color:var(--accent);border-color:var(--filet)}
  .doc-ligne::after{content:"\203A";color:var(--texte-2);font-size:24px;margin-left:10px;flex:none}

     parenthèses par entrée se lisaient mal sur un téléphone. */
  .doc-ligne .l{min-width:0}
  .doc-ligne .l small{display:block;font:400 var(--t2)/1.4 system-ui;color:var(--texte-2);margin-top:2px}

  .champs textarea{min-height:88px}

  .tableau-doc .sous-tab{font-size:14px;color:var(--texte-2);margin:0 0 10px}

  table.reg th{position:sticky;top:0;z-index:1;background:var(--creux);font:600 12.5px/1.3 system-ui;color:var(--texte-2);white-space:normal;min-width:120px}

  .dates{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .d{border:1px solid var(--filet);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;background:var(--surface)}
  .d.tard{border-left-color:var(--rouge)}
  /* PRESCRIT : ON NE PEUT PAS LE MANQUER. Demande du 16 septembre 2026,
     « si prescrit avertissement en rouge clignotant ». Sa propre classe, et
     non celle des échéances « au plus tard » : la première version faisait
     clignoter toutes les dates limites, y compris celles qui n'annoncent
     aucun problème. Le clignotement s'arrête pour qui a demandé des
     animations réduites ; la couleur et le mot restent, l'information ne
     dépendant pas du clignotement. */
  .d.prescrit{border-color:var(--rouge);border-left-color:var(--rouge);
    background:var(--rouge-clair);animation:bat 1.1s steps(1,end) infinite}
  .d.prescrit .q,.d.prescrit .v,.d.prescrit .f{color:var(--rouge)}
  @keyframes bat{0%,49%{background:var(--rouge-clair)}50%,100%{background:#fff}}
  @media (prefers-reduced-motion:reduce){.d.prescrit{animation:none}}
  .d.tot{border-left-color:var(--vert)}
  .d .q{display:block;font:600 11.5px/1.3 system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-3)}
  .d .v{display:block;font:600 17px/1.3 system-ui;margin:3px 0 1px;color:var(--encre)}
  .d .f{display:block;font-size:12.5px;color:var(--texte-3);line-height:1.45}

  .refus b{display:block;margin-bottom:4px}
  .alerte{background:var(--ambre-clair);border:1px solid #e8ddc6;border-radius:8px;padding:10px 14px;
    margin:0 0 12px;color:var(--ambre);font-size:14.5px;line-height:1.55}
  /* IL MANQUE QUELQUE CHOSE : ON NE PEUT PAS L'ENVOYER AINSI. Demande du
     16 septembre 2026, « pour l'entretien préalable en rouge aussi
     clignotant si une information manque ». Une convocation sans date,
     sans heure ou sans lieu n'est pas une convocation. */
  .alerte.manque{background:var(--rouge-clair);border-color:#e6cccc;color:var(--rouge);
    font-weight:600;animation:bat 1.1s steps(1,end) infinite}
  .alerte.manque ul{margin:6px 0 0;padding-left:20px;font-weight:400}
  .alerte.manque li{margin:0 0 2px}
  @media (prefers-reduced-motion:reduce){.alerte.manque{animation:none}}

  .feuille .b-st{font:600 14px/1.4 Georgia,serif;margin:0 0 20px;text-align:center;color:var(--texte-2)}
  .feuille .b-h1{font:700 15.5px/1.35 Georgia,serif;margin:18px 0 6px}
  .feuille .b-h2{font:600 15px/1.35 Georgia,serif;margin:14px 0 5px}
  .feuille .b-p{margin:0 0 10px;font-size:15.5px;line-height:1.6}
  .feuille .b-puce{margin:0 0 4px 16px;font-size:15.5px;line-height:1.55}
  .feuille .b-note{margin:9px 0 12px;padding:0 0 0 10px;border-left:2px dashed var(--filet-2);

  .feuille .b-trait{border:0;border-top:1px solid var(--filet);margin:18px 0}

  .feuille .b-sign{margin:18px 0 0;font-size:15.5px;white-space:pre-wrap;line-height:1.7}

  .barre{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px}

  /* L'EN-TÊTE DE L'ENTREPRISE, EN HAUT DE CHAQUE DOCUMENT.

  /* Une ligne de tête est de l'identité si elle répète, à la ponctuation

  /* ─────── L'ENTRETIEN TOMBE-T-IL SUR UN JOUR ET UNE HEURE DE TRAVAIL ? ──────

  /* Le tableau à l'écran : les lignes de titre en petit, l'en-tête figé, une

    corps = corps.filter(function (l, i) { return !l.section || corps.slice(i + 1).some(function (m) { return !m.section && pleines(m) >= 1; }); });

    corps.forEach(function (l) {

      if (pleines(l) >= 4 && l.join("|") !== tetes.join("|") && corps.indexOf(l) > 0 && !/^\d+$/.test(String(l[0]))) {
        /* une seconde partie du tableau (stagiaires) : son en-tête sur une ligne grise */
        h += '<tr>' ; for (var k = 0; k < nb; k++) h += '<th>' + ech(l[k] || "") + "</th>"; h += "</tr>"; return;

      h += "<tr>";

    });
    h += "</tbody></table></div>";
    notes.forEach(function (t) { h += '<p class="note-tab">' + ech(t) + "</p>"; });
    return h;
  }
  /* Le modèle vide : mêmes titres, mêmes en-têtes, mais les lignes d'exemple
     sont remplacées par des lignes numérotées vides, trente pour la première
     partie, dix pour chaque partie suivante. */
  function modeleVide(lignes) {
    var out = [], enTetes = 0, dansCorps = false;
    lignes.forEach(function (l) {
      var n = pleines(l);
      var tete = n >= 4 && !/^\d+$/.test(String(l[0] || ""));
      if (tete) {
        enTetes++; dansCorps = true;
        out.push(l.slice());
        var nb = enTetes === 1 ? 30 : 10;
        for (var i = 1; i <= nb; i++) { var v = l.map(function () { return ""; }); v[0] = String(i); out.push(v); }
        return;
      }
      if (dansCorps && n >= 2) return;
      if (dansCorps && n === 1 && /^\d+$/.test(String(l[0]))) return;
      if (n === 0) { dansCorps = false; out.push([]); return; }
      dansCorps = false;
      out.push(l.slice());
    });
    return out;
  }
  /* Le classeur : feuille 1 le registre vide à compléter, feuille 2 l'exemple
     rempli, feuille 3 les règles (le mode d'emploi, les rappels, et le texte
     du document). */
  $("btn-excel").addEventListener("click", function () {
    if (!window.TableurExport) return;
    var doc = DOCS[ACTIF];
    if (!TABLEAU) {
      var feuilles = window.FeuilleDoc.tableaux(relire());
      if (!feuilles.length) return;
      var nomF = (doc.titre + "-" + (profil.denomination || "")).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
      TableurExport.telecharger(TableurExport.xlsx(feuilles), nomF + ".xlsx");
      return;
    }
    var regles = [];
    var tableau = TABLEAU.filter(function (l) {
      if (pleines(l) === 1 && /^(MODE D'EMPLOI|RAPPEL|NOTE)/i.test(String(l[0]))) { regles.push([String(l[0])]); return false; }
      return true;
    });
    var texte = String(REGLES || "").split(/\n+/).map(function (t) { return t.replace(/^#+\s*/, "").trim(); }).filter(Boolean);
    var feuilleRegles = [[doc.titre + " : les règles"], []].concat(regles).concat([[]]).concat(texte.map(function (t) { return [t]; }));
    var nom = (doc.titre + "-" + (profil.denomination || "")).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
    TableurExport.telecharger(TableurExport.xlsx([
      { titre: "À compléter", lignes: modeleVide(tableau) },
      { titre: "Exemple rempli", lignes: tableau },
      { titre: "Règles", lignes: feuilleRegles, largeurs: [110] }
    ]), nom + ".xlsx");
  });

  function rendreDoc() {
    var doc = DOCS[ACTIF], r;
    if (doc.ext) {
      r = produitExterne(doc.ext, V, doc.champs, doc.apres);
      if (!r.refus) { r.dates = doc.dates ? doc.dates(V) : []; r.loi = doc.loi; }
    } else {
      r = doc.produire(V);
    }
    var h = "";
    (r.dates || []).forEach(function (s) { h += carte(s.q, s.d, s.f, s.c); });
    $("d-dates").innerHTML = h;
    $("d-dates").hidden = !h;
    var a = "";
    if (r.refus) a += '<div class="refus"><b>Ce document n\'est pas produit.</b>' + r.refus.map(function (l) { return "<div>" + ech(l) + "</div>"; }).join("") + "</div>";
    (r.alertes || []).forEach(function (t) {
      if (t && typeof t === "object" && t.manque) {
        a += '<div class="alerte manque">' + ech(t.t) + "<ul>" +
          (t.liste || []).map(function (x) { return "<li>" + ech(x) + "</li>"; }).join("") +
          "</ul></div>";
        return;
      }
      a += '<div class="alerte">' + ech(t) + "</div>";
    });
    $("d-avis").innerHTML = a;
    TABLEAU = r.refus ? null : (r.tableau || null);
    REGLES = r.refus ? "" : (r.regles || "");
    if (TABLEAU) {
      /* Le registre est un tableau : son en-tête se pose au-dessus de lui,
         non dans le repli des règles de tenue, sinon le document imprimé
         commence par une grille sans dire de quelle entreprise elle est. */
      $("d-tableau").innerHTML =
        '<div class="feuille fd tete-fiche">' +
        lignesIdentite().map(function (t) { return '<div class="b-sur">' + ech(t) + "</div>"; }).join("") +
        '<hr class="b-trait"></div>' + tableauHtml(TABLEAU);
      $("d-tableau").hidden = false;
      $("d-barre-tableau").hidden = false;
      $("d-feuille").innerHTML = '<details class="loi"><summary>Voir les règles de tenue</summary>' + feuilleHtml(r.blocs) + "</details>";
    } else {
      $("d-tableau").hidden = true;
      $("d-feuille").innerHTML = r.refus ? "" : feuilleHtml(avecEnTete(r.blocs));
      $("d-barre-tableau").hidden = r.refus || !window.FeuilleDoc.tableaux(r.blocs || []).length;
    }
    $("btn-word").disabled = !!r.refus;
    $("btn-imprimer").disabled = !!r.refus;
    $("d-loi").innerHTML = loiHtml(r.loi || []);
  }

  function ouvrir(cle) {
    var doc = DOCS[cle]; if (!doc) return;
    function montrer() {
      ACTIF = cle; V = {}; corrections = {};
      doc.champs.forEach(function (c) { V[c.id] = c.defaut == null ? "" : c.defaut; });
      $("d-titre").textContent = doc.titre;
      $("d-champs").innerHTML = doc.champs.map(champHtml).join("");
      $("d-champs").hidden = !doc.champs.length;
      rendreDoc();
      $("e-liste").hidden = true;
      $("e-doc").hidden = false;
      $("main").classList.add("large");
      window.scrollTo(0, 0);
      try { history.replaceState(null, "", "#" + cle); } catch (e) {}
    }
    if (doc.ext) {
      charger(FICHIERS[doc.famille], function (err) {
        if (err) { montrer(); return; }
        montrer();
      });
    } else montrer();
  }
  function revenir() {
    ACTIF = null;
    $("e-doc").hidden = true;
    $("e-liste").hidden = false;
    $("main").classList.remove("large");
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }

  $("liste").addEventListener("click", function (ev) {
    if (!ev.target.closest) return;
    var v = ev.target.closest("button[data-vers]");
    if (v) { location.href = v.getAttribute("data-vers"); return; }
    var b = ev.target.closest("button[data-doc]");
    if (b) ouvrir(b.getAttribute("data-doc"));
  });
  $("btn-retour").addEventListener("click", revenir);
  function surChamp(ev) {
    var el = ev.target; if (!el || !el.getAttribute) return;
    var id = el.getAttribute("data-ch"); if (!id) return;
    V[id] = el.value;
    rendreDoc();
  }
  $("d-champs").addEventListener("input", surChamp);
  $("d-champs").addEventListener("change", surChamp);
  $("btn-word").addEventListener("click", function () {
    var doc = DOCS[ACTIF]; if (!doc) return;
    exporterDocx(doc.titre, slug(doc.titre) + (V.nom ? "-" + slug(V.nom) : "") + "-" + iso(AUJOURDHUI) + ".docx");
  });
  $("btn-imprimer").addEventListener("click", function () { window.print(); });

  /* Une correction faite à la main dans le document est retenue sur le texte
     d'origine du bloc : elle survit à la réécriture des autres. */
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute || !el.hasAttribute("contenteditable")) return;
    corrections[el.getAttribute("data-o")] = texteDe(el);
    el.classList.add("modifie");
  });

  rendreListe();
  var demande = (location.hash || "").replace(/^#/, "") || new URLSearchParams(location.search).get("d");
  if (demande && DOCS[demande]) ouvrir(demande);
  /* Le bouton « précédent » du navigateur ramène à la liste, et un lien
     gerer.html#avert ouvre directement l'avertissement. */
  window.addEventListener("hashchange", function () {
    var cle = (location.hash || "").replace(/^#/, "");
    if (cle && DOCS[cle]) { if (cle !== ACTIF) ouvrir(cle); }
    else if (ACTIF) revenir();
  });

  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update().catch(function () {}); });
    });
  }
  $("btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>

<!--
  Écran 4 et écran 5 de la maquette validée le 8 septembre 2026
  (epreuve/maquette.html).

  Écran 4 : une liste de documents types, groupés (Embaucher, Pendant le
  contrat, Sanctionner, Rompre, Collectif). Un mot, un document.

  Écran 5 : le document seul à l'écran, déjà rempli avec la fiche
  d'entreprise. Deux, trois ou quatre champs en tête, qui se glissent dans
  le texte à chaque frappe. Télécharger en Word, Imprimer, un repli « Voir
  le texte de loi », le bouton Retour.

  Pour les sanctions : la date des faits et la date à laquelle l'employeur
  en a eu connaissance, et le délai de deux mois de l'article L. 1332-4,
  calculé et affiché.

  Trois familles de documents :
  1. ceux que cette page écrit elle-même en blocs (contrats, sanctions,
     licenciements, ruptures, comité, accord) ;
  2. ceux que les générateurs de l'application produisent déjà
     (DocumentsProduits, dans documents-rh.js, documents-cse.js,
     documents-nao.js), chargés à la demande comme le fait parcours.js ;
  3. rien d'autre : un document sans générateur a été écrit ici.

  Les textes. Chaque article cité a été lu au relais Légifrance, deux fois
  à quelques minutes d'intervalle, avec le nom du code en filtre, et son
  identifiant de version LEGIARTI est dans la table TEXTES. Les articles
  déjà cités par la page avant le 8 septembre 2026 gardent l'identifiant
  de leur lecture du 7 septembre ; les autres ont été lus le 8 septembre.
  Les deux articles du code de la sécurité sociale sur la déclaration
  d'accident ont été lus au même relais, avec « Code de la sécurité
  sociale » en filtre, deux fois, et portent leur code à côté.

  Rien ne sort du poste : tout est calculé et rédigé dans le navigateur.
-->

<link rel="stylesheet" href="style.css">
<script src="barre.js"></script>
<script src="installer.js"></script>
<style>
  body{font-size:18px;line-height:1.45}
  main.wrap{max-width:560px;padding:0 16px var(--e7)}
  main.wrap.large{max-width:760px}

  /* la barre du haut : Retour, le titre, l'entreprise */
  .haut{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 0 10px;
    border-bottom:1px solid var(--filet);background:var(--fond)}
  .haut .retour{margin:0;font:600 15px system-ui;padding:10px 14px;border:1px solid var(--filet-2);
    border-radius:10px;background:var(--surface);color:var(--encre);text-decoration:none;min-height:44px;
    display:inline-flex;align-items:center;white-space:nowrap;flex:none;cursor:pointer}
  .haut .retour:hover{background:var(--creux);color:var(--encre);border-color:var(--filet-2)}
  .haut b{font-size:17px;color:var(--encre);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .haut span{color:var(--texte-2);font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .aide{margin:14px 0 0;color:var(--texte-2);font-size:16px;max-width:none}

  /* écran 4 : la liste */
  .groupe{font:600 13px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);margin:18px 0 0}
  /* Une note qui explique pourquoi un document n'est peut-être pas dû :
     elle se lit avant la liste, sans la remplacer. */
  .doc-note{margin:0 0 10px;padding:11px 13px;border:1px solid var(--filet);border-radius:10px;
    background:var(--creux);font-size:var(--t2);line-height:1.45;color:var(--texte-2)}
  .doc-ligne{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 0;
    border:0;border-bottom:1px solid var(--filet);border-radius:0;background:none;color:var(--encre);
    font:400 18px/1.3 system-ui;min-height:52px;text-align:left;cursor:pointer}
  .doc-ligne:hover{background:var(--creux);color:var(--accent);border-color:var(--filet)}
  .doc-ligne::after{content:"\203A";color:var(--texte-2);font-size:24px;margin-left:10px;flex:none}
  /* Le titre sur une ligne, ce qu'il couvre en gris dessous : trois lignes de
     parenthèses par entrée se lisaient mal sur un téléphone. */
  .doc-ligne .l{min-width:0}
  .doc-ligne .l small{display:block;font:400 var(--t2)/1.4 system-ui;color:var(--texte-2);margin-top:2px}

  /* écran 5 : les champs, les dates, la feuille, les boutons */
  /* UNE COLONNE SUR UN TÉLÉPHONE, DEUX SUR UN ÉCRAN LARGE.

     Les champs étaient sur deux colonnes à toutes les largeurs : sur 390
     pixels, une date et son étiquette tenaient dans 185, et les intitulés
     passaient à la ligne au milieu d'un mot. Relevé le 27 septembre 2026. */
  .champs{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
  @media (min-width:700px){.champs{grid-template-columns:1fr 1fr}}
  .champs label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--texte-2)}
  .champs label.pleine{grid-column:1/-1}
  .champs input,.champs select,.champs textarea{font-size:16px;padding:10px 12px;min-height:44px;
    border-radius:10px;border:1px solid var(--filet-2);background:var(--surface);color:var(--encre);
    width:100%;min-width:0;max-width:100%;box-sizing:border-box}
  .champs label{min-width:0}
  .champs textarea{min-height:88px}
  .champs label .sous{font-size:12.5px;line-height:1.45;color:var(--texte-3)}

  .tableau-doc{margin:0 0 14px}
  .tableau-doc .titre-tab{font:600 17px/1.3 system-ui;color:var(--encre);margin:0 0 4px}
  .tableau-doc .sous-tab{font-size:14px;color:var(--texte-2);margin:0 0 10px}
  .tableau-doc .cadre-tab{overflow:auto;max-height:62vh;border:1px solid var(--filet);border-radius:10px;-webkit-overflow-scrolling:touch;background:var(--surface)}
  table.reg{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
  table.reg th,table.reg td{border-bottom:1px solid var(--filet);border-right:1px solid var(--filet);padding:8px 10px;text-align:left;vertical-align:top;white-space:nowrap}
  table.reg th{position:sticky;top:0;z-index:1;background:var(--creux);font:600 12.5px/1.3 system-ui;color:var(--texte-2);white-space:normal;min-width:120px}
  table.reg td:first-child,table.reg th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--filet)}
  table.reg th:first-child{background:var(--creux);z-index:3}
  table.reg td.vide{color:var(--texte-2)}
  table.reg tr.section td{position:static;font:600 14px system-ui;color:var(--encre);background:var(--accent-clair);white-space:normal;padding:10px}
  table.reg th{min-width:140px;max-width:210px;font-size:12px;line-height:1.25;padding:6px 8px}
  table.reg th:first-child{min-width:70px}
  .tableau-doc .note-tab{font-size:14px;color:var(--texte-2);margin:10px 0 0}
  .dates{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
  .d{border:1px solid var(--filet);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;background:var(--surface)}
  .d.tard{border-left-color:var(--rouge)}
  /* PRESCRIT : ON NE PEUT PAS LE MANQUER. Demande du 16 septembre 2026,
     « si prescrit avertissement en rouge clignotant ». Sa propre classe, et
     non celle des échéances « au plus tard » : la première version faisait
     clignoter toutes les dates limites, y compris celles qui n'annoncent
     aucun problème. Le clignotement s'arrête pour qui a demandé des
     animations réduites ; la couleur et le mot restent, l'information ne
     dépendant pas du clignotement. */
  .d.prescrit{border-color:var(--rouge);border-left-color:var(--rouge);
    background:var(--rouge-clair);animation:bat 1.1s steps(1,end) infinite}
  .d.prescrit .q,.d.prescrit .v,.d.prescrit .f{color:var(--rouge)}
  @keyframes bat{0%,49%{background:var(--rouge-clair)}50%,100%{background:#fff}}
  @media (prefers-reduced-motion:reduce){.d.prescrit{animation:none}}
  .d.tot{border-left-color:var(--vert)}
  .d .q{display:block;font:600 11.5px/1.3 system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-3)}
  .d .v{display:block;font:600 17px/1.3 system-ui;margin:3px 0 1px;color:var(--encre)}
  .d .f{display:block;font-size:12.5px;color:var(--texte-3);line-height:1.45}

  .refus{background:var(--rouge-clair);border:1px solid #e6cccc;border-radius:10px;padding:14px 16px;
    margin:0 0 12px;color:var(--rouge);font-size:15px;line-height:1.55}
  .refus b{display:block;margin-bottom:4px}
  .alerte{background:var(--ambre-clair);border:1px solid #e8ddc6;border-radius:8px;padding:10px 14px;
    margin:0 0 12px;color:var(--ambre);font-size:14.5px;line-height:1.55}
  /* IL MANQUE QUELQUE CHOSE : ON NE PEUT PAS L'ENVOYER AINSI. Demande du
     16 septembre 2026, « pour l'entretien préalable en rouge aussi
     clignotant si une information manque ». Une convocation sans date,
     sans heure ou sans lieu n'est pas une convocation. */
  .alerte.manque{background:var(--rouge-clair);border-color:#e6cccc;color:var(--rouge);
    font-weight:600;animation:bat 1.1s steps(1,end) infinite}
  .alerte.manque ul{margin:6px 0 0;padding-left:20px;font-weight:400}
  .alerte.manque li{margin:0 0 2px}
  @media (prefers-reduced-motion:reduce){.alerte.manque{animation:none}}

  .feuille{padding:20px 18px;font:16px/1.55 Georgia,"Times New Roman",serif;color:var(--encre);border-radius:12px}
  @media (min-width:700px){.feuille{padding:38px 44px}}
  .feuille [contenteditable]{outline:none}
  .feuille [contenteditable]:focus{background:#fffbe9;border-radius:3px}
  .feuille .modifie{border-left:2px solid var(--vert);padding-left:8px;margin-left:-10px}
  .feuille .b-t1{font:700 17px/1.3 Georgia,serif;margin:0 0 6px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
  .feuille .b-st{font:600 14px/1.4 Georgia,serif;margin:0 0 20px;text-align:center;color:var(--texte-2)}
  .feuille .b-h1{font:700 15.5px/1.35 Georgia,serif;margin:18px 0 6px}
  .feuille .b-h2{font:600 15px/1.35 Georgia,serif;margin:14px 0 5px}
  .feuille .b-p{margin:0 0 10px;font-size:15.5px;line-height:1.6}
  .feuille .b-puce{margin:0 0 4px 16px;font-size:15.5px;line-height:1.55}
  .feuille .b-note{margin:9px 0 12px;padding:0 0 0 10px;border-left:2px dashed var(--filet-2);
    font-size:13px;font-style:italic;line-height:1.5;color:var(--texte-2)}
  .feuille .b-vide{height:9px}
  .feuille .b-trait{border:0;border-top:1px solid var(--filet);margin:18px 0}
  .feuille .b-saut{border:0;border-top:2px dashed var(--filet-2);margin:28px 0}
  .feuille .b-sign{margin:18px 0 0;font-size:15.5px;white-space:pre-wrap;line-height:1.7}

  .barre{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px}
  .barre button{font:600 19px system-ui;padding:16px;min-height:56px;border-radius:12px;width:100%}
  @media (min-width:700px){.barre{flex-direction:row}.barre button{width:auto;flex:1}}

  details.loi{border-top:1px solid var(--filet);padding-top:10px;color:var(--texte-2);font-size:15px;margin-top:8px}
  details.loi summary{cursor:pointer;font-weight:600;color:var(--texte-2);min-height:40px;display:flex;align-items:center}
  details.loi p{margin:0 0 8px;line-height:1.5}
  details.loi a{color:var(--accent)}
  details.loi .ident{font-size:11px}

  [hidden]{display:none !important}

  @media print{
    .haut,.champs,.dates,.barre,details.loi,.refus,.alerte,.aide,.maj-dispo{display:none !important}
    main.wrap,main.wrap.large{max-width:none;padding:0}
    .feuille{padding:0;border:0}
  }
</style>
</head>

<div class="maj-dispo" id="maj-dispo">

  </div>
</div>

<main class="wrap" id="main">

  <!-- écran 4 : la liste -->
  <section id="e-liste">
    <div class="haut">
      <a class="retour" href="index.html">&larr; Retour</a>
      <b>Gérer</b>
      <span id="ent"></span>
    </div>
    <p class="aide">Un mot, un document rempli.</p>
    <div id="liste"></div>
  </section>

  <!-- écran 5 : le document, seul -->
  <section id="e-doc" hidden>
    <div class="haut">
      <button type="button" class="retour" id="btn-retour">&larr; Retour</button>
      <b id="d-titre"></b>
    </div>
    <p class="doux" id="d-reprise" hidden></p>
    <form class="champs" id="d-champs" autocomplete="off" onsubmit="return false"></form>
    <p class="doux" id="d-registre" hidden></p>
    <div class="dates" id="d-dates"></div>
    <div id="d-avis"></div>
    <!-- Un document qui est un tableau (le registre du personnel) s'affiche en
         tableau, jamais en texte, et se télécharge en classeur : demande du
         9 septembre 2026, « on doit tomber sur le registre pratique ». -->
    <div class="barre" id="d-barre-tableau" hidden>
      <button type="button" id="btn-excel">Télécharger le classeur Excel</button>
    </div>
    <div id="d-tableau" class="tableau-doc" hidden></div>
    <div id="d-feuille"></div>
    <div class="barre">
      <button type="button" id="btn-word">Télécharger en Word</button>
      <p class="doux" id="d-bloque" hidden></p>
      <button type="button" class="second" id="btn-imprimer">Imprimer</button>
      <!-- LE CONTRAT ÉCRIT INSCRIT LE SALARIÉ. Un CDI produit ici ne
           remontait nulle part : quatre-vingt-cinq lignes au registre avant,
           quatre-vingt-cinq après, et la déclaration préalable s'ouvrait
           vide. Relevé le 26 septembre 2026. -->
      <button type="button" class="second" id="btn-inscrire" hidden>Inscrire au registre</button>
      <!-- L'autorisation de conduite tient à une attestation médicale de cinq
           ans (R. 4323-56) : la date se portait ici et ne remontait ni à la
           fiche conducteur ni à l'agenda. Relevé le 26 septembre 2026. -->
      <button type="button" class="second" id="btn-conducteur" hidden>Porter à la fiche conducteur</button>
      <!-- LE REGISTRE DES SANCTIONS N'ÉTAIT RELIÉ À AUCUNE LETTRE. Les
           avertissements, les mises à pied et les licenciements pour faute
           partaient un à un, et au moment de sanctionner de nouveau personne ne
           savait ce qui pouvait encore être invoqué. Relevé le 27 septembre
           2026. -->
      <button type="button" class="second" id="btn-sanction" hidden>Porter au registre des sanctions</button>
    </div>
    <p class="doux" id="d-inscrit" hidden></p>
    <details class="loi"><summary>Voir le texte de loi</summary><div id="d-loi"></div></details>
  </section>

</main>

<script>

     LES TEXTES.

     Chaque article a été demandé deux fois au relais Légifrance, à plusieurs

     rendu le même identifiant et le même texte. L'identifiant de version est

     reprend ce qui sert au calcul ou à la rédaction, dans les mots de

     ══════════════════════════════════════════════════════════════════════ */
  var TEXTES = {
    "L1221-1": { id: "LEGIARTI000006900839", lu: 8,
      dit: "le contrat de travail est soumis aux règles du droit commun ; il peut être établi selon les formes que les parties décident d'adopter" },
    "L1221-10": { id: "LEGIARTI000006900849",
      dit: "l'embauche ne peut intervenir qu'après déclaration nominative auprès des organismes de protection sociale" },

      dit: "la déclaration préalable est adressée au plus tôt dans les huit jours précédant la date prévisible de l'embauche" },
    /* LA COMPLÉMENTAIRE SANTÉ, LUE À LA SOURCE LE 26 SEPTEMBRE 2026, DEUX
       LECTURES CONCORDANTES CHACUNE. Le code de la sécurité sociale, et non
       celui du travail : la mention est portée dans le document. */
    "CSS-L911-1": { id: "LEGIARTI000006745463",
      dit: "les garanties collectives sont déterminées par convention ou accord collectif, par ratification d'un projet d'accord, ou par une décision unilatérale du chef d'entreprise constatée dans un écrit remis à chaque intéressé" },
    "CSS-L911-7": { id: "LEGIARTI000031686110",
      dit: "couverture minimale obligatoire : ticket modérateur, forfait journalier, soins dentaires prothétiques et dispositifs médicaux ; l'employeur assure au minimum la moitié du financement ; dispense possible des contrats courts" },
    "CSS-D911-2": { id: "LEGIARTI000038682723",
      dit: "cas de dispense à l'initiative du salarié : complémentaire santé solidaire, assurance individuelle en cours, couverture au titre d'un autre emploi ; dans tous les cas, l'employeur doit être en mesure de produire la demande de dispense" },
    /* Lu à la source le 26 septembre 2026, deux lectures concordantes. */
    "CSS-L911-8": { id: "LEGIARTI000027549338",
      dit: "maintien gratuit des garanties après la rupture non consécutive à une faute lourde ouvrant droit au chômage, pendant une durée égale à la période d'indemnisation dans la limite du dernier contrat et de douze mois ; l'employeur signale ce maintien dans le certificat de travail et informe l'organisme assureur de la cessation du contrat" },
    "L1221-13": { id: "LEGIARTI000033971569",

    "D1221-23": { id: "LEGIARTI000018537878",
      dit: "indications du registre : nationalité, date de naissance, sexe, emploi, qualification, dates d'entrée et de sortie" },
    "L4624-1": { id: "LEGIARTI000043909039", lu: 8,
      dit: "suivi individuel de l'état de santé ; visite d'information et de prévention effectuée après l'embauche, qui donne lieu à une attestation ; travailleur de nuit et travailleur handicapé, suivi adapté" },
    "R4624-10": { id: "LEGIARTI000033769085",
      dit: "visite d'information et de prévention dans un délai qui n'excède pas trois mois à compter de la prise effective du poste" },
    /* Lus à la source au relais le 27 septembre 2026, deux lectures
       concordantes chacun. */
    "R4624-18": { id: "LEGIARTI000033769047",
      dit: "tout travailleur de nuit et tout travailleur de moins de dix-huit ans bénéficie d'une visite d'information et de prévention préalablement à son affectation sur le poste" },
    "R4624-22": { id: "LEGIARTI000033769092",
      dit: "tout travailleur affecté à un poste présentant des risques particuliers bénéficie d'un suivi individuel renforcé de son état de santé" },
    "R4624-24": { id: "LEGIARTI000033769104",
      dit: "le suivi individuel renforcé comprend un examen médical d'aptitude, qui se substitue à la visite d'information et de prévention, effectué par le médecin du travail préalablement à l'affectation sur le poste" },
    "R4624-31": { id: "LEGIARTI000054250639", lu: 8,

    "L1221-19": { id: "LEGIARTI000019071113",

    "L1221-21": { id: "LEGIARTI000019071109",

    "L1221-22": { id: "LEGIARTI000047293356",
      dit: "ces durées sont impératives, sauf durées plus courtes d'un accord postérieur au 25 juin 2008 ou du contrat lui-même" },

    "L1242-1": { id: "LEGIARTI000006901194",
      dit: "un contrat à durée déterminée ne peut avoir pour objet ni pour effet de pourvoir durablement un emploi lié à l'activité normale et permanente" },
    "L1242-2": { id: "LEGIARTI000037312980",
      dit: "cas de recours : remplacement, accroissement temporaire d'activité, emploi saisonnier ou d'usage, remplacement d'un non-salarié, objet défini" },
    "L1242-3": { id: "LEGIARTI000052437237",
      dit: "cas complémentaires : politique de l'emploi, complément de formation professionnelle, recherche, reconversion" },
    "L1242-5": { id: "LEGIARTI000035653074",
      dit: "interdiction, dans les six mois d'un licenciement économique, du contrat pour accroissement temporaire sur les postes concernés" },
    "L1242-6": { id: "LEGIARTI000006901199",
      dit: "interdiction de remplacer un salarié dont le contrat est suspendu par un conflit collectif, et d'affecter à des travaux dangereux" },
    "L1242-7": { id: "LEGIARTI000033024651",
      dit: "terme fixé avec précision dès la conclusion, sauf remplacement, attente d'entrée en service, saison ou usage, objet défini" },
    "L1242-8-1": { id: "LEGIARTI000035643961",
      dit: "durée totale de dix-huit mois à défaut d'accord de branche, neuf mois en attente d'entrée en service, vingt-quatre mois dans trois cas" },
    "L1242-10": { id: "LEGIARTI000006901204",
      dit: "période d'essai d'un jour par semaine, deux semaines au plus si le contrat est d'au plus six mois, un mois dans les autres cas" },
    "L1242-12": { id: "LEGIARTI000006901206",
      dit: "contrat écrit, motif précis, à défaut réputé à durée indéterminée ; huit mentions dont la convention collective et la retraite complémentaire" },
    "L1242-13": { id: "LEGIARTI000006901207",
      dit: "le contrat est transmis au salarié au plus tard dans les deux jours ouvrables suivant l'embauche" },
    "L1243-1": { id: "LEGIARTI000029946319",
      dit: "rupture avant terme seulement par accord, faute grave, force majeure ou inaptitude constatée par le médecin du travail" },
    "L1243-5": { id: "LEGIARTI000029946316", lu: 8,
      dit: "le contrat de travail à durée déterminée cesse de plein droit à l'échéance du terme" },
    "L1243-8": { id: "LEGIARTI000006901219",
      dit: "indemnité de fin de contrat égale à 10 % de la rémunération totale brute, versée avec le dernier salaire" },
    "L1243-10": { id: "LEGIARTI000006901221",
      dit: "indemnité non due pour la saison et l'usage, les vacances scolaires, le refus d'un contrat à durée indéterminée, la faute grave" },
    "L1243-11": { id: "LEGIARTI000006901222",
      dit: "la relation poursuivie après le terme devient un contrat à durée indéterminée, l'ancienneté est conservée" },
    "L1243-13": { id: "LEGIARTI000035643980",
      dit: "renouvellement dans les conditions d'un accord de branche étendu ; conditions stipulées au contrat ou par avenant avant le terme" },
    "L3121-27": { id: "LEGIARTI000033020376",
      dit: "la durée légale de travail effectif est de trente-cinq heures par semaine" },
    "L3121-36": { id: "LEGIARTI000033020341",
      dit: "à défaut d'accord, majoration de 25 % pour les huit premières heures supplémentaires, 50 % au-delà" },
    /* LE TRAVAIL DE NUIT, POUR L'AVENANT QUI Y FAIT PASSER. Lus à la source

    /* LA PROMESSE D'EMBAUCHE, LE CDD D'USAGE ET LE CONTRAT DE

    /* LES TITRES D'UN CONDUCTEUR, À CONTRÔLER AVANT LA PRISE DE POSTE.
       Lus à la source le 26 septembre 2026, deux lectures concordantes. */
    "TR-R3314-1": { id: "LEGIARTI000044326162", code: "Code des transports",
      dit: "tout conducteur visé à l'article L. 3314-2 doit, avant de débuter son activité de conduite, avoir suivi une formation professionnelle initiale théorique et pratique et avoir subi avec succès l'examen final" },
    "TR-R3314-10": { id: "LEGIARTI000044326235", code: "Code des transports",
      dit: "tout conducteur doit suivre une formation continue obligatoire tous les cinq ans, la première dans les cinq années qui suivent l'obtention de la qualification initiale" },
    "TR-R3411-13": { id: "LEGIARTI000048629458", code: "Code des transports",
      dit: "tout véhicule exécutant en France un transport routier de marchandises est accompagné du titre administratif de transport, de la lettre de voiture, le cas échéant du justificatif de location, et de l'attestation de conducteur lorsque le transport international ou de cabotage est exécuté sous licence communautaire par un conducteur ressortissant d'un État tiers" },
    "CIV-1114": { id: "LEGIARTI000032040891", code: "Code civil",
      dit: "l'offre comprend les éléments essentiels du contrat envisagé et exprime la volonté de son auteur d'être lié en cas d'acceptation ; à défaut, il y a seulement invitation à entrer en négociation" },
    "CIV-1124": { id: "LEGIARTI000032040818", code: "Code civil",
      dit: "la promesse unilatérale est le contrat par lequel le promettant accorde au bénéficiaire le droit d'opter pour la conclusion d'un contrat dont les éléments essentiels sont déterminés ; la révocation pendant le temps laissé pour opter n'empêche pas la formation du contrat" },
    "D1242-1": { id: "LEGIARTI000051768762",
      dit: "liste des secteurs où le contrat à durée déterminée d'usage est ouvert : exploitations forestières, réparation navale, déménagement, hôtellerie et restauration, sport professionnel, spectacles, enseignement, information et sondages, entreposage et stockage de la viande, bâtiment et travaux publics pour les chantiers à l'étranger, coopération et ingénierie à l'étranger, insertion par les associations intermédiaires, mise à disposition pour services à la personne, recherche scientifique sous convention internationale, activités foraines, soutien et fourniture à l'étranger au sens du code de la défense, exercice de la médecine dans certains centres de santé" },
    "L6325-1": { id: "LEGIARTI000054201191",
      dit: "le contrat de professionnalisation a pour objet l'acquisition d'une qualification et l'insertion ou la réinsertion professionnelle ; il est ouvert aux seize à vingt-cinq ans révolus, aux demandeurs d'emploi de vingt-six ans et plus, et aux bénéficiaires de certains minima sociaux" },
    "L6325-7": { id: "LEGIARTI000024422128",
      dit: "le contrat de professionnalisation à durée déterminée peut être renouvelé une fois, si le bénéficiaire prépare une qualification supérieure ou complémentaire, ou n'a pu obtenir la qualification visée pour échec, maternité, maladie, accident du travail, maladie professionnelle ou défaillance de l'organisme de formation" },
    "L6325-11": { id: "LEGIARTI000037386541",
      dit: "l'action de professionnalisation dure au minimum entre six et douze mois, et peut être allongée jusqu'à trente-six mois pour les personnes de l'article L. 6325-1-1" },
    "L6325-13": { id: "LEGIARTI000033024376",
      dit: "les actions de positionnement, d'évaluation, d'accompagnement et les enseignements durent au minimum entre 15 %, sans être inférieurs à cent cinquante heures, et 25 % de la durée totale du contrat" },
    "D6325-1": { id: "LEGIARTI000049854565",
      dit: "l'employeur adresse le contrat de professionnalisation et son document annexé à l'opérateur de compétences au plus tard dans les cinq jours qui suivent le début du contrat, sous forme dématérialisée" },
    "D6325-15": { id: "LEGIARTI000018522997", lu: 27,
      dit: "le salaire ne peut être inférieur à 55 % du salaire minimum de croissance avant vingt et un ans et à 70 % à partir de vingt et un ans ; 65 % et 80 % lorsque le bénéficiaire est titulaire d'une qualification au moins égale au baccalauréat professionnel" },
    "D6325-16": { id: "LEGIARTI000018522995", lu: 27,
      dit: "les montants de rémunération prévus à l'article D. 6325-15 sont calculés à partir du premier jour du mois suivant le jour où le titulaire du contrat a atteint l'âge indiqué" },
    "D6325-18": { id: "LEGIARTI000018522991", lu: 27,
      dit: "la rémunération du titulaire d'un contrat de professionnalisation âgé d'au moins vingt-six ans ne peut être inférieure à 85 % de la rémunération minimale prévue par la convention ou l'accord collectif de branche dont relève l'entreprise" },
    "L3122-5": { id: "LEGIARTI000033020171",
      dit: "est travailleur de nuit celui qui accomplit, au moins deux fois par semaine, selon son horaire habituel, au moins trois heures de travail de nuit quotidiennes, ou un nombre minimal d'heures de nuit sur une période de référence" },
    "L3123-6": { id: "LEGIARTI000033020080",
      dit: "mentions du contrat à temps partiel : qualification, rémunération, durée et répartition, modifications, horaires, heures complémentaires" },
    "L3123-7": { id: "LEGIARTI000047453545",
      dit: "durée minimale ; une durée inférieure peut être fixée à la demande écrite et motivée du salarié" },
    "L3123-20": { id: "LEGIARTI000033019991",
      dit: "un accord peut porter la limite des heures complémentaires au tiers de la durée prévue au contrat" },
    "L3123-21": { id: "LEGIARTI000033019988",
      dit: "le taux de majoration fixé par accord de branche étendu ne peut être inférieur à 10 %" },
    "L3123-27": { id: "LEGIARTI000033019953",
      dit: "à défaut d'accord, la durée minimale du salarié à temps partiel est de vingt-quatre heures par semaine" },
    "L3123-28": { id: "LEGIARTI000033019950",
      dit: "à défaut d'accord, les heures complémentaires ne peuvent dépasser le dixième de la durée prévue au contrat" },
    "L3123-29": { id: "LEGIARTI000033019947",
      dit: "à défaut d'accord, majoration de 10 % jusqu'au dixième et de 25 % entre le dixième et le tiers" },
    /* Lus à la source le 26 septembre 2026, deux lectures concordantes. */
    "R1231-1": { id: "LEGIARTI000018537730",
      dit: "les délais du titre qui expirent un samedi, un dimanche ou un jour férié ou chômé sont prorogés jusqu'au premier jour ouvrable suivant" },
    "L5221-8": { id: "LEGIARTI000018766932",
      dit: "l'employeur s'assure auprès des administrations compétentes de l'existence du titre autorisant l'étranger à exercer une activité salariée en France" },
    "R5221-2": { id: "LEGIARTI000053963834",
      dit: "sont dispensés d'autorisation de travail les ressortissants de l'Union européenne, des autres États de l'Espace économique européen et de la Confédération suisse" },
    "L3141-3": { id: "LEGIARTI000033020826",
      dit: "deux jours et demi ouvrables de congé par mois de travail effectif, trente jours ouvrables au plus" },
    "L3231-2": { id: "LEGIARTI000006902832",
      dit: "le salaire minimum de croissance garantit le pouvoir d'achat des rémunérations les plus faibles" },
    "L3243-2": { id: "LEGIARTI000033024092",
      dit: "bulletin de paie remis lors du paiement du salaire" },
    "L1226-1": { id: "LEGIARTI000054331868", lu: 8,
      dit: "après une année d'ancienneté, indemnité complémentaire à l'allocation journalière, à condition d'avoir justifié de l'incapacité dans les quarante-huit heures, d'être pris en charge par la sécurité sociale et soigné en France ou dans l'Espace économique européen" },
    "L1226-7": { id: "LEGIARTI000053283550", lu: 8,
      dit: "le contrat du salarié victime d'un accident du travail ou d'une maladie professionnelle est suspendu pendant l'arrêt ; la durée de la suspension compte pour l'ancienneté" },
    "L1226-9": { id: "LEGIARTI000006900975",
      dit: "pendant la suspension pour accident du travail, rupture seulement pour faute grave ou impossibilité de maintenir le contrat" },
    "L441-2": { id: "LEGIARTI000006743085", lu: 8, code: "Code de la sécurité sociale",
      dit: "l'employeur déclare tout accident dont il a eu connaissance à la caisse primaire d'assurance maladie dont relève la victime, dans un délai déterminé" },
    "R441-3": { id: "LEGIARTI000038423383", lu: 8, code: "Code de la sécurité sociale",
      dit: "déclaration par tout moyen conférant date certaine à sa réception, dans les quarante-huit heures non compris les dimanches et jours fériés" },
    "L1331-2": { id: "LEGIARTI000006901446", lu: 27,
      dit: "les amendes ou autres sanctions pécuniaires sont interdites ; toute disposition ou stipulation contraire est réputée non écrite" },
    "L1332-1": { id: "LEGIARTI000006901447",
      dit: "aucune sanction sans que le salarié soit informé, dans le même temps et par écrit, des griefs retenus contre lui" },
    "L1332-2": { id: "LEGIARTI000025560074",
      dit: "convocation en précisant l'objet, sauf avertissement sans incidence ; assistance ; la sanction ne peut intervenir moins de deux jours ouvrables ni plus d'un mois après l'entretien ; motivée et notifiée" },
    "L1332-3": { id: "LEGIARTI000006901449",
      dit: "la mise à pied conservatoire n'exonère pas de la procédure de l'article L. 1332-2" },
    "L1332-4": { id: "LEGIARTI000006901450",
      dit: "aucun fait fautif ne peut fonder des poursuites au-delà de deux mois du jour où l'employeur en a eu connaissance" },
    "L1332-5": { id: "LEGIARTI000006901451",
      dit: "aucune sanction antérieure de plus de trois ans ne peut être invoquée à l'appui d'une nouvelle sanction" },
    "R1332-1": { id: "LEGIARTI000018536889",
      dit: "la convocation indique l'objet, la date, l'heure et le lieu, rappelle l'assistance, et est remise contre récépissé ou par lettre recommandée dans le délai de deux mois" },
    "L1232-1": { id: "LEGIARTI000019071126",
      dit: "tout licenciement pour motif personnel est motivé et justifié par une cause réelle et sérieuse" },
    "L1232-2": { id: "LEGIARTI000006901000",
      dit: "convocation par lettre recommandée ou remise en main propre ; l'entretien ne peut avoir lieu moins de cinq jours ouvrables après la présentation" },
    /* Lu à la source le 27 septembre 2026, deux lectures concordantes. */
    "L3132-3": { id: "LEGIARTI000020967733",
      dit: "dans l'intérêt des salariés, le repos hebdomadaire est donné le dimanche" },
    "L1232-3": { id: "LEGIARTI000006901001",
      dit: "au cours de l'entretien, l'employeur indique les motifs et recueille les explications du salarié" },
    "L1232-4": { id: "LEGIARTI000006901002",
      dit: "assistance par un salarié de l'entreprise ou, sans institution représentative, par un conseiller du salarié dont la lettre indique l'adresse des listes" },
    "L1232-6": { id: "LEGIARTI000036762096",
      dit: "notification par lettre recommandée avec avis de réception énonçant les motifs, expédiée au plus tôt deux jours ouvrables après l'entretien" },
    "R1232-1": { id: "LEGIARTI000018537724",
      dit: "la convocation indique l'objet, la date, l'heure et le lieu, et rappelle la possibilité de se faire assister" },
    /* Lu deux fois au relais le 27 septembre 2026, mêmes identifiant et texte :

    "D1232-5": { id: "LEGIARTI000018537714",
      dit: "la liste des conseillers du salarié est arrêtée dans chaque département par le préfet et tenue à la disposition des salariés dans chaque section d'inspection du travail et dans chaque mairie" },
    "R1232-13": { id: "LEGIARTI000036212577",
      dit: "le salarié dispose de quinze jours pour demander des précisions sur les motifs, l'employeur de quinze jours pour répondre" },
    "L1235-2": { id: "LEGIARTI000036261950",
      dit: "les motifs peuvent être précisés après la notification ; la lettre fixe les limites du litige" },
    "L1233-3": { id: "LEGIARTI000036762081", lu: 27,
      dit: "motif non inhérent à la personne : suppression ou transformation d'emploi, ou modification refusée d'un élément essentiel du contrat, consécutive à des difficultés économiques, des mutations technologiques, une réorganisation nécessaire à la sauvegarde de la compétitivité ou la cessation d'activité ; une baisse significative des commandes ou du chiffre d'affaires suppose un trimestre en dessous de onze salariés, deux trimestres consécutifs de onze à moins de cinquante, trois de cinquante à moins de trois cents, quatre à partir de trois cents" },
    "L1233-4": { id: "LEGIARTI000036261863", lu: 8,
      dit: "licenciement seulement lorsque tous les efforts de formation et d'adaptation ont été réalisés et que le reclassement ne peut être opéré sur les emplois disponibles ; offres écrites et précises" },
    "L1233-11": { id: "LEGIARTI000006901023", lu: 8,
      dit: "convocation à l'entretien préalable par lettre recommandée ou remise en main propre contre décharge, indiquant l'objet ; entretien au plus tôt cinq jours ouvrables après la présentation" },
    "L1233-13": { id: "LEGIARTI000006901025", lu: 8,
      dit: "assistance par un salarié de l'entreprise ou, sans institution représentative, par un conseiller du salarié ; la convocation mentionne cette possibilité et l'adresse des services où la liste est tenue" },
    "L1233-15": { id: "LEGIARTI000032344944", lu: 8,
      dit: "notification par lettre recommandée avec avis de réception, expédiée au plus tôt sept jours ouvrables à compter de la date prévue de l'entretien ; quinze jours ouvrables pour un cadre" },
    "L1233-16": { id: "LEGIARTI000036762077", lu: 8,
      dit: "la lettre énonce les motifs économiques et mentionne la priorité de réembauche et ses conditions" },
    "L1233-45": { id: "LEGIARTI000029144908", lu: 8,
      dit: "priorité de réembauche pendant un an à compter de la rupture, si le salarié en fait la demande dans ce délai" },
    "L1233-65": { id: "LEGIARTI000024422267", lu: 8,
      dit: "le contrat de sécurisation professionnelle organise un parcours de retour à l'emploi" },
    "L1233-66": { id: "LEGIARTI000031013988", lu: 8,
      dit: "l'employeur propose le contrat de sécurisation professionnelle lors de l'entretien préalable à chaque salarié dont il envisage le licenciement économique ; à défaut, contribution de deux à trois mois de salaire" },
    "L1233-67": { id: "LEGIARTI000031014016", lu: 8,
      dit: "l'adhésion emporte rupture du contrat, sans préavis, avec l'indemnité de licenciement ; contestation dans les douze mois si la proposition le mentionne" },
    "L1234-1": { id: "LEGIARTI000006901112",
      dit: "préavis d'un mois de six mois à deux ans d'ancienneté, de deux mois au-delà, sauf faute grave et sauf disposition plus favorable" },
    "L1234-3": { id: "LEGIARTI000006901114",
      dit: "la date de présentation de la lettre recommandée fixe le point de départ du préavis" },
    "L1234-5": { id: "LEGIARTI000006901118",
      dit: "indemnité compensatrice de préavis en cas de dispense, sans diminution des salaires et avantages" },
    "L1234-9": { id: "LEGIARTI000035644154",
      dit: "indemnité de licenciement dès huit mois d'ancienneté ininterrompus, sauf faute grave" },
    "R1234-1": { id: "LEGIARTI000035644687",
      dit: "l'indemnité tient compte des mois accomplis au-delà des années pleines ; année incomplète calculée au prorata des mois complets" },
    "R1234-2": { id: "LEGIARTI000035644692",
      dit: "un quart de mois par année jusqu'à dix ans, un tiers de mois par année au-delà" },
    "R1234-4": { id: "LEGIARTI000035644695",
      dit: "salaire de référence : moyenne des douze derniers mois ou tiers des trois derniers, au plus avantageux" },
    "L1234-19": { id: "LEGIARTI000006901138",
      dit: "certificat de travail délivré à l'expiration du contrat" },
    "L1234-20": { id: "LEGIARTI000019071122",
      dit: "solde de tout compte dont le salarié donne reçu, dénonçable dans les six mois" },
    "R1234-9": { id: "LEGIARTI000049816309",
      dit: "attestation permettant d'exercer les droits à l'assurance chômage, délivrée au moment de la rupture et transmise sans délai à France Travail" },
    "L1237-1": { id: "LEGIARTI000006901174", lu: 8,
      dit: "en cas de démission, l'existence et la durée du préavis sont fixées par la loi ou par convention ou accord collectif ; à défaut, par les usages de la localité et de la profession" },
    "L1237-9": { id: "LEGIARTI000052437168", lu: 8,
      dit: "tout salarié quittant volontairement l'entreprise pour bénéficier d'une pension de vieillesse a droit à une indemnité de départ à la retraite" },
    "L1237-10": { id: "LEGIARTI000006901184", lu: 8,
      dit: "le salarié demandant son départ à la retraite respecte un préavis dont la durée est celle de l'article L. 1234-1" },
    "D1237-1": { id: "LEGIARTI000018537484", lu: 8,
      dit: "au moins un demi-mois de salaire après dix ans d'ancienneté, un mois après quinze ans, un mois et demi après vingt ans, deux mois après trente ans" },
    /* LA MISE À LA RETRAITE PAR L'EMPLOYEUR. Elle n'existait nulle part : le
       menu n'offrait que le départ demandé par le salarié. Relevé le
       26 septembre 2026. Textes lus à la source le même jour, deux lectures
       concordantes. */
    "L1237-5": { id: "LEGIARTI000052437183",
      dit: "la mise à la retraite est la possibilité donnée à l'employeur de rompre le contrat d'un salarié ayant atteint l'âge mentionné au 1° de l'article L. 351-8 du code de la sécurité sociale ; avant cet âge, l'employeur interroge par écrit le salarié sur son intention de partir, et une réponse négative lui interdit la mise à la retraite pendant l'année qui suit, chaque année jusqu'au soixante-neuvième anniversaire" },
    "L1237-6": { id: "LEGIARTI000006901180",
      dit: "l'employeur qui décide une mise à la retraite respecte un préavis dont la durée est celle de l'article L. 1234-1" },
    "L1237-7": { id: "LEGIARTI000047453558",
      dit: "la mise à la retraite ouvre droit à une indemnité au moins égale à l'indemnité de licenciement de l'article L. 1234-9 ; un salarié ne peut bénéficier que d'une seule indemnité de départ ou de mise à la retraite" },
    "D1237-2-1": { id: "LEGIARTI000020080277",
      dit: "l'employeur interroge le salarié trois mois avant son anniversaire ; le salarié répond dans le mois qui suit la question" },
    "L1237-11": { id: "LEGIARTI000019071187", lu: 8,
      dit: "rupture convenue en commun, exclusive du licenciement ou de la démission, qui ne peut être imposée par l'une ou l'autre des parties ; elle résulte d'une convention signée" },
    "L1237-12": { id: "LEGIARTI000019071185", lu: 8,
      dit: "un ou plusieurs entretiens ; le salarié peut se faire assister par un salarié de l'entreprise ou, sans institution représentative, par un conseiller du salarié ; l'employeur peut se faire assister si le salarié en use" },
    "L1237-13": { id: "LEGIARTI000019071182", lu: 8,
      dit: "indemnité spécifique au moins égale à l'indemnité de l'article L. 1234-9 ; date de rupture au plus tôt le lendemain de l'homologation ; quinze jours calendaires de rétractation à compter de la signature" },
    "L1237-14": { id: "LEGIARTI000019071180", lu: 8,

    "L2242-1": { id: "LEGIARTI000043893962", lu: 8,

    /* L'inaptitude constatée par le médecin du travail, et le permis. Lus à la

    "L4624-4": { id: "LEGIARTI000033024926", lu: 27,

    "L1226-4": { id: "LEGIARTI000025560071", lu: 27,

    "L1226-10": { id: "LEGIARTI000035653215", lu: 27,

    "L1233-7": { id: "LEGIARTI000006901019", lu: 27,

    "L1233-8": { id: "LEGIARTI000036261850", lu: 27,

    "D1233-3": { id: "LEGIARTI000022348560", lu: 27,

    "L2314-5": { id: "LEGIARTI000035651159", lu: 27,

    "R4323-56": { id: "LEGIARTI000051500371", lu: 15,

  };
  function ref(nums) {
    return nums.map(function (n) {
      /* « CSS-L911-1 » s'écrit « L. 911-1 du code de la sécurité sociale » :
         un article d'un autre code ne se cite pas comme s'il était du code du
         travail. Posé le 26 septembre 2026. */
      var css = n.indexOf("CSS-") === 0;
      var civ = n.indexOf("CIV-") === 0;
      if (civ) return "article " + n.slice(4) + " du code civil";
      if (n.indexOf("TR-") === 0)
        return n.slice(3).replace(/^([LRD])(\d)/, "$1. $2") + " du code des transports";
      /* Le code de la route : la suspension du permis et la conduite sans
         permis y sont, et elles se citent pour ce qu'elles sont. */
      if (n.indexOf("ROUTE-") === 0)
        return n.slice(6).replace(/^([LRD])(\d)/, "$1. $2") + " du code de la route";
      var x = (css ? n.slice(4) : n).replace(/^([LRD])(\d)/, "$1. $2");
      return css ? x + " du code de la sécurité sociale" : x;
    }).join(", ");
  }

  /* ═══════════════════════════════════════════════════════════════════════

     Pour toute autre convention, la page applique le code du travail et
     laisse le niveau, l'échelon et le minimum conventionnel entre crochets.
     ══════════════════════════════════════════════════════════════════════ */
  var CCN = {

    },
    /* LE PRÉAVIS DES TRANSPORTS ROUTIERS, PARCE QU'IL ÉTAIT INTROUVABLE.

       La démission sortait avec « [durée] » et « [date] » pour une entreprise

       Deux annexes, deux régimes, lus à la source par la recherche plein texte
       de la convention 16, deux lectures concordantes le 27 septembre 2026 :

       - annexe I, ouvriers, article 5 (KALIARTI000045968978) : « en cas de

       - annexe II, employés, article 13 (KALIARTI000005849509) : démission un

       Les annexes III, techniciens et agents de maîtrise, et IV, cadres, n'ont
       pas été lues : pour ces deux statuts, c'est le code du travail qui

    "16": {
      nom: "convention collective nationale des transports routiers et activités auxiliaires du transport du 21 décembre 1950",
      idcc: "16",

  /* ═══════════════════════════════════════════════ le profil de l'entreprise */
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}
  if ((!profil || !profil.denomination) && window.Profil) profil = window.Profil.lire();
  if (!profil || !profil.denomination) { location.replace("index.html"); return; }
  $("ent").textContent = profil.denomination;

  function numeroIdcc() {
    var s = String(profil.conventionCollective || profil.convention || profil.idcc || "");
    var m = s.match(/\d{3,4}/);
    return m ? String(Number(m[0])) : "";
  }
  var ccn = CCN[numeroIdcc()] || null;
  var effectif = parseInt(profil.effectif, 10); if (isNaN(effectif)) effectif = 0;

  function societe() {
    var t = profil.denomination;
    if (profil.adresse) t += ", dont le siège social est situé " + profil.adresse;
    if (profil.siret) t += ", identifiée sous le numéro SIRET " + profil.siret;
    t += ", représentée par " + (profil.responsable || "[nom et qualité du représentant]");
    return t;
  }
  function signataire() { return profil.responsable || "[nom et qualité du signataire]"; }

  /* L'EN-TÊTE DE L'ENTREPRISE, EN HAUT DE CHAQUE DOCUMENT.

     Demande du 12 septembre 2026 : « tous les documents générés doivent
     comporter les infos figurant sur cette fiche d'accueil, et ça doit être
     automatique et à chaque changement mise à jour. » Mesuré le 13 septembre
     sur les vingt-cinq documents de cet écran : tous portaient la
     dénomination et l'adresse quelque part, onze ne portaient pas le SIRET,
     et la place de ces mentions changeait d'un document à l'autre, parfois
     sous le titre, parfois au milieu. L'en-tête est désormais le même
     partout, en premier, et il suit la fiche.

     Les documents qui portaient déjà ces lignes en tête ne les portent pas
     deux fois : elles sont retirées avant que l'en-tête ne soit posé. */
  function lignesIdentite() {
    var L = [];
    L.push(profil.denomination || "[dénomination sociale]");

  /* ═══════════════════ LES AVENANTS GUIDÉS ═══════════════════════════

     seul les clauses du passage en grand routier, du temps partiel ou du
     travail de nuit. L'audit du 26 septembre 2026 demandait des avenants
     guidés. Six objets, et le texte libre reste pour tout le reste.

     Ce qui est écrit vient de ce qui a été lu : les durées de service des
     quatre catégories sont celles du code des transports que porte

  function avenant(v) {
    var nomS = v.nom || "[nom et prénom du salarié]";
    var effet = dateDe(v.effet);
    var guide = clausesAvenant(v);
    var b = [];
    b.push({ k: "t1", t: "Avenant au contrat de travail" });
    b.push({ k: "st", t: nomS });
    b.push({ k: "h1", t: "Entre les soussignés" });

    b.push({ k: "p", t: "Et " + nomS + ", demeurant " +
      (String(v.adresse || "").trim() || "[adresse]") + ", ci-après « le salarié », d'autre part," });
    b.push({ k: "p", t: "Il a été convenu ce qui suit." });
    b.push({ k: "h1", t: "Article 1 - Objet" });
    var conclu = dateDe(v.entree);
    b.push({ k: "p", t: "Le contrat de travail conclu entre les parties le " +
      (conclu ? dateFr(conclu) : "[date du contrat]") +
      " est modifié, à compter du " + dateFr(effet) + ", comme suit :" });
    if (guide) guide.forEach(function (l) { b.push({ k: "p", t: l }); });
    else griefsBlocs(b, v.objet, "[ce qui change : emploi, durée du travail, rémunération, lieu de travail, horaires ; écrivez la clause nouvelle en entier]");
    if (guide && String(v.objet || "").trim()) {
      b.push({ k: "p", t: "Il est en outre convenu ce qui suit :" });
      griefsBlocs(b, v.objet, "");
    }
    b.push({ k: "h1", t: "Article 2 - Autres clauses" });
    b.push({ k: "p", t: "Toutes les autres dispositions du contrat de travail demeurent inchangées et continuent de s'appliquer." });
    b.push({ k: "h1", t: "Article 3 - Accord des parties" });
    b.push({ k: "p", t: "Le présent avenant est conclu d'un commun accord entre les parties, le contrat de travail étant soumis aux règles du droit commun (" + ref(["L1221-1"]) + "). Il prend effet le " + dateFr(effet) + "." });
    b.push({ k: "trait", t: "" });
    b.push({ k: "sign", t: "Fait à " + ville() + ", le " + dateFr(AUJOURDHUI) + ", en deux exemplaires originaux, dont un remis au salarié." });
    b.push({ k: "sign", t: "\nLe salarié                                                    Pour la Société\n(signature précédée de la mention                             " + signataire() + "\n« lu et approuvé, bon pour accord »)" });

    if (v.sorte === "partiel") loi = loi.concat(["L3123-6"]);

    var alertes = [];
    if (v.sorte && v.sorte !== "libre")
      alertes.push("Un avenant ne s'impose pas : il se signe. Tant que le salarié ne l'a pas " +
        "signé, le contrat reste celui d'avant.");
    return { blocs: b, loi: loi, dates: [], alertes: alertes };
  }

  /* ═══════════════ LA PROMESSE D'EMBAUCHE ═══════════════════════════════

     Elle n'existait nulle part, et c'est l'écrit le plus demandé avant un
     contrat. Depuis 2017, deux écrits distincts portent deux engagements
     distincts, et l'application fait choisir plutôt que de mélanger :

       article 1114 du code civil (LEGIARTI000032040891) : « L'offre, faite à
       personne déterminée ou indéterminée, comprend les éléments essentiels du
       contrat envisagé et exprime la volonté de son auteur d'être lié en cas
       d'acceptation. A défaut, il y a seulement invitation à entrer en
       négociation. »

       article 1124 du code civil (LEGIARTI000032040818) : « La promesse
       unilatérale est le contrat par lequel une partie, le promettant, accorde
       à l'autre, le bénéficiaire, le droit d'opter pour la conclusion d'un
       contrat dont les éléments essentiels sont déterminés [...]. La révocation
       de la promesse pendant le temps laissé au bénéficiaire pour opter
       n'empêche pas la formation du contrat. »

     Les deux lus à la source le 26 septembre 2026, deux lectures concordantes.
     La différence tient en une phrase, et le document l'écrit : l'offre se
     rétracte tant qu'elle n'est pas acceptée, la promesse ne se rétracte pas
     sans que le contrat se forme quand même.                                */
  function promesse(v) {
    var nomS = v.nom || "[nom et prénom du candidat]";
    var civ = civiliteDe(nomS);
    var unilat = v.forme === "promesse";
    var debut = dateDe(v.debut);
    var limite = dateDe(v.limite);
    var b = [], dates = [], alertes = [];
    b.push({ k: "t1", t: unilat ? "Promesse unilatérale de contrat de travail" : "Offre de contrat de travail" });
    enTete(b, nomS, unilat ? "notre promesse d'embauche" : "notre offre de contrat de travail",
      "Lettre remise en main propre contre décharge, ou adressée par courriel avec accusé de réception");
    b.push({ k: "p", t: unilat
      ? "Nous vous accordons, par la présente, le droit d'opter pour la conclusion du contrat de travail dont les éléments essentiels sont arrêtés ci-dessous."
      : "Nous vous proposons de conclure le contrat de travail dont les éléments essentiels sont arrêtés ci-dessous, et nous nous déclarons liés par cette offre en cas d'acceptation de votre part." });
    b.push({ k: "h1", t: "Les éléments essentiels du contrat" });
    b.push({ k: "puce", t: "Emploi : " + (String(v.emploi || "").trim() || "[intitulé de l'emploi]") + "." });
    b.push({ k: "puce", t: "Classification : " + (String(v.coef || "").trim() || "[niveau, coefficient]") +
      " de la convention collective applicable." });
    b.push({ k: "puce", t: "Rémunération : " +
      (String(v.salaire || "").trim() ? nb(Number(v.salaire)) + " euros bruts par mois" : "[montant] euros bruts par mois") +
      ", pour " + (String(v.heures || "").trim() ? nb(Number(v.heures)) + " heures" : "[durée]") + " par semaine." });
    b.push({ k: "puce", t: "Date d'entrée en fonction : " + (debut ? dateFr(debut) : "[date]") + "." });
    b.push({ k: "puce", t: "Lieu de travail : " + (String(v.lieu || "").trim() || "[lieu de travail]") + "." });
    b.push({ k: "puce", t: "Nature du contrat : " + (String(v.nature || "").trim() || "[à durée indéterminée ou déterminée, avec son terme]") + "." });
    b.push({ k: "h1", t: "Ce que cet écrit engage" });
    if (unilat) {
      b.push({ k: "p", t: "La présente promesse est une promesse unilatérale au sens de " +
        ref(["CIV-1124"]) + " : nous sommes engagés, et il ne manque que votre consentement pour que le contrat soit formé." });
      b.push({ k: "p", t: "Vous disposez, pour lever l'option, d'un délai expirant le " +
        (limite ? dateFr(limite) : "[date]") + ". Notre révocation pendant ce délai n'empêcherait pas la formation du contrat." });
    } else {
      b.push({ k: "p", t: "La présente offre comprend les éléments essentiels du contrat envisagé et exprime notre volonté d'être liés en cas d'acceptation (" + ref(["CIV-1114"]) + ")." });
      b.push({ k: "p", t: "Elle peut être rétractée tant que vous ne l'avez pas acceptée. Elle est valable jusqu'au " +
        (limite ? dateFr(limite) : "[date]") + " ; passé ce terme, elle devient caduque." });
    }
    b.push({ k: "p", t: "L'embauche demeure subordonnée à l'accomplissement des formalités préalables, et notamment à la déclaration préalable à l'embauche (" + ref(["L1221-10"]) + ")." });
    if (String(v.conditions || "").trim()) {
      b.push({ k: "h1", t: "Conditions" });
      griefsBlocs(b, v.conditions, "");
    }
    b.push({ k: "p", t: "Nous vous remercions de nous retourner un exemplaire de la présente, daté et signé, portant la mention « bon pour accord »." });
    formule(b, civ);
    if (limite) dates.push({ q: unilat ? "Fin du délai d'option" : "Fin de validité de l'offre",
      d: dateFrJour(limite),
      f: unilat ? "délai que vous fixez, pendant lequel la révocation n'empêche pas la formation du contrat (" + ref(["CIV-1124"]) + ")"
                : "au-delà, l'offre est caduque (" + ref(["CIV-1114"]) + ")", c: "" });
    if (debut) dates.push({ q: "Entrée en fonction prévue", d: dateFrJour(debut),
      f: "la déclaration préalable à l'embauche se fait au plus tôt huit jours avant, et avant la prise de poste (" + ref(["L1221-10", "R1221-4"]) + ")", c: "" });
    if (limite && debut && limite > debut)
      alertes.push("Le délai laissé au candidat expire après la date d'entrée en fonction : l'une des deux dates est à revoir.");
    alertes.push(unilat
      ? "Une promesse unilatérale engage : la rétracter avant la levée de l'option n'empêche pas le contrat de se former, et la rupture s'analyse alors en licenciement."
      : "Une offre se rétracte tant qu'elle n'est pas acceptée ; une fois acceptée, le contrat est formé et sa rupture s'analyse en licenciement.");
    return { blocs: b, dates: dates, alertes: alertes,
      loi: ["CIV-1114", "CIV-1124", "L1221-10", "R1221-4"] };
  }

  /* ═══════════════ LES TITRES D'UN CONDUCTEUR, À L'EMBAUCHE ════════════

     Un conducteur ne se recrute pas comme un autre salarié : il faut avoir vu
     ses titres avant de le laisser partir avec un camion. L'écran n'en avait
     aucune liste, et rien ne remontait à la flotte. Relevé le 26 septembre
     2026.

     Ce qui fonde chaque ligne, lu à la source le 26 septembre 2026, deux
     lectures concordantes :

       R. 3314-1 du code des transports (LEGIARTI000044326162) : la formation
       professionnelle initiale est requise « avant de débuter son activité de
       conduite » ;
       R. 3314-10 (LEGIARTI000044326235) : la formation continue obligatoire
       tous les cinq ans ;
       R. 3411-13 (LEGIARTI000048629458) : les documents qui accompagnent le
       véhicule, dont l'attestation de conducteur pour un ressortissant d'un
       État tiers en transport international ou de cabotage sous licence
       communautaire ;
       L. 5221-8 du code du travail (LEGIARTI000018766932) : l'employeur
       s'assure auprès des administrations compétentes de l'existence du titre
       autorisant l'étranger à exercer une activité salariée.

     Le permis de conduire et la carte de conducteur n'ont pas d'article cité
     ici : ce sont des titres dont l'existence ne se discute pas, et
     l'application ne prétend pas avoir lu le règlement européen qui organise
     la carte. La ligne les demande, sans les fonder sur un texte qu'elle
     n'aurait pas lu.                                                        */
  var TITRES_CONDUCTEUR = [
    { c: "permisNum", nom: "Permis de conduire, numéro", t: "text",
      quoi: "Permis de conduire, catégorie exigée par le véhicule confié" },
    { c: "permisCat", nom: "Catégories du permis", t: "text" },
    { c: "permisFin", nom: "Permis valable jusqu'au", t: "date" },
    { c: "fco", nom: "Dernière FIMO ou FCO, le", t: "date",
      quoi: "Formation initiale et formation continue obligatoire",
      fond: ["TR-R3314-1", "TR-R3314-10"] },
    { c: "carteCond", nom: "Carte de conducteur, échéance", t: "date",
      quoi: "Carte de conducteur pour le chronotachygraphe" },
    { c: "carteQualif", nom: "Carte de qualification, échéance", t: "date",
      quoi: "Carte de qualification de conducteur" },
    { c: "attestConducteur", nom: "Attestation de conducteur, échéance", t: "date",
      quoi: "Attestation de conducteur, pour un ressortissant d'un État tiers en transport international ou de cabotage",
      fond: ["TR-R3411-13"] },
    { c: "titreSejour", nom: "Titre de séjour, type et numéro", t: "text",
      quoi: "Titre autorisant l'exercice d'une activité salariée, pour un salarié étranger",
      fond: ["L5221-8"] },
    { c: "titreSejourFin", nom: "Titre de séjour valable jusqu'au", t: "date" }
  ];

  /* « R. 3314-1 du code des transports, R. 3314-10 du code des transports »
     se lit mal : le nom du code s'écrit une fois, à la fin. */
  function fondementDe(liste) {
    var tr = liste.filter(function (n) { return n.indexOf("TR-") === 0; });
    var autres = liste.filter(function (n) { return n.indexOf("TR-") !== 0; });
    var bouts = [];
    if (tr.length)
      bouts.push(tr.map(function (n) { return n.slice(3).replace(/^([LRD])(\d)/, "$1. $2"); })
        .join(" et ") + " du code des transports");
    if (autres.length) bouts.push(ref(autres) + " du code du travail");
    return bouts.join(", ");
  }

  function titresConducteur(v) {
    var nomS = String(v.nom || "").trim() || "[nom et prénom du conducteur]";
    var b = [], dates = [], alertes = [];
    var manquants = [];
    /* UN DOCUMENT N'ATTESTE PAS CE QU'IL NE CONSTATE PAS. Il affirmait que les
       titres « ont été présentés et vérifiés » alors que chaque ligne portait
       « non renseigné ». Relevé le 26 septembre 2026. Le titre lui-même suit :
       tant que rien n'est porté, ce n'est pas un contrôle, c'est une liste de
       ce qui reste à produire. Relevé le 27 septembre 2026. */
    var remplis = titresRemplis().length;
    b.push({ k: "t1", t: remplis ? "Contrôle des titres du conducteur"
      : "Titres à produire par le conducteur" });
    b.push({ k: "st", t: nomS });
    b.push({ k: "p", t: "Établi le " + dateFr(AUJOURDHUI) + " par " + societe() + "." });
    b.push({ k: "p", t: remplis
      ? "Les titres ci-dessous ont été présentés par le salarié et vérifiés avant sa prise de poste. Une copie de chacun est conservée au dossier."
      : "Aucun titre n'est encore renseigné : ce document est la liste de ce que le salarié doit produire avant sa prise de poste. Il ne vaut pas constat de vérification." });
    TITRES_CONDUCTEUR.forEach(function (x) {
      if (!x.quoi) return;
      var lignes = [x];
      /* Les lignes de détail qui suivent la ligne principale : le permis a sa
         catégorie et son échéance, le titre de séjour la sienne. */
      if (x.c === "permisNum") lignes = lignes.concat([TITRES_CONDUCTEUR[1], TITRES_CONDUCTEUR[2]]);
      if (x.c === "titreSejour") lignes = lignes.concat([TITRES_CONDUCTEUR[8]]);
      var vals = lignes.map(function (l) {
        var val = String(v[l.c] == null ? "" : v[l.c]).trim();
        if (!val) return null;
        return l.nom + " : " + (l.t === "date" ? dateFr(dateDe(val)) : val);
      }).filter(Boolean);
      if (!vals.length) { manquants.push(x.quoi); return; }
      b.push({ k: "h1", t: x.quoi });
      vals.forEach(function (l) { b.push({ k: "puce", t: l }); });
      if (x.fond) b.push({ k: "p", t: "Fondement : " + fondementDe(x.fond) + "." });
    });
    if (manquants.length) {
      b.push({ k: "h1", t: "Ce qui n'a pas été renseigné" });
      manquants.forEach(function (m) { b.push({ k: "puce", t: m + " : non renseigné." }); });
      b.push({ k: "p", t: "Un titre non renseigné n'est pas un titre absent : il n'a pas été porté ici. Ce qui manque se contrôle avant la prise de poste." });
    }
    b.push({ k: "trait", t: "" });
    b.push({ k: "sign", t: "\nLe conducteur                                                 Pour la Société\n(signature)                                                   " + signataire() });
    /* Les échéances, pour celles qui sont renseignées. */
    TITRES_CONDUCTEUR.forEach(function (x) {
      if (x.t !== "date") return;
      var val = String(v[x.c] == null ? "" : v[x.c]).trim();
      if (!val) return;
      var d = dateDe(val);
      if (!d) return;
      if (x.c === "fco") {
        var cinq = new Date(d); cinq.setFullYear(cinq.getFullYear() + 5);
        dates.push({ q: "Prochaine formation continue obligatoire", d: dateFrJour(cinq),
          f: "cinq ans après la précédente (" + ref(["TR-R3314-10"]) + ")",
          c: cinq < AUJOURDHUI ? "tard" : "" });
        return;
      }
      dates.push({ q: x.nom.replace(", échéance", "").replace(" valable jusqu'au", ""),
        d: dateFrJour(d), f: "échéance portée sur le titre",
        c: d < AUJOURDHUI ? "tard" : "" });
    });
    if (String(v.titreSejour || "").trim())
      alertes.push("L'employeur s'assure auprès des administrations territorialement compétentes " +
        "de l'existence du titre autorisant l'étranger à exercer une activité salariée (" +
        ref(["L5221-8"]) + ") : la copie du titre ne suffit pas, la vérification se demande.");
    if (!String(v.fco || "").trim())
      alertes.push("La formation initiale doit avoir été suivie avant que le conducteur ne " +
        "débute son activité de conduite (" + ref(["TR-R3314-1"]) + ") : sa date n'est pas portée ici.");
    return { blocs: b, dates: dates, alertes: alertes,
      loi: ["TR-R3314-1", "TR-R3314-10", "TR-R3411-13", "L5221-8"] };
  }

  /* ═══════════════ LE CONTRAT DE PROFESSIONNALISATION ═══════════════════

     Dans le transport, c'est la voie par laquelle un conducteur se forme et
     obtient son titre professionnel : l'écran n'en avait rien. Les articles
     qui le commandent ont été lus à la source le 26 septembre 2026, deux
     lectures concordantes : L. 6325-1 (objet et public), L. 6325-7
     (renouvellement), L. 6325-11 (six à douze mois, trente-six dans les cas
     de L. 6325-1-1), L. 6325-13 (formation de 15 % à 25 %, cent cinquante
     heures au moins), D. 6325-15 (rémunération minimale en pourcentage du
     salaire minimum de croissance) et D. 6325-1 (dépôt à l'opérateur de
     compétences dans les cinq jours du début du contrat).

     Le contrat lui-même se conclut sur le formulaire de l'administration :
     le document produit ici porte les clauses et sert d'annexe, et il le dit
     au lieu de laisser croire qu'il remplace le formulaire.                */
  function professionnalisation(v) {
    var nomS = v.nom || "[nom et prénom du salarié]";
    var debut = dateDe(v.debut), fin = dateDe(v.fin);
    var mois = debut && fin ? Math.round(joursEntre(debut, fin) / 30.44) : null;
    var heures = Number(v.heuresTotal) || 0;
    var minFormation = heures ? Math.max(150, Math.round(heures * 0.15)) : null;
    var maxFormation = heures ? Math.round(heures * 0.25) : null;
    var b = [], dates = [], alertes = [];
    b.push({ k: "t1", t: "Contrat de professionnalisation" });
    b.push({ k: "st", t: nomS });
    b.push({ k: "p", t: "Le présent document porte les clauses du contrat de professionnalisation. Le contrat se conclut sur le formulaire de l'administration, auquel ce document s'annexe." });
    b.push({ k: "h1", t: "Entre les soussignés" });
    b.push({ k: "p", t: "La société " + societe() + ", ci-après « la Société », d'une part," });
    b.push({ k: "p", t: "Et " + nomS + ", demeurant " + adresseDe(nomS) + ", né" +
      (civiliteDe(nomS) === "Madame" ? "e" : "") + " le " +
      (dateDe(v.naissance) ? dateFr(dateDe(v.naissance)) : "[date de naissance]") +
      ", ci-après « le salarié », d'autre part," });
    b.push({ k: "h1", t: "Article 1 - Objet et qualification visée" });
    b.push({ k: "p", t: "Le contrat a pour objet de permettre au salarié d'acquérir la qualification suivante : " +
      (String(v.qualification || "").trim() || "[intitulé de la qualification, du titre ou du certificat visé]") +
      ", et de favoriser son insertion ou sa réinsertion professionnelle (" + ref(["L6325-1"]) + ")." });
    b.push({ k: "h1", t: "Article 2 - Nature et durée" });
    b.push({ k: "p", t: "Le contrat est conclu " + (v.nature === "cdi"
      ? "pour une durée indéterminée ; l'action de professionnalisation se situe à son début"
      : "pour une durée déterminée") + ", du " + (debut ? dateFr(debut) : "[date]") +
      " au " + (fin ? dateFr(fin) : "[date]") + (mois ? ", soit " + mois + " mois" : "") + "." });
    b.push({ k: "p", t: "L'action de professionnalisation dure au minimum entre six et douze mois ; elle peut être allongée jusqu'à trente-six mois pour les personnes mentionnées à l'article L. 6325-1-1 (" + ref(["L6325-11"]) + ")." });
    if (v.nature !== "cdi")
      b.push({ k: "p", t: "Le contrat peut être renouvelé une fois si le salarié, ayant obtenu la qualification visée, prépare une qualification supérieure ou complémentaire, ou s'il n'a pu l'obtenir pour échec aux épreuves, maternité, maladie, accident du travail, maladie professionnelle ou défaillance de l'organisme de formation (" + ref(["L6325-7"]) + ")." });
    b.push({ k: "h1", t: "Article 3 - Formation" });
    b.push({ k: "p", t: "Les actions de positionnement, d'évaluation et d'accompagnement ainsi que les enseignements généraux, professionnels et technologiques sont mis en œuvre par " +
      (String(v.organisme || "").trim() || "[nom et adresse de l'organisme de formation]") + "." });
    b.push({ k: "p", t: "Leur durée est au minimum comprise entre 15 % de la durée totale du contrat, sans être inférieure à cent cinquante heures, et 25 % de cette durée (" + ref(["L6325-13"]) + ")." +
      (minFormation ? " Pour une durée totale de " + nb(heures) + " heures, la formation représente au moins " +
        nb(minFormation) + " heures, et 25 % en représenteraient " + nb(maxFormation) + "." : "") });
    b.push({ k: "h1", t: "Article 4 - Tutorat" });
    b.push({ k: "p", t: "Le salarié est suivi par " + (String(v.tuteur || "").trim() || "[nom et fonction du tuteur]") +
      ", chargé de l'accueillir, de l'accompagner et de veiller au respect du calendrier de formation." });
    /* LE MINIMUM, CALCULÉ SUR L'ÂGE ET SUR LE NIVEAU.

       D. 6325-15 (LEGIARTI000018522997) : 55 % du salaire minimum de croissance
       avant vingt et un ans, 70 % à partir de vingt et un ans, portés à 65 % et
       80 % pour un titulaire d'une qualification au moins égale à un
       baccalauréat professionnel. D. 6325-16 (LEGIARTI000018522995) : le
       montant se calcule à partir du premier jour du mois suivant celui où
       l'âge est atteint. D. 6325-18 (LEGIARTI000018522991) : à partir de
       vingt-six ans, 85 % du minimum conventionnel de branche. Lus à la source
       le 27 septembre 2026, deux lectures concordantes. */
    var naisPro = dateDe(v.naissance);
    var agePro = null;
    if (naisPro && debut) {
      agePro = debut.getFullYear() - naisPro.getFullYear();
      var apres = debut.getMonth() < naisPro.getMonth() ||
        (debut.getMonth() === naisPro.getMonth() && debut.getDate() < naisPro.getDate());
      if (apres) agePro--;
    }
    var smicPro = Number(v.smic) > 0 ? Number(v.smic) : 0;
    var convPro = Number(v.minConv) > 0 ? Number(v.minConv) : 0;
    var salPro = Number(v.salaire) > 0 ? Number(v.salaire) : 0;
    var bacPro = v.niveau === "bac";
    var minPro = null, minDit = "";
    if (agePro !== null && agePro >= 26) {
      if (convPro > 0) {
        minPro = Math.round(convPro * 0.85 * 100) / 100;
        minDit = "85 % du minimum conventionnel de branche, soit 85 % de " + eur(convPro) +
          " euros (" + ref(["D6325-18"]) + ")";
      }
    } else if (agePro !== null && smicPro > 0) {
      var taux = agePro < 21 ? (bacPro ? 0.65 : 0.55) : (bacPro ? 0.80 : 0.70);
      minPro = Math.round(smicPro * taux * 100) / 100;
      minDit = Math.round(taux * 100) + " % du salaire minimum de croissance, soit " +
        Math.round(taux * 100) + " % de " + eur(smicPro) + " euros (" + ref(["D6325-15"]) + ")";
    }
    b.push({ k: "h1", t: "Article 5 - Rémunération" });
    b.push({ k: "p", t: "Le salarié perçoit une rémunération mensuelle brute de " +
      (salPro > 0 ? eur(salPro) + " euros" : "[montant] euros") + "." + (agePro !== null
        ? " Il " + (debut && debut > AUJOURDHUI ? "aura " : "a ") + agePro +
          " ans au début du contrat." : "") });
    if (minPro !== null) {
      b.push({ k: "p", t: "Le minimum applicable est de " + eur(minPro) + " euros : " + minDit + "." +
        (salPro > 0 ? (salPro >= minPro
          ? " La rémunération fixée ci-dessus lui est supérieure ou égale."
          : " La rémunération fixée ci-dessus lui est INFÉRIEURE de " + eur(minPro - salPro) +
            " euros : elle doit être portée au minimum.") : "") });
    }
    b.push({ k: "p", t: "Pour les salariés de moins de vingt-six ans, la rémunération ne peut être inférieure à 55 % du salaire minimum de croissance avant vingt et un ans et à 70 % à partir de vingt et un ans, portés respectivement à 65 % et 80 % lorsque le salarié est titulaire d'une qualification au moins égale à celle d'un baccalauréat professionnel (" + ref(["D6325-15"]) + "), ces montants étant calculés à partir du premier jour du mois qui suit celui où l'âge est atteint (" + ref(["D6325-16"]) + "). À partir de vingt-six ans, elle ne peut être inférieure à 85 % de la rémunération minimale de la convention ou de l'accord de branche (" + ref(["D6325-18"]) + "). Le minimum conventionnel du coefficient s'applique s'il est plus favorable." });
    b.push({ k: "h1", t: "Article 6 - Statut du salarié" });
    b.push({ k: "p", t: "Le salarié bénéficie de l'ensemble des dispositions applicables aux autres salariés de l'entreprise, dans la mesure où elles ne sont pas incompatibles avec les exigences de sa formation." });

  /* ═══════════════════════════════════════════════════════════════════════

  /* ═══════════════════════════════════════════════════════════════════════

    salariesRegistre().forEach(function (x) {
      if (out) return;

  /* LA FICHE CONDUCTEUR, LUE ET ÉCRITE D'ICI.

    dire(nom + " : sanction portée au registre des sanctions, au " + dateFr(quand) +
      ". Elle pourra être invoquée à l'appui d'une nouvelle poursuite jusqu'au " +
      dateFr(new Date(quand.getFullYear() + 3, quand.getMonth(), quand.getDate())) +
      " (L. 1332-5). Le registre s'ouvre par l'entrée « Registre des sanctions ».");
  });
  $("btn-inscrire").addEventListener("click", function () {
    if (!window.EcheancesSalaries) return;
    var nom = String(V.nom || "").trim();
    if (!nom) { dire("Le nom du salarié manque : rien n'a été inscrit."); return; }
    var parts = window.EcheancesSalaries.couper(nom);
    var r = window.EcheancesSalaries.inscrire({
      nom: parts.nom, pre: parts.pre,
      nat: V.nationalite, nais: V.naissance, emp: V.poste,
      qua: V.classe ? "Niveau " + V.classe : (V.statut ? statutMot(V.statut) : ""),
      ent: V.entree || iso(AUJOURDHUI),
      nature: DOCS_EMBAUCHE[ACTIF] === "cdd" ? "cdd" : "cdi",
      part: ACTIF === "partiel" ? "partiel" : "complet",
      terme: ACTIF === "cdd" ? V.terme : "",
    });
    if (!r) { dire("Rien n'a été inscrit."); return; }
    var dits = [r.nouveau ? "inscrit au registre du personnel"
      : (r.complets.length ? "complété au registre" : "déjà au registre, rien à compléter")];
    if (r.fiche) dits.push("fiche conducteur ouverte dans Flotte");
    dits.push("échéances posées dans l'agenda");
    dire(nom + " : " + dits.join(" ; ") + ". La déclaration préalable et la visite d'information " +
      "se retrouvent maintenant par son nom.");
    function dire(t) { $("d-inscrit").textContent = t; $("d-inscrit").hidden = false; }
  });

  /* LES TITRES RENSEIGNÉS, ET RIEN D'AUTRE. Un champ vide ne s'écrit pas
     dans la flotte : il n'efface pas ce qui y est déjà. */
  function titresRemplis() {
    return TITRES_CONDUCTEUR.filter(function (x) {
      return String(V[x.c] == null ? "" : V[x.c]).trim() !== "";
    });
  }

  $("btn-conducteur").addEventListener("click", function () {
    var nom = String(V.nom || "").trim();
    var z = $("d-inscrit");
    if (ACTIF === "titres") {
      var L = titresRemplis();
      if (!nom || !L.length) {
        z.textContent = "Le nom du conducteur ou les titres manquent : rien n'a été porté.";
        z.hidden = false; return;
      }
      var salT = salarieDuRegistre(nom);
      var cible = salT ? salT.nom : nom;
      var ecrits = 0, deja = 0, rates = 0;
      L.forEach(function (x) {
        var r = ecrireConducteur(cible, x.c, String(V[x.c]).trim());
        if (r === "déjà") deja++; else if (r) ecrits++; else rates++;
      });
      var dits = [];
      if (ecrits) dits.push(ecrits + " titre" + (ecrits > 1 ? "s" : "") + " porté" + (ecrits > 1 ? "s" : "") + " à la fiche conducteur");
      if (deja) dits.push(deja + " déjà à la même valeur");
      if (rates) dits.push(rates + " n'a pas pu être écrit sur cet appareil");
      z.textContent = cible + " : " + dits.join(" ; ") +
        ". Les échéances passent dans Flotte et dans l'agenda.";
      z.hidden = false;
      return;
    }
    var att = String(V.attestation || "").trim();
    if (!nom || !att) {
      z.textContent = "Le nom du salarié ou la date de l'attestation manque : rien n'a été porté.";
      z.hidden = false; return;
    }
    var sal = salarieDuRegistre(nom);
    var r = ecrireConducteur(sal ? sal.nom : nom, "attestConduite", att);
    z.textContent = r === "déjà"
      ? "La fiche conducteur de " + nom + " portait déjà cette attestation : l'échéance des cinq ans est à l'agenda."
      : (r ? "Attestation du " + dateFr(dateDe(att)) + " portée à la fiche conducteur de " + nom +
             " : l'échéance des cinq ans (R. 4323-56) passe dans Flotte et dans l'agenda."
           : "La fiche conducteur n'a pas pu être écrite sur cet appareil.");
    z.hidden = false;
  });

  /* Une correction faite à la main dans le document est retenue sur le texte
     d'origine du bloc : elle survit à la réécriture des autres. */
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute || !el.hasAttribute("contenteditable")) return;
    corrections[el.getAttribute("data-o")] = texteDe(el);
    el.classList.add("modifie");
  });

  rendreListe();
  var demande = (location.hash || "").replace(/^#/, "") || new URLSearchParams(location.search).get("d");
  if (demande && DOCS[demande]) ouvrir(demande);
  /* Le bouton « précédent » du navigateur ramène à la liste, et un lien
     gerer.html#avert ouvre directement l'avertissement. */
  window.addEventListener("hashchange", function () {
    var cle = (location.hash || "").replace(/^#/, "");
    if (cle && DOCS[cle]) { if (cle !== ACTIF) ouvrir(cle); }
    else if (ACTIF) revenir();
  });

  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { if (reg && reg.update) reg.update().catch(function () {}); });
    });
  }
  $("btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>

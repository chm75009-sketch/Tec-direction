<!-- Équipe, droits et journal : le point unique d'autorisation. Chargé avant
     tout le reste, il masque la page tant que l'utilisateur n'est pas identifié.
     Tant qu'aucun utilisateur n'a été créé, il ne fait rien. Il pose aussi le
     bouton Retour du bandeau. Voir docs/DROITS.md. -->

<!--
  LA BRANCHE « OUI » DU MODULE BASE DE DONNÉES, À L'ÉCRAN 5 DE LA MAQUETTE
  VALIDÉE LE 8 SEPTEMBRE 2026 (epreuve/maquette.html).

  Le dépôt en premier : on choisit le fichier, il est lu, et l'écran passe
  aux rubriques sans autre clic. Le bouton Retour du bandeau est posé par
  droits.js ; la page ne le refait pas. Les deux téléchargements en premier, les
  champs en tête, puis chaque rubrique absente de la base déposée, mise en
  forme ligne à ligne avec ses colonnes d'années et son bouton « Insérer ».
  Les rubriques déjà présentes suivent, au cas où la vôtre serait plus courte.

  LA RÈGLE DE CET ÉCRAN : il ne nomme jamais un manque. Pas de note, pas de
  verdict. Il y a la rubrique déjà mise en forme et le bouton qui l'insère.
  Le repérage lexical sert seulement à ranger l'écran : il ne juge pas ce qui
  est écrit dans la base déposée.

  LA GRILLE N'EST PAS ÉCRITE ICI. Elle est découpée du texte du décret par
  moteur/bdese/contenu-bdese.js, dont la couverture est mesurée à cent pour
  cent sur les deux articles, et servie par docs/moteur-bdese.js.

  Rien ne quitte ce poste : le fichier déposé est lu dans le navigateur.

  LES ARTICLES, LUS AU RELAIS LÉGIFRANCE DE L'APPLICATION (filtre par le nom
  du code, lectures espacées et concordantes, contenu vérifié et non le seul
  numéro). Le 8 septembre 2026, deux lectures chacun, puis deux lectures
  espacées de plus dans la journée, mêmes identifiants :

    L. 2312-2   LEGIARTI000035650754   attributions récurrentes à cinquante salariés, douze mois
    L. 2312-18  LEGIARTI000052437125   la base rassemble les informations, égalité, formations
    L. 2312-21  LEGIARTI000043975329   l'accord, et les dix thèmes du plancher (alinéa 3)
    L. 2312-36  LEGIARTI000048533625   à défaut d'accord : accès permanent, thèmes, six années
    R. 2312-10  LEGIARTI000036411580   année en cours, deux précédentes, trois suivantes, tendances
    R. 2312-12  LEGIARTI000036411586   support informatique ou papier selon l'effectif

  Le 7 septembre 2026, trois lectures chacun (R. 2312-8 et R. 2312-9 relus
  deux fois le 8 septembre 2026) :

    L. 2312-34  LEGIARTI000035609830   seuil de trois cents réputé franchi, un an pour s'y conformer
    R. 2312-8   LEGIARTI000049905537   contenu supplétif, moins de trois cents salariés
    R. 2312-9   LEGIARTI000049905524   contenu supplétif, au moins trois cents salariés
-->

<style>

  @media (min-width:900px){main.wrap.large{max-width:1080px}}

<body>

<header class="site">
  <div class="wrap">
    <p class="marque">Contrôle : base de données</p>
    <div class="outils">
      <a href="index.html">Accueil</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">

  <!-- le dépôt, en premier -->
  <section id="e-depot" hidden>
    <div class="depot">
      <label class="btn depose">
        Déposer votre base (Excel, Word, PDF, CSV ou texte)
        <input type="file" id="fichier" accept=".xlsx,.csv,.docx,.txt,text/plain,.pdf,application/pdf" hidden>
      </label>
      <p class="lu" id="lecture"></p>
      <div id="erreur"></div>
      <p class="ou">Ou collez ici le sommaire de votre base, puis contrôlez.</p>
      <textarea id="texte" placeholder="Investissements, égalité professionnelle, fonds propres..."></textarea>
      <button type="button" id="ouvrir">Contrôler</button>
    </div>
  </section>

  <!-- les rubriques, mises en forme, prêtes à insérer -->
  <section id="e-rubriques" hidden>
    <div class="barre pile">
      <button type="button" id="dl-xlsx">Télécharger le classeur</button>
      <button type="button" class="second" id="dl-csv">Télécharger en CSV</button>
    </div>

    <form class="champs" id="champs" autocomplete="off" onsubmit="return false">
      <label>Entreprise<input type="text" id="ent" placeholder="dénomination sociale"></label>
      <label>Effectif<input type="number" id="eff" min="0" step="1" placeholder="salariés"></label>
      <label>Année en cours<input type="number" id="an" min="1990" max="2200" step="1"></label>
      <label>Un accord définit la base
        <select id="acc"><option value="non">non</option><option value="oui">oui</option></select></label>
    </form>
    <p class="etat" id="etat"></p>

    <div id="rubriques"></div>
    <div id="presentes"></div>

    <details class="loi"><summary>Voir le texte de loi</summary><div id="loi"></div></details>
  </section>

  <p class="reserve">Contrôle documentaire automatisé : le résultat est indicatif et ne vaut ni avis juridique ni attestation de conformité.</p>
</main>

<script src="moteur-bdese.js"></script>
<script src="profil.js"></script>
<script>
(function () {
  "use strict";
  var AUD = (window.MoteurBDESE && window.MoteurBDESE.audit) || null;
  var P = window.Profil || null;
  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  var CTX = null, CHOIX = {}, PRESENTES = {};

  var profil = P ? (P.lire() || {}) : {};
  var effProfil = (profil.effectif !== undefined && profil.effectif !== null && String(profil.effectif).trim() !== "")
    ? parseInt(profil.effectif, 10) : null;
  if (effProfil !== null && isNaN(effProfil)) effProfil = null;

  function montrer(id) {
    ["e-depot", "e-rubriques"].forEach(function (e) { document.getElementById(e).hidden = (e !== id); });
    document.getElementById("main").classList.toggle("large", id === "e-rubriques");
    window.scrollTo(0, 0);
  }
  /* Le bouton Retour du bandeau, posé par droits.js : depuis les rubriques,
     il revient au dépôt ; depuis le dépôt, il quitte la page. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || $("#e-rubriques").hidden) return;
    ev.preventDefault(); ev.stopPropagation();
    montrer("e-depot");
  }, true);

  /* ---------------------------------------------------------------- */
  /* LE ZIP, EN LECTURE. Un .docx comme un .xlsx sont des archives zip. On lit
     le répertoire central une fois, on garde toutes les entrées, puis on
     décomprime celles dont on a besoin avec le flux natif du navigateur.
     Aucun octet ne sort de la page. */
  function u16(v, i) { return v.getUint16(i, true); }
  function u32(v, i) { return v.getUint32(i, true); }

  function entreesZip(buf) {
    var v = new DataView(buf), n = buf.byteLength, out = {};
    var fin = -1;
    for (var i = n - 22; i >= 0 && i > n - 65558; i--) if (u32(v, i) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(v, fin + 10), pos = u32(v, fin + 16);
    var dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(v, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(v, pos + 10), taille = u32(v, pos + 20);
      var lnom = u16(v, pos + 28), lextra = u16(v, pos + 30), lcom = u16(v, pos + 32);
      var debut = u32(v, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      var ln = u16(v, debut + 26), lx = u16(v, debut + 28);
      out[nom] = { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      pos += 46 + lnom + lextra + lcom;
    }
    return out;
  }

  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier. Collez le texte à la place."));
    var flux = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(flux).arrayBuffer();
  }

  function lireEntree(e) {
    if (!e) return Promise.resolve("");
    if (e.methode === 0) return Promise.resolve(new TextDecoder("utf-8").decode(e.data));
    if (e.methode !== 8) return Promise.reject(new Error("Compression inconnue dans ce fichier."));
    return inflater(e.data).then(function (b) { return new TextDecoder("utf-8").decode(new Uint8Array(b)); });
  }

  function sansBalises(xml) {
    return String(xml).replace(/<[^>]+>/g, " ")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&")
      .replace(/\s+/g, " ").trim();
  }

  function lireDocx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var z = entreesZip(buf);
      if (!z["word/document.xml"]) throw new Error("Le fichier ne contient pas de document Word.");
      return lireEntree(z["word/document.xml"]);
    }).then(function (xml) {
      return xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n")
        .replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
        .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&")
        .replace(/\n{3,}/g, "\n\n").trim();
    });
  }

  /* Un .xlsx : les libellés vivent soit dans la table des chaînes partagées,
     soit en clair dans les feuilles. On lit les deux. */
  function lireXlsx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var z = entreesZip(buf);
      var parts = Object.keys(z).filter(function (n) {
        return n === "xl/sharedStrings.xml" || /^xl\/worksheets\/.*\.xml$/.test(n);
      });
      if (!parts.length) throw new Error("Le fichier ne contient pas de feuille de calcul lisible.");
      return Promise.all(parts.map(function (n) { return lireEntree(z[n]); }));
    }).then(function (xmls) { return xmls.map(sansBalises).join("\n"); });
  }

  function dit(html) { $("#lecture").innerHTML = html || ""; }

  /* Le fichier choisi est lu, puis les rubriques s'ouvrent sans autre clic. */
  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    $("#erreur").innerHTML = "";
    dit("Lecture de <b>" + ech(f.name) + "</b>...");
    var suite;
    if (window.LirePdf && window.LirePdf.estPdf(f)) suite = window.LirePdf.texte(f);
    else if (/\.xlsx$/i.test(f.name)) suite = lireXlsx(f);
    else if (/\.docx$/i.test(f.name)) suite = lireDocx(f);
    else suite = f.text();
    suite.then(function (t) {
      $("#texte").value = t;
      dit("<b>" + ech(f.name) + "</b> lu.");
      ouvrir();
    }).catch(function (e) {
      dit("");
      $("#erreur").innerHTML = '<div class="avis att"><b>Ce fichier n\'a pas pu être lu.</b>' + ech(e.message) +
        " Collez le sommaire de la base ci-dessous.</div>";
    });
  });

  /* ---------------------------------------------------------------- */
  function nombre(v) {
    var s = String(v == null ? "" : v).trim();
    return s !== "" && isFinite(+s) ? Number(s) : null;
  }

  function contexte() {
    var c = {
      ent: $("#ent").value.trim(),
      eff: nombre($("#eff").value),
      an: nombre($("#an").value) || new Date().getFullYear(),
      accord: $("#acc").value === "oui",
    };
    c.mil = AUD ? AUD.millesimes(c.an) : [];
    /* L'effectif commande la grille : R. 2312-8 en deçà de trois cents
       salariés, R. 2312-9 au-delà. La grille du décret n'est due qu'à défaut
       d'accord : sous accord, ou tant que l'effectif n'est pas connu, restent
       les dix thèmes de L. 2312-21, alinéa 3. */
    c.grille = AUD ? AUD.grilleDue(c.eff, c.accord) : null;
    c.plancher = (AUD && AUD.plancher) || [];
    return c;
  }

  function rubriques(c) {
    if (c.grille) {
      return c.grille.rubriques.map(function (r) {
        var lignes = [];
        (r.sections || []).forEach(function (s) {
          (s.sujets || []).forEach(function (su) {
            var infos = (su.informations && su.informations.length) ? su.informations : [su.intitule];
            infos.forEach(function (i) {
              lignes.push({ section: (s.lettre ? s.lettre + ". " : "") + s.titre,
                sujet: (su.lettre ? su.lettre + ") " : "") + su.intitule, info: i });
            });
          });
        });
        if (!lignes.length) lignes.push({ section: "", sujet: "", info: r.titre });
        return { id: "r" + r.n, n: r.n, titre: r.titre, lignes: lignes,
          fond: c.grille.article === "R2312-9" ? "R. 2312-9" : "R. 2312-8" };
      });
    }
    return c.plancher.map(function (t, i) {
      var titre = t.charAt(0).toUpperCase() + t.slice(1);
      return { id: "p" + (i + 1), n: i + 1, titre: titre,
        lignes: [{ section: "", sujet: "", info: titre }], fond: "L. 2312-21, al. 3" };
    });
  }

  /* Un titre de section ou de sujet qui est lui-même la ligne à renseigner
     ne s'écrit qu'une fois : « A. Environnement » puis « Environnement »
     serait la même chose deux fois. */
  function sansLettre(t) { return String(t || "").replace(/^([A-Z]+\.|[a-z]+\))\s*/, ""); }
  function entetes(c) {
    return ["Section", "Sujet", "Information"]
      .concat(c.mil.map(function (m) { return m.annee + " (" + m.nature + ")"; }))
      .concat(["Ne peut être renseigné : raison (R. 2312-10)"]);
  }

  function texteApplicable(c) {
    if (c.grille)
      return c.grille.article === "R2312-9"
        ? "R. 2312-9, à défaut d'accord, au moins trois cents salariés"
        : "R. 2312-8, à défaut d'accord, moins de trois cents salariés";
    return c.accord
      ? "L'accord de l'article L. 2312-21. Les dix thèmes du plancher de son alinéa 3 restent dus."
      : "Les dix thèmes du plancher de L. 2312-21, alinéa 3. L'effectif ouvrira la grille du décret.";
  }

  /* ---------------------------------------------------------------- */
  /* Le repérage, lexical, qui ne sert qu'à ranger l'écran. */
  function normaliser(s) {
    return String(s || "").toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[’']/g, "'").replace(/\s+/g, " ");
  }
  function reperee(rb, t) {
    var cand = [rb.titre];
    rb.lignes.slice(0, 40).forEach(function (l) {
      if (l.section) cand.push(l.section.replace(/^[A-Z]+\.\s*/, ""));
      if (l.sujet) cand.push(l.sujet.replace(/^[a-z]+\)\s*/, ""));
    });
    var vus = {}, n = 0;
    cand.forEach(function (x) {
      var k = normaliser(x);
      if (k.length < 14 || vus[k]) return;
      vus[k] = true;
      if (t.indexOf(k) >= 0) n++;
    });
    return n >= 2;
  }

  function classer() {
    var t = normaliser($("#texte").value);
    CHOIX = {}; PRESENTES = {};
    rubriques(CTX).forEach(function (rb) {
      PRESENTES[rb.id] = reperee(rb, t);
      CHOIX[rb.id] = !PRESENTES[rb.id];
    });
  }

  function ouvrir() {
    $("#erreur").innerHTML = "";
    if (!AUD) {
      $("#erreur").innerHTML = '<div class="avis non"><b>Le moteur de la base ne s\'est pas chargé.</b>' +
        "Rechargez la page.</div>";
      return;
    }
    CTX = contexte();
    classer();
    rendre();
    montrer("e-rubriques");
  }
  $("#ouvrir").addEventListener("click", ouvrir);

  /* ---------------------------------------------------------------- */
  function rendre() {
    var liste = rubriques(CTX);
    var mis = liste.filter(function (rb) { return CHOIX[rb.id]; }).length;

<!--
  UNE QUESTION, DEUX RÉPONSES, ET DANS LES DEUX CAS UN DOCUMENT.

  « Avez-vous engagé la négociation annuelle obligatoire ? » Non : la
  convocation des organisations syndicales et le calendrier des négociations
  sont déjà écrits au nom de l'entreprise, seuls à l'écran, et trois champs en
  tête (la date, l'heure et le lieu de la première réunion) les complètent
  frappe par frappe. Oui : la page passe la main à controler-nao.html, qui
  prend le procès-verbal existant et rend, pour chaque manque, le paragraphe
  à insérer.

  C'est l'écran 5 de la maquette validée le 8 septembre 2026 : les champs en
  tête, la feuille, Télécharger en Word, Imprimer, « Voir le texte de loi »
  replié, et Retour. Rien d'autre : ni chapeau, ni étape, ni exposé du droit
  avant d'agir. Le questionnaire en six étapes et le rapport général qui
  occupaient cette page ont été retirés le 8 septembre 2026.

  CE QUE L'EFFECTIF COMMANDE. Deux négociations sont dues chaque année à
  défaut d'accord de méthode : la rémunération et l'égalité professionnelle
  (L. 2242-13, 1° et 2°). À partir de trois cents salariés s'y ajoutent, tous
  les trois ans, la gestion des emplois et des parcours professionnels et les
  salariés expérimentés (L. 2242-13, 3° et 4°) : la convocation et le
  calendrier les portent seulement à cet effectif.

  LES TEXTES. Chaque article cité a été demandé deux fois au relais Légifrance
  le 8 septembre 2026, à plusieurs minutes d'intervalle, filtre par nom du
  code ; les deux lectures ont rendu le même identifiant de version et le même
  texte. L'identifiant LEGIARTI est dans la table TEXTES, à côté du numéro : un
  article change sans changer de numéro, et seul l'identifiant dit lequel a
  été lu.

  CE QUI RESTE ENTRE CROCHETS. Les organisations syndicales représentatives et
  leurs délégués, que l'application ne connaît pas ; ce qui manque à la fiche.
  Un crochet est un champ à remplir, jamais une affirmation.

  Rien ne sort du poste : tout est calculé et rédigé dans le navigateur.
-->

<style>
  /* Ce qui est propre à cette page. Tout le reste vient de style.css. */

  /* La question d'entrée : elle occupe l'écran, et deux boutons y répondent. */
  .question{max-width:720px;margin:11vh auto 0;text-align:center}
  .question h1{font:600 clamp(24px,3.6vw,32px)/1.3 system-ui;margin:0 0 var(--e6)}
  .question .deux{display:flex;gap:var(--e3);justify-content:center;flex-wrap:wrap}
  .question .deux button{min-width:170px;font-size:17px;padding:16px 26px}
  .question .fiche{margin:var(--e6) 0 0;font-size:var(--t3);color:var(--texte-2)}

  /* Le document seul à l'écran : trois champs en tête, la feuille, la barre. */
  #ecran-doc{margin:var(--e4) 0 0}
  #ecran-doc .champs{margin:0 0 var(--e4)}
  #ecran-doc .barre{margin:var(--e4) 0}
  #ecran-doc details{margin:var(--e2) 0 var(--e6)}
  #sources{margin-top:8px;font-size:var(--t1);line-height:1.6;color:var(--texte-2)}
  #sources div{margin:0 0 6px}
  #sources b{color:var(--encre)}

  /* La feuille : le document tel qu'il sortira sur le papier. */
  .feuille [contenteditable]{outline:none}
  .feuille [contenteditable]:focus{background:#fffbe9;border-radius:3px}
  .feuille .modifie{border-left:2px solid var(--vert);padding-left:8px;margin-left:-10px}
  .feuille .b-t1{font:700 18px/1.35 system-ui;margin:0 0 6px;text-align:center}
  .feuille .b-st{font:600 13.5px/1.4 system-ui;margin:0 0 22px;text-align:center;color:var(--texte-2)}
  .feuille .b-h1{font:700 15px/1.35 system-ui;margin:20px 0 7px}
  .feuille .b-h2{font:600 14px/1.35 system-ui;margin:15px 0 5px}
  .feuille .b-p{margin:0 0 9px;font-size:14.5px;line-height:1.68}
  .feuille .b-puce{margin:0 0 5px 18px;font-size:14.5px;line-height:1.6}
  /* Une note de marge s'adresse à l'employeur : elle ne part pas dans le
     fichier emporté, elle doit donc se voir comme telle. */
  .feuille .b-note{margin:9px 0 12px;padding:0 0 0 10px;border-left:2px dashed var(--filet-2);
    font-size:12.5px;font-style:italic;line-height:1.55;color:var(--texte-3)}
  .feuille .b-vide{height:9px}
  .feuille .b-trait{border:0;border-top:1px solid var(--filet);margin:20px 0}
  /* Le second document commence sur une nouvelle page à l'impression. */
  .feuille .b-saut{border:0;border-top:2px dashed var(--filet-2);margin:34px 0}
  .feuille .b-sign{margin:20px 0 0;font-size:14.5px;white-space:pre-wrap;line-height:1.7}

  @media print{
    .champs,.barre,details,.b-note,.question{display:none !important}
    .feuille .b-saut{border:0;margin:0;break-before:page}
  }
</style>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  /* ═══════════════════════════════════════════════════════════════════════
     LES TEXTES.

     Chacun a été demandé deux fois au relais Légifrance le 8 septembre 2026,
     à plusieurs minutes d'intervalle, filtre par nom du code ; les deux
     lectures ont rendu le même identifiant et le même texte. La colonne
     « dit » ne reprend que ce qui sert à la rédaction, dans les mots de
     l'article.
     ══════════════════════════════════════════════════════════════════════ */
  var TEXTES = {
    "L2242-1": { id: "LEGIARTI000043893962",
      dit: "dans les entreprises où sont constituées une ou plusieurs sections syndicales d'organisations représentatives, l'employeur engage au moins une fois tous les quatre ans une négociation sur la rémunération, notamment les salaires effectifs, le temps de travail et le partage de la valeur ajoutée, et une négociation sur l'égalité professionnelle entre les femmes et les hommes et la qualité de vie et des conditions de travail" },
    "L2242-2": { id: "LEGIARTI000036262221",
      dit: "dans les entreprises et les groupes d'au moins trois cents salariés, l'employeur engage en plus, au moins une fois tous les quatre ans, une négociation sur la gestion des emplois et des parcours professionnels" },
    "L2242-2-1": { id: "LEGIARTI000052432470",
      dit: "dans les entreprises et les groupes d'au moins trois cents salariés où une section syndicale représentative est constituée, l'employeur engage en plus, au moins une fois tous les quatre ans, une négociation sur l'emploi, le travail et l'amélioration des conditions de travail des salariés expérimentés, en considération de leur âge" },
    "L2242-5": { id: "LEGIARTI000035627862",
      dit: "si, au terme de la négociation, aucun accord n'a été conclu, il est établi un procès-verbal de désaccord consignant, en leur dernier état, les propositions respectives des parties et les mesures que l'employeur entend appliquer unilatéralement ; ce procès-verbal donne lieu à dépôt, à l'initiative de la partie la plus diligente" },
    "L2242-6": { id: "LEGIARTI000035627858",
      dit: "l'engagement sérieux et loyal des négociations implique que l'employeur ait convoqué à la négociation les organisations syndicales représentatives dans l'entreprise et fixé le lieu et le calendrier des réunions ; il doit également leur avoir communiqué les informations nécessaires pour négocier en toute connaissance de cause et avoir répondu de manière motivée aux éventuelles propositions des organisations syndicales" },
    "L2242-11": { id: "LEGIARTI000052437060",
      dit: "l'accord de méthode précise les thèmes des négociations et leur périodicité, de telle sorte qu'au moins tous les quatre ans soient négociés les thèmes des 1° et 2° de l'article L. 2242-1 et des articles L. 2242-2 et L. 2242-2-1, le contenu de chacun des thèmes, le calendrier et les lieux des réunions, les informations remises aux négociateurs et la date de cette remise, et les modalités de suivi des engagements ; sa durée ne peut excéder quatre ans" },
    "L2242-13": { id: "LEGIARTI000052437044",
      dit: "à défaut d'accord de méthode, l'employeur engage chaque année la négociation sur la rémunération, le temps de travail et le partage de la valeur ajoutée (1°) et la négociation sur l'égalité professionnelle et la qualité de vie et des conditions de travail (2°), et, tous les trois ans dans les entreprises d'au moins trois cents salariés, la négociation sur la gestion des emplois et des parcours professionnels (3°) et celle sur les salariés expérimentés (4°) ; à défaut d'initiative de l'employeur depuis plus de douze mois (trente-six pour la négociation triennale), la négociation s'engage obligatoirement à la demande d'une organisation syndicale représentative ; la demande est transmise dans les huit jours aux autres organisations représentatives, et l'employeur convoque les parties dans les quinze jours qui suivent la demande" },
    "L2242-14": { id: "LEGIARTI000035627802",
      dit: "lors de la première réunion sont précisés le lieu et le calendrier de la ou des réunions, et les informations que l'employeur remettra aux délégués syndicaux et aux salariés composant la délégation sur les thèmes prévus par la négociation qui s'engage, et la date de cette remise" },
    "L2242-15": { id: "LEGIARTI000038837123",
      dit: "la négociation annuelle sur la rémunération porte sur les salaires effectifs ; la durée effective et l'organisation du temps de travail, notamment la mise en place du travail à temps partiel ; l'intéressement, la participation et l'épargne salariale, à défaut d'accord ou de plan en vigueur ; le suivi de la mise en œuvre des mesures visant à supprimer les écarts de rémunération et les différences de déroulement de carrière entre les femmes et les hommes" },
    "L2242-17": { id: "LEGIARTI000043893940",
      dit: "la négociation annuelle sur l'égalité professionnelle et la qualité de vie et des conditions de travail porte sur l'articulation entre la vie personnelle et la vie professionnelle ; les objectifs et les mesures permettant d'atteindre l'égalité professionnelle, en s'appuyant sur les données du 2° de l'article L. 2312-36 ; la lutte contre les discriminations ; l'insertion et le maintien dans l'emploi des travailleurs handicapés ; la prévoyance et les remboursements complémentaires de frais de santé, à défaut de couverture ; le droit d'expression directe et collective ; le droit à la déconnexion ; et, dans les entreprises de l'article L. 2143-3 dont cinquante salariés au moins sont employés sur un même site, la mobilité entre le domicile et le lieu de travail" },
    "L2242-20": { id: "LEGIARTI000043975202",
      dit: "dans les entreprises d'au moins trois cents salariés, la négociation triennale sur la gestion des emplois et des parcours professionnels et sur la mixité des métiers porte sur un dispositif de gestion prévisionnelle des emplois et des compétences et ses mesures d'accompagnement ; le cas échéant, les conditions de la mobilité interne ; les grandes orientations à trois ans de la formation et les objectifs du plan de développement des compétences ; les perspectives de recours aux différents contrats de travail, au temps partiel et aux stages ; l'information des entreprises sous-traitantes ; le déroulement de carrière des salariés exerçant des responsabilités syndicales" },
    "L2243-1": { id: "LEGIARTI000031086617",
      dit: "le fait de se soustraire aux obligations prévues à l'article L. 2242-1, relatives à la convocation des parties à la négociation et à l'obligation périodique de négocier, est puni d'un emprisonnement d'un an et d'une amende de 3 750 euros" }
  };
  /* « L2242-1 » s'écrit « L. 2242-1 » dans un document. */
  function ref(nums) {
    return nums.map(function (n) { return n.replace(/^([LRD])(\d)/, "$1. $2"); }).join(", ");
  }

  /* ═════════════════════════════════════════════ le profil de l'entreprise */
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}
  if ((!profil || !profil.denomination) && window.Profil) profil = window.Profil.lire();
  if (!profil) profil = {};

  function nomSociete() { return profil.denomination || "[dénomination de l'entreprise]"; }
  function adresse() { return profil.adresse || "[adresse du siège]"; }
  function signataire() { return profil.responsable || "[nom et qualité du signataire]"; }
  function ville() {
    var m = String(profil.adresse || "").match(/\d{5}\s+(.+)$/);
    return m ? m[1].trim() : "[ville]";
  }
  function effectif() {
    var n = Number(profil.effectif);
    return isFinite(n) && n > 0 ? n : null;
  }
  /* Les deux négociations triennales ne sont dues qu'à partir de trois cents
     salariés (L. 2242-2, L. 2242-2-1, L. 2242-13, 3° et 4°). */
  function troisCents() { var n = effectif(); return n !== null && n >= 300; }

  /* ═══════════════════════════════════════════════════════ dates et calculs */
  function jour(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  /* Le même quantième, n mois plus tard ; à défaut, le dernier jour du mois. */
  function plusMois(d, n) {
    var x = new Date(d.getTime()), voulu = x.getDate();
    x.setMonth(x.getMonth() + n);
    if (x.getDate() < voulu) x.setDate(0);
    return x;
  }
  /* Un samedi ou un dimanche recule au lundi : on ne convoque pas un dimanche. */
  function ouvre(d) {
    var x = new Date(d.getTime());
    while (x.getDay() === 0 || x.getDay() === 6) x = jour(x, 1);
    return x;
  }
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function lireDate(id) {
    var el = $(id); if (!el || !el.value) return null;
    var p = el.value.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
    "septembre", "octobre", "novembre", "décembre"];
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  function dateFr(d) {
    if (!d) return "[date]";
    return (d.getDate() === 1 ? "1er" : d.getDate()) + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }
  function dateLongue(d) {
    if (!d) return "[date]";
    return JOURS[d.getDay()] + " " + dateFr(d);
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LE RENDU.

     Un document est une liste de blocs. Chaque bloc devient une ligne
     modifiable à l'écran et repart telle quelle dans le .docx. Quand les
     champs changent, tout est réécrit, sauf les blocs corrigés à la main : la
     correction est retenue sur une empreinte du texte d'origine, pas sur la
     place du bloc.
     ══════════════════════════════════════════════════════════════════════ */
  var corrections = {};
  function empreinte(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "b" + (h >>> 0).toString(36);
  }
  function feuilleHtml(blocs) {
    var h = '<div class="feuille" id="feuille">';
    blocs.forEach(function (b) {
      if (b.k === "trait") { h += '<hr class="b-trait">'; return; }
      if (b.k === "saut") { h += '<hr class="b-saut">'; return; }
      if (b.k === "vide") { h += '<div class="b-vide"></div>'; return; }
      var cle = empreinte(b.t);
      var texte = Object.prototype.hasOwnProperty.call(corrections, cle) ? corrections[cle] : b.t;
      h += '<div class="b-' + b.k + (texte !== b.t ? " modifie" : "") +
        '" contenteditable="true" data-k="' + b.k + '" data-o="' + cle + '">' +
        ech(texte) + "</div>";
    });
    return h + "</div>";
  }
  function texteDe(el) {
    var t = el.innerText !== undefined && el.innerText !== null ? el.innerText : el.textContent;
    return String(t).replace(/ /g, " ");
  }
  function relire() {
    var out = [];
    document.querySelectorAll("#feuille > *").forEach(function (el) {
      if (el.tagName === "HR") { out.push({ k: el.classList.contains("b-saut") ? "saut" : "trait", t: "" }); return; }
      if (el.classList.contains("b-vide")) { out.push({ k: "p", t: "" }); return; }
      out.push({ k: el.getAttribute("data-k"), t: texteDe(el) });
    });
    return out;
  }
  var VERS_EXPORT = { t1: "t1", st: "sur", h1: "h1", h2: "h2", p: "p", puce: "puce",
    note: "note", sign: "p", trait: "trait", saut: "saut" };
  /* Ce qui part dans le fichier : les deux documents, et eux seuls. Les notes
     de marge s'adressent à l'employeur, elles restent à l'écran. */
  function pourFichier() {
    var blocs = relire().filter(function (b) { return b.k !== "note"; });
    var titre = blocs.length && blocs[0].k === "t1" ? blocs.shift().t : "";
    return { titre: titre, blocs: blocs };
  }

  /* ═══════════════════════════════════════════════════ la lecture des champs */
  function lire() {
    return {
      date: lireDate("#c-date"),
      heure: $("#c-heure").value.trim() || "[heure]",
      lieu: $("#c-lieu").value.trim() || "[salle, adresse]"
    };
  }

  /* Les thèmes que la convocation engage : deux chaque année, quatre à partir
     de trois cents salariés (L. 2242-13). */
  function themes() {
    var t = [
      "la rémunération, le temps de travail et le partage de la valeur ajoutée dans l'entreprise (" + ref(["L2242-1"]) + ", 1° ; " + ref(["L2242-13"]) + ", 1°)",
      "l'égalité professionnelle entre les femmes et les hommes et la qualité de vie et des conditions de travail (" + ref(["L2242-1"]) + ", 2° ; " + ref(["L2242-13"]) + ", 2°)"
    ];
    if (troisCents()) {
      t.push("la gestion des emplois et des parcours professionnels et la mixité des métiers (" + ref(["L2242-2", "L2242-20"]) + " ; " + ref(["L2242-13"]) + ", 3°)");
      t.push("l'emploi, le travail et l'amélioration des conditions de travail des salariés expérimentés, en considération de leur âge (" + ref(["L2242-2-1"]) + " ; " + ref(["L2242-13"]) + ", 4°)");
    }
    return t;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LA CONVOCATION DES ORGANISATIONS SYNDICALES, AVEC SON ORDRE DU JOUR
     ══════════════════════════════════════════════════════════════════════ */
  function convocation(d) {
    var b = [];
    function p(t) { b.push({ k: "p", t: t }); }
    function puce(t) { b.push({ k: "puce", t: t }); }
    var remise = d.date ? ouvre(jour(d.date, -7)) : null;

    b.push({ k: "t1", t: "CONVOCATION À LA NÉGOCIATION ANNUELLE OBLIGATOIRE" });
    b.push({ k: "st", t: nomSociete() + " - " + adresse() });

    p("Aux organisations syndicales représentatives dans l'entreprise, à l'attention de chaque " +
      "délégué syndical : [organisation 1, délégué syndical], [organisation 2, délégué syndical].");
    p(ville() + ", le " + dateFr(new Date()) + ". Lettre remise en main propre contre décharge, " +
      "ou recommandée avec avis de réception.");
    p("Objet : convocation à la première réunion de la négociation obligatoire.");
    p("Mesdames, Messieurs,");
    p("En application des articles " + ref(["L2242-1", "L2242-13"]) + " du code du travail, " +
      nomSociete() + " engage la négociation obligatoire sur :");
    themes().forEach(function (t) { puce(t + " ;"); });
    p("Je vous convoque à la première réunion de cette négociation le " + dateLongue(d.date) +
      ", à " + d.heure + ", " + d.lieu + ".");
    p("Lors de cette première réunion seront précisés le lieu et le calendrier des réunions, " +
      "ainsi que les informations que l'employeur remettra aux délégués syndicaux et aux " +
      "salariés composant la délégation sur les thèmes de la négociation, et la date de cette " +
      "remise (" + ref(["L2242-14"]) + "). Le calendrier proposé est joint.");
    p("Les informations nécessaires pour négocier en toute connaissance de cause vous seront " +
      "remises le " + dateLongue(remise) + ", contre décharge. Chacune de vos propositions " +
      "recevra une réponse motivée (" + ref(["L2242-6"]) + ").");
    p("Vous voudrez bien me faire connaître la composition de votre délégation avant la " +
      "première réunion.");
    p("Je vous prie d'agréer, Mesdames, Messieurs, l'expression de ma considération distinguée.");
    b.push({ k: "sign", t: signataire() + "\n" + nomSociete() });
    p("Pièces jointes : l'ordre du jour ci-après ; le calendrier des réunions.");

    b.push({ k: "h1", t: "Ordre du jour de la négociation sur la rémunération, le temps de travail et le partage de la valeur ajoutée (" + ref(["L2242-15"]) + ")" });
    puce("1° Les salaires effectifs.");
    puce("2° La durée effective et l'organisation du temps de travail, notamment la mise en place du travail à temps partiel.");
    puce("3° L'intéressement, la participation et l'épargne salariale, à défaut d'accord d'intéressement, d'accord de participation, de plan d'épargne d'entreprise, de plan d'épargne pour la mise à la retraite collectif ou d'accord de branche comportant un ou plusieurs de ces dispositifs.");
    puce("4° Le suivi de la mise en œuvre des mesures visant à supprimer les écarts de rémunération et les différences de déroulement de carrière entre les femmes et les hommes.");

    b.push({ k: "h1", t: "Ordre du jour de la négociation sur l'égalité professionnelle entre les femmes et les hommes et la qualité de vie et des conditions de travail (" + ref(["L2242-17"]) + ")" });
    puce("1° L'articulation entre la vie personnelle et la vie professionnelle pour les salariés.");
    puce("2° Les objectifs et les mesures permettant d'atteindre l'égalité professionnelle entre les femmes et les hommes : suppression des écarts de rémunération, accès à l'emploi, formation professionnelle, déroulement de carrière et promotion professionnelle, conditions de travail et d'emploi, en particulier pour les salariés à temps partiel, mixité des emplois ; sur la base des données du 2° de l'article L. 2312-36.");
    puce("3° Les mesures permettant de lutter contre toute discrimination en matière de recrutement, d'emploi et d'accès à la formation professionnelle.");
    puce("4° Les mesures relatives à l'insertion professionnelle et au maintien dans l'emploi des travailleurs handicapés.");
    puce("5° Les modalités de définition d'un régime de prévoyance et d'un régime de remboursements complémentaires de frais de santé, à défaut de couverture par un accord de branche ou un accord d'entreprise.");
    puce("6° L'exercice du droit d'expression directe et collective des salariés, notamment au moyen des outils numériques.");
    puce("7° Les modalités du plein exercice par le salarié de son droit à la déconnexion et les dispositifs de régulation de l'utilisation des outils numériques.");
    puce("8° Dans les entreprises dont cinquante salariés au moins sont employés sur un même site, les mesures visant à améliorer la mobilité des salariés entre leur lieu de résidence habituelle et leur lieu de travail.");

    if (troisCents()) {
      b.push({ k: "h1", t: "Ordre du jour de la négociation sur la gestion des emplois et des parcours professionnels (" + ref(["L2242-20"]) + ")" });
      puce("1° La mise en place d'un dispositif de gestion prévisionnelle des emplois et des compétences et les mesures d'accompagnement susceptibles de lui être associées.");
      puce("2° Le cas échéant, les conditions de la mobilité professionnelle ou géographique interne à l'entreprise.");
      puce("3° Les grandes orientations à trois ans de la formation professionnelle et les objectifs du plan de développement des compétences.");
      puce("4° Les perspectives de recours aux différents contrats de travail, au travail à temps partiel et aux stages, et les moyens mis en œuvre pour diminuer le recours aux emplois précaires.");
      puce("5° Les conditions dans lesquelles les entreprises sous-traitantes sont informées des orientations stratégiques de l'entreprise.");
      puce("6° Le déroulement de carrière des salariés exerçant des responsabilités syndicales et l'exercice de leurs fonctions.");
      b.push({ k: "h1", t: "Ordre du jour de la négociation sur les salariés expérimentés (" + ref(["L2242-2-1"]) + ")" });
      puce("L'emploi, le travail et l'amélioration des conditions de travail des salariés expérimentés, en considération de leur âge : [maintien dans l'emploi, aménagement des postes et des horaires, formation, transmission des savoirs, transition entre activité et retraite].");
    }

    b.push({ k: "note", t: "Toutes les organisations syndicales représentatives sont convoquées : " +
      "une seule oubliée fait tomber l'engagement sérieux et loyal que " + ref(["L2242-6"]) +
      " définit. Se soustraire à la convocation des parties ou à l'obligation périodique de " +
      "négocier est puni d'un an d'emprisonnement et de 3 750 euros d'amende (" +
      ref(["L2243-1"]) + ")." });
    return b;
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LE CALENDRIER DES NÉGOCIATIONS
     ══════════════════════════════════════════════════════════════════════ */
  function calendrier(d) {
    var b = [], D = d.date, n = effectif();
    function p(t) { b.push({ k: "p", t: t }); }
    function puce(t) { b.push({ k: "puce", t: t }); }
    function le(j) { return D ? dateLongue(ouvre(jour(D, j))) : "[date]"; }

    b.push({ k: "saut", t: "" });
    b.push({ k: "t1", t: "CALENDRIER DES NÉGOCIATIONS OBLIGATOIRES" });
    b.push({ k: "st", t: nomSociete() + (n !== null ? " - " + n + " salariés" : "") +
      " - établi le " + dateFr(new Date()) });

    b.push({ k: "h1", t: "Les réunions de la négociation qui s'engage" });
    p("Le lieu et le calendrier des réunions sont fixés lors de la première réunion (" +
      ref(["L2242-14"]) + ", 1°) ; ceux qui suivent sont la proposition de l'employeur.");
    puce(le(-7) + " : remise aux négociateurs des informations nécessaires pour négocier en " +
      "toute connaissance de cause, contre décharge (" + ref(["L2242-6"]) + " ; " +
      ref(["L2242-14"]) + ", 2°).");
    puce(dateLongue(D) + ", " + d.heure + ", " + d.lieu + " : première réunion. Lieu et " +
      "calendrier des réunions fixés, liste des informations remises et date de leur remise " +
      "précisées (" + ref(["L2242-14"]) + ") ; recueil des propositions des organisations syndicales.");
    puce(le(21) + " : deuxième réunion. Examen des propositions ; réponse motivée de " +
      "l'employeur à chacune (" + ref(["L2242-6"]) + ").");
    puce(le(42) + " : troisième réunion. Dernières propositions des parties.");
    puce(le(56) + " : réunion de clôture. Signature de l'accord, ou procès-verbal de désaccord " +
      "consignant, en leur dernier état, les propositions respectives des parties et les mesures " +
      "que l'employeur entend appliquer unilatéralement (" + ref(["L2242-5"]) + ").");
    puce(le(70) + " : dépôt de l'accord ou du procès-verbal de désaccord, à l'initiative de la " +
      "partie la plus diligente (" + ref(["L2242-5"]) + ") ; récépissé conservé au dossier.");

    b.push({ k: "h1", t: "Le rythme des négociations, à défaut d'accord de méthode (" + ref(["L2242-13"]) + ")" });
    puce("Chaque année : la négociation sur la rémunération, le temps de travail et le partage " +
      "de la valeur ajoutée (1°). Prochaine ouverture au plus tard le " +
      (D ? dateFr(ouvre(plusMois(D, 12))) : "[date]") + ".");
    puce("Chaque année : la négociation sur l'égalité professionnelle entre les femmes et les " +
      "hommes et la qualité de vie et des conditions de travail (2°). Prochaine ouverture au " +
      "plus tard le " + (D ? dateFr(ouvre(plusMois(D, 12))) : "[date]") + ".");
    if (troisCents()) {
      puce("Tous les trois ans : la négociation sur la gestion des emplois et des parcours " +
        "professionnels (3°). Prochaine ouverture au plus tard le " +
        (D ? dateFr(ouvre(plusMois(D, 36))) : "[date]") + ".");
      puce("Tous les trois ans : la négociation sur l'emploi, le travail et l'amélioration des " +
        "conditions de travail des salariés expérimentés (4°). Prochaine ouverture au plus tard " +
        "le " + (D ? dateFr(ouvre(plusMois(D, 36))) : "[date]") + ".");
    } else if (n !== null) {
      p("Les deux négociations triennales des 3° et 4° de l'article " + ref(["L2242-13"]) +
        " ne sont pas dues à " + n + " salariés : elles visent les entreprises d'au moins " +
        "trois cents salariés (" + ref(["L2242-2", "L2242-2-1"]) + ").");
    }
    p("À défaut d'initiative de l'employeur depuis plus de douze mois pour chacune des deux " +
      "négociations annuelles, et depuis plus de trente-six mois pour la négociation " +
      "triennale, la négociation s'engage obligatoirement à la demande d'une organisation " +
      "syndicale représentative. La demande est alors transmise dans les huit jours aux autres " +
      "organisations représentatives, et l'employeur convoque les parties dans les quinze jours " +
      "qui suivent la demande (" + ref(["L2242-13"]) + ").");

    b.push({ k: "trait", t: "" });
    b.push({ k: "sign", t: "Fait à " + ville() + ", le " + dateFr(new Date()) + "\n\n" +
      signataire() + "\n" + nomSociete() });

    b.push({ k: "note", t: "Ces négociations ne sont dues que dans les entreprises où une ou " +
      "plusieurs sections syndicales d'organisations représentatives sont constituées (" +
      ref(["L2242-1"]) + "). Un accord de méthode conclu au titre des articles L. 2242-10 et " +
      "L. 2242-11 peut fixer un autre calendrier, dans la limite de quatre ans : s'il en existe " +
      "un, c'est lui qui s'applique." });
    return b;
  }

  /* ═══════════════════════════════════════════════════════════════ le rendu */
  var BLOCS = [];
  function rendre() {
    var d = lire();
    BLOCS = convocation(d).concat(calendrier(d));
    $("#doc").innerHTML = feuilleHtml(BLOCS);
    sources();
  }

  /* Les textes que les documents citent, avec leur identifiant de version. */
  function sources() {
    var cites = {};
    BLOCS.forEach(function (b) {
      var m = String(b.t).match(/\b[LRD]\. \d{4}-\d{1,2}(?:-\d)?\b/g) || [];
      m.forEach(function (x) { cites[x.replace(". ", "")] = true; });
    });
    var h = "";
    Object.keys(TEXTES).forEach(function (k) {
      if (!cites[k]) return;
      h += "<div><b>" + ech(ref([k])) + "</b> · " + ech(TEXTES[k].dit) + " · " + TEXTES[k].id + "</div>";
    });
    $("#sources").innerHTML = "<div>Code du travail, lu au relais Légifrance le 8 septembre 2026, " +
      "deux lectures concordantes par article.</div>" + h;
  }

  /* Chaque frappe réécrit les documents. */
  $("#champs").addEventListener("input", rendre);
  $("#champs").addEventListener("change", rendre);

  /* Une correction faite à la main dans le document est retenue sur le texte
     d'origine du bloc : elle survit à la réécriture des autres. */
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute || !el.hasAttribute("contenteditable")) return;
    if (!el.closest("#feuille")) return;
    corrections[el.getAttribute("data-o")] = texteDe(el);
    el.classList.add("modifie");
  });

  $("#btn-word").addEventListener("click", function () {
    var f = pourFichier();
    /* Les puces partent en paragraphes précédés du trait d'union : le rendu
       « puce » d'audit-export.js les ferait précéder d'un tiret long. */
    var items = f.blocs.map(function (b) {
      if (b.k === "puce") return { k: "p", t: "- " + b.t };
      return { k: VERS_EXPORT[b.k] || "p", t: b.t };
    });
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, f.titre || "Convocation et calendrier de la négociation annuelle obligatoire"),
      "negociation-annuelle-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  $("#btn-imprimer").addEventListener("click", function () { window.print(); });

  /* ═══════════════════════════════════ la question, et ce qu'elle commande */
  var CLE = "nao-reponse";
  function ouvrirDocument() {
    $("#ecran-question").hidden = true;
    $("#ecran-doc").hidden = false;
    rendre();
    window.scrollTo(0, 0);
  }
  function ouvrirQuestion() {
    $("#ecran-question").hidden = false;
    $("#ecran-doc").hidden = true;
    window.scrollTo(0, 0);
  }
  $("#rep-non").addEventListener("click", function () {
    try { localStorage.setItem(CLE, "non"); } catch (e) {}
    ouvrirDocument();
  });
  /* Le « oui » n'ouvre pas un questionnaire : il ouvre le dépôt du
     procès-verbal existant et son contrôle, en un clic. */
  $("#rep-oui").addEventListener("click", function () {
    try { localStorage.setItem(CLE, "oui"); } catch (e) {}
    location.href = "controler-nao.html";
  });
  /* Le bouton Retour du bandeau, posé par droits.js : depuis le document, il
     revient à la question ; depuis la question, il quitte la page. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || $("#ecran-doc").hidden) return;
    ev.preventDefault(); ev.stopPropagation();
    try { localStorage.removeItem(CLE); } catch (e) {}
    ouvrirQuestion();
  }, true);

  /* Les valeurs de départ, pour que les documents soient écrits avant la
     première frappe : la première réunion à trois semaines, un jour ouvré. */
  (function depart() {
    $("#c-date").value = iso(ouvre(jour(new Date(), 21)));
  })();

  /* Sous la question : l'entreprise, son effectif, et ce que L. 2242-1
     commande. */
  (function fiche() {
    var eff = effectif(), t = "";
    if (profil.denomination) t = profil.denomination;
    if (eff !== null) t += (t ? " · " : "") + eff + " salarié" + (eff > 1 ? "s" : "");
    t += (t ? " · " : "") + "due si une section syndicale d'organisation représentative est constituée (" +
      ref(["L2242-1"]) + ")";
    if (eff !== null && eff >= 300) t += " · quatre négociations à partir de 300 salariés (" + ref(["L2242-13"]) + ")";
    $("#fiche-rappel").textContent = t;
  })();

  /* La réponse déjà donnée n'est pas redemandée : on retombe où l'on était. */
  var dejaRepondu = null;
  try { dejaRepondu = localStorage.getItem(CLE); } catch (e) {}
  if (dejaRepondu === "non") ouvrirDocument();
})();
</script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
<script src="assistant.js" defer></script>

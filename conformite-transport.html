<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="fiche-tec.js"></script>
<script src="sans-cache.js"></script>
<script src="verrou.js"></script>
<meta name="theme-color" content="#16181d">
<link rel="icon" href="icons-tec/icon-180.png">
<title>Conformité transport</title>
<link rel="stylesheet" href="style.css">
<script src="barre.js"></script>

<!--
  LE MODULE CONFORMITÉ TRANSPORT ET CONTRÔLE DRIEAT.

  Deux espaces. La prévention : les documents que l'entreprise tient au jour le
  jour (consigne signée, journal de téléchargement, registre des anomalies,
  compte rendu de contrôle), et l'échéancier des téléchargements, calculé par
  véhicule depuis la flotte et par conducteur depuis le registre. La défense :
  le rétroplanning des délais de la commission, la note de méthode et la liste
  des moyens, prêts le jour du contrôle.

  Rien ne se saisit deux fois : les véhicules viennent de flotte-vehicules, les
  conducteurs de registre-personnel. Le moteur et les textes vérifiés sont dans
  conformite-transport.js.
-->

<style>
  .enveloppe{max-width:820px;margin:0 auto;padding:0 16px}
  h1.titre{font:600 clamp(22px,3.4vw,30px)/1.3 system-ui;margin:var(--e5) 0 4px}
  .sous{color:var(--texte-2);margin:0 0 var(--e5)}
  .espace{margin:var(--e6) 0}
  .espace>h2{font-size:var(--t5);border-bottom:1.5px solid var(--trait);padding-bottom:6px;margin:0 0 var(--e3)}
  .carte{border:1px solid var(--trait);border-radius:10px;padding:14px 16px;margin:0 0 var(--e3);background:var(--fond-2)}
  .carte h3{margin:0 0 2px;font-size:var(--t4)}
  .carte .sous3{color:var(--texte-2);font-size:var(--t2);margin:0 0 8px}
  .carte button{font-size:15px;padding:9px 16px}
  .doc{display:none;margin:10px 0 0;padding:12px 0 0;border-top:1px dashed var(--trait)}
  .doc.ouvert{display:block}
  .doc h4{margin:12px 0 4px}
  .doc .bloc-h1{font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 8px}
  .doc .bloc-h2{font-weight:700;margin:10px 0 2px}
  .doc .bloc-note{color:var(--texte-2);font-style:italic;font-size:var(--t2)}
  .doc .bloc-table{font-family:ui-monospace,monospace;font-size:13px;background:var(--fond);padding:8px;border-radius:6px;white-space:pre-wrap}
  .doc .volet{margin:10px 0 0}
  .doc .volet b{display:block;margin:0 0 2px}
  .doc ul{margin:4px 0 0;padding-left:20px}
  table.ech{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:14px}
  table.ech th,table.ech td{border:1px solid var(--trait);padding:6px 8px;text-align:left;vertical-align:top}
  table.ech th{background:var(--fond-2)}
  .pastille{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .f-vert{background:#1f6f43;color:#fff}.f-orange{background:#9a5b16;color:#fff}
  .f-rouge{background:#8a2020;color:#fff}.f-gris{background:#555;color:#fff}
  table.ech input{width:140px}
  .nontransport{border:1px solid var(--trait);border-radius:10px;padding:16px;color:var(--texte-2)}
  .retro td input{width:160px}
</style>
</head>
<body>
<div class="enveloppe">
  <h1 class="titre">Conformité transport et contrôle DRIEAT</h1>
  <p class="sous">Le dispositif à tenir au quotidien, et le dossier prêt en cas de contrôle.</p>
  <div id="corps"></div>
</div>

<script src="documents-transport.js"></script>
<script src="tableur-export.js"></script>
<script src="apercu.js"></script>
<script src="audit-export.js"></script>
<script src="base-documents.js"></script>
<script src="conformite-transport.js"></script>
<script>
"use strict";
(function () {
  var CT = window.ConformiteTransport;
  var corps = document.getElementById("corps");
  function ech(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}

  if (!CT || !CT.estTransport()) {
    corps.innerHTML = '<div class="nontransport">Ce module s\'adresse aux entreprises de transport routier ' +
      '(convention IDCC 16). La fiche d\'entreprise n\'indique pas ce secteur : renseignez-la pour l\'activer.</div>';
    return;
  }

  /* ─── bloc d'un document ─── */
  function rendreBloc(bl) {
    var t = ech(bl.t);
    if (bl.k === "h1") return '<div class="bloc-h1">' + t + '</div>';
    if (bl.k === "h2") return '<div class="bloc-h2">' + t + '</div>';
    if (bl.k === "note") return '<p class="bloc-note">' + t + '</p>';
    if (bl.k === "table") return '<div class="bloc-table">' + t.split(" | ").join("   |   ") + '</div>';
    if (bl.k === "sign") return '<p class="bloc-note">' + t + '</p><p>Date et signature : ______________________</p>';
    return '<p>' + t + '</p>';
  }
  function rendreDoc(d) {
    var h = '';
    d.blocs.forEach(function (bl) { h += rendreBloc(bl); });
    h += '<div class="volet"><b>Formalités</b><ul>';
    d.formalites.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div><div class="volet"><b>Le droit</b><ul>';
    d.droit.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div>';
    return h;
  }

  var html = '';

  /* ───────────────── ESPACE A : PRÉVENTION ───────────────── */
  html += '<div class="espace"><h2>Prévention : le dispositif de conformité</h2>';
  CT.documents().forEach(function (d) {
    html += '<div class="carte"><h3>' + ech(d.nom) + '</h3>' +
      '<p class="sous3">' + ech(d.sous) + '</p>' +
      '<button data-doc="' + d.cle + '">Voir le modèle</button> ' +
      '<button data-word="' + d.cle + '">Télécharger en Word</button>' +
      '<div class="doc" id="doc-' + d.cle + '">' + rendreDoc(d) + '</div></div>';
  });
  html += '</div>';

  /* ───────────────── ÉCHÉANCIER DES TÉLÉCHARGEMENTS ───────────────── */
  html += '<div class="espace"><h2>Échéancier des téléchargements</h2>' +
    '<p class="sous3">Carte tous les ' + CT.DELAI_CARTE + ' jours (registre), véhicule tous les ' +
    CT.DELAI_VEHICULE + ' jours (flotte). Portez la dernière date, l\'échéance se calcule.</p>' +
    '<table class="ech"><thead><tr><th>À télécharger</th><th>Qui</th><th>Dernier</th>' +
    '<th>Prochaine échéance</th><th>État</th></tr></thead><tbody id="ech-corps"></tbody></table>' +
    '<div class="carte" style="margin-top:12px"><h3>Certificat du conseiller ADR</h3>' +
    '<p class="sous3">Fin de validité : <input type="date" id="date-adr"> ' +
    '<span id="adr-etat"></span></p></div></div>';

  /* ───────────────── ESPACE B : DÉFENSE ───────────────── */
  var def = CT.defense();
  html += '<div class="espace"><h2>En cas de contrôle ou de saisine de la commission</h2>';
  html += '<div class="carte"><h3>Rétroplanning des délais</h3>' +
    '<p class="sous3">Date de la séance : <input type="date" id="date-seance"></p>' +
    '<table class="ech retro"><thead><tr><th>Étape</th><th>Règle</th><th>Date</th></tr></thead>' +
    '<tbody id="retro-corps"></tbody></table></div>';
  html += '<div class="carte"><h3>' + ech(def.note.titre) + '</h3><div class="doc ouvert">';
  def.note.blocs.forEach(function (bl) { html += rendreBloc(bl); });
  html += '</div></div>';
  html += '<div class="carte"><h3>Liste des moyens à vérifier</h3><div class="doc ouvert"><ul>';
  def.checklist.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Proportionnalité : conséquences d\'une sanction</h3><div class="doc ouvert"><ul>';
  def.proportionnalite.phrases.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Tableau des infractions</h3>' +
    '<p class="sous3">Une ligne par infraction, avec les véhicules et conducteurs repris de la flotte et du registre.</p>' +
    '<button id="export-infractions">Télécharger le classeur</button></div>';
  html += '<div class="carte"><h3>Délai pour sanctionner un conducteur</h3>' +
    '<p class="sous3">Date de connaissance des faits : <input type="date" id="date-connaissance"></p>' +
    '<div id="delai-disc"></div></div>';
  html += '</div>';

  corps.innerHTML = html;

  /* ─── interactions ─── */
  corps.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-doc]");
    if (b) document.getElementById("doc-" + b.getAttribute("data-doc")).classList.toggle("ouvert");
    var w = e.target.closest("button[data-word]");
    if (w) { if (!CT.enWord(w.getAttribute("data-word"))) alert("Le générateur Word n'est pas disponible sur cette page."); }
    if (e.target.id === "export-infractions") {
      if (!CT.exportInfractions()) alert("Le moteur d'export n'est pas disponible sur cette page.");
    }
  });

  /* délai disciplinaire (L. 1332-4) */
  document.getElementById("date-connaissance").addEventListener("change", function (e) {
    var cible = document.getElementById("delai-disc");
    var d = CT.delaiDisciplinaire(e.target.value);
    if (!d) { cible.textContent = ""; return; }
    cible.innerHTML = '<p>Dernier jour pour engager la sanction : <b>' + ech(d.echeance) +
      '</b> <span class="pastille f-' + (d.jours < 0 ? "rouge" : d.jours <= 7 ? "orange" : "vert") +
      '">' + ech(d.etat) + (d.jours != null ? " (" + d.jours + " j)" : "") + '</span></p>' +
      '<p class="bloc-note">' + ech(d.reserve) + '</p>';
  });

  /* échéancier */
  function peindreEch() {
    var tb = document.getElementById("ech-corps"), L = CT.echeances(), h = '';
    if (!L.length) h = '<tr><td colspan="5">La flotte et le registre ne portent encore ni véhicule ni conducteur.</td></tr>';
    L.forEach(function (x, i) {
      h += '<tr><td>' + ech(x.quoi) + '</td><td>' + ech(x.qui) + '</td>' +
        '<td><input type="date" data-k="' + (x.quoi.indexOf("carte") >= 0 ? "c" : "v") + '" ' +
        'data-qui="' + ech(x.qui) + '" value="' + (x.dernier || "") + '"></td>' +
        '<td>' + ech(x.date || "à renseigner") + '</td>' +
        '<td><span class="pastille f-' + (x.fond || "gris") + '">' + ech(x.etat) +
        (x.jours != null ? " (" + x.jours + " j)" : "") + '</span></td></tr>';
    });
    tb.innerHTML = h;
  }
  peindreEch();
  document.getElementById("ech-corps").addEventListener("change", function (e) {
    var inp = e.target; if (inp.type !== "date" || !inp.value) return;
    var qui = inp.getAttribute("data-qui");
    if (inp.getAttribute("data-k") === "c") {
      var s = CT.salaries().filter(function (x) { return x.nom === qui; })[0];
      if (s) CT.porterTelechargementCarte(s.id, inp.value);
    } else {
      CT.porterTelechargementVehicule(qui, inp.value);
    }
    peindreEch();
  });

  /* certificat ADR */
  function peindreADR() {
    var e = CT.echeanceADR(), s = document.getElementById("adr-etat");
    var inp = document.getElementById("date-adr");
    if (e) { inp.value = e.date;
      s.innerHTML = '<span class="pastille f-' + e.fond + '">' + ech(e.etat) +
        (e.jours != null ? " (" + e.jours + " j)" : "") + '</span>'; }
    else s.textContent = "";
  }
  peindreADR();
  document.getElementById("date-adr").addEventListener("change", function (e) {
    if (e.target.value) { CT.porterCertificatADR(e.target.value); peindreADR(); }
  });

  /* rétroplanning */
  function peindreRetro() {
    var ds = document.getElementById("date-seance").value || null;
    var tb = document.getElementById("retro-corps"), h = '';
    CT.retroplanning(ds).forEach(function (e) {
      h += '<tr><td>' + ech(e.quoi) + '</td><td>' + ech(e.regle) + '</td><td>' + ech(e.date || "") + '</td></tr>';
    });
    tb.innerHTML = h;
  }
  peindreRetro();
  document.getElementById("date-seance").addEventListener("change", peindreRetro);
})();
</script>
</body>
</html>

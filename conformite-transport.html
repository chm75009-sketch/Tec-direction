<!--
  LE MODULE CONFORMITÉ TRANSPORT ET CONTRÔLE DRIEAT.

  Deux espaces. La prévention : les documents que l'entreprise tient au jour le
  jour (consigne signée, journal de téléchargement, registre des anomalies,
  compte rendu de contrôle), et l'échéancier des téléchargements, calculé par
  véhicule depuis la flotte et par conducteur depuis le registre. La défense :
  le rétroplanning des délais de la commission, la note de méthode et la liste
  des moyens, prêts le jour du contrôle.

  Rien ne se saisit deux fois : les véhicules viennent de flotte-vehicules, les
  conducteurs de registre-personnel. Le moteur et les textes vérifiés sont dans
  conformite-transport.js.
-->

<style>
  .enveloppe{max-width:820px;margin:0 auto;padding:0 16px}
  h1.titre{font:600 clamp(22px,3.4vw,30px)/1.3 system-ui;margin:var(--e5) 0 4px}
  .sous{color:var(--texte-2);margin:0 0 var(--e5)}
  .espace{margin:var(--e6) 0}
  .espace>h2{font-size:var(--t5);border-bottom:1.5px solid var(--trait);padding-bottom:6px;margin:0 0 var(--e3)}
  details.repli>summary{font:600 var(--t5)/1.3 system-ui;border-bottom:1.5px solid var(--trait);padding-bottom:6px;margin:0 0 var(--e3);cursor:pointer;list-style:none;color:var(--texte-2)}
  details.repli>summary::-webkit-details-marker{display:none}
  details.repli>summary::after{content:" +";color:var(--texte-2);font-weight:400}
  details.repli[open]>summary::after{content:" -"}
  .carte{border:1px solid var(--trait);border-radius:10px;padding:14px 16px;margin:0 0 var(--e3);background:var(--fond-2)}
  .carte h3{margin:0 0 2px;font-size:var(--t4)}
  .carte .sous3{color:var(--texte-2);font-size:var(--t2);margin:0 0 8px}
  .carte button{font-size:15px;padding:9px 16px}
  .doc{display:none;margin:10px 0 0;padding:12px 0 0;border-top:1px dashed var(--trait)}
  .doc.ouvert{display:block}
  .doc h4{margin:12px 0 4px}
  .doc .bloc-h1{font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin:4px 0 8px}
  .doc .bloc-h2{font-weight:700;margin:10px 0 2px}
  .doc .bloc-note{color:var(--texte-2);font-style:italic;font-size:var(--t2)}
  .doc .bloc-table{font-family:ui-monospace,monospace;font-size:13px;background:var(--fond);padding:8px;border-radius:6px;white-space:pre-wrap}
  .doc .volet{margin:10px 0 0}
  .doc .volet b{display:block;margin:0 0 2px}
  .doc ul{margin:4px 0 0;padding-left:20px}
  table.ech{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:14px}
  table.ech th,table.ech td{border:1px solid var(--trait);padding:6px 8px;text-align:left;vertical-align:top}
  table.ech th{background:var(--fond-2)}
  .pastille{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .f-vert{background:#1f6f43;color:#fff}.f-orange{background:#9a5b16;color:#fff}
  .f-rouge{background:#8a2020;color:#fff}.f-gris{background:#555;color:#fff}
  table.ech input{width:140px}
  .nontransport{border:1px solid var(--trait);border-radius:10px;padding:16px;color:var(--texte-2)}
  .retro td input{width:160px}
  /* le look de la fiche : bascules segmentées et lignes de documents */
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--trait)}
  .ctl .lb{font-weight:600;font-size:14px}
  .seg{display:inline-flex;border:1px solid var(--trait);border-radius:9px;overflow:hidden;background:var(--fond)}
  .seg button{font:600 13px system-ui;border:0;background:transparent;color:var(--texte-2);padding:7px 14px;cursor:pointer;margin:0}
  .seg button.on{background:var(--accent);color:#fff}
  .fitem{padding:11px 0;border-top:1px solid var(--trait)}
  .fitem .ti b{font-size:15px;display:block}
  .fitem .ti span{color:var(--texte-2);font-size:13px}
  .fitem .co{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .fitem .co .lab{font-size:12px;color:var(--texte-2)}
  .fitem .co input[type=date]{font-size:14px;padding:7px 9px}
  .fitem .co button{margin:0;font-size:14px;padding:8px 14px}
  .pick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .chip-cond{font:600 14px system-ui;border:1px solid var(--trait);background:var(--fond-2);color:var(--texte);border-radius:20px;padding:8px 14px;cursor:pointer;margin:0}
  .chip-cond.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip-cond::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:#777}
  .chip-cond.f-rouge::before{background:#8a2020}.chip-cond.f-orange::before{background:#9a5b16}.chip-cond.f-vert::before{background:#1f6f43}
  .chip-cond.on::before{background:#fff}
  .choixcond{margin:0 0 14px}
  .choixcond label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:5px}
  .choixcond select{font-size:16px;padding:10px;border:1px solid var(--trait);border-radius:9px;background:var(--fond-2);color:var(--texte)}
  .cond h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cond .pl{font-size:11px;background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:1px 8px;color:var(--texte-2)}
  .mini{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
  .mini label{display:flex;flex-direction:column;font-size:12px;color:var(--texte-2);gap:2px}
  .mini input,.mini select{font-size:14px;padding:7px 8px}
  .mini input[type=text]{min-width:120px}
  .mini button{font-size:14px;padding:8px 12px}
  .sup{background:none;border:none;color:var(--texte-2);cursor:pointer;font-size:16px;padding:0 4px}
  .vide{color:var(--texte-2);font-style:italic;font-size:var(--t2);margin:6px 0 0}
  .echeance{border:1px solid var(--trait);border-left:4px solid var(--trait);border-radius:10px;padding:12px 14px;margin:0 0 10px;background:var(--fond-2)}
  .echeance.b-vert{border-left-color:#1f6f43}.echeance.b-orange{border-left-color:#9a5b16}
  .echeance.b-rouge{border-left-color:#8a2020}.echeance.b-gris{border-left-color:#777}
  .echeance .et-titre{font-weight:600;margin:0 0 8px}
  .echeance .et-ligne{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin:6px 0}
  .echeance .et-ligne>span.lab{color:var(--texte-2);font-size:var(--t2)}
  .echeance input[type=date]{font-size:15px;padding:7px 8px}
</style>

<body>
<div class="enveloppe">
  <div class="haut"><a class="retour" href="gerer.html">&larr; Retour</a></div>
  <h1 class="titre">Tachygraphe, cartes conducteurs et temps de conduite</h1>
  <p class="sous">Le dispositif à tenir au quotidien, conducteur par conducteur, et le dossier prêt en cas de contrôle.</p>
  <div id="corps"></div>
</div>

<script src="documents-transport.js?v=6db77104"></script>
<script src="flotte.js?v=218623f7"></script>
<script src="tableur-export.js?v=c41750d9"></script>
<script src="apercu.js?v=0d8afe7c"></script>
<script src="audit-export.js?v=890d7345"></script>
<script src="base-documents.js?v=6d57384f"></script>
<script src="lire-pdf.js?v=7667bc22"></script>
<script src="lecture-carte.js?v=d66c2b73"></script>
<script src="lecture-rapport.js?v=4244d96d"></script>
<script src="conformite-transport.js?v=d0811b1b"></script>
<script>
"use strict";
(function () {
  var CT = window.ConformiteTransport;
  var corps = document.getElementById("corps");
  function ech(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  /* Une date ISO rendue en français : 2027-01-31 devient 31 janv. 2027. */
  function joliDate(iso){
    if(!iso) return "";
    try{ return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"})
      .format(new Date(iso+"T00:00:00")); }catch(e){ return iso; }
  }

  if (!CT || !CT.estTransport()) {
    corps.innerHTML = '<div class="nontransport">Ce module s\'adresse aux entreprises de transport routier ' +
      '(convention IDCC 16). La fiche d\'entreprise n\'indique pas ce secteur : renseignez-la pour l\'activer.</div>';
    return;
  }

  /* ─── bloc d'un document ─── */
  function rendreBloc(bl) {
    var t = ech(bl.t);
    if (bl.k === "h1") return '<div class="bloc-h1">' + t + '</div>';
    if (bl.k === "h2") return '<div class="bloc-h2">' + t + '</div>';
    if (bl.k === "note") return '<p class="bloc-note">' + t + '</p>';
    if (bl.k === "table") return '<div class="bloc-table">' + t.split(" | ").join("   |   ") + '</div>';
    if (bl.k === "sign") return '<p class="bloc-note">' + t + '</p><p>Date et signature : ______________________</p>';
    return '<p>' + t + '</p>';
  }
  function rendreDoc(d) {
    var h = '';
    d.blocs.forEach(function (bl) { h += rendreBloc(bl); });
    h += '<div class="volet"><b>Formalités</b><ul>';
    d.formalites.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div><div class="volet"><b>Le droit</b><ul>';
    d.droit.forEach(function (f) { h += '<li>' + ech(f) + '</li>'; });
    h += '</ul></div>';
    return h;
  }

  var html = '';

  /* ───────── LE POINT D'ENTRÉE : LA FICHE DE CHAQUE CONDUCTEUR ───────── */
  html += '<div class="espace"><h2>Les conducteurs</h2>' +
    '<p class="sous3">Choisissez un conducteur : sa fiche porte tout, son profil, ses documents à détenir et ' +
    'à remettre, la lecture de sa carte, ses infractions et sa réaction.</p>' +
    '<div id="cond-liste"></div></div>';

  /* ───────────────── ÉCHÉANCIER DES TÉLÉCHARGEMENTS ───────────────── */
  html += '<div class="espace"><h2>Échéancier des téléchargements</h2>' +
    '<p class="sous3">Carte tous les ' + CT.DELAI_CARTE + ' jours (registre), véhicule tous les ' +
    CT.DELAI_VEHICULE + ' jours (flotte). Portez la dernière date, l\'échéance se calcule.</p>' +
    '<div id="ech-corps"></div>' +
    '<div class="carte" style="margin-top:12px"><h3>Certificat du conseiller ADR</h3>' +
    '<p class="sous3">Fin de validité : <input type="date" id="date-adr"> ' +
    '<span id="adr-etat"></span></p></div></div>';

  /* ─── les modèles du dispositif, repliés : utiles, mais pas en premier ─── */
  html += '<details class="espace repli"><summary>Les documents du dispositif (consigne, journal, registre, compte rendu)</summary>';
  CT.documents().forEach(function (d) {
    html += '<div class="carte"><h3>' + ech(d.nom) + '</h3>' +
      '<p class="sous3">' + ech(d.sous) + '</p>' +
      '<button data-doc="' + d.cle + '">Voir le modèle</button> ' +
      '<button data-word="' + d.cle + '">Télécharger en Word</button>' +
      '<div class="doc" id="doc-' + d.cle + '">' + rendreDoc(d) + '</div></div>';
  });
  html += '</details>';

  /* ───────────────── ESPACE B : DÉFENSE ───────────────── */
  var def = CT.defense();
  html += '<div class="espace"><h2>En cas de contrôle ou de saisine de la commission</h2>';
  html += '<div class="carte"><h3>Rétroplanning des délais</h3>' +
    '<p class="sous3">Date de la séance : <input type="date" id="date-seance"></p>' +
    '<table class="ech retro"><thead><tr><th>Étape</th><th>Règle</th><th>Date</th></tr></thead>' +
    '<tbody id="retro-corps"></tbody></table></div>';
  html += '<div class="carte"><h3>' + ech(def.note.titre) + '</h3><div class="doc ouvert">';
  def.note.blocs.forEach(function (bl) { html += rendreBloc(bl); });
  html += '</div></div>';
  html += '<div class="carte"><h3>Liste des moyens à vérifier</h3><div class="doc ouvert"><ul>';
  def.checklist.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Proportionnalité : conséquences d\'une sanction</h3><div class="doc ouvert"><ul>';
  def.proportionnalite.phrases.forEach(function (m) { html += '<li>' + ech(m) + '</li>'; });
  html += '</ul></div></div>';
  html += '<div class="carte"><h3>Tableau des infractions</h3>' +
    '<p class="sous3">Une ligne par infraction, avec les véhicules et conducteurs repris de la flotte et du registre.</p>' +
    '<button id="export-infractions">Télécharger le classeur</button></div>';
  html += '<div class="carte"><h3>Délai pour sanctionner un conducteur</h3>' +
    '<p class="sous3">Date de connaissance des faits : <input type="date" id="date-connaissance"></p>' +
    '<div id="delai-disc"></div></div>';
  html += '</div>';

  corps.innerHTML = html;

  /* ─── interactions ─── */
  corps.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-doc]");
    if (b) document.getElementById("doc-" + b.getAttribute("data-doc")).classList.toggle("ouvert");
    var w = e.target.closest("button[data-word]");
    if (w) { if (!CT.enWord(w.getAttribute("data-word"))) alert("Le générateur Word n'est pas disponible sur cette page."); }
    if (e.target.id === "export-infractions") {
      if (!CT.exportInfractions()) alert("Le moteur d'export n'est pas disponible sur cette page.");
    }
  });

  /* délai disciplinaire (L. 1332-4) */
  document.getElementById("date-connaissance").addEventListener("change", function (e) {
    var cible = document.getElementById("delai-disc");
    var d = CT.delaiDisciplinaire(e.target.value);
    if (!d) { cible.textContent = ""; return; }
    cible.innerHTML = '<p>Dernier jour pour engager la sanction : <b>' + ech(d.echeance) +
      '</b> <span class="pastille f-' + (d.jours < 0 ? "rouge" : d.jours <= 7 ? "orange" : "vert") +
      '">' + ech(d.etat) + (d.jours != null ? " (" + d.jours + " j)" : "") + '</span></p>' +
      '<p class="bloc-note">' + ech(d.reserve) + '</p>';
  });

  /* échéancier : une fiche par véhicule et par conducteur, lisible de haut en
     bas sur un téléphone, plutôt qu'un tableau à cinq colonnes qui déborde. */
  function peindreEch() {
    var tb = document.getElementById("ech-corps"), L = CT.echeances(), h = '';
    if (!L.length) {
      tb.innerHTML = '<p class="vide">La flotte et le registre ne portent encore ni véhicule ni conducteur.</p>';
      return;
    }
    L.forEach(function (x) {
      var carte = x.quoi.indexOf("carte") >= 0;
      var titre = carte ? "Carte conducteur" : "Véhicule";
      var fond = x.fond || "gris";
      h += '<div class="echeance b-' + fond + '">' +
        '<div class="et-titre">' + titre + ' : ' + ech(x.qui) + '</div>' +
        '<div class="et-ligne"><span class="lab">Dernier téléchargement</span>' +
        '<input type="date" data-k="' + (carte ? "c" : "v") + '" data-qui="' + ech(x.qui) +
        '" value="' + (x.dernier || "") + '"></div>' +
        '<div class="et-ligne"><span class="lab">Prochaine limite</span>' +
        '<span><b>' + (x.date ? ech(joliDate(x.date)) : "à renseigner") + '</b> ' +
        '<span class="pastille f-' + fond + '">' + ech(x.etat) +
        (x.jours != null ? " (" + x.jours + " j)" : "") + '</span></span></div></div>';
    });
    tb.innerHTML = h;
  }
  peindreEch();
  document.getElementById("ech-corps").addEventListener("change", function (e) {
    var inp = e.target; if (inp.type !== "date" || !inp.value) return;
    var qui = inp.getAttribute("data-qui");
    if (inp.getAttribute("data-k") === "c") {
      var s = CT.salaries().filter(function (x) { return x.nom === qui; })[0];
      if (s) CT.porterTelechargementCarte(s.id, inp.value);
    } else {
      CT.porterTelechargementVehicule(qui, inp.value);
    }
    peindreEch();
  });

  /* certificat ADR */
  function peindreADR() {
    var e = CT.echeanceADR(), s = document.getElementById("adr-etat");
    var inp = document.getElementById("date-adr");
    if (e) { inp.value = e.date;
      s.innerHTML = '<span class="pastille f-' + e.fond + '">' + ech(e.etat) +
        (e.jours != null ? " (" + e.jours + " j)" : "") + '</span>'; }
    else s.textContent = "";
  }
  peindreADR();
  document.getElementById("date-adr").addEventListener("change", function (e) {
    if (e.target.value) { CT.porterCertificatADR(e.target.value); peindreADR(); }
  });

  /* ─── suivi par conducteur ─── */
  function optionsCat(sel) {
    return CT.CATEGORIES.map(function (c) {
      return '<option value="' + c.cle + '"' + (c.cle === sel ? " selected" : "") +
        '>' + ech(c.nom) + '</option>';
    }).join("");
  }
  function seg(id, champ, opts, val) {
    return '<div class="seg">' + opts.map(function (o) {
      return '<button data-prof-c="' + champ + '" data-c="' + id + '" data-val="' + o[0] + '"' +
        (o[0] === val ? ' class="on"' : '') + '>' + ech(o[1]) + '</button>';
    }).join("") + '</div>';
  }
  function optionsSanctions(sel) {
    return CT.SANCTIONS.map(function (s) {
      return '<option value="' + s.cle + '"' + (s.cle === sel ? " selected" : "") + '>' + ech(s.nom) + '</option>';
    }).join("");
  }
  var selId = null;
  function peindreConducteurs() {
    var cont = document.getElementById("cond-liste");
    var L = CT.conducteurs(), h = '';
    if (!L.length) { cont.innerHTML = '<p class="vide">Le registre du personnel ne porte encore aucun conducteur.</p>'; return; }
    if (!selId || !L.some(function (x) { return x.id === selId; })) selId = L[0].id;
    h += '<div class="choixcond"><label>Salarié (fichier du personnel)<select id="sel-cond">' +
      L.map(function (x) {
        return '<option value="' + x.id + '"' + (x.id === selId ? ' selected' : '') + '>' + ech(x.nom) +
          (x.fond === "rouge" ? " (à traiter)" : "") + '</option>';
      }).join("") + '</select></label></div>';
    var c = L.filter(function (x) { return x.id === selId; })[0];
    var s = CT.suiviConducteur(c.id);
    h += '<div class="carte cond"><h3>' + ech(c.nom) +
      (c.poidsLourd ? ' <span class="pl">poids lourd</span>' : '') +
      ' <span class="pastille f-' + c.fond + '">' + ech(c.etat) + '</span></h3>' +
      '<p class="sous3">' + ech(c.poste || "poste non précisé") + '  ·  ' +
      c.anomalies + ' anomalie' + (c.anomalies > 1 ? 's' : '') + ', ' +
      c.mesures + ' mesure' + (c.mesures > 1 ? 's' : '') + '</p>' +
      '<button data-fiche="' + c.id + '">Télécharger la fiche en Word</button>' +
      '<div class="doc ouvert" id="cond-' + c.id + '">';

      /* profil, documents à détenir (avec échéances), documents à remettre */
      var pr = CT.profilConducteur(c.id), eds = CT.echeancesDoc(c.id);
      h += '<div class="bloc-h2">Profil</div>';
      h += '<div class="ctl"><span class="lb">Type de véhicule</span>' +
        seg(c.id, "pl", [["1", "Poids lourd"], ["0", "Léger"]], pr.pl ? "1" : "0") + '</div>';
      h += '<div class="ctl"><span class="lb">Matière dangereuse (ADR)</span>' +
        seg(c.id, "adr", [["1", "Oui"], ["0", "Non"]], pr.adr ? "1" : "0") + '</div>';

      h += '<div class="bloc-h2">Ce qu\'il doit détenir</div>';
      h += '<p class="sous3">Ses documents. Saisissez la date de validité, la fiche alerte avant l\'échéance.</p>';
      CT.docsADetenir(pr).forEach(function (it) {
        var val = eds[it[0]] || '', st = CT.statutDoc(val);
        h += '<div class="fitem"><div class="ti"><b>' + ech(it[1]) + '</b><span>' + ech(it[2]) + '</span></div>' +
          '<div class="co"><span class="lab">valable jusqu\'au</span>' +
          '<input type="date" data-ech-c="' + it[0] + '" data-c="' + c.id + '" value="' + val + '">' +
          '<span class="pastille f-' + st.fond + '">' + ech(st.txt) + '</span></div></div>';
      });

      h += '<div class="bloc-h2">Ce qu\'on lui remet et fait signer</div>';
      h += '<p class="sous3">Produits à son nom, signés, versés à son dossier.</p>';
      CT.docsARemettre(pr).forEach(function (it) {
        h += '<div class="fitem"><div class="ti"><b>' + ech(it[1]) + '</b></div>' +
          '<div class="co"><button data-remettre="' + it[0] + '" data-c="' + c.id + '">Produire</button></div></div>';
      });

      /* lire sa carte : le point de départ de la fiche */
      h += '<div class="carte" style="margin:0 0 10px"><h3>Lire sa carte</h3>' +
        '<p class="sous3">Le fichier .ddd ou .C1B, ou le rapport d\'analyse en PDF. Les infractions tombent ' +
        'directement dans sa fiche. Rien n\'est envoyé.</p>' +
        '<input type="file" data-lire-c="' + c.id + '" accept=".ddd,.C1B,.c1b,.DDD,.tgd,.TGD,.pdf,application/pdf,application/octet-stream"></div>';

      /* anomalies */
      h += '<div class="bloc-h2">Anomalies relevées</div>';
      if (s.anomalies.length) {
        h += '<table class="ech"><thead><tr><th>Date</th><th>Type</th><th>Détail</th><th></th></tr></thead><tbody>';
        s.anomalies.forEach(function (a, i) {
          h += '<tr><td>' + ech(a.date) + '</td><td>' + ech(a.type) + '</td><td>' + ech(a.detail) +
            '</td><td><button class="sup" data-sup-ano="' + c.id + '" data-i="' + i + '" title="Supprimer">×</button></td></tr>';
        });
        h += '</tbody></table>';
      } else { h += '<p class="vide">Aucune anomalie relevée.</p>'; }
      h += '<div class="mini">' +
        '<label>Date<input type="date" data-f="ano-date" data-c="' + c.id + '"></label>' +
        '<label>Type<input type="text" data-f="ano-type" data-c="' + c.id + '" placeholder="ex. dépassement du temps de conduite"></label>' +
        '<label>Détail<input type="text" data-f="ano-detail" data-c="' + c.id + '" placeholder="ce qui a été constaté"></label>' +
        '<button data-add-ano="' + c.id + '">Ajouter l\'anomalie</button></div>';

      /* réactions */
      h += '<div class="bloc-h2">Réactions : correction, ajustement, sanction</div>';
      if (s.mesures.length) {
        h += '<table class="ech"><thead><tr><th>Date</th><th>Catégorie</th><th>Mesure</th><th>Pour</th><th></th></tr></thead><tbody>';
        s.mesures.forEach(function (m, i) {
          var cat = (CT.CATEGORIES.filter(function (x) { return x.cle === (m.categorie || "").toLowerCase(); })[0] || {}).nom || m.categorie;
          h += '<tr><td>' + ech(m.date) + '</td><td>' + ech(cat) + '</td><td>' + ech(m.objet) +
            '</td><td>' + ech(m.pour) + '</td><td><button class="sup" data-sup-mes="' + c.id + '" data-i="' + i + '" title="Supprimer">×</button></td></tr>';
        });
        h += '</tbody></table>';
      } else { h += '<p class="vide">Aucune mesure prise.</p>'; }
      h += '<div class="mini">' +
        '<label>Date<input type="date" data-f="mes-date" data-c="' + c.id + '"></label>' +
        '<label>Catégorie<select data-f="mes-cat" data-c="' + c.id + '">' + optionsCat("correction") + '</select></label>' +
        '<label>Mesure<input type="text" data-f="mes-objet" data-c="' + c.id + '" placeholder="ce qui est fait"></label>' +
        '<label>Pour<input type="text" data-f="mes-pour" data-c="' + c.id + '" placeholder="le type de manquement visé"></label>' +
        '<button data-add-mes="' + c.id + '">Ajouter la mesure</button></div>';

      /* rapport et sanction, à partir des infractions */
      h += '<div class="bloc-h2">Rapport au conducteur et sanction</div>';
      h += '<div class="mini">' +
        '<button data-rapport="' + c.id + '">Mise en garde à signer</button>' +
        '<label>Sanction proposée<select data-f="sanc" data-c="' + c.id + '">' +
        optionsSanctions(CT.sanctionProposee(c.id)) + '</select></label>' +
        '<button data-sanction="' + c.id + '">Éditer le document à signer</button></div>';

      if (c.fond === "rouge") h += '<p class="bloc-note">' + ech(c.message) + '</p>';
      h += '</div></div>';
    cont.innerHTML = h;
  }
  function valeur(sel, id) {
    var el = document.querySelector('[data-f="' + sel + '"][data-c="' + id + '"]');
    return el ? el.value : "";
  }
  peindreConducteurs();
  document.getElementById("cond-liste").addEventListener("click", function (e) {
    var f = e.target.closest("button[data-fiche]");
    if (f) { if (!CT.enWordSuivi(f.getAttribute("data-fiche"))) alert("Le générateur Word n'est pas disponible sur cette page."); return; }
    var pcb = e.target.closest("button[data-prof-c]");
    if (pcb) { var idp = pcb.getAttribute("data-c");
      CT.setProfilConducteur(idp, pcb.getAttribute("data-prof-c"), pcb.getAttribute("data-val") === "1");
      peindreConducteurs(); reouvrir(idp); return; }
    var rm = e.target.closest("button[data-remettre]");
    if (rm) { if (!CT.enWordDocConducteur(rm.getAttribute("data-c"), rm.getAttribute("data-remettre"))) alert("Le générateur Word n'est pas disponible sur cette page."); return; }
    var rp = e.target.closest("button[data-rapport]");
    if (rp) { if (!CT.enWordRapport(rp.getAttribute("data-rapport"))) alert("Le générateur Word n'est pas disponible sur cette page."); return; }
    var sc = e.target.closest("button[data-sanction]");
    if (sc) { var sid = sc.getAttribute("data-sanction");
      var sel = document.querySelector('[data-f="sanc"][data-c="' + sid + '"]');
      if (!CT.enWordSanction(sid, sel ? sel.value : "rappel")) alert("Le générateur Word n'est pas disponible sur cette page.");
      return; }
    var aa = e.target.closest("button[data-add-ano]");
    if (aa) {
      var id = aa.getAttribute("data-add-ano");
      var type = valeur("ano-type", id);
      if (!type) { alert("Indiquez au moins le type d'anomalie."); return; }
      CT.ajouterAnomalie(id, { date: valeur("ano-date", id), type: type, detail: valeur("ano-detail", id) });
      peindreConducteurs(); reouvrir(id); return;
    }
    var am = e.target.closest("button[data-add-mes]");
    if (am) {
      var idm = am.getAttribute("data-add-mes");
      var objet = valeur("mes-objet", idm);
      if (!objet) { alert("Indiquez la mesure prise."); return; }
      CT.ajouterMesure(idm, { date: valeur("mes-date", idm), categorie: valeur("mes-cat", idm),
        objet: objet, pour: valeur("mes-pour", idm) });
      peindreConducteurs(); reouvrir(idm); return;
    }
    var sa = e.target.closest("button[data-sup-ano]");
    if (sa) { var ida = sa.getAttribute("data-sup-ano");
      CT.supprimerAnomalie(ida, +sa.getAttribute("data-i")); peindreConducteurs(); reouvrir(ida); return; }
    var sm = e.target.closest("button[data-sup-mes]");
    if (sm) { var idsm = sm.getAttribute("data-sup-mes");
      CT.supprimerMesure(idsm, +sm.getAttribute("data-i")); peindreConducteurs(); reouvrir(idsm); return; }
  });
  /* Un rapport multi-conducteurs (correspondance, infractions) porte le nom du
     conducteur sur chaque anomalie. On ventile chacune au conducteur du registre
     dont le nom correspond, par les mots partagés (au moins deux, sans
     ambiguïté). Ce qui ne se rattache pas - conducteur hors effectif, ou nom
     manquant - est listé à part, à confirmer à la main. */
  function ventilerParNom(anoms) {
    var sals = (CT && CT.salaries) ? CT.salaries() : [];
    function toks(s) {
      return String(s || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^A-Z]+/g, " ").trim().split(" ").filter(function (w) { return w.length >= 2 && w !== "TEC"; });
    }
    var salToks = sals.map(function (s) { return { id: s.id, nom: s.nom, t: toks(s.nom) }; });
    var groupes = {}, nonRattaches = [];
    (anoms || []).forEach(function (a) {
      var at = toks(a.conducteur);
      if (!at.length) { nonRattaches.push(a); return; }
      var best = null, bestN = 0, tie = false;
      salToks.forEach(function (s) {
        var inter = s.t.filter(function (w) { return at.indexOf(w) >= 0; }).length;
        if (inter > bestN) { bestN = inter; best = s; tie = false; }
        else if (inter === bestN && inter > 0 && best && s.id !== best.id) { tie = true; }
      });
      if (best && bestN >= 2 && !tie) { (groupes[best.id] = groupes[best.id] || []).push(a); }
      else nonRattaches.push(a);
    });
    return { groupes: groupes, nonRattaches: nonRattaches,
      nomDe: function (id) { var s = salToks.filter(function (x) { return x.id === id; })[0]; return s ? s.nom : id; } };
  }

  function messageNonRattaches(nonRattaches, intro) {
    if (!nonRattaches.length) return "";
    var noms = {};
    nonRattaches.forEach(function (a) { var c = a.conducteur || "conducteur à confirmer"; noms[c] = (noms[c] || 0) + 1; });
    return "\n\n" + intro + " :\n" +
      Object.keys(noms).map(function (c) { return "- " + c + " : " + noms[c]; }).join("\n");
  }

  function dispatcherCorrespondance(anoms) {
    var v = ventilerParNom(anoms), lignesMsg = [];
    Object.keys(v.groupes).forEach(function (id) {
      var n = CT.importerAnomalies(id, v.groupes[id]);
      lignesMsg.push("- " + v.nomDe(id) + " : " + n + " conduite(s) sans carte");
    });
    peindreConducteurs();
    var msg = "Rapport de correspondance : " + (anoms || []).length + " conduites sans carte lues.\n\n" +
      (lignesMsg.length ? "Rattachées au registre :\n" + lignesMsg.join("\n")
        : "Aucune n'a pu être rattachée à un conducteur du registre.");
    msg += messageNonRattaches(v.nonRattaches, "À confirmer (hors effectif, ou véhicule sans session de carte)");
    alert(msg);
  }

  function dispatcherInfractions(anoms) {
    var v = ventilerParNom(anoms), lignesMsg = [];
    Object.keys(v.groupes).forEach(function (id) {
      var grp = v.groupes[id], n = CT.importerAnomalies(id, grp);
      var graves = grp.filter(function (a) { return a.grave; }).length;
      lignesMsg.push("- " + v.nomDe(id) + " : " + n + " infraction(s)" +
        (graves ? " dont " + graves + " grave(s)" : ""));
    });
    peindreConducteurs();
    lignesMsg.sort();
    var msg = "Rapport d'infractions : " + (anoms || []).length + " infraction(s) lue(s) pour " +
      Object.keys(v.groupes).length + " conducteur(s).\n\n" +
      (lignesMsg.length ? "Portées au registre :\n" + lignesMsg.join("\n")
        : "Aucune n'a pu être rattachée à un conducteur du registre.");
    msg += messageNonRattaches(v.nonRattaches, "À confirmer (conducteur hors effectif)");
    alert(msg);
  }

  function lireCartePour(id, f) {
    var cible = document.getElementById("cond-" + id);
    var fr = new FileReader();
    fr.onload = function () {
      var buf = fr.result, tete = new Uint8Array(buf.slice(0, 5));
      var estPdf = /\.pdf$/i.test(f.name) ||
        (tete[0] === 0x25 && tete[1] === 0x50 && tete[2] === 0x44 && tete[3] === 0x46);
      /* Un classeur Excel ou un texte : on ne le lit pas, on le dit. */
      if (/\.(xlsx|xls|xlsm|csv|txt|docx?)$/i.test(f.name) ||
          (tete[0] === 0x50 && tete[1] === 0x4b && !estPdf)) {
        alert("Ce fichier n'est pas lu ici. Déposez la carte du conducteur (.ddd ou .C1B), " +
          "le relevé de correspondance ou le rapport d'infractions en PDF. Un classeur ou une note " +
          "d'analyse ne sont pas des relevés tachygraphe.");
        return;
      }
      function importe(anoms) {
        var n = CT.importerAnomalies(id, anoms || []);
        peindreConducteurs(); reouvrir(id);
        alert(n + " infraction" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "") + " à sa fiche" +
          (anoms && n < anoms.length ? " (" + (anoms.length - n) + " déjà présente(s))" : "") + ".");
      }
      if (estPdf) {
        if (!window.LectureRapport) { alert("Le lecteur de rapport PDF n'est pas disponible."); return; }
        window.LectureRapport.lire(buf).then(function (rap) {
          var anoms = window.LectureRapport.anomalies(rap);
          if (rap.source === "pdf-correspondance") dispatcherCorrespondance(anoms);
          else if (rap.source === "pdf-infractions") dispatcherInfractions(anoms);
          else if (!anoms.length) {
            alert("Ce PDF a été lu, mais ce n'est ni un relevé d'infractions, ni un relevé de " +
              "correspondance, ni un rapport d'analyse reconnu (peut-être un graphique journalier " +
              "ou un relevé de géolocalisation). Aucune infraction n'en a été tirée.");
          } else importe(anoms);
        }).catch(function (err) { alert("PDF illisible : " + (err && err.message || err)); });
        return;
      }
      if (!window.LectureCarte) { alert("Le lecteur de carte n'est pas disponible."); return; }
      try {
        var carte = window.LectureCarte.lire(buf);
        if (!carte.identification) {
          alert("Ce fichier n'est pas une carte conducteur exploitable. C'est sans doute un " +
            "téléchargement d'unité véhicule (.V1B) ou un fichier d'un autre type. Déposez la carte " +
            "du conducteur (.ddd ou .C1B).");
          return;
        }
        importe(window.LectureCarte.analyser(carte).anomalies);
      } catch (err) { alert("Fichier illisible : " + err.message); }
    };
    fr.onerror = function () { alert("Le fichier n'a pas pu être ouvert."); };
    fr.readAsArrayBuffer(f);
  }
  document.getElementById("cond-liste").addEventListener("change", function (e) {
    var sc = e.target.closest("#sel-cond");
    if (sc) { selId = sc.value; peindreConducteurs(); return; }
    var lc = e.target.closest("[data-lire-c]");
    if (lc) { var idl = lc.getAttribute("data-lire-c"); var f = lc.files && lc.files[0];
      if (f) { lc.value = ""; lireCartePour(idl, f); } return; }
    var ed = e.target.closest("[data-ech-c]");
    if (ed) { var ide = ed.getAttribute("data-c");
      CT.porterEcheanceDoc(ide, ed.getAttribute("data-ech-c"), ed.value);
      peindreConducteurs(); reouvrir(ide); return; }
  });
  function reouvrir(id) { selId = id; }

  /* ─── lecture d'une carte conducteur ─── */
  function optionsConducteurs(sel) {
    return '<option value="">choisir le conducteur</option>' +
      CT.salaries().map(function (s) {
        return '<option value="' + s.id + '"' + (s.id === sel ? " selected" : "") + '>' + ech(s.nom) + '</option>';
      }).join("");
  }
  var carteAnalyse = null;
  var inpCarte = document.getElementById("carte-fichier");
  if (inpCarte) inpCarte.addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    var cible = document.getElementById("carte-resultat");
    if (!f) { cible.innerHTML = ""; return; }
    var fr = new FileReader();
    fr.onload = function () {
      var buf = fr.result, tete = new Uint8Array(buf.slice(0, 5));
      var estPdf = /\.pdf$/i.test(f.name) ||
        (tete[0] === 0x25 && tete[1] === 0x50 && tete[2] === 0x44 && tete[3] === 0x46);
      if (estPdf) {
        if (!window.LectureRapport) { cible.innerHTML = '<p class="vide">Le lecteur de rapport PDF n\'est pas disponible sur cette page.</p>'; return; }
        cible.innerHTML = '<p class="sous3">Lecture du rapport…</p>';
        window.LectureRapport.lire(buf).then(function (rap) {
          var nomRap = rap.conducteur.nom || "";
          carteAnalyse = { identification: { titulaire: nomRap, nom: nomRap.split(/\s+/).pop() || "" },
            periode: null, nbJours: 0, vehicules: [], evenements: [],
            anomalies: window.LectureRapport.anomalies(rap) };
          peindreCarte();
        }).catch(function (err) {
          cible.innerHTML = '<p class="vide">PDF illisible : ' + ech(err && err.message || err) + '</p>'; });
        return;
      }
      if (!window.LectureCarte) { cible.innerHTML = '<p class="vide">Le lecteur de carte n\'est pas disponible sur cette page.</p>'; return; }
      try {
        var carte = window.LectureCarte.lire(buf);
        carteAnalyse = window.LectureCarte.analyser(carte);
      } catch (err) {
        cible.innerHTML = '<p class="vide">Fichier illisible : ' + ech(err.message) + '</p>'; return;
      }
      peindreCarte();
    };
    fr.onerror = function () { cible.innerHTML = '<p class="vide">Le fichier n\'a pas pu être ouvert.</p>'; };
    fr.readAsArrayBuffer(f);
  });
  function peindreCarte() {
    var a = carteAnalyse, cible = document.getElementById("carte-resultat");
    if (!a) { cible.innerHTML = ""; return; }
    var id = a.identification || {};
    if (!id.titulaire && !a.nbJours && !a.evenements.length) {
      cible.innerHTML = '<p class="vide">Ce fichier ne ressemble pas à une carte de conducteur lisible (aucune identification ni activité).</p>'; return;
    }
    var match = CT.matchConducteur(a);
    var h = '<div class="doc ouvert">';
    h += '<div class="bloc-h2">Carte lue</div>';
    h += '<p>' + ech(id.titulaire || "titulaire non lu") +
      (id.numero ? '  ·  n° ' + ech(id.numero) : '') +
      (id.expiration ? '  ·  valable jusqu\'au ' + ech(id.expiration) : '') + '</p>';
    if (a.periode) h += '<p class="sous3">Activités du ' + ech(a.periode.du) + ' au ' + ech(a.periode.au) +
      ', ' + a.nbJours + ' jour' + (a.nbJours > 1 ? 's' : '') + '. Véhicules : ' + a.vehicules.length + '.</p>';

    h += '<div class="mini"><label>Rattacher au conducteur<select id="carte-cible">' +
      optionsConducteurs(match) + '</select></label>' +
      '<button id="carte-date">Porter la date de téléchargement</button></div>';
    h += '<span id="carte-msg" class="sous3"></span>';

    h += '<div class="bloc-h2">Anomalies tirées de la carte</div>';
    if (a.anomalies.length) {
      h += '<table class="ech"><thead><tr><th></th><th>Date</th><th>Type</th><th>Détail</th></tr></thead><tbody>';
      a.anomalies.forEach(function (x, i) {
        h += '<tr><td><input type="checkbox" class="ia" data-i="' + i + '" checked></td><td>' +
          ech(x.date) + '</td><td>' + ech(x.type) + '</td><td>' + ech(x.detail) + '</td></tr>';
      });
      h += '</tbody></table><div class="mini"><button id="carte-ajouter">Ajouter les anomalies cochées au suivi</button></div>';
    } else {
      h += '<p class="vide">Aucune anomalie tirée de la carte : ni dépassement calculé, ni événement enregistré par l\'appareil.</p>';
    }
    h += '</div>';
    cible.innerHTML = h;

    var bd = document.getElementById("carte-date");
    if (bd) bd.addEventListener("click", function () {
      var cid = document.getElementById("carte-cible").value;
      if (!cid) { msgCarte("Choisissez d'abord le conducteur."); return; }
      var d = a.periode ? a.periode.au : null;
      d = d || new Date().toISOString().slice(0, 10);
      CT.porterTelechargementCarte(cid, d);
      peindreEch();
      msgCarte("Date du téléchargement portée à l'échéancier (" + d + ").");
    });
    var ba = document.getElementById("carte-ajouter");
    if (ba) ba.addEventListener("click", function () {
      var cid = document.getElementById("carte-cible").value;
      if (!cid) { msgCarte("Choisissez d'abord le conducteur."); return; }
      var choisies = [];
      Array.prototype.forEach.call(document.querySelectorAll("#carte-resultat .ia:checked"), function (c) {
        choisies.push(a.anomalies[+c.getAttribute("data-i")]);
      });
      var n = CT.importerAnomalies(cid, choisies);
      peindreConducteurs(); reouvrir(cid);
      msgCarte(n + " anomalie" + (n > 1 ? "s" : "") + " ajoutée" + (n > 1 ? "s" : "") + " au suivi" +
        (n < choisies.length ? " (" + (choisies.length - n) + " déjà présente(s))" : "") + ".");
    });
  }
  function msgCarte(t) { var m = document.getElementById("carte-msg"); if (m) m.textContent = t; }

  /* rétroplanning */
  function peindreRetro() {
    var ds = document.getElementById("date-seance").value || null;
    var tb = document.getElementById("retro-corps"), h = '';
    CT.retroplanning(ds).forEach(function (e) {
      h += '<tr><td>' + ech(e.quoi) + '</td><td>' + ech(e.regle) + '</td><td>' + ech(e.date || "") + '</td></tr>';
    });
    tb.innerHTML = h;
  }
  peindreRetro();
  document.getElementById("date-seance").addEventListener("change", peindreRetro);
})();
</script>

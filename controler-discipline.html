<!--
  LA BRANCHE « OUI ».

  La question posée est : « Avez-vous un règlement des sanctions et une
  procédure disciplinaire écrite ? » Le « non » écrit le règlement
  (audit-discipline.html). Le « oui » arrive ici, et ici on ne pose aucune
  question : on prend le document, et pour chaque manque on rend la clause
  rédigée, prête à être collée à sa place.

  Le dépôt est le premier écran, et le seul geste qu'on y fait : un fichier
  ou un texte collé, puis Contrôler. Le deuxième écran est ce qui manque, avec
  la clause à insérer sous chaque manque. Le troisième est la version
  complétée, en Word ou imprimée. Ni chapeau, ni étape numérotée : Retour
  remonte d'un écran.

  CE QUE LE REPÉRAGE FAIT, ET CE QU'IL NE FAIT PAS. Il est lexical. Il voit
  qu'un sujet est traité ; il ne dit jamais qu'il est bien traité. Aucun point
  n'est donc dit « conforme » : c'est refusé, pas oublié. Et une clause écrite
  en d'autres termes que ceux que la page connaît sera dite absente. C'est le
  prix du procédé : il vaut mieux relire une clause qui existe que croire
  complète celle qui manque.

  LES TEXTES. Chaque article cité a été demandé deux fois au relais Légifrance
  le 7 septembre 2026, à plusieurs minutes d'intervalle ; les deux lectures ont
  rendu le même identifiant de version et le même texte. L'identifiant LEGIARTI
  est dans la table TEXTES, et « Voir le texte de loi » l'affiche.

  Rien ne quitte ce poste : le fichier déposé est lu dans le navigateur, et
  n'est envoyé nulle part.
-->

<style>
  /* Ce qui est propre à cette page. Le reste vient de style.css. */

  #o-depot{margin:var(--e4) 0 0}
  textarea#depot{min-height:200px;font-size:var(--t3);line-height:1.5;margin:var(--e3) 0 0}
  #o-depot .barre{margin:var(--e3) 0}
  #lecture .avis,#erreur .avis{margin:var(--e3) 0 0}

  .pt{border:1px solid var(--filet);border-radius:var(--r2);margin:var(--e3) 0;
    background:var(--surface);overflow:hidden}
  .pt>.tt{padding:11px 15px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;
    border-bottom:1px solid var(--filet)}
  .pt>.tt .obj{font:600 16px/1.35 system-ui;color:var(--encre);flex:1;min-width:0}
  .etat{font:600 11px/1 system-ui;padding:6px 9px;border-radius:var(--r1);white-space:nowrap;
    text-transform:uppercase;letter-spacing:.04em}
  .etat.absent{background:var(--rouge-clair);color:var(--rouge)}
  .etat.averifier{background:var(--accent-clair);color:var(--accent)}
  .etat.acontroler{background:var(--ambre-clair);color:var(--ambre)}
  .etat.sansobjet{background:var(--creux);color:var(--texte-3)}
  .pt .c{padding:12px 15px;font-size:15px;line-height:1.55;color:var(--texte-2)}
  .pt .c p{margin:0 0 9px}
  .pt .c details{margin:var(--e2) 0 0;border:0;padding:0}
  .pt .c details p{margin:6px 0 0;font-size:var(--t1)}
  blockquote{margin:8px 0;padding:9px 13px;border-left:3px solid var(--filet-2);
    background:var(--creux);border-radius:0 var(--r1) var(--r1) 0;font-size:14px;color:var(--encre)}
  blockquote .m{display:block;margin-top:5px;font-size:11.5px;color:var(--texte-3)}

  /* La clause prête à insérer : c'est elle qu'on vient chercher, elle est donc
     lisible d'un coup d'oeil et copiable d'un bouton. */
  .clause{margin:8px 0 0;padding:12px 14px;background:var(--vert-clair);
    border-radius:var(--r1);font-size:14px;line-height:1.55;color:#1b4b2d}
  .clause p{margin:0 0 6px}
  .clause p:last-child{margin-bottom:0}
  .sous-clause{display:flex;flex-wrap:wrap;gap:var(--e2);align-items:center;margin:var(--e2) 0 0}
  label.opt{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--encre)}
  label.opt input{width:auto;margin-top:3px}

  /* La version complétée, en feuille : le texte tel qu'il partira. */
  #sortie{white-space:pre-wrap}
  #sortie .b-h{font:700 15px/1.4 system-ui;margin:16px 0 6px}
  #sortie p{margin:0 0 8px;font-size:14.5px;line-height:1.65}
  #sources{margin-top:8px;font-size:var(--t1);line-height:1.6;color:var(--texte-2)}
  #sources div{margin:0 0 6px}
  #sources b{color:var(--encre)}
  main details{margin:var(--e2) 0 var(--e6)}

  @media print{.barre,#o-depot,#o-diag,details,header.site{display:none !important}}
</style>

    </div>

    <div class="barre pile">
      <button type="button" id="vers-sortie">Voir la version complétée</button>
    </div>
    <details>
      <summary>Voir le texte de loi</summary>
      <div id="sources"></div>
    </details>
  </section>

  <!-- ══════ LA VERSION COMPLÉTÉE ══════ -->
  <section id="o-sortie" class="cache">
    <div id="resume"></div>
    <div class="feuille" id="sortie"></div>
    <div class="barre pile">
      <button type="button" id="dl-docx">Télécharger en Word</button>

    </div>
  </section>

  <p class="reserve">Contrôle documentaire automatisé : le résultat est indicatif et ne vaut ni avis juridique ni attestation de conformité.</p>
</main>

<script>
(function () {

     LES TEXTES.

     minutes d'intervalle, concordantes pour chacun. L'identifiant de version
     est conservé : un article change sans changer de numéro.
     ══════════════════════════════════════════════════════════════════════ */
  var TEXTES = {
    "L1321-1": { id: "LEGIARTI000006901432",
      dit: "le règlement intérieur fixe exclusivement les mesures de santé et de sécurité, la participation au rétablissement de conditions protectrices, et les règles générales et permanentes relatives à la discipline, notamment la nature et l'échelle des sanctions" },

    "L1321-4": { id: "LEGIARTI000054140230",
      dit: "avis du comité social et économique avant introduction ; entrée en vigueur postérieure d'un mois aux formalités de publicité ; communication à l'inspecteur du travail avec l'avis du comité, en même temps que la publicité ; mêmes règles en cas de modification ou de retrait" },

    "R1321-2": { id: "LEGIARTI000018536915",
      dit: "le règlement intérieur est déposé au greffe du conseil de prud'hommes du ressort de l'entreprise ou de l'établissement" },
    "R1321-3": { id: "LEGIARTI000018536913",
      dit: "le délai court à compter de la dernière en date des formalités de publicité et de dépôt définies aux articles R. 1321-1 et R. 1321-2" },
    "R1321-4": { id: "LEGIARTI000018536911",
      dit: "le texte du règlement intérieur est transmis à l'inspecteur du travail en deux exemplaires" },
    "L1331-1": { id: "LEGIARTI000006901445",
      dit: "constitue une sanction toute mesure, autre que les observations verbales, prise à la suite d'un agissement considéré comme fautif, de nature à affecter immédiatement ou non la présence dans l'entreprise, la fonction, la carrière ou la rémunération" },

      dit: "convocation en précisant l'objet, sauf avertissement ou sanction de même nature sans incidence ; assistance par une personne du personnel ; motif indiqué et explications recueillies ; la sanction ne peut intervenir moins de deux jours ouvrables ni plus d'un mois après le jour fixé pour l'entretien ; elle est motivée et notifiée" },
    "L1332-3": { id: "LEGIARTI000006901449",

      dit: "la lettre de convocation indique l'objet, précise la date, l'heure et le lieu, rappelle l'assistance, et est remise contre récépissé ou adressée par lettre recommandée dans le délai de deux mois de L. 1332-4" },
    "R1332-2": { id: "LEGIARTI000018536887",

      dit: "le conseil de prud'hommes apprécie la régularité de la procédure et si les faits sont de nature à justifier une sanction ; si un doute subsiste, il profite au salarié" },
    "L1333-2": { id: "LEGIARTI000006901454",
      dit: "le conseil de prud'hommes peut annuler une sanction irrégulière en la forme, injustifiée ou disproportionnée à la faute commise" },
    "L1333-3": { id: "LEGIARTI000006901455",
      dit: "lorsque la sanction contestée est un licenciement, les dispositions de ce chapitre ne sont pas applicables : le conseil applique celles relatives à la contestation des irrégularités de licenciement" },
    "L1232-2": { id: "LEGIARTI000006901000",
      dit: "convocation avant toute décision, par lettre recommandée ou remise en main propre contre décharge, indiquant l'objet ; l'entretien ne peut avoir lieu moins de cinq jours ouvrables après la présentation ou la remise" },
    "L1232-4": { id: "LEGIARTI000006901002",
      dit: "assistance par une personne du personnel ; sans institution représentative, par un conseiller du salarié, la lettre mentionnant cette possibilité et l'adresse des services où la liste est tenue à disposition" },

  function article(a) { return a.replace(/^([LRD])(\d)/, "$1. $2"); }
  function refs(l) { return l.map(article).join(", "); }

  /* ═══════════════════════════════════════════════════════════════════════
     LE REPÉRAGE.

     Le texte est replié : sans accent, sans guillemet typographique, en
     minuscules, espaces normalisés. On le coupe en phrases sur la ponctuation
     forte et les sauts de ligne, en gardant la position d'origine pour rendre
     le passage tel qu'il est écrit.

     La marque est cherchée aux limites de mot : « amende » ne doit pas se lire
     dans « amendement ». C'est la seule protection que le procédé admette, et
     elle ne le rend pas exact pour autant.
     ══════════════════════════════════════════════════════════════════════ */
  function replier(s) {
    return String(s || "")
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[’‘‛]/g, "'").replace(/[“”«»]/g, '"')
      .replace(/\s+/g, " ")
      .toLowerCase();
  }
  function phrases(texte) {
    var P = [], re = /[^.!?\n]+[.!?]*/g, m;
    while ((m = re.exec(String(texte || ""))) !== null) {
      var t = m[0].trim();
      if (t.length < 3) continue;
      P.push({ texte: t, debut: m.index, replie: replier(t) });
    }
    return P;
  }
  function estLettre(c) { return (c >= "a" && c <= "z") || (c >= "0" && c <= "9"); }
  function contient(replie, marqueur) {
    var i = replie.indexOf(marqueur);
    while (i !== -1) {
      var avant = i === 0 ? "" : replie[i - 1];
      var apres = replie[i + marqueur.length] || "";
      if (!estLettre(avant) && !estLettre(apres)) return true;
      i = replie.indexOf(marqueur, i + 1);
    }
    return false;
  }
  function reperer(P, marqueurs) {
    var out = [];
    P.forEach(function (p) {
      var vus = marqueurs.filter(function (m) { return contient(p.replie, m); });
      if (vus.length) out.push({ texte: p.texte, debut: p.debut, marques: vus });
    });
    return out;
  }

     la grille ne doit jamais renvoyer à un texte qui n'a pas été lu. */
  GRILLE.forEach(function (g) {
    g.fondement.forEach(function (a) {
      if (!TEXTES[a]) throw new Error("controler-discipline : l'article " + a + " cité par " +
        g.id + " n'est pas dans la table des textes lus à la source.");
    });
  });

  /* ═══════════════════════════════════════════════════════════ l'analyse */
  function analyser(texte) {
    var brut = String(texte || ""), P = phrases(brut), points = [];

    GRILLE.forEach(function (g) {
      var vue = { id: g.id, famille: g.famille, objet: g.objet, fondement: g.fondement,
        exige: g.exige, prohibe: !!g.prohibe, clause: g.clause || null,
        critere: g.critere || null, remplacement: g.remplacement || null };

      if (g.depend) {
        var porteuses = P.filter(function (p) { return contient(p.replie, g.depend); });
        if (!porteuses.length) {
          points.push(Object.assign({}, vue, { etat: ABSENT, passages: [], sansObjet: true,
            motif: "La mise à pied disciplinaire n'apparaît pas dans le document : la durée maximale n'a pas d'objet tant qu'elle n'est pas prévue. Si vous l'ajoutez à l'échelle, sa durée maximale devient l'affaire de la même clause." }));
          return;
        }
        var avec = porteuses.filter(function (p) {
          return g.marqueurs.some(function (m) { return contient(p.replie, m); });
        });
        points.push(Object.assign({}, vue, {
          etat: avec.length ? AVERIFIER : ABSENT,
          passages: (avec.length ? avec : porteuses).map(function (p) {
            return { texte: p.texte, debut: p.debut, marques: p.marques || [] }; }),
          motif: avec.length
            ? "La phrase qui prévoit la mise à pied porte une durée : lisez-la, et vérifiez qu'elle borne bien la sanction et non l'une de ses modalités."
            : "La mise à pied disciplinaire est prévue, sans qu'une durée maximale apparaisse dans la phrase qui la prévoit."
        }));
        return;
      }

      var trouves = reperer(P, g.marqueurs);

      if (g.prohibe) {
        points.push(Object.assign({}, vue, {
          etat: trouves.length ? ACONTROLER : ABSENT,
          passages: trouves,
          motif: trouves.length
            ? trouves.length + " passage" + (trouves.length > 1 ? "s font" : " fait") +
              " apparaître une clause de cette famille. Le module ne conclut pas à son illicéité : il rend le passage et le critère."
            : "Aucun passage de cette famille n'a été repéré. Cela ne vaut pas quitus : une clause peut être rédigée en termes que ce repérage ne connaît pas."
        }));
        return;
      }

      points.push(Object.assign({}, vue, {
        etat: trouves.length ? AVERIFIER : ABSENT,
        passages: trouves,
        motif: trouves.length
          ? "Le sujet est traité dans le document. Lisez le passage : le repérage établit qu'il en est question, jamais que la clause est complète."
          : "Aucune trace de cette exigence dans le document. La clause ci-dessous la comble."
      }));
    });

    return {
      texte: brut, caracteres: brut.length, phrases: P.length, points: points,
      compteurs: {
        absents: points.filter(function (p) { return p.etat === ABSENT && !p.prohibe && !p.sansObjet; }).length,
        aRelire: points.filter(function (p) { return p.etat === AVERIFIER && !p.sansObjet; }).length,
        aControler: points.filter(function (p) { return p.etat === ACONTROLER; }).length
      }
    };
  }

  /* ═══════════════════════════════════════════════ la version complétée */
  function corriger(analyse, choix) {
    var c = choix || {};
    var inserer = c.inserer || [], signaler = c.signaler || [];

    /* Les marques, posées de la fin vers le début pour ne pas décaler les
       positions restantes. */
    var marques = [];
    analyse.points.forEach(function (p) {
      if (!p.prohibe || signaler.indexOf(p.id) === -1) return;
      p.passages.forEach(function (q) {
        marques.push({ fin: q.debut + q.texte.length, id: p.id, objet: p.objet });
      });
    });
    marques.sort(function (a, b) { return b.fin - a.fin; });

    var corps = analyse.texte;
    marques.forEach(function (m) {
      corps = corps.slice(0, m.fin) + "  [À CONTRÔLER - " + m.id + " : " + m.objet + "]" +
        corps.slice(m.fin);
    });

    var ajouts = [], notes = [];
    analyse.points.forEach(function (p) {
      if (p.clause && inserer.indexOf(p.id) !== -1)
        ajouts.push({ id: p.id, objet: p.objet, fondement: p.fondement, lignes: p.clause });
      if (p.prohibe && signaler.indexOf(p.id) !== -1)
        notes.push({ id: p.id, objet: p.objet, fondement: p.fondement, critere: p.critere,
          remplacement: p.remplacement, passages: p.passages.map(function (q) { return q.texte; }) });
    });

    return { corps: corps, ajouts: ajouts, notes: notes,
      resume: ajouts.length + (ajouts.length > 1 ? " clauses ajoutées" : " clause ajoutée") + ", " +
        notes.length + (notes.length > 1 ? " familles signalées" : " famille signalée") + " à contrôler." };
  }

  function texteComplete(analyse, choix) {
    var r = corriger(analyse, choix), L = [r.corps.trim(), ""];
    if (r.ajouts.length) {
      L.push("", "- - -", "CLAUSES AJOUTÉES AU TITRE DU CONTRÔLE", "");
      r.ajouts.forEach(function (a) {
        L.push("[" + a.id + " - " + refs(a.fondement) + "]");
        a.lignes.forEach(function (l) { L.push(l); });
        L.push("");
      });
    }
    if (r.notes.length) {
      L.push("", "- - -", "PASSAGES À CONTRÔLER AVANT DIFFUSION", "");
      r.notes.forEach(function (n) {
        L.push("[" + n.id + " - " + n.objet + " - " + refs(n.fondement) + "]");
        L.push("Critère : " + n.critere);
        L.push("Ce qu'il faut faire : " + n.remplacement);
        n.passages.forEach(function (p) { L.push("  « " + p + " »"); });
        L.push("");
      });
    }
    return L.join("\n");
  }

  /* ═══════════════════════════════════════════════════════════ les écrans */
  var analyse = null, choixInserer = {}, choixSignaler = {};
  var ECRAN = "depot";

  function ecran(nom) {
    ECRAN = nom;
    ["depot", "diag", "sortie"].forEach(function (o) {
      $("#o-" + o).classList.toggle("cache", o !== nom);
    });
    window.scrollTo(0, 0);
  }
  /* Le bouton Retour du bandeau, posé par droits.js : il remonte d'un écran,
     et ne quitte la page que depuis le dépôt. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || ECRAN === "depot") return;
    ev.preventDefault(); ev.stopPropagation();
    ecran(ECRAN === "sortie" ? "diag" : "depot");
  }, true);

  /* ═══════════════════════════════════════════════════════════════════════
     LA LECTURE D'UN .DOCX, SANS BIBLIOTHÈQUE.

     Un .docx est une archive zip, et le texte vit dans word/document.xml. On
     lit le répertoire central pour trouver l'entrée, puis on la décomprime
     avec le flux natif du navigateur. Aucun octet ne sort de la page.
     ══════════════════════════════════════════════════════════════════════ */
  function u16(v, i) { return v.getUint16(i, true); }
  function u32(v, i) { return v.getUint32(i, true); }

  function entreeZip(buf, nomVoulu) {
    var v = new DataView(buf), n = buf.byteLength, fin = -1;
    for (var i = n - 22; i >= 0 && i > n - 65558; i--) if (u32(v, i) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(v, fin + 10), pos = u32(v, fin + 16), dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(v, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(v, pos + 10), taille = u32(v, pos + 20);
      var lnom = u16(v, pos + 28), lextra = u16(v, pos + 30), lcom = u16(v, pos + 32);
      var debut = u32(v, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      if (nom === nomVoulu) {
        var ln = u16(v, debut + 26), lx = u16(v, debut + 28);
        return { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      }
      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word (word/document.xml).");
  }
  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier. Collez le texte à la place."));
    return new Response(new Blob([u8]).stream()
      .pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  function texteDeDocumentXml(xml) {
    /* Un paragraphe par <w:p>, un saut par <w:br/>, le texte des <w:t>. */
    return xml
      .replace(/<w:tab[^>]*\/>/g, "\t")
      .replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  function lireDocx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) {
        return new TextDecoder("utf-8").decode(new Uint8Array(b)); });
    }).then(texteDeDocumentXml);
  }

  function dit(html, classe) {
    $("#lecture").innerHTML = html ? '<div class="avis ' + (classe || "info") + '">' + html + "</div>" : "";
  }

  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    $("#erreur").innerHTML = "";
    dit("Lecture de <b>" + ech(f.name) + "</b>…");
    var suite = (window.LirePdf && window.LirePdf.estPdf(f)) ? window.LirePdf.texte(f)
      : (/\.docx$/i.test(f.name) ? lireDocx(f) : f.text());
    suite.then(function (t) {
      $("#depot").value = t;
      dit("<b>" + ech(f.name) + "</b> lu : " + t.length.toLocaleString("fr-FR") +
          " caractères. C'est ce texte qui sera contrôlé.");
    }).catch(function (e) {
      dit("<b>Ce fichier n'a pas pu être lu</b>" + ech(e.message) +
          " Ouvrez le document, copiez son texte et collez-le ci-dessous.", "att");
    });
  });

  $("#controler").addEventListener("click", function () {
    var t = $("#depot").value.trim();
    $("#erreur").innerHTML = "";
    if (t.length < 150) {
      $("#erreur").innerHTML = '<div class="avis att"><b>Le texte déposé est trop court.</b>' +
        "Il compte " + t.length + " caractères. Déposez le document entier : un contrôle sur un " +
        "extrait dirait « absent » de tout ce que l'extrait ne contient pas.</div>";
      return;
    }
    analyse = analyser(t);
    choixInserer = {}; choixSignaler = {};
    analyse.points.forEach(function (p) {
      if (p.etat === ABSENT && p.clause && !p.sansObjet) choixInserer[p.id] = true;
      if (p.etat === ACONTROLER) choixSignaler[p.id] = true;
    });
    rendreDiagnostic();
    ecran("diag");
  });

  function classeEtat(p) {
    if (p.sansObjet) return "sansobjet";
    if (p.etat === ABSENT) return "absent";
    if (p.etat === ACONTROLER) return "acontroler";
    return "averifier";
  }

  function carte(p) {
    var h = '<div class="pt"><div class="tt"><span class="etat ' + classeEtat(p) + '">' +
      ech(p.sansObjet ? "sans objet" : p.etat) + "</span>" +
      '<span class="obj">' + ech(p.objet) + "</span></div><div class=\"c\">";

    if (p.passages && p.passages.length) {
      p.passages.slice(0, 6).forEach(function (q) {
        h += "<blockquote>" + ech(q.texte) +
          (q.marques && q.marques.length
            ? '<span class="m">repéré sur : ' + ech(q.marques.join(", ")) + "</span>" : "") +
          "</blockquote>";
      });
      if (p.passages.length > 6) {
        var reste = p.passages.length - 6;
        h += "<p>… et " + reste + " autre" + (reste > 1 ? "s" : "") + " passage" +
          (reste > 1 ? "s" : "") + ".</p>";
      }
    }

    if (p.critere) h += "<p><b>Ce que le juge vérifie.</b> " + ech(p.critere) + "</p>";
    if (p.remplacement) h += "<p><b>Ce qu'il faut faire.</b> " + ech(p.remplacement) + "</p>";

    if (p.clause && p.etat === ABSENT && !p.sansObjet) {
      h += '<div class="clause" id="clause-' + ech(p.id) + '">' +
        p.clause.map(function (l) { return "<p>" + ech(l) + "</p>"; }).join("") + "</div>" +
        '<div class="sous-clause">' +
        '<label class="opt"><input type="checkbox" data-ins="' + ech(p.id) + '" checked> ' +
        "Insérer cette clause dans la version complétée</label>" +
        '<button type="button" class="btn second petit" data-copier="' + ech(p.id) + '">Copier la clause</button>' +
        "</div>";
    }
    if (p.etat === ACONTROLER) {
      h += '<label class="opt"><input type="checkbox" data-sig="' + ech(p.id) + '" checked> ' +
        "Signaler ce passage dans la version complétée</label>";
    }
    h += '<details><summary>Voir le texte de loi</summary><p>' + ech(p.exige) + "</p><p>" +
      ech(p.motif) + "</p><p>" + ech(p.id) + " · " + ech(refs(p.fondement)) + "</p></details>";
    return h + "</div></div>";
  }

  function rendreDiagnostic() {
    var c = analyse.compteurs;
    $("#compteurs").innerHTML =
      '<span class="c">' + c.absents + " clause" + (c.absents > 1 ? "s" : "") + " à insérer</span>" +
      '<span class="c">' + c.aControler + " passage" + (c.aControler > 1 ? "s" : "") + " à contrôler</span>" +
      '<span class="c">' + c.aRelire + " point" + (c.aRelire > 1 ? "s" : "") + " à relire</span>";

    var familles = ["le règlement des sanctions", "la procédure disciplinaire", "les formalités",
      "ce qui ne peut pas y figurer"];
    var h = "";
    familles.forEach(function (fam) {
      var liste = analyse.points.filter(function (p) { return p.famille === fam; });
      if (!liste.length) return;
      h += "<h3>" + ech(fam.charAt(0).toUpperCase() + fam.slice(1)) + "</h3>";
      liste.forEach(function (p) { h += carte(p); });
    });
    $("#points").innerHTML = h;

    $("#points").querySelectorAll("input[data-ins]").forEach(function (i) {
      i.addEventListener("change", function () { choixInserer[i.dataset.ins] = i.checked; });
    });
    $("#points").querySelectorAll("input[data-sig]").forEach(function (i) {
      i.addEventListener("change", function () { choixSignaler[i.dataset.sig] = i.checked; });
    });
    $("#points").querySelectorAll("button[data-copier]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = analyse.points.filter(function (x) { return x.id === b.dataset.copier; })[0];
        if (!p || !p.clause) return;
        var t = p.clause.join("\n");
        if (navigator.clipboard) navigator.clipboard.writeText(t);
        b.textContent = "Copiée";
        setTimeout(function () { b.textContent = "Copier la clause"; }, 1600);
      });
    });
  }

  function choix() {
    return {
      inserer: Object.keys(choixInserer).filter(function (k) { return choixInserer[k]; }),
      signaler: Object.keys(choixSignaler).filter(function (k) { return choixSignaler[k]; })
    };
  }

  function feuilleDe(texte) {
    return String(texte).split(/\n/).map(function (l) {
      var t = l.trim();
      if (!t) return '<div style="height:8px"></div>';
      if (/^[A-ZÀ-Ý0-9'’ ,:-]{6,}$/.test(t) && t === t.toUpperCase()) return '<div class="b-h">' + ech(t) + "</div>";
      return "<p>" + ech(t) + "</p>";
    }).join("");
  }
  $("#vers-sortie").addEventListener("click", function () {
    var c = corriger(analyse, choix());
    $("#resume").innerHTML = '<div class="compteurs"><span class="c">' + ech(c.resume) + "</span></div>";
    $("#sortie").innerHTML = feuilleDe(texteComplete(analyse, choix()));
    ecran("sortie");
  });
  $("#imprimer").addEventListener("click", function () { window.print(); });

  function nomFichier(ext) {
    return "procedure-disciplinaire-completee-" + new Date().toISOString().slice(0, 10) + "." + ext;
  }
  $("#dl-docx").addEventListener("click", function () {
    var c = corriger(analyse, choix());
    var items = [{ k: "sur", t: "Version complétée au terme du contrôle de la discipline · " + c.resume }];
    c.corps.split(/\n/).forEach(function (l) { items.push({ k: "p", t: l }); });
    if (c.ajouts.length) {
      items.push({ k: "trait" }, { k: "h1", t: "Clauses ajoutées au titre du contrôle" });
      c.ajouts.forEach(function (a) {
        items.push({ k: "h2", t: a.objet });
        items.push({ k: "note", t: a.id + " · " + refs(a.fondement) });
        a.lignes.forEach(function (l) { items.push({ k: "p", t: l }); });
      });
    }
    if (c.notes.length) {
      items.push({ k: "trait" }, { k: "h1", t: "Passages à contrôler avant diffusion" });
      c.notes.forEach(function (n) {
        items.push({ k: "h2", t: n.objet });
        items.push({ k: "note", t: n.id + " · " + refs(n.fondement) });
        items.push({ k: "p", t: "Ce que le juge vérifie : " + n.critere });
        items.push({ k: "p", t: "Ce qu'il faut faire : " + n.remplacement });
        n.passages.forEach(function (p) { items.push({ k: "puce", t: "« " + p + " »" }); });
      });
    }
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, "Procédure disciplinaire - version complétée"),
      nomFichier("docx"),
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  /* Les textes, repliés sous « Voir le texte de loi » : le numéro, ce qu'il
     dit, et l'identifiant de version. */
  (function sources() {
    var h = "<div>Code du travail, lu au relais Légifrance le 7 septembre 2026, deux lectures " +
      "concordantes par article.</div>";
    Object.keys(TEXTES).forEach(function (k) {
      h += "<div><b>" + ech(article(k)) + "</b> · " + ech(TEXTES[k].dit) + " · " + TEXTES[k].id + "</div>";
    });
    $("#sources").innerHTML = h;
  })();
})();
</script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
<script src="assistant.js" defer></script>

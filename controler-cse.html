<!--
  LA BRANCHE « OUI » DU MODULE COMITÉ, le dépôt en premier (maquette validée
  le 8 septembre 2026, epreuve/maquette.html, écran 3 puis écran 5).

  On dépose le document que l'on a : protocole d'accord préélectoral,
  procès-verbal du scrutin, convocation, ordre du jour, procès-verbal de
  réunion ou règlement intérieur du comité. L'écran rend les clauses
  entièrement rédigées, avec les chiffres de la fiche entreprise dedans, et
  un bouton les insère. Le paramètre d= de l'adresse (protocole, pv,
  convocation, odj, pvreunion, reglement) choisit la nature du document
  déposé ; il vient de la ligne de audit-cse.html.

  LA RÈGLE DE CET ÉCRAN : il ne nomme jamais un manque. Il n'y a pas ici de
  « clause absente », pas de constat, pas de note. Il y a le texte fini, prêt
  à coller, et le bouton qui l'insère. Le repérage lexical sert seulement à
  savoir quelle clause proposer en premier : il ne juge pas ce qui est écrit.

  Le nombre de sièges et le nombre de collèges ne sont pas saisis : ils sont
  calculés sur l'effectif de la fiche entreprise, par le moteur du module
  comité (docs/moteur-cse.js, tableau de R. 2314-1 et article L. 2314-11).

  Rien ne quitte ce poste : le fichier déposé est lu dans le navigateur.

  l'application, deux lectures espacées et concordantes par article, contenu

<script>
(function () {
  "use strict";
  var M = (window.MoteurCSE && window.MoteurCSE.moteur) || null;
  var P = window.Profil || null;
  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  var CHOIX = {};          /* id de clause -> insérée ou non */
  var CTX = null;          /* les chiffres du dossier, au moment de l'ouverture */
  var PRESENTES = {};       /* id de clause -> repérée dans le texte déposé */

  /* ---------------------------------------------------------------- */
  /* Les onglets. */
  function onglet(nom) {
    ["depot", "clauses", "sortie"].forEach(function (o) {
      $("#o-" + o).classList.toggle("cache", o !== nom);
    });
    Array.prototype.forEach.call($("#onglets").children, function (b) {
      b.classList.toggle("actif", b.dataset.o === nom);
    });
    /* Le panneau des champs suit : il se tient toujours à côté de ce que
       l'utilisateur regarde, jamais devant. */
    var hote = nom === "clauses" ? $("#hote-clauses") : (nom === "depot" ? $("#hote-depot") : null);
    var champs = $("#champs");
    if (hote) { hote.appendChild(champs); champs.hidden = false; }
    else champs.hidden = true;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  Array.prototype.forEach.call($("#onglets").children, function (b) {
    b.addEventListener("click", function () { if (!b.disabled) onglet(b.dataset.o); });
  });

  /* ---------------------------------------------------------------- */
  /* La lecture d'un .docx, sans bibliothèque : un .docx est une archive zip,
     et le texte vit dans word/document.xml. On lit le répertoire central pour
     trouver l'entrée, puis on la décomprime avec le flux natif du navigateur.
     Aucun octet ne sort de la page. Même procédé que docs/controler-ri.html. */
  function u16(v, i) { return v.getUint16(i, true); }
  function u32(v, i) { return v.getUint32(i, true); }

  function entreeZip(buf, nomVoulu) {
    var v = new DataView(buf), n = buf.byteLength;
    var fin = -1;
    for (var i = n - 22; i >= 0 && i > n - 65558; i--) if (u32(v, i) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(v, fin + 10), pos = u32(v, fin + 16);
    var dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(v, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(v, pos + 10), taille = u32(v, pos + 20);
      var lnom = u16(v, pos + 28), lextra = u16(v, pos + 30), lcom = u16(v, pos + 32);
      var debut = u32(v, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      if (nom === nomVoulu) {
        var ln = u16(v, debut + 26), lx = u16(v, debut + 28);
        return { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      }
      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word (word/document.xml).");
  }

  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier. Collez le texte à la place."));
    var flux = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(flux).arrayBuffer();
  }

  function texteDeDocumentXml(xml) {
    return xml
      .replace(/<w:tab[^>]*\/>/g, "\t")
      .replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n")
      .replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function lireDocx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) { return new TextDecoder("utf-8").decode(new Uint8Array(b)); });
    }).then(texteDeDocumentXml);
  }

  function dit(html, classe) {
    $("#lecture").innerHTML = html ? '<div class="avis ' + (classe || "info") + '">' + html + "</div>" : "";
  }

  /* ---------------------------------------------------------------- */
  /* Les dates. Tout se compte en UTC, pour qu'un changement d'heure ne
     décale pas un délai de recours d'un jour. */
  function jours(iso, n) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return null;
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  /* Jours ouvrables : tous les jours sauf le dimanche. Les jours fériés ne
     sont pas décomptés ici, et le texte le dit. */
  function ouvr(iso, n) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return null;
    var pas = n < 0 ? -1 : 1, reste = Math.abs(n);
    while (reste > 0) { d.setUTCDate(d.getUTCDate() + pas); if (d.getUTCDay() !== 0) reste--; }
    return d.toISOString().slice(0, 10);
  }
  function mois(iso, n) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return null;
    var j = d.getUTCDate();
    d.setUTCMonth(d.getUTCMonth() + n);
    if (d.getUTCDate() !== j) d.setUTCDate(0);
    return d.toISOString().slice(0, 10);
  }
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
    "août", "septembre", "octobre", "novembre", "décembre"];
  function fr(iso) {

        cl.texte(CTX).forEach(function (l) {
          if (l && l.tab) items.push({ k: "table", head: l.tab.head, rows: l.tab.rows });
          else items.push({ k: "p", t: l });
        });
      });
    }
    var cal = lignesCalendrier(CTX);
    if (cal.length) {
      items.push({ k: "trait" }, { k: "h1", t: electoral(CTX.nature) ? "Calendrier" : "Délais" });
      items.push({ k: "table", head: ["Date", "Étape", "Texte"],
        rows: cal.map(function (x) { return [x.d ? fr(x.d) : "à fixer", x.t + " " + x.n, x.f]; }) });
    }
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, TITRES[CTX.nature] || "Document"),
      nomFichier("docx"), "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });

  $("#copier").addEventListener("click", function () {
    var t = $("#sortie").textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    else { var a = document.createElement("textarea"); a.value = t; document.body.appendChild(a);
           a.select(); document.execCommand("copy"); a.remove(); }
    $("#copier").textContent = "Copié";
    setTimeout(function () { $("#copier").textContent = "Copier"; }, 1600);
  });

  /* ---------------------------------------------------------------- */
  /* La fiche entreprise pré-remplit ce qui la concerne : l'effectif commande
     les sièges et les collèges, et il n'a pas à être ressaisi ici. */
  (function prealable() {
    if (P) {
      var p = P.lire() || {};
      if (p.denomination) $("#ent").value = p.denomination;
      if (p.effectif !== undefined && p.effectif !== null && String(p.effectif).trim() !== "")
        $("#eff").value = p.effectif;
    }
    /* Chaque réponse remplit le texte déjà affiché, sans qu'on quitte l'écran :
       les clauses se réécrivent, le compteur suit, les choix d'insertion sont
       conservés. */
    $("#champs").addEventListener("input", function () {
      if (!CTX) return;
      var nature = CTX.nature, eff = CTX.eff;
      CTX = contexte();
      if (CTX.nature !== nature || CTX.eff !== eff) reperer();
      rendreClauses();
    });
    $("#champs").addEventListener("change", function () {
      majChamps();
      if (CTX) { var nature = CTX.nature, eff = CTX.eff; CTX = contexte(); if (CTX.nature !== nature || CTX.eff !== eff) reperer(); rendreClauses(); }
    });
    /* La ligne de audit-cse.html dit quelle nature de document arrive :
       controler-cse.html?d=convocation, par exemple. */
    var d = new URLSearchParams(location.search).get("d");
    if (d && TITRES[d]) $("#nature").value = d;
    /* Les dates de réunion et d'adoption partent d'aujourd'hui : elles se
       corrigent dans le champ, elles ne restent pas vides. */
    var auj = new Date(); auj.setMinutes(auj.getMinutes() - auj.getTimezoneOffset());
    var dans7 = new Date(auj.getTime() + 7 * 86400000);
    $("#dr").value = dans7.toISOString().slice(0, 10);
    $("#dadopt").value = auj.toISOString().slice(0, 10);
    majChamps();
    onglet("depot");
  })();

  /* Chaque champ ne s'affiche que pour les natures qu'il sert ; le titre de
     la barre suit la nature choisie. */
  function majChamps() {
    var nature = $("#nature").value;
    Array.prototype.forEach.call(document.querySelectorAll("#champs label[data-pour]"), function (l) {
      l.hidden = l.getAttribute("data-pour").split(" ").indexOf(nature) < 0;
    });
    $("#titre").textContent = "Contrôle : " + (COURTS[nature] || "document");
    var p = P ? (P.lire() || {}) : {};
    var eff = nombre($("#eff").value);
    $("#ent-haut").textContent = (p.denomination || "") + (eff !== null ? " · " + eff + " salarié" + (eff > 1 ? "s" : "") : "");
  }
})();
</script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>

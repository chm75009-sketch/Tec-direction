<!--
  L'ÉCRAN 3 DE LA MAQUETTE VALIDÉE LE 8 SEPTEMBRE 2026 : une ligne par pièce,
  Oui et Non sur la ligne. Rien avant la liste, rien après.

  « Non » ouvre le document, déjà écrit à partir de la fiche d'entreprise, seul
  à l'écran : les champs que l'application ne connaît pas en tête, la feuille,
  Télécharger en Word, Imprimer, le texte de loi replié dessous. Le bouton
  Retour du bandeau, posé par droits.js, ramène à la liste.

  « Oui » ouvre le dépôt du document existant : chaque mention exigée y est
  cherchée, celle qu'on n'y trouve pas sort rédigée, prête à insérer. Pour les
  obligations qui n'ont pas de contrôle écrit, « Oui » enregistre la réponse
  et la ligne passe en vert.

  Les obligations du moteur social qui ont une procédure guidée sont sur la
  même liste, avec un libellé court : leur « non » ouvre le parcours sur son
  document (parcours.html?p=…&faire=1).

  CE QUI NE S'AFFICHE PAS : une obligation que la fiche d'entreprise rend non
  due. C'est l'effectif qui commande, comme partout dans l'application.

  LES TEXTES. Les documents écrits pour cet écran citent des articles lus au
  relais Légifrance le 7 septembre 2026, deux lectures concordantes, identifiant
  LEGIARTI porté sous chaque document, dans le repli « Voir le texte de loi ».
  Le reste vient du moteur du module, où cent soixante-douze articles ont été
  lus à la source.

  Rien ne sort du poste.
-->

<main class="wrap" id="main"><div id="ecran"></div></main>

<script src="profil.js"></script>
<script src="audit-export.js"></script>
<script src="base-documents.js"></script>
<script src="moteur-social.js"></script>
<script src="documents-produits.js"></script>
<script src="documents-sst.js"></script>
<script src="documents-sst-2.js"></script>
<script>
(function () {
  "use strict";
  var P = window.Pieces;
  var A = window.MoteurSocial && window.MoteurSocial.audit;
  var profil = window.Profil ? window.Profil.lire() : {};

  /* Le libellé court de chaque ligne : la pièce, pas la question entière. */
  var COURT = {
    "PIECE-REGISTRE-SECURITE": "Registre unique de sécurité",
    "PIECE-DGI": "Registre des dangers graves et imminents",
    "PIECE-INCENDIE": "Consigne de sécurité incendie",
    "PIECE-FICHE-ENTREPRISE": "Fiche d'entreprise du service de santé",
    "PIECE-SALARIE-COMPETENT": "Salarié compétent en prévention",
    "PIECE-PLAN-PREVENTION": "Plan de prévention (entreprises extérieures)",
    "PIECE-ACCIDENT-MORTEL": "Accident mortel : information de l'inspection",
    "PIECE-REFERENT-HANDICAP": "Référent handicap",
    "PIECE-LIVRET-EPARGNE": "Livret d'épargne salariale",
    "PIECE-FORFAIT-JOURS": "Convention de forfait en jours",
  };

  function dePiece(id) {
    var p = P.pour(id);
    if (!p) return null;
    return { id: p.id, groupe: "Les pièces à tenir", question: COURT[id] || p.titre, titre: p.titre,
      piece: p, renvoi: p.renvoi, due: p.due };
  }

  var QUESTIONS = [
    dePiece("PIECE-REGISTRE-SECURITE"),
    dePiece("PIECE-DGI"),
    dePiece("PIECE-INCENDIE"),
    dePiece("PIECE-FICHE-ENTREPRISE"),
    dePiece("PIECE-SALARIE-COMPETENT"),
    dePiece("PIECE-PLAN-PREVENTION"),
    dePiece("PIECE-ACCIDENT-MORTEL"),
    dePiece("PIECE-REFERENT-HANDICAP"),
    dePiece("PIECE-LIVRET-EPARGNE"),
    dePiece("PIECE-FORFAIT-JOURS"),
  ].filter(Boolean);

  /* Le libellé court d'une obligation du moteur : ce qui précède le
     deux-points ou la parenthèse. */
  function court(t) {
    var m = String(t || "").split(/\s[:(]/)[0].trim();
    return m || t;
  }

  /* Les obligations du moteur qui ont une procédure guidée : le « non » y
     mène, ouverte sur son document. Celles que la fiche d'entreprise rend non
     dues ne sont pas posées. */
  if (A) {
    var ORDRE = ["instances", "documents obligatoires", "affichages et informations",
      "registres", "négociations", "santé-sécurité", "formation et entretiens",
      "congés et jours", "embauche et contrat", "fin du contrat",
      "égalité et non-discrimination", "épargne et protection sociale",
      "durée du travail et repos"];
    /* Une obligation déjà servie par une pièce écrite ici n'est pas reposée. */
    var DEJA = { "SOC-AFF-CONSIGNE-INCENDIE": true, "SOC-SST-SALARIE-COMPETENT": true };
    var avecParcours = A.applicables(profil).filter(function (o) {
      return o.du !== false && !DEJA[o.id] && o.regularisation && o.regularisation.parcours;
    });
    avecParcours.sort(function (a, b) {
      var ia = ORDRE.indexOf(a.categorie), ib = ORDRE.indexOf(b.categorie);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    avecParcours.forEach(function (o) {
      /* Le document unique a son écran, où il s'écrit par métier. */
      var duerp = o.id === "SOC-DOC-DUERP";
      QUESTIONS.push({
        id: o.id,
        groupe: o.categorie.charAt(0).toUpperCase() + o.categorie.slice(1),
        question: court(o.intitule),
        titre: duerp ? "Document unique" : o.regularisation.parcoursNom,
        lien: duerp ? "duerp.html"
                    : "parcours.html?p=" + o.regularisation.parcours + "&faire=1",
        lienOui: duerp ? "controler-duerp.html" : null,
        renvoi: o.fondement || "",
      });
    });
  }

  window.EcranPieces.demarrer({
    racine: "ecran",
    module: "social",
    titre: "",
    questions: QUESTIONS,
    pied: "",
  });

  /* Le document ouvert prend une colonne plus large que la liste. */
  var main = document.getElementById("main"), ecran = document.getElementById("ecran");
  if (main && ecran && window.MutationObserver)
    new MutationObserver(function () {
      main.classList.toggle("large", !!ecran.querySelector("#vue"));
    }).observe(ecran, { childList: true });
})();
</script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>

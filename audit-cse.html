<!--
  Le comité social et économique, aux écrans 3 et 5 de la maquette validée le
  8 septembre 2026 (epreuve/maquette.html).

  Écran 3 : une ligne par obligation du comité, deux boutons sur la ligne.
  « Non » ouvre le document rempli, seul à l'écran (écran 5) : les élections,
  la convocation, l'ordre du jour, le procès-verbal, le règlement intérieur
  du comité selon la ligne. « Oui » ouvre controler-cse.html, le dépôt en
  premier. Au-dessous de onze salariés, la page dit « pas dû » et renvoie à
  auditer.html. Les lignes non dues à l'effectif sont en gris, sans bouton.

  Écran 5 : deux ou trois champs en tête qui se glissent dans le texte, le
  document, Télécharger en Word, Imprimer, un repli « Voir le texte de loi »,
  le bouton Retour. Les générateurs sont dans documents-cse.js
  (CSE-DOC-ELECTIONS, CSE-DOC-CONVOCATION, CSE-DOC-ORDRE-DU-JOUR,
  CSE-DOC-PROCES-VERBAL, CSE-DOC-REGLEMENT).

  Les articles ont été lus au relais Légifrance de l'application le
  8 septembre 2026, deux lectures espacées et concordantes chacun, filtre par
  le nom du code ; l'identifiant de version de chacun est dans la table
  TEXTES ci-dessous. Le seuil de onze salariés est celui de L. 2311-2. Le
  seuil de cinquante salariés retenu pour l'ordre du jour, le procès-verbal
  et le règlement intérieur du comité tient à la place des articles L. 2315-23
  à L. 2315-35 dans le code (section des entreprises d'au moins cinquante
  salariés) : le relais ne rend pas cette place, elle vient du travail
  antérieur du module (moteur/cse/controles-cse.js).

  Rien ne quitte ce poste : tout est calculé et rédigé dans le navigateur.
-->

  .barre{display:flex;flex-direction:column;gap:10px;margin:16px 0 8px}

    .feuille{padding:0;border:0}

</style>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };

  /* ─────────────────────────────────────────────────────────── la fiche */
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}
  if (!profil || !profil.denomination) { location.replace("index.html"); return; }
  var eff = profil.effectif != null ? parseInt(profil.effectif, 10) : 0;
  if (isNaN(eff)) eff = 0;
  var ENT = profil.denomination + " · " + eff + " salarié" + (eff > 1 ? "s" : "");
  $("ent").textContent = ENT;
  $("ent2").textContent = ENT;

  /* LA FICHE DIT S'IL Y A UN COMITÉ, ET LA PAGE S'Y TIENT.

     Relevé le 27 septembre 2026 : sans comité, cette page proposait encore la
     convocation des réunions, l'ordre du jour, le procès-verbal et le
     règlement intérieur du comité. Ces quatre pièces supposent une instance
     élue : sans elle, il n'y a rien à convoquer. Ce qui reste dû est
     l'organisation des élections, ou le procès-verbal de carence. À l'inverse,
     avec un comité élu, la ligne des élections ne redemande pas de les
     organiser : elle donne la fin des mandats, quatre ans après le scrutin
     (L. 2314-33, LEGIARTI000052437191, deux lectures concordantes au relais le
     27 septembre 2026 : « Les membres de la délégation du personnel du comité
     social et économique sont élus pour quatre ans »). */
  var repCse = String(profil.cseExiste || "").trim().toLowerCase();
  var COMITE_ABSENT = repCse.indexOf("non") === 0;
  var COMITE_ELU = repCse.indexOf("oui") === 0;
  var PAR_CARENCE = COMITE_ABSENT && repCse.indexOf("carence") >= 0;
  /* La quatrième réponse, demandée le 27 septembre 2026 : les élections sont
     en cours. Elles ne sont ni faites ni à lancer, et les deux dates de la
     fiche disent où en est le calendrier. */
  var EN_COURS = COMITE_ABSENT && repCse.indexOf("cours") >= 0;
  var DATE_CARENCE = String(profil.cseCarence || "").trim();
  var DATE_ELECTIONS = String(profil.cseElections || "").trim();
  var DATE_INFO = String(profil.cseInfoPersonnel || "").trim();
  var DATE_NEGO = String(profil.cseReunionNego || "").trim();
  function estIso(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || "").trim()); }

  /* ──────────────────────────────────────────────────────────── les textes

     Chaque article a été demandé deux fois au relais Légifrance, à plusieurs
     minutes d'intervalle, filtre par le nom du code ; les deux lectures ont
     rendu le même identifiant et le même texte, le 8 septembre 2026. La
     colonne « dit » reprend ce qui sert au document, dans les mots de
     l'article. */
  var TEXTES = {
    "L2311-2":  { id: "LEGIARTI000035609353", dit: "un comité social et économique est mis en place dans les entreprises d'au moins onze salariés ; sa mise en place n'est obligatoire que si cet effectif est atteint pendant douze mois consécutifs" },
    "L2314-1":  { id: "LEGIARTI000037389707", dit: "la délégation du personnel comporte un nombre égal de titulaires et de suppléants ; le suppléant assiste aux réunions en l'absence du titulaire ; un référent harcèlement sexuel est désigné par résolution" },
    "L2314-4":  { id: "LEGIARTI000035651165", dit: "l'employeur informe le personnel tous les quatre ans de l'organisation des élections par tout moyen conférant date certaine ; le document précise la date envisagée pour le premier tour, qui se tient au plus tard le quatre-vingt-dixième jour suivant la diffusion" },
    "L2314-5":  { id: "LEGIARTI000035651159", dit: "les organisations syndicales sont informées par tout moyen et invitées à négocier le protocole ; les représentatives, celles ayant une section syndicale et les syndicats affiliés sont invités par courrier ; l'invitation parvient au plus tard quinze jours avant la première réunion ; de onze à vingt salariés, l'invitation n'est due que si un salarié s'est porté candidat dans les trente jours" },
    "L2312-19": { id: "LEGIARTI000036262394", dit: "un accord d'entreprise, ou un accord entre l'employeur et le comité adopté à la majorité des titulaires, peut fixer le nombre de réunions annuelles, qui ne peut être inférieur à six" },
    "L2315-21": { id: "LEGIARTI000035624428", dit: "les membres de la délégation du personnel sont reçus collectivement par l'employeur au moins une fois par mois ; en cas d'urgence, sur leur demande" },
    "L2315-22": { id: "LEGIARTI000035624430", dit: "note écrite des demandes remise deux jours ouvrables avant la réunion ; réponse écrite de l'employeur dans les six jours ouvrables suivant la réunion ; demandes et réponses transcrites sur un registre spécial, tenu à la disposition des salariés un jour ouvrable par quinzaine" },
    "L2315-23": { id: "LEGIARTI000035624835", dit: "le comité a la personnalité civile ; il est présidé par l'employeur, assisté éventuellement de trois collaborateurs à voix consultative ; il désigne parmi ses titulaires un secrétaire et un trésorier" },
    "L2315-24": { id: "LEGIARTI000036761946", dit: "le comité détermine dans un règlement intérieur les modalités de son fonctionnement et de ses rapports avec les salariés ; sauf accord de l'employeur, il ne peut lui imposer d'obligations ne résultant pas de dispositions légales" },
    "L2315-27": { id: "LEGIARTI000036761943", dit: "au moins quatre réunions par an portent sur la santé, la sécurité et les conditions de travail ; réunion après tout accident grave ou à la demande motivée de deux membres ; l'agent de contrôle, le médecin du travail et l'agent de prévention sont informés du calendrier et confirmés par écrit quinze jours à l'avance" },
    "L2315-28": { id: "LEGIARTI000035624857", dit: "à défaut d'accord, le comité se réunit au moins une fois par mois à partir de trois cents salariés, au moins une fois tous les deux mois en dessous ; seconde réunion à la demande de la majorité des membres" },
    "L2315-29": { id: "LEGIARTI000035624861", dit: "l'ordre du jour est établi par le président et le secrétaire ; les consultations obligatoires y sont inscrites de plein droit" },
    "L2315-30": { id: "LEGIARTI000035624863", dit: "l'ordre du jour est communiqué par le président aux membres, à l'agent de contrôle de l'inspection du travail et à l'agent des services de prévention trois jours au moins avant la réunion" },
    "L2315-31": { id: "LEGIARTI000035624865", dit: "quand le comité se réunit à la demande de la majorité de ses membres, les questions jointes à la demande sont inscrites à l'ordre du jour" },
    "L2315-32": { id: "LEGIARTI000035624869", dit: "les résolutions sont prises à la majorité des membres présents ; le président ne vote pas quand il consulte les élus en tant que délégation du personnel" },
    "L2315-34": { id: "LEGIARTI000036262447", dit: "les délibérations sont consignées dans un procès-verbal établi par le secrétaire, dans un délai fixé par accord ou, à défaut, par décret ; transmis à l'employeur, qui fait connaître sa décision motivée à la réunion suivante" },
    "L2315-35": { id: "LEGIARTI000035624877", dit: "le procès-verbal peut, après adoption, être affiché ou diffusé dans l'entreprise par le secrétaire, selon les modalités du règlement intérieur du comité" },
    "R2315-25": { id: "LEGIARTI000036433679", dit: "à défaut d'accord, les procès-verbaux sont établis par le secrétaire dans un délai de quinze jours et communiqués à l'employeur et aux membres du comité" },
    "D2315-26": { id: "LEGIARTI000036433681", dit: "à défaut d'accord, le procès-verbal est établi et transmis à l'employeur dans les quinze jours suivant la réunion, ou avant la réunion suivante si elle est prévue dans ce délai ; il contient au moins le résumé des délibérations et la décision motivée de l'employeur sur les propositions de la réunion précédente" }
  };
  function ref(n) { return n.replace(/^([A-Z])(\d)/, "$1. $2"); }
  function loiHtml(nums) {
    var h = "";
    nums.forEach(function (n) {
      var t = TEXTES[n]; if (!t) return;
      h += "<p><b>" + ech(ref(n)) + "</b> du code du travail : " + ech(t.dit) +
        '. <a href="https://www.legifrance.gouv.fr/codes/article_lc/' + ech(t.id) + '" target="_blank" rel="noopener">Lire sur Légifrance</a> <span class="ident">' + ech(t.id) + "</span></p>";
    });
    return h;
  }

  /* ──────────────────────────────────────────────────────────── les dates */
  var AUJOURDHUI = new Date(); AUJOURDHUI.setHours(0, 0, 0, 0);
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  function iso(d) {
    var m = d.getMonth() + 1, j = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (j < 10 ? "0" : "") + j;
  }
  function dateDe(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d) ? null : d;
  }
  function jour(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function ouvrables(d, n) {
    var x = new Date(d.getTime()), pas = n < 0 ? -1 : 1, reste = Math.abs(n);
    while (reste > 0) { x.setDate(x.getDate() + pas); if (x.getDay() !== 0) reste--; }
    return x;
  }
  var JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  function dateFrJour(d) {
    if (!d) return "[date]";
    return JOURS[d.getDay()] + " " + (d.getDate() === 1 ? "1er" : d.getDate()) + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }
  /* Un avertissement quand une échéance tombe un samedi, un dimanche ou un
     jour férié : le kit annonçait un premier tour « au plus tard le samedi
     26 décembre » sans rien dire. Relevé le 27 septembre 2026. */
  function ferie(d) {
    return (window.JoursFeries && window.JoursFeries.avertissement)
      ? window.JoursFeries.avertissement(d) : "";
  }
  function carte(q, d, f) {
    return '<div class="d"><span class="q">' + ech(q) + '</span><span class="v">' + ech(dateFrJour(d)) + '</span><span class="f">' + ech(f) + "</span></div>";
  }

  /* ───────────────────────────────────────────── une ligne par obligation

     seuil : l'effectif à partir duquel l'obligation est due. doc : le
     générateur qui écrit la pièce quand la réponse est « non ». oui : la page
     de contrôle, le dépôt en premier. */
  var SECRETAIRE = { id: "secretaire", nom: "Secrétaire du comité", t: "text", ph: "Madame Nadia ROUX" };
  var REUNION = { id: "dateReunion", nom: "Date de la réunion", t: "date", defaut: iso(jour(AUJOURDHUI, 7)) };
  /* L'HEURE ET LE LIEU, DEMANDÉS PARTOUT OÙ ILS SERVENT. La convocation les
     demandait, l'ordre du jour non : le même document sortait « à [heure], à

  /* ───────────────────────────────────────────────── le document, seul

     Le générateur rend un texte écrit en lignes courtes. Un paragraphe y tient
     sur quatre ou cinq lignes de soixante-douze signes, et c'est le paragraphe
     qui est l'unité, pas la ligne. Chaque bloc devient une ligne modifiable à
     l'écran et repart telle quelle dans le .docx. Un bloc corrigé à la main est
     retenu sur son texte d'origine.

     UNE LIGNE N'EST PAS UN PARAGRAPHE. Relevé le 27 septembre 2026 : cette
     page prenait chaque ligne du générateur pour un bloc. Le kit des élections
     sortait donc en phrases cassées à soixante-douze signes, une par ligne
     avec son interligne, et les listes en retrait sortaient en puces coupées
     au milieu des mots. Les lignes d'un même paragraphe se rejoignent, et,
     dans une liste, une ligne sans marque qui commence en minuscule après une
     ligne inachevée continue la précédente. C'est la règle de feuille-doc.js,
     écrite ici pour les blocs de cette page. */
  var corrections = {};
  function empreinte(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "b" + (h >>> 0).toString(36);
  }
  function blocsDeTexte(t) {
    /* Même filtre, même perte : la classe ne portait plus que des traits
       d'union et ne normalisait plus rien. Écrite en échappement Unicode, elle
       survit au nettoyage des tirets. Relevé le 28 septembre 2026. */
    t = String(t || "").replace(/[\u2014\u2013]/g, "-").replace(/\u00a0/g, " ");
    var lignes = t.split("\n"), b = [], i = 0;
    /* l'en-tête : dénomination, adresse, SIRET, puis le titre et son fondement */
    while (i < lignes.length && lignes[i].trim() !== "") { b.push({ k: "ent", t: lignes[i].trim() }); i++; }
    while (i < lignes.length && lignes[i].trim() === "") i++;
    if (i < lignes.length) { b.push({ k: "t1", t: lignes[i].trim() }); i++; }
    if (i < lignes.length && /^\(/.test(lignes[i].trim())) { b.push({ k: "st", t: lignes[i].trim().replace(/^\(|\)$/g, "") }); i++; }
    var para = [];
    /* Un même paragraphe peut porter une phrase d'introduction puis une liste :
       « … sont invitées à négocier : » suivi de deux lignes en retrait. On ne
       décide donc pas du groupe entier, on avance ligne par ligne. */
    function enListe(x) { return /^\s{2,}/.test(x) || /^\s*[-•·]\s/.test(x); }
    function vider() {
      if (!para.length) return;
      var j = 0;
      while (j < para.length) {
        if (enListe(para[j])) {
          var items = [];
          while (j < para.length && enListe(para[j])) {
            var brut = para[j].trim();
            var puce = /^[-•·]\s*/.test(brut);
            var numero = /^(\d{1,2}[.)]|\d°)\s/.test(brut);
            var avant = items.length ? items[items.length - 1] : null;
            if (avant && !puce && !numero && /^[a-zà-ÿ«("]/.test(brut) && !/[.:;»)\]]$/.test(avant))
              items[items.length - 1] = avant + " " + brut;
            else items.push(brut.replace(/^[-•·]\s*/, ""));
            j++;
          }
          items.forEach(function (x) { b.push({ k: "puce", t: x }); });
        } else {
          var lignesP = [];
          while (j < para.length && !enListe(para[j])) { lignesP.push(para[j].trim()); j++; }
          var texte = lignesP.join(" ");
          if (!/[a-zà-ÿ]/.test(texte) && texte.length < 100) b.push({ k: "h1", t: texte });
          else b.push({ k: "p", t: texte });
        }
      }
      para = [];
    }
    for (; i < lignes.length; i++) {
      var l = lignes[i];
      if (!l.trim()) { vider(); continue; }
      if (/^[═]{4,}$/.test(l.trim())) { vider(); continue; }
      if (/^[─_\-]{4,}$/.test(l.trim())) { vider(); b.push({ k: "trait", t: "" }); continue; }
      if (/^Fondement :/.test(l.trim())) { vider(); b.push({ k: "fond", t: l.trim() }); continue; }
      /* Un titre en capitales seul sur sa ligne ferme le paragraphe qui
         précède : sans cela, il se collerait à sa dernière phrase. */
      if (!/[a-zà-ÿ]/.test(l) && l.trim().length < 100 && !/^\s{2,}/.test(l)) {
        vider(); b.push({ k: "h1", t: l.trim() }); continue;
      }
      para.push(l);
    }
    vider();
    return b;
  }
  function crochets(html) {
    return html.replace(/\[[^\[\]]{1,160}\]/g, function (m) { return '<span class="cro">' + m + "</span>"; });
  }
  function feuilleHtml(blocs) {

      var cle = empreinte(b.t);

      h += '<div class="b-' + b.k + (texte !== b.t ? " modifie" : "") +

  function rendreDoc() {

      $("btn-word").disabled = true; $("btn-imprimer").disabled = true;
    } else {

        var g2 = window.DocumentsProduits ? window.DocumentsProduits.pour(id) : null;

      });
      /* NI EXEMPLE NI AVERTISSEMENT DANS UN DOCUMENT QUI SE SIGNE.

         Le « non » de cette page ouvre la convocation, l'ordre du jour, le
         procès-verbal ou le règlement du comité : des pièces qui partent
         telles quelles, sous l'en-tête de l'entreprise. Elles s'ouvraient sur
         « À ADAPTER : ce document est un modèle rédigé à partir des textes »,
         phrase qui suivait jusque dans le .docx et jusque dans le classeur du
         comité. Gérer la retirait déjà ; cette page ne le faisait pas. Relevé
         le 27 septembre 2026. Ce qui est à compléter reste entre crochets,
         c'est le seul repère dont le lecteur a besoin. */
      if (window.DocumentsProduits && window.DocumentsProduits.sansExemple)
        texte = window.DocumentsProduits.sansExemple(texte);
      $("d-feuille").innerHTML = feuilleHtml(blocsDeTexte(texte));
      $("btn-word").disabled = false; $("btn-imprimer").disabled = false;
    }
    $("d-loi").innerHTML = loiHtml(typeof l.loi === "function" ? l.loi() : l.loi);
  }
  function ouvrir(cle) {
    var l = LIGNES.filter(function (x) { return x.cle === cle; })[0];
    if (!l || eff < l.seuil) return;
    ACTIF = l; V = {}; corrections = {};
    l.champs.forEach(function (c) { V[c.id] = c.defaut == null ? "" : c.defaut; });
    $("d-titre").textContent = l.titre;
    $("d-champs").innerHTML = l.champs.map(champHtml).join("");
    $("d-champs").hidden = !l.champs.length;
    rendreDoc();
    $("e-liste").hidden = true;
    $("e-doc").hidden = false;
    $("main").classList.add("large");
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + cle); } catch (e) {}
  }
  function revenir() {
    ACTIF = null;
    $("e-doc").hidden = true;
    $("e-liste").hidden = false;
    $("main").classList.remove("large");
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  $("btn-retour").addEventListener("click", revenir);
  function surChamp(ev) {
    var el = ev.target; if (!el || !el.getAttribute) return;
    var id = el.getAttribute("data-ch"); if (!id) return;
    V[id] = el.value;
    rendreDoc();
  }
  $("d-champs").addEventListener("input", surChamp);
  $("d-champs").addEventListener("change", surChamp);
  $("btn-word").addEventListener("click", function () {
    if (!ACTIF) return;
    exporterDocx(ACTIF.titre + " du comité social et économique", slug(ACTIF.titre) + "-cse-" + iso(AUJOURDHUI) + ".docx");
  });
  $("btn-imprimer").addEventListener("click", function () { window.print(); });
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute || !el.hasAttribute("contenteditable")) return;
    corrections[el.getAttribute("data-o")] = texteDe(el);
    el.classList.add("modifie");
  });

  /* ───────────────────────────────────────────────────────────── l'écran */
  if (eff < 11) {
    $("e-pasdu").hidden = false;
  } else {
    rendreListe();
    $("e-liste").hidden = false;
    var demande = (location.hash || "").replace(/^#/, "");
    if (demande) ouvrir(demande);
    window.addEventListener("hashchange", function () {
      var cle = (location.hash || "").replace(/^#/, "");
      if (cle && LIGNES.some(function (x) { return x.cle === cle; })) { if (!ACTIF || cle !== ACTIF.cle) ouvrir(cle); }
      else if (ACTIF) revenir();
    });
  }

  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { if (reg && reg.update) reg.update().catch(function () {}); });
    });
  }
  $("btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>
</body>
</html>

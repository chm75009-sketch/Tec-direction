<!--
  LE DÉPÔT OU L'AFFICHE EN PREMIER. Rien avant.

  Depuis « Oui » à l'audit (j'ai mes affichages), la page ouvre sur le dépôt :
  le texte des affiches en place (Word ou texte), un bouton Contrôler. Chaque
  mention que la loi impose y est cherchée ; ce qui manque ouvre l'affiche,
  entièrement rédigée, remplie avec la fiche d'entreprise, prête à imprimer.

  Depuis « Non » (controler-affichages.html?depart=non), la page ouvre sur les
  dix affiches, les unes sous les autres : les quelques cases à compléter en
  tête de chacune, la feuille dessous, Imprimer et Télécharger en Word.

  Une affiche seule à l'écran : ses champs en tête, la feuille, Imprimer,
  Télécharger en Word, et le texte qui l'appelle sous un repli. Le bouton
  Retour du bandeau, posé par droits.js, revient à l'écran précédent.

  CE QUI EST REPRODUIT MOT POUR MOT. Les articles 225-1 à 225-4, 222-33 et
  222-33-2 du code pénal, et les articles L. 3221-1 à L. 3221-7 du code du
  travail, figurent en toutes lettres sur les affiches qui les appellent :
  L. 1142-6, L. 1152-4, L. 1153-5 et R. 3221-2 imposent le texte, pas un
  résumé. Ils ont été lus à la source le 7 septembre 2026, trois lectures
  concordantes chacun, et leur identifiant de version est porté sous chaque
  encadré. Un texte que l'on n'a pas lu ne s'écrit pas de mémoire.

  CE QUI N'EST PAS CITÉ, ET POURQUOI. L'affiche « interdiction de fumer et de
  vapoter » ne cite aucun article : le texte qui impose cette signalisation
  relève du code de la santé publique, que le relais de vérification de cette
  application ne sert pas. L'affiche existe et se pose ; elle ne se réclame
  d'aucun texte que cette page aurait lu.

  Rien ne sort de ce poste. Les coordonnées saisies restent dans le navigateur.
-->

  .manque{border:1px solid var(--filet);border-left:4px solid var(--ambre);
    border-radius:0 var(--r2) var(--r2) 0;background:var(--surface);padding:12px 14px;margin:0 0 var(--e2)}

  .manque .o{font:600 15px/1.35 system-ui;color:var(--encre)}

     téléphone. Le format A4 n'est pris qu'à l'impression. */

  .a4{background:#fff;color:#000;padding:20px 16px;margin:14px 0 0;border:1px solid var(--filet);

  .a4 h1{font:700 24px/1.15 system-ui;margin:22px 0 4px;letter-spacing:-.01em;text-align:center}
  .a4 .sous{text-align:center;font:600 14px/1.4 system-ui;color:#333;margin:0 0 18px}
  .a4 h2{font:700 16px/1.3 system-ui;margin:18px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
  .a4 p{margin:0 0 8px}
  .a4 .gros{font:700 20px/1.35 system-ui;margin:6px 0}
  .a4 .cle{display:grid;grid-template-columns:1fr;gap:2px;margin:0 0 8px;font-size:16px}
  .a4 .cle span:first-child{font:600 12.5px/1.5 system-ui;text-transform:uppercase;letter-spacing:.04em;color:#333}
  .a4 ul{margin:0 0 8px;padding-left:20px}
  .a4 li{margin:0 0 4px}
  .a4 .vide{color:#666;font-style:italic}
  .a4 .loi{border-left:3px solid #000;padding:6px 0 6px 12px;margin:0 0 12px;font-size:14px;line-height:1.45}
  .a4 .loi b{display:block;font:700 14px/1.4 system-ui;margin-bottom:4px}
  .a4 .loi .ref{display:block;margin-top:4px;font:400 12px/1.3 system-ui;color:#555}
  .a4 .note{font-size:13.5px;color:#444;margin:0 0 8px}
  .a4 .pied{margin-top:20px;border-top:1px solid #999;padding-top:8px;

<header class="site">
  <div class="wrap">
    <p class="marque">Affichages obligatoires</p>

<main class="wrap" id="main">

  <!-- ══════ LE DÉPÔT ══════ -->
  <section id="e-depot" hidden>
    <p class="rappel-fiche" id="rappel-depot"></p>
    <div class="barre pile">
      <label class="btn second" style="display:inline-flex;align-items:center;justify-content:center;gap:9px">Choisir le fichier (.docx, .pdf ou .txt)
        <input type="file" id="fichier" accept=".docx,.txt,text/plain,.pdf,application/pdf" style="display:none"></label>
    </div>
    <div id="lecture"></div>
    <textarea class="depot" id="depot" placeholder="Ou collez ici le texte de vos affichages."></textarea>
    <div class="barre pile"><button type="button" class="btn" id="controler">Contrôler</button></div>
    <div id="diagnostic"></div>
    <div class="suite">
      <button type="button" class="doc-ligne" data-va="toutes">Les dix affiches, prêtes à poser</button>
      <button type="button" class="doc-ligne" data-va="releve">Le relevé daté</button>
    </div>
  </section>

  <!-- ══════ UNE AFFICHE, SEULE ══════ -->
  <section id="e-affiche" hidden>
    <div id="affiche-seule"></div>
  </section>

  <!-- ══════ LES DIX AFFICHES ══════ -->
  <section id="e-toutes" hidden>
    <p class="rappel-fiche" id="rappel-toutes"></p>
    <div class="barre pile">
      <button type="button" class="btn" id="imprimer-tout">Imprimer toutes les affiches</button>
      <button type="button" class="btn second" id="word-tout">Télécharger en Word</button>
    </div>
    <details class="loi"><summary>L'entreprise, en tête de chaque affiche</summary>
      <div class="champs" id="champs-entreprise"></div></details>
    <div id="affiches"></div>
    <div class="suite">
      <button type="button" class="doc-ligne" data-va="releve">Le relevé daté</button>
    </div>
  </section>

  <!-- ══════ LE RELEVÉ ══════ -->
  <section id="e-releve" hidden>
    <div class="champs" id="champs-releve"></div>
    <div id="releve"></div>
    <div class="barre pile">
      <button type="button" class="btn" id="imprimer-releve">Imprimer le relevé</button>
      <button type="button" class="btn second" id="word-releve">Télécharger en Word</button>
    </div>
  </section>

  <p class="reserve">Contrôle documentaire automatisé : le résultat est indicatif et ne vaut ni avis juridique ni attestation de conformité.</p>
</main>

  /* ------------------------------------------------------------------ */
  /* Les écrans. Un seul visible ; le bouton Retour du bandeau (droits.js)
     revient à l'écran précédent, et quitte la page depuis le premier. */
  var PILE = [];
  var ECRANS = ["depot", "affiche", "toutes", "releve"];
  function montrer(nom, sansPile) {
    var courant = ECRANS.filter(function (e) { return !$("#e-" + e).hidden; })[0];
    if (courant && !sansPile && courant !== nom) PILE.push(courant);
    ECRANS.forEach(function (e) { $("#e-" + e).hidden = e !== nom; });
    $("#main").classList.toggle("large", nom !== "depot");
    if (nom === "toutes") rendreAffiches();
    if (nom === "releve") rendreReleve();
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || !PILE.length) return;
    ev.preventDefault(); ev.stopPropagation();
    montrer(PILE.pop(), true);
  }, true);
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("[data-va]") : null;
    if (b) montrer(b.getAttribute("data-va"));
  });

  function rappelFiche() {
    var n = Number(P.effectif), t = v("denomination") || "";
    if (isFinite(n) && String(P.effectif || "").trim() !== "") t += (t ? " · " : "") + n + " salarié" + (n > 1 ? "s" : "");
    return t;
  }
  $("#rappel-depot").textContent = rappelFiche();
  $("#rappel-toutes").textContent = rappelFiche();

  /* ------------------------------------------------------- l'entreprise */
  var ENTREPRISE = [
    { c: "denomination", n: "Dénomination", large: true, ph: "raison sociale, telle qu'au Kbis" },
    { c: "etablissement", n: "Établissement concerné", ph: "le site, s'il y en a plusieurs" },
    { c: "adresse", n: "Adresse", large: true, ph: "n°, rue, code postal, ville" },
    { c: "siret", n: "SIRET", ph: "14 chiffres" },
    { c: "responsable", n: "Signataire des affiches", ph: "nom et qualité" },
  ];

  function champHtml(ch) {
    var dedans, plein = !!v(ch.c);
    if (ch.aire)
      dedans = '<textarea data-c="' + ech(ch.c) + '" placeholder="' + ech(ch.ph || "") + '">' + ech(v(ch.c)) + "</textarea>";
    else
      dedans = '<input data-c="' + ech(ch.c) + '" type="' + (ch.t || "text") +
        '" placeholder="' + ech(ch.ph || "") + '" value="' + ech(v(ch.c)) + '">';
    return '<label class="ch' + (ch.large || ch.aire ? " pleine" : "") + (plein ? " plein" : "") +
      '"><span class="nom">' + ech(ch.n) + "</span>" + dedans + "</label>";
  }

  function brancherChamps(racine, apres) {
    racine.querySelectorAll("[data-c]").forEach(function (el) {
      el.addEventListener("input", function () {
        E.v[el.getAttribute("data-c")] = el.value; garder();
        el.closest("label").classList.toggle("plein", String(el.value).trim() !== "");
        if (apres) apres(el);
      });
    });
  }

  $("#champs-entreprise").innerHTML = ENTREPRISE.map(champHtml).join("");
  brancherChamps($("#champs-entreprise"), function () { redessiner(); });

  /* ---------------------------------------------------------- l'affiche */
  function parId(id) {
    for (var i = 0; i < AFFICHES.length; i++) if (AFFICHES[i].id === id) return AFFICHES[i];
    return null;
  }
  function enTete() {
    return '<div class="ent"><span>' + ech(v("denomination") || "[ dénomination ]") + "</span><span>" +
      ech(v("etablissement") || v("adresse") || "") + "</span></div>";
  }
  function pied(a) {
    var f = a.fond.length
      ? "Fondement : " + a.fond.map(function (x) { return x + " du code du travail (" + FOND[x] + ", " + LU + ")"; }).join(" ; ") + "."
      : "Cette affiche ne cite aucun article : le texte qui l'impose relève du code de la santé publique, non lu par cette application.";
    return '<div class="pied"><span>' + ech(v("denomination") || "[ dénomination ]") +
      (v("siret") ? " · SIRET " + ech(v("siret")) : "") + "<br>" + ech(v("adresse") || "") +
      "<br>Affiche établie le " + ech(dateFr(v("dateReleve")) || "[ date ]") +
      " par " + ech(v("responsable") || "[ signataire ]") + "</span><span>" + ech(f) + "</span></div>";
  }

  function feuilleHtml(a) {
    var h = enTete();
    a.feuille().forEach(function (b) {
      if (b.k === "titre") h += "<h1>" + ech(b.t) + "</h1>";
      else if (b.k === "sous") h += '<p class="sous">' + ech(b.t) + "</p>";
      else if (b.k === "h") h += "<h2>" + ech(b.t) + "</h2>";
      else if (b.k === "p") h += "<p>" + ech(b.t) + "</p>";
      else if (b.k === "gros") h += '<p class="gros">' + ech(b.t) + "</p>";
      else if (b.k === "note") h += '<p class="note">' + ech(b.t) + "</p>";
      else if (b.k === "cle") h += '<div class="cle"><span>' + ech(b.l) + '</span><span' +
        (b.x.k === "vide" ? ' class="vide"' : "") + ">" + ech(b.x.t) + "</span></div>";
      else if (b.k === "liste") h += "<ul>" + String(b.t).split(/\n+/).filter(function (l) { return l.trim(); })
        .map(function (l) { return "<li>" + ech(l.trim()) + "</li>"; }).join("") + "</ul>";
      else if (b.k === "puces") h += "<ul>" + b.t.map(function (l) { return "<li>" + ech(l) + "</li>"; }).join("") + "</ul>";
      else if (b.k === "loi") h += '<div class="loi"><b>' + ech(b.nom) + "</b>" +
        String(b.t).split("\n").map(function (l) { return ech(l); }).join("<br>") +
        '<span class="ref">Version ' + ech(b.ref) + ", " + LU + ".</span></div>";
      else if (b.k === "signature") h += '<div class="signature">' + ech(b.t) + "</div>";
    });
    return h + pied(a);
  }

  /* Le texte de loi, sous le repli : ce qui appelle l'affiche, et les
     articles avec leur identifiant de version. */
  function loiHtml(a) {
    return ech(a.pourquoi) + (a.fond.length
      ? "<br><br>" + a.fond.map(function (x) { return ech(x) + " du code du travail, version " + ech(FOND[x]) + ", " + LU; }).join(" ; ") + "."
      : "");
  }

  /* Les champs en tête : d'abord ce qui manque encore, puis ce qui est déjà
     rempli sous un repli, pour ne pas redemander ce qu'on a déjà. */
  function champsAfficheHtml(a) {
    a.champs.forEach(function (ch) { if (ch.defaut && !v(ch.c)) E.v[ch.c] = ch.defaut; });
    var vides = a.champs.filter(function (ch) { return !v(ch.c); });
    var remplis = a.champs.filter(function (ch) { return !!v(ch.c); });
    return (vides.length ? '<div class="champs">' + vides.map(champHtml).join("") + "</div>" : "") +
      (remplis.length
        ? '<details class="loi"><summary>Corriger ce qui est déjà rempli (' + remplis.length + ")</summary>" +
          '<div class="champs">' + remplis.map(champHtml).join("") + "</div></details>"
        : "");
  }

  /* Une affiche, seule à l'écran. */
  var SEULE = null;
  function ouvrirAffiche(id) {
    var a = parId(id); if (!a) return;
    SEULE = a;
    $("#affiche-seule").innerHTML =
      '<p class="titre-affiche">' + ech(a.nom) + "</p>" +
      '<div data-aff="' + ech(a.id) + '">' + champsAfficheHtml(a) +
      '<div class="a4" data-feuille="' + ech(a.id) + '">' + feuilleHtml(a) + "</div></div>" +
      '<div class="barre pile"><button type="button" class="btn" data-imp="' + ech(a.id) + '">Imprimer cette affiche</button>' +
      '<button type="button" class="btn second" data-word="' + ech(a.id) + '">Télécharger en Word</button>' +
      '<button type="button" class="btn second" data-fait="' + ech(a.id) + '">Elle est posée</button></div>' +
      '<details class="loi"><summary>Voir le texte de loi</summary><div class="c">' + loiHtml(a) + "</div></details>";
    brancherChamps($("#affiche-seule"), function () { redessiner(); });
    montrer("affiche");
  }

  /* Les dix affiches, les unes sous les autres. */
  function aPoser() { return AFFICHES.filter(function (a) { return !E.faites[a.id]; }); }
  function rendreAffiches() {
    var liste = AFFICHES;
    $("#affiches").innerHTML = liste.map(function (a) {
      return '<div data-aff="' + ech(a.id) + '"' + (E.faites[a.id] ? ' class="hors-impression"' : "") + ">" +
        '<p class="titre-affiche">' + ech(a.nom) + (E.faites[a.id] ? ' <span style="color:var(--vert);font-size:var(--t2)">posée</span>' : "") + "</p>" +
        champsAfficheHtml(a) +
        '<div class="a4" data-feuille="' + ech(a.id) + '">' + feuilleHtml(a) + "</div>" +
        '<div class="barre pile"><button type="button" class="btn second" data-imp="' + ech(a.id) + '">Imprimer cette affiche</button>' +
        (E.faites[a.id]
          ? '<button type="button" class="btn second" data-refaire="' + ech(a.id) + '">À reposer</button>'
          : '<button type="button" class="btn second" data-fait="' + ech(a.id) + '">Elle est posée</button>') + "</div>" +
        '<details class="loi"><summary>Voir le texte de loi</summary><div class="c">' + loiHtml(a) + "</div></details></div>";
    }).join("");
    garder();
    brancherChamps($("#affiches"), function () { redessiner(); });
  }

  /* Chaque frappe réécrit toutes les feuilles à l'écran. */
  function redessiner() {
    document.querySelectorAll("[data-feuille]").forEach(function (f) {
      var a = parId(f.getAttribute("data-feuille"));
      if (a) f.innerHTML = feuilleHtml(a);
    });
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-imp],[data-word],[data-fait],[data-refaire],[data-ouvre]") : null;
    if (!t) return;
    if (t.hasAttribute("data-imp")) imprimer(t.getAttribute("data-imp"));
    else if (t.hasAttribute("data-word")) word([parId(t.getAttribute("data-word"))], "affiche-" + t.getAttribute("data-word"));
    else if (t.hasAttribute("data-fait")) { E.faites[t.getAttribute("data-fait")] = true; garder(); if (!$("#e-toutes").hidden) rendreAffiches(); else montrer(PILE.pop() || "depot", true); }
    else if (t.hasAttribute("data-refaire")) { delete E.faites[t.getAttribute("data-refaire")]; garder(); rendreAffiches(); }
    else if (t.hasAttribute("data-ouvre")) ouvrirAffiche(t.getAttribute("data-ouvre"));
  });

  function imprimer(seul) {
    var caches = [];
    document.querySelectorAll("[data-aff]").forEach(function (d) {
      if (seul && d.getAttribute("data-aff") !== seul && !d.classList.contains("hors-impression")) {
        d.classList.add("hors-impression"); caches.push(d);
      }
    });
    window.print();
    setTimeout(function () { caches.forEach(function (d) { d.classList.remove("hors-impression"); }); }, 800);
  }
  $("#imprimer-tout").addEventListener("click", function () { imprimer(null); });

  /* ---------------------------------------------------------- vers Word */
  function motsFeuille(a) {
    var items = [];
    a.feuille().forEach(function (b) {
      if (b.k === "titre") items.push({ k: "h1", t: b.t });
      else if (b.k === "sous") items.push({ k: "sur", t: b.t });
      else if (b.k === "h") items.push({ k: "h2", t: b.t });
      else if (b.k === "p" || b.k === "gros") items.push({ k: "p", t: b.t });
      else if (b.k === "note") items.push({ k: "note", t: b.t });
      else if (b.k === "cle") items.push({ k: "p", t: b.l + " : " + b.x.t });
      else if (b.k === "liste") String(b.t).split(/\n+/).forEach(function (l) {
        if (l.trim()) items.push({ k: "puce", t: l.trim() }); });
      else if (b.k === "puces") b.t.forEach(function (l) { items.push({ k: "puce", t: l }); });
      else if (b.k === "loi") items.push({ k: "enc", titre: b.nom, t: b.t.replace(/\n/g, "  ") },
        { k: "note", t: "Version " + b.ref + ", " + LU + "." });
      else if (b.k === "signature") items.push({ k: "p", t: b.t + " : ............................................" });
    });
    items.push({ k: "note", t: (v("denomination") || "[ dénomination ]") +
      (v("siret") ? " · SIRET " + v("siret") : "") + " · " + (v("adresse") || "") +
      " · affiche établie le " + (dateFr(v("dateReleve")) || "[ date ]") +
      " par " + (v("responsable") || "[ signataire ]") });
    if (a.fond.length) items.push({ k: "note", t: "Fondement : " +
      a.fond.map(function (x) { return x + " du code du travail (" + FOND[x] + ")"; }).join(" ; ") + ", " + LU + "." });
    return items;
  }

  function word(liste, nom) {
    var items = [{ k: "sur", t: "Affiches à poser · " + (v("denomination") || "") + " · " + dateFr(v("dateReleve")) }];
    liste.forEach(function (a, i) {
      if (i) items.push({ k: "saut" });
      items = items.concat(motsFeuille(a));
    });
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, "Affichages obligatoires"),
      nom + "-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  }
  $("#word-tout").addEventListener("click", function () { word(aPoser().length ? aPoser() : AFFICHES, "affichages"); });

  /* ----------------------------------------------------------- le dépôt */
  function sansAccents(s) {
    return String(s || "").normalize ? String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
                                     : String(s || "").toLowerCase();
  }
  function u16(vw, i) { return vw.getUint16(i, true); }
  function u32(vw, i) { return vw.getUint32(i, true); }
  function entreeZip(buf, nomVoulu) {
    var vw = new DataView(buf), n = buf.byteLength, fin = -1;
    for (var i = n - 22; i >= 0 && i > n - 65558; i--) if (u32(vw, i) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(vw, fin + 10), pos = u32(vw, fin + 16), dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(vw, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(vw, pos + 10), taille = u32(vw, pos + 20);
      var lnom = u16(vw, pos + 28), lextra = u16(vw, pos + 30), lcom = u16(vw, pos + 32);
      var debut = u32(vw, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      if (nom === nomVoulu) {
        var ln = u16(vw, debut + 26), lx = u16(vw, debut + 28);
        return { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      }
      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word (word/document.xml).");
  }
  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier. Collez le texte à la place."));
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  function texteDeXml(xml) {
    return xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
  }
  function lireDocx(fichier) {
    return fichier.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) { return new TextDecoder("utf-8").decode(new Uint8Array(b)); });
    }).then(texteDeXml);
  }

  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var dit = function (m, c) { $("#lecture").innerHTML = '<div class="avis ' + (c || "info") + '">' + m + "</div>"; };
    dit("Lecture de <b>" + ech(f.name) + "</b>…");
    ((window.LirePdf && window.LirePdf.estPdf(f)) ? window.LirePdf.texte(f)
      : (/\.docx$/i.test(f.name) ? lireDocx(f) : f.text())).then(function (t) {
      $("#depot").value = t;
      dit("<b>" + ech(f.name) + "</b> lu, " + t.length.toLocaleString("fr-FR") + " caractères. Le fichier n'est pas sorti de ce poste.");
    }).catch(function (e) {
      dit("<b>Ce fichier n'a pas pu être lu.</b>" + ech(e.message) + " Ouvrez le document, copiez son texte et collez-le ci-dessous.", "att");
    });
  });

  $("#controler").addEventListener("click", function () {
    var txt = $("#depot").value, cible = $("#diagnostic");
    if (txt.trim().length < 40) {
      cible.innerHTML = '<div class="avis att"><b>Le texte déposé est trop court.</b>' +
        "Déposez le texte de toutes vos affiches : sur un extrait, tout ce qui n'y figure pas serait dit absent.</div>";
      return;
    }
    var plat = sansAccents(txt), manques = 0, h = "";
    AFFICHES.forEach(function (a) {
      var att = ATTENDUS[a.id] || [], absents = [];
      att.forEach(function (x) {
        var ok = (x.mots || []).some(function (m) { return plat.indexOf(sansAccents(m)) >= 0; });
        if (!ok) absents.push(x.objet);
      });
      var trouve = !absents.length;
      if (trouve) E.faites[a.id] = true; else { manques++; delete E.faites[a.id]; }
      h += '<div class="manque' + (trouve ? " trouve" : "") + '"><div class="o">' + ech(a.nom) + "</div>" +
        (trouve
          ? '<p class="note" style="margin:6px 0 0">Trouvé dans votre texte. La recherche voit que le sujet est traité, elle ne dit jamais qu\'il l\'est bien.</p>'
          : '<p class="note" style="margin:6px 0 0">Introuvable : ' + ech(absents.join(" ; ")) + ".</p>" +
            '<div class="barre pile"><button type="button" class="btn" data-ouvre="' + ech(a.id) + '">L\'affiche, prête à poser</button></div>') +
        "</div>";
    });
    garder();
    cible.innerHTML = '<div class="avis ' + (manques ? "att" : "ok") + '"><b>' +
      (manques ? manques + " affichage(s) introuvable(s) dans votre texte" : "Les dix affichages sont trouvés") +
      "</b>La recherche est faite sur les mots : c'est votre lecture qui décide.</div>" + h;
    cible.scrollIntoView({ behavior: "smooth" });
  });

  /* -------------------------------------------------------- le relevé */
  var CHAMPS_RELEVE = [
    { c: "dateReleve", n: "Date du relevé", t: "date" },
    { c: "relLieux", n: "Lieux parcourus", large: true, ph: "chaque site, chaque atelier, chaque local d'embauche" },
    { c: "relAuteur", n: "Relevé effectué par", ph: "nom et qualité" },
    { c: "relSupport", n: "Support de l'information due par tout moyen", large: true,
      ph: "affichage papier, intranet, livret remis à l'embauche, courriel nominatif" },
  ];

  function rendreReleve() {
    $("#champs-releve").innerHTML = CHAMPS_RELEVE.map(champHtml).join("");
    brancherChamps($("#champs-releve"), tableauReleve);
    tableauReleve();
  }

  function tableauReleve() {
    var lignes = AFFICHES.map(function (a) {
      var f = !!E.faites[a.id];
      return '<div class="releve-ligne"><div class="n">' + ech(a.nom) + "</div>" +
        '<div class="e' + (f ? " fait" : "") + '">' + (f ? "en place" : "à poser") + " · " +
        (a.fond.length ? ech(a.fond.join(", ")) : "code de la santé publique") + "</div>" +
        '<div class="deux"><input data-rel="lieu-' + ech(a.id) + '" value="' + ech(v("lieu-" + a.id)) + '" placeholder="emplacement exact">' +
        '<input data-rel="date-' + ech(a.id) + '" type="date" value="' + ech(v("date-" + a.id)) + '"></div></div>';
    }).join("");

    $("#releve").innerHTML =
      '<div class="a4">' + enTete() +
      "<h1>RELEVÉ DES AFFICHAGES</h1>" +
      '<p class="sous">Constat daté de ce qui est apposé dans l\'établissement</p>' +
      '<div class="cle"><span>Date du relevé</span><span' + (v("dateReleve") ? "" : ' class="vide"') + ">" +
      ech(dateFr(v("dateReleve")) || "[ date à porter ]") + "</span></div>" +
      '<div class="cle"><span>Lieux parcourus</span><span' + (v("relLieux") ? "" : ' class="vide"') + ">" +
      ech(v("relLieux") || "[ lieux à indiquer ]") + "</span></div>" +
      '<div class="cle"><span>Relevé effectué par</span><span' + (v("relAuteur") ? "" : ' class="vide"') + ">" +
      ech(v("relAuteur") || v("responsable") || "[ nom et qualité ]") + "</span></div>" +
      '<div class="cle"><span>Support de l\'information</span><span' + (v("relSupport") ? "" : ' class="vide"') + ">" +
      ech(v("relSupport") || "[ support à indiquer ]") + "</span></div>" +
      "<h2>Ce qui a été constaté, affichage par affichage</h2>" + lignes +
      '<p class="note" style="margin-top:12px">Une photographie datée de chaque emplacement est jointe au présent relevé. ' +
      "Pour ce qui est dû par tout moyen, la preuve du support en tient lieu : accusé de diffusion, " +
      "capture de l'intranet, émargement du livret d'accueil.</p>" +
      '<div class="signature">Date et signature</div>' +
      "</div>";

    $("#releve").querySelectorAll("[data-rel]").forEach(function (i) {
      i.addEventListener("input", function () { E.v[i.getAttribute("data-rel")] = i.value; garder(); });
    });
  }

  $("#imprimer-releve").addEventListener("click", function () { window.print(); });

  $("#word-releve").addEventListener("click", function () {
    var items = [
      { k: "sur", t: "Relevé daté des affichages · " + (v("denomination") || "") },
      { k: "p", t: "Date du relevé : " + (dateFr(v("dateReleve")) || "[ date ]") },
      { k: "p", t: "Lieux parcourus : " + (v("relLieux") || "[ lieux ]") },
      { k: "p", t: "Relevé effectué par : " + (v("relAuteur") || v("responsable") || "[ nom et qualité ]") },
      { k: "p", t: "Support de l'information due par tout moyen : " + (v("relSupport") || "[ support ]") },
      { k: "table", head: ["Affichage", "Fondement", "État", "Emplacement", "Posé le"],
        rows: AFFICHES.map(function (a) {
          return [a.nom, a.fond.length ? a.fond.join(", ") : "code de la santé publique",
            E.faites[a.id] ? "en place" : "à poser",
            v("lieu-" + a.id) || "", dateFr(v("date-" + a.id)) || ""];
        }) },
      { k: "note", t: "Une photographie datée de chaque emplacement est jointe au présent relevé." },
      { k: "p", t: "Date et signature :" },
    ];
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, "Relevé des affichages"),
      "releve-affichages-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });

  /* ------------------------------------------------------------------ */
  /* L'entrée. « non » (rien n'est en place) ouvre les dix affiches ;
     tout le reste ouvre le dépôt. */
  var depart = new URLSearchParams(location.search).get("depart");
  if (depart === "non") { E.faites = {}; garder(); montrer("toutes", true); }
  else montrer("depot", true);

  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
})();
</script>
<script src="assistant.js" defer></script>
</body>

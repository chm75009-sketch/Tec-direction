<!--
  LE SUIVI MÉDICAL, SALARIÉ PAR SALARIÉ.

  Jusqu'au 26 septembre 2026, l'application ne savait produire qu'une demande
  de visite d'embauche saisie à la main : aucun échéancier, rien sur le
  renouvellement, rien sur la reprise après un arrêt. Un audit l'a relevé, et
  c'est ce que cette page fait.

  Ce qu'elle porte, et le texte qui le commande, chacun lu à la source le
  26 septembre 2026, deux lectures concordantes :

    R. 4624-10  LEGIARTI000033769085  la visite d'information et de
                prévention, dans un délai qui n'excède pas trois mois à
                compter de la prise effective du poste ;
    R. 4624-16  LEGIARTI000033769063  son renouvellement, selon une
                périodicité qui ne peut excéder cinq ans, fixée par le
                médecin du travail dans le protocole ;
    R. 4624-28  LEGIARTI000033769094  poste à risques particuliers : suivi
                individuel renforcé, renouvellement par le médecin du travail
                selon une périodicité qui ne peut être supérieure à quatre
                ans, et visite intermédiaire au plus tard deux ans après ;
    R. 4624-31  LEGIARTI000054250639  l'examen de reprise, après un congé de
                maternité, une maladie professionnelle, trente jours d'arrêt
                pour accident du travail, ou soixante jours pour maladie ou
                accident non professionnel ; l'employeur saisit le service dès
                qu'il connaît la date de fin de l'arrêt, et l'examen a lieu le
                jour de la reprise, au plus tard dans les huit jours.

  Les dates sont celles que l'employeur saisit : aucune n'est devinée. Ce qui
  n'est pas renseigné s'affiche en rouge, et non en gris : une date qui manque
  n'est pas une situation saine.

  Le stockage est celui de la flotte, « flotte-conducteurs », rangé sous le
  nom du salarié : la fiche conducteur et l'agenda lisent les mêmes dates, et
  rien n'est saisi deux fois.
-->

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function ech(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  var profil = {};
  try {
    profil = (window.Profil && window.Profil.lire) ? (window.Profil.lire() || {})
      : (JSON.parse(localStorage.getItem("profil-entreprise") || "null") || {});
  } catch (e) { profil = {}; }

  var CLE_REG = "registre-personnel";
  var CLE_FICHES = "flotte-conducteurs";
  var AUJOURDHUI = new Date();
  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet",
    "août", "septembre", "octobre", "novembre", "décembre"];

  /* ──────────────────────────────── les textes lus ───────────────────── */
  var TEXTES = {
    "R4624-10": { id: "LEGIARTI000033769085",
      dit: "tout travailleur bénéficie d'une visite d'information et de prévention dans un délai qui n'excède pas trois mois à compter de la prise effective du poste de travail" },
    "R4624-16": { id: "LEGIARTI000033769063",
      dit: "renouvellement de la visite d'information et de prévention selon une périodicité qui ne peut excéder cinq ans, fixée par le médecin du travail dans le protocole" },
    "R4624-28": { id: "LEGIARTI000033769094",
      dit: "poste à risques particuliers : renouvellement par le médecin du travail selon une périodicité qui ne peut être supérieure à quatre ans, et visite intermédiaire au plus tard deux ans après" },
    "R4624-31": { id: "LEGIARTI000054250639",
      dit: "examen de reprise après un congé de maternité, une maladie professionnelle, trente jours d'arrêt pour accident du travail ou soixante jours pour maladie ou accident non professionnel ; l'employeur saisit le service dès qu'il connaît la date de fin de l'arrêt, l'examen a lieu le jour de la reprise et au plus tard dans les huit jours" },
    /* L'APTITUDE MÉDICALE DU PERMIS, QUI N'EST PAS LA VISITE DU TRAVAIL.

       Relevé le 27 septembre 2026 : cette page ne disait rien de la visite
       médicale du permis, alors que c'est elle qui décide si un conducteur
       peut prendre le volant. Les deux suivis sont distincts : le médecin du
       travail se prononce sur le poste, le médecin agréé sur le droit de
       conduire, et la seconde échéance tombe bien plus souvent que la
       première. Ces deux articles viennent du code de la route, et non du
       code du travail : le relais les sert, deux lectures espacées
       concordantes le 27 septembre 2026, mêmes identifiants. */
    "R221-10": { id: "LEGIARTI000051682550", code: "code de la route",
      dit: "les catégories C1, C1E, C, CE, D1, D1E, D et DE ne peuvent être obtenues ou renouvelées qu'à la suite d'un avis médical favorable" },
    "R221-11": { id: "LEGIARTI000046217357", code: "code de la route",
      dit: "périodicité maximale de cinq ans pour les conducteurs de moins de soixante ans, deux ans à partir de soixante ans et un an à partir de soixante-seize ans ; pour les catégories D1, D, D1E ou DE, un an à partir de soixante ans" }
  };
  function ref(cles) {
    /* Le .replace("-", "-") qui était ici ne faisait rien depuis le premier
       jour : il est retiré plutôt que laissé à faire croire à un traitement.
       Relevé le 28 septembre 2026. */
    return cles.map(function (c) { return "art. " + c.replace(/^([A-Z])(\d)/, "$1. $2"); }).join(", ");
  }
  function art(c) {
    var m = /^([A-Z]+)(\d+)-(.+)$/.exec(c);
    var n = m ? m[1] + ". " + m[2] + "-" + m[3] : c;
    /* Un article d'un autre code se nomme avec son code : sans cela, « R. 221-10 »
       se lit comme un article du code du travail, qui porte un tout autre texte. */
    var t = TEXTES[c];
    return t && t.code ? n + " du " + t.code : n;
  }

  /* ──────────────────────────────── les dates ────────────────────────── */
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function deIso(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    return isNaN(d.getTime()) ? null : d;
  }
  function dateFr(v) {
    var d = v instanceof Date ? v : deIso(v);
    if (!d) return "";
    return (d.getDate() === 1 ? "1er" : d.getDate()) + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }
  function plusMois(v, n) {
    var d = v instanceof Date ? new Date(v.getTime()) : deIso(v);
    if (!d) return null;
    var j = d.getDate();
    d.setMonth(d.getMonth() + n);
    if (d.getDate() < j) d.setDate(0);
    return d;
  }
  function plusJours(v, n) {
    var d = v instanceof Date ? new Date(v.getTime()) : deIso(v);
    if (!d) return null;
    d.setDate(d.getDate() + n);
    return d;
  }
  function joursEntre(a, b) {
    if (!a || !b) return null;
    return Math.round((a.getTime() - b.getTime()) / 864e5);
  }
  function net(v) { return String(v == null ? "" : v).trim(); }
  function slug(s) {
    try {
      return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    } catch (e) { return String(s == null ? "" : s).toLowerCase(); }
  }

  /* ──────────────────────────── les salariés et leurs fiches ─────────── */
  function salaries() {
    var E = null;
    try { E = JSON.parse(localStorage.getItem(CLE_REG) || "null"); } catch (e) { E = null; }
    return ((E && E.salaries) || []).filter(function (s) {
      return !s.ex && !net(s.sor) && (net(s.nom) || net(s.pre));
    }).map(function (s) {
      var nom = (net(s.nom) + " " + net(s.pre)).trim();
      /* La date de naissance vient du registre : c'est l'âge qui commande la
         périodicité de la visite médicale du permis (R. 221-11 du code de la
         route). Sans elle, la périodicité n'est pas dite. */
      return { id: slug(nom), nom: nom, emp: net(s.emp), ent: net(s.ent), nais: net(s.nais) };
    });
  }
  function fiches() {
    try { return JSON.parse(localStorage.getItem(CLE_FICHES) || "null") || {}; }
    catch (e) { return {}; }
  }
  function fiche(id) { return fiches()[id] || {}; }
  function ecrire(id, champ, valeur) {
    var t = fiches();
    t[id] = t[id] || {};
    if (net(valeur)) t[id][champ] = net(valeur); else delete t[id][champ];
    try { localStorage.setItem(CLE_FICHES, JSON.stringify(t)); } catch (e) {}
  }

  /* ──────────────────────────── ce qui est dû, et quand ──────────────── */
  /* LES MOTIFS D'EXAMEN DE REPRISE, ET LEUR DURÉE D'ARRÊT.
     R. 4624-31 : maternité et maladie professionnelle sans condition de
     durée, accident du travail à partir de trente jours, maladie ou accident
     non professionnel à partir de soixante jours. */
  var MOTIFS = [
    { v: "", lib: "- aucun arrêt en cours -", jours: null },
    { v: "maternite", lib: "Congé de maternité", jours: 0 },
    { v: "mp", lib: "Maladie professionnelle", jours: 0 },
    { v: "at", lib: "Accident du travail", jours: 30 },
    { v: "maladie", lib: "Maladie ou accident non professionnel", jours: 60 }
  ];
  function motifDe(v) {
    var out = MOTIFS[0];
    MOTIFS.forEach(function (m) { if (m.v === v) out = m; });
    return out;
  }

  function echeances(s) {
    var f = fiche(s.id), L = [];
    var suivi = f.suivi === "sir" ? "sir" : "vip";
    var derniere = net(f.visiteTravail);

    /* 1. La visite d'information et de prévention, à l'embauche.

       UNE DATE QU'ON NE CONNAÎT PAS N'EST PAS UN RETARD. Pour un salarié entré
       en 2004 et dont aucune visite n'est saisie, l'écran annonçait « en retard
       de 8 152 jours » et la demande au service de santé au travail fixait une
       échéance « au plus tard le 1er décembre 2009 » : envoyée telle quelle,
       elle faisait reconnaître à l'employeur dix-sept ans de manquement, sur
       une visite qui a peut-être eu lieu. Relevé le 26 septembre 2026. Tant que
       la dernière visite n'est pas renseignée, l'échéance n'est pas calculée :
       l'écran demande la date, et aucun courrier ne porte de date passée. */
    if (!derniere && net(s.ent)) {
      var duEmbauche = plusMois(s.ent, 3);
      if (joursEntre(duEmbauche, AUJOURDHUI) >= 0)
        L.push({ quoi: "Visite d'information et de prévention", date: duEmbauche,
          fond: "R4624-10", pour: "une visite d'information et de prévention",
          dit: "dans un délai qui n'excède pas trois mois à compter de la prise effective du poste" });
      else
        L.push({ quoi: "Visite d'information et de prévention", date: null, inconnu: true,
          fond: "R4624-10", pour: "une visite d'information et de prévention",
          dit: "dans un délai qui n'excède pas trois mois à compter de la prise effective du poste" });
    }

    /* 2. Le renouvellement, cinq ans au plus, quatre en suivi renforcé, avec
          la visite intermédiaire à deux ans. */
    if (derniere && suivi === "vip")
      L.push({ quoi: "Renouvellement de la visite", date: plusMois(derniere, 60),
        fond: "R4624-16", pour: "le renouvellement de votre visite d'information et de prévention",
        dit: "périodicité qui ne peut excéder cinq ans, fixée par le médecin du travail" });
    if (derniere && suivi === "sir") {
      L.push({ quoi: "Renouvellement avec le médecin du travail", date: plusMois(derniere, 48),
        fond: "R4624-28", pour: "le renouvellement de votre visite avec le médecin du travail",
        dit: "périodicité qui ne peut être supérieure à quatre ans" });
      L.push({ quoi: "Visite intermédiaire", date: plusMois(net(f.visiteInter) || derniere, net(f.visiteInter) ? 48 : 24),
        fond: "R4624-28", pour: "une visite intermédiaire",
        dit: "au plus tard deux ans après la visite avec le médecin du travail" });
    }

    /* 3. L'examen de reprise : il se compte depuis la fin de l'arrêt, et le
          motif décide s'il est dû. */
    var fin = net(f.arretFin), motif = motifDe(net(f.arretMotif));
    if (fin && motif.v && !net(f.visiteReprise)) {
      var deb = net(f.arretDebut);
      var duree = deb ? joursEntre(deIso(fin), deIso(deb)) : null;
      var du = motif.jours === 0 || duree === null || duree >= motif.jours;
      if (du)
        L.push({ quoi: "Examen de reprise", date: plusJours(fin, 8), fond: "R4624-31",
          pour: "un examen de reprise",
          dit: "l'examen a lieu le jour de la reprise et au plus tard dans les huit jours qui suivent ; " +
            "l'employeur saisit le service dès qu'il connaît la date de fin de l'arrêt",
          reprise: true });
    }
    /* 4. L'aptitude médicale du permis, pour les catégories lourdes.

          Elle ne remplace pas la visite du travail et ne s'en déduit pas : le
          médecin agréé se prononce sur le droit de conduire, le médecin du
          travail sur le poste. Sans elle, le permis n'est plus valable et le
          conducteur ne peut plus rouler. */
    var cat = String(f.permisCat || "").toUpperCase();
    var lourd = /\b(C1E|C1|CE|C|D1E|D1|DE|D)\b/.test(cat);
    var transport = /transport|logistique/.test(String(profil.secteur || "").toLowerCase());
    /* UN CONDUCTEUR SANS CATÉGORIE SAISIE N'EST PAS UN CONDUCTEUR SANS PERMIS.

       L'échéance du permis n'apparaissait que si la catégorie était saisie sur
       la fiche du conducteur, ou la date de validité de l'avis médical : chez un
       transporteur dont les fiches sont vides, aucun conducteur ne recevait
       d'échéance, et rien ne disait qu'il en manquait une. L'intitulé d'emploi du
       registre le dit : « Conducteur poids lourd », « Chauffeur PL ». La
       catégorie n'est pas devinée pour autant, elle est demandée. Ajouté le
       28 septembre 2026 sur la ligne « aptitude au permis » de la
       contre-vérification du 26. */
    var roule = /conduc|chauffeur|routier|poids lourd|\bpl\b|\bspl\b|livreur/i
      .test(String(s.emp || "") + " " + String(s.qua || ""));
    if (lourd || (transport && net(f.visitePermisFin)) || (transport && roule)) {
      var moisMax = periodicitePermis(s.nais, cat);
      var ditPeriode = moisMax === null
        ? "la date de naissance n'est pas au registre : la périodicité applicable, de cinq ans, de deux ans ou d'un an selon l'âge et la catégorie, ne peut pas être dite"
        : "périodicité maximale " + (moisMax === 12 ? "d'un an" : (moisMax === 24 ? "de deux ans" : "de cinq ans")) +
          " pour ce conducteur, au vu de son âge et de ses catégories";
      if (net(f.visitePermisFin))
        L.push({ quoi: "Visite médicale du permis", date: deIso(net(f.visitePermisFin)),
          fond: "R221-11", pour: "le renouvellement de la visite médicale du permis de conduire",
          dit: ditPeriode, permis: true });
      else
        L.push({ quoi: "Visite médicale du permis", date: null,
          inconnu: cat ? "date de validité de l'avis médical inconnue"
                       : "catégories du permis et validité de l'avis médical inconnues",
          fond: "R221-10", pour: "la visite médicale du permis de conduire",
          dit: (cat
            ? "la date jusqu'à laquelle l'avis médical vaut n'est pas renseignée sur la fiche du conducteur"
            : "l'emploi porté au registre est un emploi de conduite, et ni les catégories du permis " +
              "ni la date jusqu'à laquelle l'avis médical vaut ne sont renseignées : saisissez-les " +
              "ci-dessus") +
            ", et l'échéance ne peut donc pas être calculée ; " + ditPeriode,
          permis: true });
    }
    return L.filter(function (x) { return !!x.date || x.inconnu; });
  }

  /* La périodicité que le code de la route fixe, en mois : cinq ans sous
     soixante ans, deux ans à partir de soixante, un an à partir de
     soixante-seize ; et un an dès soixante ans pour les catégories D
     (R. 221-11, I, 2°). Rend null quand la date de naissance manque : on ne
     devine pas un âge. */
  function periodicitePermis(naissance, cat) {
    var n = deIso(net(naissance));
    if (!n) return null;
    var age = AUJOURDHUI.getFullYear() - n.getFullYear();
    var m = AUJOURDHUI.getMonth() - n.getMonth();
    if (m < 0 || (m === 0 && AUJOURDHUI.getDate() < n.getDate())) age--;
    var d = /\b(D1E|D1|DE|D)\b/.test(String(cat || "").toUpperCase());
    if (age >= 76) return 12;
    if (age >= 60) return d ? 12 : 24;
    return 60;
  }

  function etatDe(jours, inconnu) {
    if (inconnu) return "att";
    if (jours === null) return "non";
    if (jours < 0) return "non";
    if (jours <= 30) return "non";
    if (jours <= 60) return "att";
    return "ok";
  }
  function direDelai(jours, inconnu) {
    /* « inconnu » peut valoir true, ou porter le mot qui convient à cette
       échéance-là : la visite du travail se compte depuis la dernière visite,
       la visite du permis depuis la date jusqu'à laquelle l'avis médical vaut,
       et dire « dernière visite inconnue » pour la seconde était faux. */
    if (typeof inconnu === "string" && inconnu) return inconnu + ", à renseigner";
    if (inconnu) return "dernière visite inconnue, à renseigner";
    if (jours === null) return "date inconnue";
    if (jours < 0) return "en retard de " + (-jours) + " jour" + (-jours > 1 ? "s" : "");
    if (jours === 0) return "aujourd'hui";
    return "dans " + jours + " jour" + (jours > 1 ? "s" : "");
  }

  /* ──────────────────────────────── l'écran ──────────────────────────── */
  var FILTRE = "faire";
  var ouvert = {};

  function lignesDe(s) {
    return echeances(s).map(function (e) {
      var j = e.date ? joursEntre(e.date, AUJOURDHUI) : null;
      return { e: e, jours: j, etat: etatDe(j, e.inconnu) };
    }).sort(function (a, b) { return rang(a) - rang(b); });
  }
  /* UNE DATE QUI MANQUE PASSE DEVANT CE QUI EST LOIN. Elle était rangée en
     dernier, avec les échéances sans date : la carte du salarié affichait
     alors une visite due en 2029 et taisait celle dont la date n'est pas
     connue, si bien que le filtre « à faire » ne montrait personne. Elle vient
     donc après ce qui est en retard, et avant tout ce qui est à venir. Relevé
     le 27 septembre 2026. */
  function rang(x) {
    if (x.e.inconnu) return -0.5;
    return x.jours === null ? 1e9 : x.jours;
  }

  /* LES DEUX COURRIERS S'ADRESSENT AU SERVICE DE PRÉVENTION ET DE SANTÉ AU
     TRAVAIL, ET LA VISITE DU PERMIS NE LE CONCERNE PAS. Elle relève du
     contrôle médical de l'aptitude à la conduite du code de la route : lui
     demander de l'organiser serait lui demander ce qu'il ne fait pas. La
     première échéance retenue pour les courriers écarte donc celle-là, qui
     reste à sa place sur l'écran. */
  function premiereDuTravail(lg) {
    var out = null;
    lg.forEach(function (x) { if (!out && !x.e.permis) out = x; });
    return out;
  }

  function rendre() {
    var L = salaries();
    var dus = [];
    /* UN SALARIÉ PEUT AVOIR DEUX ÉCHÉANCES, ET LES DEUX COMPTENT.

       La carte fermée ne montrait que la première de la liste, et l'encadré
       n'en retenait qu'une par salarié. Relevé le 29 septembre 2026 sur
       AKKOUCHE idriss, entré le 1er juillet 2026 : sa visite d'information et
       de prévention, due le 1er octobre, avait disparu de la carte et du
       compte, parce que la visite du permis, dont les catégories ne sont pas
       saisies, passe devant les dates connues et prenait seule la place. Deux
       obligations distinctes, deux médecins, deux textes : on les montre
       toutes les deux. */
    var cartes = L.map(function (s) {
      var lg = lignesDe(s);
      var pire = lg.length ? lg[0] : null;
      var dues = lg.filter(function (x) { return x.etat === "non" || x.etat === "att"; });
      dues.forEach(function (x) { dus.push({ s: s, l: x }); });
      if (FILTRE === "faire" && !dues.length) return "";
      var f = fiche(s.id);
      var suivi = f.suivi === "sir" ? "sir" : "vip";
      return '<div class="sal' + (ouvert[s.id] ? " ouverte" : "") + '" data-sal="' + ech(s.id) + '">' +
        '<div class="tete" data-ouvrir="' + ech(s.id) + '"><b>' + ech(s.nom) + "</b>" +
        '<p class="resume">' + ech([s.emp, suivi === "sir" ? "suivi individuel renforcé" : "visite d'information et de prévention",
          net(f.visiteTravail) ? "dernière visite le " + dateFr(f.visiteTravail) : "aucune visite enregistrée"]
          .filter(Boolean).join(" · ")) + "</p>" +
        /* Le badge ne recevait pas « inconnu » et affichait « date inconnue »
           là où la ligne dépliée dit « dernière visite inconnue, à
           renseigner » : deux phrases pour le même fait, et la plus vague sur
           le dessus. Relevé le 28 septembre 2026. */
        ((dues.length ? dues : (pire ? [pire] : [])).map(function (x) {
          return '<p class="prochaine">' + ech(x.e.quoi) + '</p><span class="jauge ' + x.etat + '">' +
            ech(direDelai(x.jours, x.e.inconnu)) + "</span>";
        }).join("") || '<span class="jauge ok">rien à échéance</span>') +
        "</div><div class=\"corps\">" + champsDe(s, f) + lignesHtml(lg) + boutonsDe(s) + "</div></div>";
    }).join("");

    $("liste").innerHTML = cartes || '<div class="avis info"><b>Rien à faire dans cette vue</b>' +
      "Aucune échéance n'est due dans les soixante jours. Le filtre « Tous » montre l'ensemble des salariés.</div>";
    /* DEUX FOIS LE MÊME CHIFFRE, ET RIEN POUR LES DISTINGUER.

       « 82 salariés en poste au registre · 82 à traiter dans les soixante
       jours » : les deux nombres coïncidaient, et la ligne se lisait comme une
       répétition. Relevé le 29 septembre 2026. Ce qui manquait est le nombre de
       personnes concernées, qui est celui sur lequel on agit : il s'ajoute, et
       chaque nombre dit ce qu'il compte. */
    var gens = {};
    dus.forEach(function (x) { if (x && x.s) gens[x.s.id] = true; });
    var nGens = Object.keys(gens).length;
    $("compte").textContent = L.length + " salarié" + (L.length > 1 ? "s" : "") +
      " en poste au registre · " + nGens + " concerné" + (nGens > 1 ? "s" : "") + " · " +
      dus.length + " échéance" + (dus.length > 1 ? "s" : "") + " dans les soixante jours";
    rendreAlertes(dus, L.length);
    cabler();
  }

  function champsDe(s, f) {
    var suivi = f.suivi === "sir" ? "sir" : "vip";
    var ch = function (id, nom, type, valeur, sous, opts) {
      var dedans;
      if (opts) {
        dedans = '<select data-id="' + ech(s.id) + '" data-c="' + id + '">' +
          opts.map(function (o) {
            return '<option value="' + ech(o[0]) + '"' + (o[0] === valeur ? " selected" : "") + ">" +
              ech(o[1]) + "</option>";
          }).join("") + "</select>";
      } else {
        dedans = '<input type="' + type + '" data-id="' + ech(s.id) + '" data-c="' + id +
          '" value="' + ech(valeur) + '"' + (net(valeur) ? ' class="rempli"' : "") + ">";
      }
      return '<label class="ch' + (sous ? " pleine" : "") + '"><span>' + ech(nom) + "</span>" + dedans +
        (sous ? '<span class="sous">' + ech(sous) + "</span>" : "") + "</label>";
    };
    return '<div class="champs">' +
      ch("suivi", "Type de suivi", "", suivi, "R. 4624-28 : le suivi individuel renforcé vise les postes à risques particuliers.",
        [["vip", "Visite d'information et de prévention"], ["sir", "Suivi individuel renforcé"]]) +
      ch("visiteTravail", "Dernière visite, le", "date", net(f.visiteTravail)) +
      (suivi === "sir" ? ch("visiteInter", "Dernière visite intermédiaire", "date", net(f.visiteInter)) : "") +
      ch("arretMotif", "Arrêt de travail en cours", "", net(f.arretMotif),
        "R. 4624-31 : maternité et maladie professionnelle sans condition de durée, trente jours pour un accident du travail, soixante pour une maladie ou un accident non professionnel.",
        MOTIFS.map(function (m) { return [m.v, m.lib]; })) +
      (net(f.arretMotif) ? ch("arretDebut", "Arrêt depuis le", "date", net(f.arretDebut)) : "") +
      (net(f.arretMotif) ? ch("arretFin", "Fin de l'arrêt, le", "date", net(f.arretFin)) : "") +
      (net(f.arretMotif) ? ch("visiteReprise", "Examen de reprise tenu le", "date", net(f.visiteReprise)) : "") +
      /* LA DATE DU PERMIS SE SAISIT ICI AUSSI. Elle vit dans la même fiche
         conducteur que le reste, et c'est ici qu'on vient voir les échéances
         médicales : obliger à passer par l'écran de la flotte pour la seule
         date qui décide du droit de conduire n'avait pas de sens. La
         catégorie s'y saisit également, puisque c'est elle, avec l'âge, qui
         donne la périodicité. Relevé le 27 septembre 2026. */
      ch("permisCat", "Catégories du permis", "text", net(f.permisCat),
        "R. 221-10, II du code de la route : les catégories C1, C1E, C, CE, D1, D1E, D et DE " +
        "ne s'obtiennent et ne se renouvellent qu'après un avis médical favorable.") +
      ch("visitePermisFin", "Visite médicale du permis, valable jusqu'au", "date", net(f.visitePermisFin),
        "R. 221-11 du code de la route : cinq ans au plus sous soixante ans, deux ans à partir de " +
        "soixante, un an à partir de soixante-seize ; un an dès soixante ans pour les catégories D.") +
      "</div>";
  }

  function lignesHtml(lg) {
    if (!lg.length) return '<div class="avis ok"><b>Aucune échéance en cours</b>' +
      "Renseignez la date de la dernière visite pour que le renouvellement se calcule.</div>";
    return lg.map(function (x) {
      return '<div class="avis ' + x.etat + '"><b>' + ech(x.e.quoi + " : " +
        (x.e.date ? dateFr(x.e.date) + ", " + direDelai(x.jours, x.e.inconnu)
          : direDelai(x.jours, x.e.inconnu))) + "</b>" +
        ech(x.e.dit) + " (" + ech(art(x.e.fond)) + ").</div>";
    }).join("");
  }

  function boutonsDe(s) {
    return '<div class="barre">' +
      '<button type="button" class="p" data-doc="service" data-sal="' + ech(s.id) + '">Demande au service de santé au travail</button>' +
      '<button type="button" data-doc="salarie" data-sal="' + ech(s.id) + '">Convocation du salarié</button>' +
      "</div>";
  }

  function rendreAlertes(dus, total) {
    if (!total) {
      $("alertes").innerHTML = '<div class="avis non"><b>Le registre du personnel ne porte aucun salarié</b>' +
        "C'est lui qui donne les noms de cet écran : ouvrez le registre et inscrivez-les.</div>";
      return;
    }
    var retard = dus.filter(function (d) { return d.l.jours !== null && d.l.jours < 0; });
    var proches = dus.filter(function (d) { return d.l.jours !== null && d.l.jours >= 0 && d.l.jours <= 30; });
    /* Une échéance sans date n'entrait ni dans l'un ni dans l'autre : elle
       disparaissait de l'encadré après avoir pris la tête de la carte. Elle a
       sa propre ligne, parce que ce qu'elle demande n'est pas de tenir un
       rendez-vous mais de saisir une date. Relevé le 29 septembre 2026. */
    var adater = dus.filter(function (d) { return d.l.jours === null; });
    /* Le compte de l'en-tête porte sur soixante jours, l'encadré n'en montrait
       que trente : entre les deux, des échéances comptées et jamais nommées.
       Relevé le 29 septembre 2026. */
    var ensuite = dus.filter(function (d) { return d.l.jours !== null && d.l.jours > 30; });
    var h = "";
    if (retard.length)
      h += '<div class="avis non"><b>' + retard.length + " échéance" + (retard.length > 1 ? "s" : "") +
        " passée" + (retard.length > 1 ? "s" : "") + "</b><ul><li>" +
        retard.slice(0, 8).map(function (d) {
          return ech(d.s.nom + " : " + d.l.e.quoi + ", " + direDelai(d.l.jours, d.l.e.inconnu));
        }).join("</li><li>") + "</li></ul>" +
        (retard.length > 8 ? "… et " + (retard.length - 8) + " autre(s)." : "") + "</div>";
    if (proches.length)
      h += '<div class="avis att"><b>' + proches.length + " échéance" + (proches.length > 1 ? "s" : "") +
        " dans les trente jours</b><ul><li>" +
        proches.slice(0, 8).map(function (d) {
          return ech(d.s.nom + " : " + d.l.e.quoi + ", " + direDelai(d.l.jours, d.l.e.inconnu));
        }).join("</li><li>") + "</li></ul>" +
        (proches.length > 8 ? "… et " + (proches.length - 8) + " autre(s)." : "") + "</div>";
    if (adater.length)
      h += '<div class="avis att"><b>' + adater.length + " échéance" + (adater.length > 1 ? "s" : "") +
        " dont la date reste à saisir</b><ul><li>" +
        adater.slice(0, 8).map(function (d) {
          return ech(d.s.nom + " : " + d.l.e.quoi + ", " + direDelai(d.l.jours, d.l.e.inconnu));
        }).join("</li><li>") + "</li></ul>" +
        (adater.length > 8 ? "… et " + (adater.length - 8) + " autre(s)." : "") + "</div>";
    if (ensuite.length)
      h += '<div class="avis info"><b>' + ensuite.length + " échéance" + (ensuite.length > 1 ? "s" : "") +
        " entre trente et soixante jours</b><ul><li>" +
        ensuite.slice(0, 8).map(function (d) {
          return ech(d.s.nom + " : " + d.l.e.quoi + ", " + direDelai(d.l.jours, d.l.e.inconnu));
        }).join("</li><li>") + "</li></ul>" +
        (ensuite.length > 8 ? "… et " + (ensuite.length - 8) + " autre(s)." : "") + "</div>";
    if (!retard.length && !proches.length && !adater.length && !ensuite.length)
      h = '<div class="avis ok"><b>Aucune échéance dans les trente jours</b>' +
        "Les dates saisies sont celles qui commandent : une date qui manque s'affiche en rouge sur la fiche du salarié.</div>";
    $("alertes").innerHTML = h;
  }

  function cabler() {
    Array.prototype.forEach.call($("liste").querySelectorAll("[data-ouvrir]"), function (t) {
      t.addEventListener("click", function () {
        var id = t.getAttribute("data-ouvrir");
        if (ouvert[id]) delete ouvert[id]; else ouvert[id] = true;
        t.parentNode.classList.toggle("ouverte", !!ouvert[id]);
      });
    });
    Array.prototype.forEach.call($("liste").querySelectorAll("[data-c]"), function (el) {
      el.addEventListener("change", function () {
        ecrire(el.getAttribute("data-id"), el.getAttribute("data-c"), el.value);
        rendre();
      });
    });
    Array.prototype.forEach.call($("liste").querySelectorAll("[data-doc]"), function (b) {
      b.addEventListener("click", function () {
        ouvrirDoc(b.getAttribute("data-doc"), b.getAttribute("data-sal"));
      });
    });
  }

  /* ──────────────────────────────── les deux courriers ───────────────── */
  var DOC = null;
  function salarieDe(id) {
    var out = null;
    salaries().forEach(function (s) { if (s.id === id) out = s; });
    return out;
  }
  /* LE SIGNATAIRE, DANS LES DEUX FORMES DE LA FICHE. « responsable » est
     l'ancien champ unique ; la fiche range depuis le 26 septembre 2026 le nom
     et la qualité séparément, si bien que les documents sortaient avec le
     crochet « [nom et qualité du signataire] » sur une fiche complète, jusque
     sur un certificat de travail. Relevé le 28 septembre 2026. */
  function respFiche() {
    var p = profil || {};
    var s = String(p.responsable || "").trim();
    if (s) return s;
    return [String(p.responsableNom || "").trim(), String(p.responsableQualite || "").trim()]
      .filter(Boolean).join(", ");
  }

  function signataire() {
    return net(respFiche()) || "[nom et qualité du représentant légal]";
  }
  function ville() {
    var m = /(\d{5})\s+([^,;]+)$/.exec(net(profil.adresse));
    return m ? m[2].trim() : "[ville]";
  }
  function enTete() {
    var L = [net(profil.denomination) || "[dénomination]"];
    if (net(profil.adresse)) L.push(net(profil.adresse));
    if (net(profil.siret)) L.push("SIRET " + net(profil.siret));
    return L;
  }

  function docService(s) {
    var f = fiche(s.id), lg = lignesDe(s);
    var premiere = premiereDuTravail(lg);
    var org = net(profil.orgSanteTravail) || "[nom et adresse du service de prévention et de santé au travail]";
    var b = enTete().map(function (l) { return { k: "p", t: l }; });
    b.push({ k: "p", t: ville() + ", le " + dateFr(AUJOURDHUI) });
    b.push({ k: "p", t: org });
    b.push({ k: "t1", t: "Demande de visite médicale" });
    b.push({ k: "p", t: "Objet : " + (premiere ? premiere.e.quoi.toLowerCase() : "suivi médical") +
      " de " + s.nom + "." });
    b.push({ k: "p", t: "Madame, Monsieur," });
    if (premiere && premiere.e.reprise) {
      b.push({ k: "p", t: "Le contrat de travail de " + s.nom + ", " + (s.emp || "[emploi]") +
        ", a été suspendu pour " + motifDe(net(f.arretMotif)).lib.toLowerCase() +
        (net(f.arretDebut) ? " depuis le " + dateFr(f.arretDebut) : "") +
        ". L'arrêt prend fin le " + dateFr(f.arretFin) + "." });
      b.push({ k: "p", t: "Nous vous saisissons dès connaissance de cette date afin que l'examen de " +
        "reprise soit organisé le jour de la reprise effective, et au plus tard dans les huit jours " +
        "qui suivent, soit le " + dateFr(plusJours(f.arretFin, 8)) + " (R. 4624-31)." });
    } else if (premiere && premiere.e.inconnu) {
      /* Aucune date passée dans un courrier : la dernière visite n'est pas
         connue, on le dit et on demande la prochaine. */
      b.push({ k: "p", t: "Nous sollicitons l'organisation d'une visite d'information et de " +
        "prévention pour " + s.nom + ", " + (s.emp || "[emploi]") +
        (net(s.ent) ? ", entré dans l'entreprise le " + dateFr(s.ent) : "") +
        ". La date de sa dernière visite n'est pas connue de nos services : nous vous " +
        "remercions de nous indiquer si elle figure dans votre dossier, et, à défaut, " +
        "d'organiser cette visite dans les meilleurs délais." });
    } else if (premiere) {
      /* AUCUNE DATE PASSÉE DANS UN COURRIER, MÊME QUAND ELLE EST CONNUE.

         La demande écrivait « à tenir au plus tard le 1er décembre 2009 » :
         envoyée telle quelle, elle reconnaît par écrit dix-sept ans de
         manquement, à un service qui n'a rien demandé. Relevé le 26 septembre
         2026. Quand l'échéance est passée, la lettre demande la visite sans
         plus, et c'est vrai : elle est due. Quand elle est à venir, elle la
         donne, parce qu'elle sert à fixer le rendez-vous. */
      var echue = premiere.jours !== null && premiere.jours < 0;
      b.push({ k: "p", t: "Nous sollicitons l'organisation de la visite suivante pour " + s.nom + ", " +
        (s.emp || "[emploi]") + (net(s.ent) ? ", entré dans l'entreprise le " + dateFr(s.ent) : "") + " : " +
        premiere.e.quoi.toLowerCase() +
        (echue ? ", dans les meilleurs délais." : ", à tenir au plus tard le " + dateFr(premiere.e.date) + ".") });
      b.push({ k: "p", t: premiere.e.dit.charAt(0).toUpperCase() + premiere.e.dit.slice(1) +
        " (" + art(premiere.e.fond) + ")." });
    } else {
      b.push({ k: "p", t: "Nous sollicitons l'organisation d'une visite pour " + s.nom + ", " +
        (s.emp || "[emploi]") + " : [préciser la visite demandée et la date souhaitée]." });
    }
    b.push({ k: "p", t: "Le salarié relève " + (f.suivi === "sir"
      ? "du suivi individuel renforcé, son poste présentant des risques particuliers au sens de l'article R. 4624-23."
      : "de la visite d'information et de prévention.") });
    b.push({ k: "p", t: "Nous vous remercions de nous communiquer la date retenue, que nous porterons à " +
      "la connaissance de l'intéressé." });
    b.push({ k: "p", t: "Nous vous prions d'agréer, Madame, Monsieur, l'expression de nos salutations distinguées." });
    b.push({ k: "p", t: " " });
    b.push({ k: "p", t: signataire() });
    b.push({ k: "p", t: net(profil.denomination) });
    return { titre: "Demande de visite médicale", blocs: b,
      fichier: "demande-visite-" + s.id, loi: premiere ? [premiere.e.fond] : ["R4624-10"] };
  }

  function docSalarie(s) {
    var f = fiche(s.id), lg = lignesDe(s);
    var premiere = premiereDuTravail(lg);
    var b = enTete().map(function (l) { return { k: "p", t: l }; });
    b.push({ k: "p", t: ville() + ", le " + dateFr(AUJOURDHUI) });
    b.push({ k: "p", t: s.nom });
    b.push({ k: "t1", t: "Convocation à une visite médicale" });
    b.push({ k: "p", t: "Objet : " + (premiere ? premiere.e.quoi.toLowerCase() : "visite médicale") + "." });
    b.push({ k: "p", t: "Madame, Monsieur," });
    b.push({ k: "p", t: "Vous êtes convoqué pour " +
      (premiere ? (premiere.e.pour || premiere.e.quoi.toLowerCase()) : "une visite médicale") +
      " auprès de " + (net(profil.orgSanteTravail) || "[service de prévention et de santé au travail]") +
      ", le [date] à [heure], [adresse]." });
    if (premiere)
      b.push({ k: "p", t: "Cette visite est due : " + premiere.e.dit + " (" + art(premiere.e.fond) + ")." });
    b.push({ k: "p", t: "Le temps nécessité par cette visite et les déplacements qu'elle impose est pris " +
      "sur les heures de travail, sans retenue de salaire." });
    b.push({ k: "p", t: "Si la date ou l'heure ne vous convenait pas, prévenez-nous sans attendre : la " +
      "visite sera reportée avec le service, et non annulée." });
    b.push({ k: "p", t: "Nous vous prions d'agréer, Madame, Monsieur, l'expression de nos salutations distinguées." });
    b.push({ k: "p", t: " " });
    b.push({ k: "p", t: signataire() });
    b.push({ k: "p", t: net(profil.denomination) });
    return { titre: "Convocation à une visite médicale", blocs: b,
      fichier: "convocation-visite-" + s.id, loi: premiere ? [premiere.e.fond] : ["R4624-10"] };
  }

  function ouvrirDoc(quoi, id) {
    var s = salarieDe(id);
    if (!s) return;
    DOC = quoi === "service" ? docService(s) : docSalarie(s);
    $("feuille").innerHTML = DOC.blocs.map(function (b) {
      if (b.k === "t1") return "<h2>" + ech(b.t) + "</h2>";
      return "<p>" + ech(b.t) + "</p>";
    }).join("");
    $("doc").hidden = false;
    $("doc").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("btn-fermer").addEventListener("click", function () { $("doc").hidden = true; });
  $("btn-imprimer").addEventListener("click", function () { window.print(); });
  $("btn-word").addEventListener("click", function () {
    if (!DOC || !window.AuditExport) return;
    var items = DOC.blocs.map(function (b) { return { k: b.k === "t1" ? "t1" : "p", t: b.t }; });
    var octets = window.AuditExport.docx(items, DOC.titre);
    window.AuditExport.telecharger(octets,
      DOC.fichier + "-" + iso(AUJOURDHUI) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });

  /* ──────────────────────────────── le reste de l'écran ──────────────── */
  Array.prototype.forEach.call($("filtres").querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () {
      FILTRE = b.getAttribute("data-f");
      Array.prototype.forEach.call($("filtres").querySelectorAll("button"), function (x) {
        x.classList.toggle("actif", x === b);
      });
      rendre();
    });
  });

  $("rappel").textContent = [net(profil.denomination),
    net(profil.orgSanteTravail) ? "service de santé au travail : " + net(profil.orgSanteTravail)
      : "service de prévention et de santé au travail non renseigné sur la fiche d'entreprise"]
    .filter(Boolean).join(" · ");

  $("textes").innerHTML = Object.keys(TEXTES).map(function (c) {
    return "<p><b>" + ech(art(c)) + "</b> <span class=\"ident\">" + ech(TEXTES[c].id) + "</span><br>" +
      ech(TEXTES[c].dit) + "</p>";
  }).join("");

  rendre();
})();
</script>
</body>
</html>

<!--
  CE QUE FAIT CETTE PAGE.

  Une question, et une seule : « Avez-vous un plan de sauvegarde de
  l'emploi ? »

  Avant de la poser, elle regarde la fiche d'entreprise. Le plan n'est dû que
  dans les entreprises d'au moins cinquante salariés, lorsque le projet
  concerne au moins dix salariés dans une même période de trente jours
  (L. 1233-61). Sous cinquante, la question ne se pose pas : la page dit
  « pas dû avant 50 » et renvoie à audit.html, l'écran du licenciement pour
  motif économique.

  « Non » ouvre les documents, déjà écrits à partir de la fiche, un onglet par
  document : la notification du projet à l'administration, la convocation du
  comité à la première réunion avec les sept renseignements que la loi y
  joint, la convocation à la seconde réunion, le plan lui-même rubrique par
  rubrique, la réponse motivée aux suggestions du comité, la demande de
  validation ou d'homologation, et la lettre de licenciement qui ne part
  qu'après la décision. Sur chaque onglet : deux ou trois champs en tête qui
  se glissent dans le texte, le document seul, Télécharger en Word, Imprimer,
  « Voir le texte de loi » replié, et Retour. C'est l'écran 5 de la maquette
  validée le 8 septembre 2026. Rien d'autre : ni chapeau, ni étape, ni exposé
  du droit avant d'agir.

  « Oui » prend le plan existant, le confronte aux rubriques de L. 1233-62,
  aux modalités de suivi de L. 1233-63 et aux mentions du reclassement, et
  rend pour chaque manque le texte à insérer, prêt à coller.

  LE POINT QUI FAIT PERDRE LES DOSSIERS. Les critères de départage entre
  salariés en cas de candidatures multiples doivent figurer dans la liste des
  postes diffusée, et pas seulement dans le plan, avec le délai de candidature
  (D. 1233-2-1, III). Chambre sociale, 8 janvier 2025, pourvoi n° 22-24.724,
  publié.

  CE QUE LA PAGE NE FAIT PAS. Elle n'apprécie aucun montant. Aucun texte ne
  fixe le montant d'un plan, et le caractère suffisant des mesures au regard
  des moyens de l'entreprise appartient à l'autorité administrative puis au
  juge (L. 1233-57-3).

  LES TEXTES. Chaque article cité a été lu au relais Légifrance le 7 septembre
  2026, deux fois à quelques minutes d'intervalle, avec le même identifiant de
  version et le même texte aux deux lectures. L. 1233-61, L. 1233-71,
  L. 1233-46 et L. 1233-30 ont été relus deux fois le 8 septembre 2026, même
  identifiant. L'identifiant LEGIARTI figure dans la table TEXTES et sous
  « Voir le texte de loi ».

  Rien ne sort du poste : tout est calculé et rédigé dans le navigateur.
-->

<style>
  main.wrap{max-width:820px;padding-bottom:var(--e7)}

  /* La question d'entrée : elle occupe l'écran, et deux boutons y répondent. */
  .question{max-width:720px;margin:11vh auto 0;text-align:center}
  .question h1{font:600 clamp(24px,3.6vw,32px)/1.3 system-ui;margin:0 0 var(--e6)}
  .question .deux{display:flex;gap:var(--e3);justify-content:center;flex-wrap:wrap}
  .question .deux button,.question .deux .btn{min-width:150px;font-size:17px;padding:16px 26px}
  .question .fiche{margin:var(--e6) 0 0;font-size:var(--t3);color:var(--texte-2)}
  .question .fiche a{color:var(--accent)}

  /* Le document seul à l'écran : les onglets, deux ou trois champs en tête,
     la feuille, la barre, le texte de loi replié. */
  #ecran-doc{margin:var(--e4) 0 0}
  .onglets{margin:0 0 var(--e4)}
  #ecran-doc .champs{grid-template-columns:1fr 1fr;gap:10px;margin:0 0 var(--e4)}
  #ecran-doc .champs label.ch .nom{font-size:14px;margin:0 0 4px}
  #ecran-doc .champs input,#ecran-doc .champs select,#ecran-doc .champs textarea{font-size:16px;padding:10px 12px;min-height:44px}
  #ecran-doc .champs textarea{min-height:88px}
  #ecran-doc .barre{margin:var(--e4) 0}
  #ecran-doc details{margin:var(--e2) 0 var(--e6)}
  #sources{margin-top:8px;font-size:var(--t1);line-height:1.6;color:var(--texte-2)}
  #sources div{margin:0 0 6px}
  #sources b{color:var(--encre)}
  .renvoi{background:var(--rouge-clair);border:1px solid #e6cccc;border-radius:var(--r2);
    padding:var(--e4);color:var(--rouge);font-size:var(--t3);line-height:1.55;margin:0 0 var(--e4)}
  .renvoi a{color:var(--rouge);font-weight:600}

  /* Les arrêts sur lesquels repose le document, et leur copie intégrale. */
  #arrets{margin:var(--e4) 0 0}
  #arrets h3{font:600 15px/1.35 system-ui;margin:0 0 8px;color:var(--encre)}
  .arret{border:1px solid var(--trait);border-radius:var(--r2);padding:12px 14px;margin:0 0 10px;
    background:var(--fond-2,#fafafa)}
  .arret .ref{font-weight:600;font-size:var(--t2);color:var(--encre);margin:0 0 4px}
  .arret .dit{font-size:var(--t1);line-height:1.55;color:var(--texte-2);margin:0 0 10px}
  .arret a.pdf{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;
    border:1px solid var(--trait);border-radius:var(--r2);background:#fff;color:var(--encre);
    font:600 14px/1 system-ui;text-decoration:none}
  .arret a.pdf:hover{background:var(--rouge-clair);border-color:#e6cccc;color:var(--rouge)}

  /* La feuille : le document tel qu'il sortira sur le papier. */
  .feuille [contenteditable]{outline:none}
  .feuille [contenteditable]:focus{background:#fffbe9;border-radius:3px}
  .feuille .modifie{border-left:2px solid var(--vert);padding-left:8px;margin-left:-10px}
  .feuille .b-t1{font:700 17px/1.35 Georgia,"Times New Roman",serif;margin:0 0 6px;text-align:center;text-transform:uppercase;letter-spacing:.02em}
  .feuille .b-st{font:600 14px/1.4 system-ui;margin:0 0 22px;text-align:center;color:var(--texte-2)}
  .feuille .b-h1{font:700 15px/1.35 Georgia,"Times New Roman",serif;margin:20px 0 7px}
  .feuille .b-h2{font:600 15px/1.35 Georgia,"Times New Roman",serif;margin:15px 0 5px}
  .feuille .b-p{margin:0 0 10px}
  .feuille .b-puce{margin:0 0 5px 18px}

  .feuille .b-vide{height:9px}
  .feuille .b-trait{border:0;border-top:1px solid var(--filet);margin:20px 0}
  .feuille .b-sign{margin:20px 0 0;white-space:pre-wrap;line-height:1.7}

  /* La branche « oui » : le plan déposé, puis les manques. */
  #ecran-oui{margin:var(--e4) 0 0}
  textarea#depot{min-height:200px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;margin:var(--e3) 0 0}
  .manque{border:1px solid var(--filet);border-radius:var(--r2);margin:var(--e3) 0;

  .manque .obj{font:600 15px/1.35 system-ui}
  .manque .fond{font-size:var(--t1);color:var(--texte-3);margin-top:2px}
  .etat{font:600 11px/1 system-ui;padding:6px 9px;border-radius:var(--r1);white-space:nowrap;

  .manque .texte p{margin:0 0 8px}
  .manque .pret{background:var(--vert-clair);border-radius:var(--r1);padding:12px 14px;
    font-size:var(--t2);line-height:1.6;color:var(--vert);white-space:pre-wrap}
  .chiffre{background:var(--accent-clair);border-radius:var(--r1);padding:11px 14px;
    margin:var(--e3) 0;color:var(--accent);font-size:var(--t2);line-height:1.6}
  .alerte{background:var(--ambre-clair);border:1px solid #e8ddc6;border-radius:var(--r1);
    padding:11px 14px;margin:var(--e3) 0;color:var(--ambre);font-size:var(--t2);line-height:1.6}

  @media print{
    header.site,.maj-dispo,.onglets,.champs,.barre,details,.question,#ecran-oui,.renvoi,#arrets{display:none !important}
    main.wrap{max-width:none;padding:0}
    .feuille{border:0;padding:0}
  }
</style>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  /* ═══════════════════════════════════════════════════════════════════════
     LES TEXTES.

     Chacun a été interrogé deux fois au relais Légifrance le 7 septembre 2026,
     à quelques minutes d'intervalle, et les deux lectures ont rendu le même
     identifiant de version et le même texte, caractère pour caractère.
     L'identifiant est conservé ici : un article change sans changer de numéro,
     et seul le LEGIARTI dit lequel a été lu.
     ══════════════════════════════════════════════════════════════════════ */
  var TEXTES = {
    "L1233-3": { id: "LEGIARTI000036762081",
      dit: "définition du licenciement économique : suppression ou transformation d'emploi, ou modification refusée d'un élément essentiel du contrat, consécutives à des difficultés économiques, des mutations technologiques, une réorganisation nécessaire à la sauvegarde de la compétitivité ou une cessation d'activité" },
    "L1233-4": { id: "LEGIARTI000036261863",
      dit: "reclassement préalable sur le territoire national dans l'entreprise ou le groupe ; offres adressées de manière personnalisée ou liste diffusée par tout moyen ; les offres proposées sont écrites et précises" },
    "D1233-2-1": { id: "LEGIARTI000036248612",
      dit: "six mentions de chaque offre écrite ; la liste diffusée précise les critères de départage entre salariés en cas de candidatures multiples et le délai de candidature, qui ne peut être inférieur à quinze jours francs à compter de la publication" },
    "L1233-5": { id: "LEGIARTI000036261856",
      dit: "critères d'ordre : charges de famille, ancienneté, caractéristiques sociales rendant la réinsertion difficile, qualités professionnelles ; périmètre au moins égal à la zone d'emplois à défaut d'accord" },
    "L1233-16": { id: "LEGIARTI000036762077",
      dit: "la lettre de licenciement comporte l'énoncé des motifs économiques et mentionne la priorité de réembauche et ses conditions de mise en oeuvre" },
    "L1233-24-1": { id: "LEGIARTI000036261836",
      dit: "un accord collectif peut déterminer le contenu du plan et les modalités de consultation ; il est signé par des organisations ayant recueilli au moins 50 % des suffrages exprimés en faveur d'organisations représentatives au premier tour des dernières élections des titulaires" },
    "L1233-24-2": { id: "LEGIARTI000036261824",
      dit: "l'accord porte sur le contenu du plan et peut porter sur les modalités d'information et de consultation, la pondération et le périmètre des critères d'ordre, le calendrier, le nombre de suppressions et les catégories professionnelles, les modalités des mesures de formation, d'adaptation et de reclassement" },
    "L1233-24-4": { id: "LEGIARTI000035652928",
      dit: "à défaut d'accord, un document élaboré par l'employeur après la dernière réunion du comité fixe le contenu du plan et précise les éléments prévus aux 1° à 5° de l'article L. 1233-24-2" },
    "L1233-28": { id: "LEGIARTI000035652699",
      dit: "l'employeur qui envisage un licenciement collectif d'au moins dix salariés dans une même période de trente jours réunit et consulte le comité social et économique" },
    "L1233-30": { id: "LEGIARTI000035643899",

    "L1233-31": { id: "LEGIARTI000035643895",
      dit: "sept renseignements joints à la convocation à la première réunion : raisons du projet, nombre de licenciements envisagé, catégories professionnelles et critères proposés pour l'ordre, effectif de l'établissement, calendrier prévisionnel, mesures de nature économique, conséquences en matière de santé, de sécurité ou de conditions de travail" },
    "L1233-32": { id: "LEGIARTI000025579021",
      dit: "dans les entreprises d'au moins cinquante salariés, l'employeur adresse aux représentants du personnel le plan de sauvegarde de l'emploi" },
    "L1233-33": { id: "LEGIARTI000035652923",
      dit: "l'employeur met à l'étude les suggestions relatives aux mesures sociales et les propositions alternatives formulées par le comité, et leur donne une réponse motivée" },
    "L1233-34": { id: "LEGIARTI000036762068",
      dit: "le comité peut décider, lors de la première réunion, de recourir à une expertise ; le rapport de l'expert est remis au plus tard quinze jours avant l'expiration du délai mentionné à l'article L. 1233-30" },
    "L1233-35": { id: "LEGIARTI000036261799",
      dit: "l'expert désigné par le comité demande à l'employeur les informations nécessaires" },
    "L1233-39": { id: "LEGIARTI000027566048",
      dit: "dans les entreprises de cinquante salariés ou plus, l'employeur notifie le licenciement après la notification de la décision de validation ou d'homologation, ou à l'expiration des délais ; il ne peut, à peine de nullité, rompre les contrats avant" },
    "L1233-45": { id: "LEGIARTI000029144908",
      dit: "priorité de réembauche pendant un an à compter de la rupture, sur demande du salarié formée dans ce délai ; information des représentants du personnel sur les postes disponibles" },
    "L1233-46": { id: "LEGIARTI000035652915",
      dit: "notification du projet à l'autorité administrative, au plus tôt le lendemain de la première réunion, accompagnée de tout renseignement concernant la convocation, l'ordre du jour et la tenue de cette réunion, et de l'intention d'ouvrir la négociation le cas échéant" },
    "L1233-57-2": { id: "LEGIARTI000035652786",
      dit: "l'autorité administrative valide l'accord collectif après s'être assurée de sa conformité, de la régularité de la procédure et de la présence des mesures prévues" },
    "L1233-57-3": { id: "LEGIARTI000036431884",
      dit: "en l'absence d'accord ou en cas d'accord ne portant pas sur l'ensemble des points, l'autorité administrative homologue le document en s'assurant notamment de la régularité de la procédure et du caractère suffisant des mesures au regard des moyens de l'entreprise, de l'unité économique et sociale et du groupe" },
    "L1233-57-4": { id: "LEGIARTI000035652911",
      dit: "décision de validation notifiée dans les quinze jours de la réception de l'accord, décision d'homologation dans les vingt et un jours de la réception du document complet ; le silence vaut décision d'acceptation ; la décision est portée à la connaissance des salariés par voie d'affichage" },
    "L1233-61": { id: "LEGIARTI000036261733",
      dit: "dans les entreprises d'au moins cinquante salariés, lorsque le projet de licenciement concerne au moins dix salariés dans une même période de trente jours, l'employeur établit et met en oeuvre un plan de sauvegarde de l'emploi intégrant un plan de reclassement" },
    "L1233-62": { id: "LEGIARTI000036261725",
      dit: "le plan prévoit des mesures telles que le reclassement interne, les actions favorisant la reprise d'activités, les créations d'activités nouvelles, le reclassement externe, le soutien à la création ou à la reprise d'activités par les salariés, les actions de formation, de validation des acquis ou de reconversion, les mesures de réduction ou d'aménagement du temps de travail" },
    "L1233-63": { id: "LEGIARTI000035652729",
      dit: "le plan détermine les modalités de suivi de la mise en oeuvre effective des mesures du plan de reclassement ; ce suivi fait l'objet d'une consultation régulière et détaillée du comité, dont l'avis est transmis à l'autorité administrative, laquelle reçoit un bilan de l'employeur" },
    "L1233-66": { id: "LEGIARTI000031013988",
      dit: "lorsque le licenciement donne lieu à un plan de sauvegarde de l'emploi, la proposition du contrat de sécurisation professionnelle est faite après la notification par l'autorité administrative de sa décision de validation ou d'homologation" },
    "L1233-71": { id: "LEGIARTI000042683537",
      dit: "dans les entreprises ou établissements d'au moins mille salariés, congé de reclassement d'une durée qui ne peut excéder douze mois, portés à vingt-quatre en cas de formation de reconversion" }
  };

  /* Les arrêts sur lesquels reposent les documents. Chacun a été lu texte
     intégral à la source (Judilibre) et sa copie est servie en PDF depuis

  var ARRETS = {
    departage: {
      ref: "Cass. soc., 8 janvier 2025, pourvoi n° 22-24.724, publié au Bulletin",
      dit: "l'employeur doit indiquer, dans la liste des postes disponibles mise à disposition " +

    mentions: {

      pdf: "arrets/Cass-soc-23-octobre-2024-23-19629.pdf" },

  /* 4. Le plan lui-même. */
  function docPlan(d) {
    var b = [], cloture = clotureCandidatures(d.publication);
    b.push({ k: "t1", t: "Plan de sauvegarde de l'emploi" });
    b.push({ k: "st", t: profil.denomination + ", " + d.nombre + " licenciements envisagés, " +
      (d.accord ? "accord collectif majoritaire" : "document unilatéral de l'employeur") });
    b.push({ k: "h1", t: "Article 1 - Objet et champ d'application" });
    b.push({ k: "p", t: "Le présent plan a pour objet d'éviter les licenciements envisagés ou d'en " +
      "limiter le nombre. Il intègre un plan de reclassement visant à faciliter le reclassement sur " +
      "le territoire national des salariés dont le licenciement ne pourrait être évité, notamment " +
      "celui des salariés âgés ou présentant des caractéristiques sociales ou de qualification " +
      "rendant leur réinsertion professionnelle particulièrement difficile." });
    b.push({ k: "p", t: "Il s'applique aux salariés relevant des catégories professionnelles " +
      "suivantes :" });
    lignes(d.categories, ["[catégorie professionnelle] ; [nombre de suppressions]"])
      .forEach(function (l) { b.push({ k: "ligne", t: l }); });

    b.push({ k: "h1", t: "Article 2 - La cause économique" });
    b.push({ k: "p", t: "L'entreprise connaît " + d.cause.t + "." });
    (d.faits ? d.faits.split(/\n+/) : ["[Éléments chiffrés et datés qui l'établissent.]"])
      .forEach(function (l) { if (l.trim()) b.push({ k: "p", t: l.trim() }); });
    b.push({ k: "note", t: "Les difficultés économiques s'apprécient au niveau du secteur " +
      "d'activité du groupe : " + ARRETS.secteur.ref + "." });

    b.push({ k: "h1", t: "Article 3 - Les mesures du plan" });
    b.push({ k: "p", t: "Les mesures ci-dessous sont classées par rubrique. Le budget indiqué est " +
      "celui que l'entreprise arrête : aucun texte ne fixe le montant d'un plan." });
    b.push({ k: "ligne", t: "Rubrique ; mesure ; bénéficiaires ; budget" });
    lignes(d.mesures).forEach(function (l) { b.push({ k: "ligne", t: l }); });

    b.push({ k: "h1", t: "Article 4 - Le reclassement interne" });
    b.push({ k: "p", t: "Les postes disponibles situés sur le territoire national dans l'entreprise " +
      "et dans les autres entreprises du groupe dont elle fait partie et dont l'organisation, les " +
      "activités ou le lieu d'exploitation assurent la permutation de tout ou partie du personnel " +
      "sont diffusés à l'ensemble des salariés concernés, par tout moyen permettant de conférer date " +
      "certaine, le " + dateFr(d.publication) + "." });
    b.push({ k: "p", t: "Le reclassement s'effectue sur un emploi relevant de la même catégorie que " +
      "celui occupé ou sur un emploi équivalent assorti d'une rémunération équivalente ; à défaut, " +
      "et sous réserve de l'accord exprès du salarié, sur un emploi de catégorie inférieure." });
    b.push({ k: "p", t: "Chaque offre est écrite et précise. Elle indique l'intitulé du poste et son " +
      "descriptif, le nom de l'employeur, la nature du contrat de travail, la localisation du poste, " +
      "le niveau de rémunération et la classification du poste." });
    b.push({ k: "note", t: "Les six mentions sont exigées à peine d'imprécision : " +
      ARRETS.mentions.ref + ". Les postes du groupe sont décrits par leur nombre, leur nature, leur " +
      "localisation, leur statut et leur rémunération : " + ARRETS.postes.ref + "." });
    b.push({ k: "h2", t: "Le délai de candidature" });
    b.push({ k: "p", t: "Les candidatures sont présentées par écrit et reçues jusqu'au " +
      (cloture ? dateFr(cloture) + " inclus" : "[date]") + ", soit un délai de quinze jours francs à " +
      "compter de la publication de la liste. L'absence de candidature écrite à l'issue de ce délai " +
      "vaut refus des offres." });
    b.push({ k: "h2", t: "Les critères de départage en cas de candidatures multiples" });
    b.push({ k: "p", t: "Lorsque plusieurs salariés se portent candidats sur un même poste, le " +
      "salarié retenu est identifié sur les bases objectives suivantes, appliquées dans cet ordre :" });
    lignes(d.departage).forEach(function (l) { b.push({ k: "puce", t: "- " + l }); });
    b.push({ k: "p", t: "Ces critères sont repris dans la liste diffusée aux salariés, et non " +
      "seulement dans le présent plan. Le salarié dont la candidature n'est pas retenue en est " +
      "informé par écrit, avec l'indication du critère qui a départagé les candidatures." });

    b.push({ k: "h1", t: "Article 5 - Les critères d'ordre des licenciements" });
    b.push({ k: "p", t: "Les critères retenus pour fixer l'ordre des licenciements sont les charges " +
      "de famille, en particulier celles des parents isolés, l'ancienneté de service dans " +
      "l'établissement ou l'entreprise, la situation des salariés dont les caractéristiques sociales " +
      "rendent la réinsertion professionnelle particulièrement difficile, notamment les personnes " +
      "handicapées et les salariés âgés, et les qualités professionnelles appréciées par catégorie." });
    b.push({ k: "p", t: "Leur pondération est la suivante : un point par enfant à charge et un point " +
      "supplémentaire pour un parent isolé ; un point par année d'ancienneté révolue, dans la limite " +
      "de vingt points ; deux points au titre des caractéristiques sociales ; de zéro à quatre points " +
      "au titre des qualités professionnelles, appréciées sur des éléments objectifs et vérifiables. " +
      "Aucun critère n'est écarté. Le total le plus faible désigne le salarié dont le licenciement " +
      "est envisagé en premier." });
    b.push({ k: "p", t: "Le périmètre d'application des critères est " + (d.accord

    b.push({ k: "note", t: "Aucun critère ne peut être écarté, et la situation sociale rendant la " +
      "réinsertion difficile ne se limite pas au handicap reconnu : " + ARRETS.criteres.ref + ". " +
      "Les catégories professionnelles et la pondération retenue sont contrôlées par " +
      "l'administration, et l'ordre mal appliqué se paie en dommages-intérêts : " +

    b.push({ k: "h1", t: "Article 6 - L'accompagnement individuel" });
    b.push({ k: "p", t: mille
      ? "L'entreprise employant au moins mille salariés, un congé de reclassement est proposé à " +
        "chaque salarié dont le licenciement est envisagé. Sa durée ne peut excéder douze mois, " +
        "portés à vingt-quatre mois en cas de formation de reconversion professionnelle. Il est pris " +
        "pendant le préavis, que le salarié est dispensé d'exécuter, et l'entreprise en finance " +
        "l'ensemble des actions."

        "licenciement est envisagé, après la notification par l'autorité administrative de sa " +

    b.push({ k: "h1", t: "Article 7 - La priorité de réembauche" });
    b.push({ k: "p", t: "Chaque salarié licencié bénéficie d'une priorité de réembauche pendant un " +
      "délai d'un an à compter de la date de rupture de son contrat, s'il en fait la demande au " +
      "cours de ce même délai. L'entreprise l'informe alors de tout emploi devenu disponible et " +
      "compatible avec sa qualification, et informe les représentants du personnel des postes " +

    b.push({ k: "note", t: "Elle est portée à la connaissance du salarié au plus tard au moment " +
      "où il accepte le contrat de sécurisation professionnelle : " + ARRETS.reembauche.ref + "." });

    b.push({ k: "h1", t: "Article 8 - Le suivi de la mise en oeuvre" });
    b.push({ k: "p", t: "Une commission de suivi est constituée. Elle comprend [nombre] " +
      "représentants de la direction et [nombre] membres désignés par le comité social et " +
      "économique. Elle se réunit tous les [périodicité] jusqu'à l'épuisement des mesures du plan de " +
      "reclassement." });
    b.push({ k: "p", t: "Elle examine, mesure par mesure, le nombre de bénéficiaires, les sommes " +
      "engagées et les reclassements obtenus. Le comité social et économique est consulté de façon " +
      "régulière et détaillée sur ce suivi, et son avis est transmis à l'autorité administrative." });
    b.push({ k: "p", t: "L'autorité administrative est associée au suivi de ces mesures et reçoit un " +
      "bilan, établi par l'entreprise, de la mise en oeuvre effective du plan." });
    b.push({ k: "sign", t: "\n" + (d.accord
      ? "Pour les organisations syndicales signataires\n\n\nPour la société\n" + signataire()
      : signataire() + "\n" + profil.denomination) });
    return b;
  }

  /* 5. La réponse motivée aux suggestions du comité. */
  function docReponse(d) {
    var b = [];
    b.push({ k: "t1", t: "Réponse motivée aux suggestions et propositions du comité" });
    b.push({ k: "st", t: "Réunion du " + dateFr(d.reunion1) + ", réponse remise le " +
      dateFr(d.reunion2) });
    b.push({ k: "p", t: "Les suggestions relatives aux mesures sociales envisagées et les " +
      "propositions alternatives au projet de restructuration formulées par le comité social et " +
      "économique lors de sa réunion du " + dateFr(d.reunion1) + " ont été mises à l'étude. La " +
      "réponse de la direction est la suivante." });
    b.push({ k: "ligne", t: "Suggestion ou proposition ; ce qui a été étudié ; suite donnée ; motif" });
    b.push({ k: "ligne", t: "[suggestion] ; [ce qui a été étudié] ; retenue / non retenue ; [motif]" });
    b.push({ k: "p", t: "Chaque réponse ci-dessus est motivée : une suggestion écartée sans motif " +
      "n'a pas reçu de réponse au sens de la loi." });
    b.push({ k: "sign", t: "\n" + signataire() + "\n" + profil.denomination });
    return b;
  }

  /* 6. La demande de validation ou d'homologation. */
  function docDemande(d) {
    var b = [];
    b.push({ k: "t1", t: d.accord ? "Demande de validation de l'accord collectif"
                                  : "Demande d'homologation du document unilatéral" });
    enTeteAdmin(b, "demande " + (d.accord
      ? "de validation de l'accord collectif déterminant le contenu du plan de sauvegarde de l'emploi"
      : "d'homologation du document fixant le contenu du plan de sauvegarde de l'emploi"), d.depot);
    b.push({ k: "p", t: d.accord
      ? "Nous sollicitons la validation de l'accord collectif signé le [date], qui détermine le " +
        "contenu du plan de sauvegarde de l'emploi ainsi que les modalités de consultation du comité " +
        "social et économique et de mise en oeuvre des licenciements."
      : "Nous sollicitons l'homologation du document que nous avons élaboré après la dernière " +
        "réunion du comité social et économique, tenue le " + dateFr(d.reunion2) + ", et qui fixe le " +
        "contenu du plan de sauvegarde de l'emploi." });
    b.push({ k: "p", t: d.accord
      ? "L'accord a été signé par [organisations syndicales signataires], ayant recueilli [   ] % " +
        "des suffrages exprimés en faveur d'organisations reconnues représentatives au premier tour " +
        "des dernières élections des titulaires au comité social et économique, quel que soit le " +
        "nombre de votants, soit au moins cinquante pour cent."
      : "Le document précise le contenu du plan et les éléments suivants : les modalités " +
        "d'information et de consultation du comité, la pondération et le périmètre d'application " +
        "des critères d'ordre, le calendrier des licenciements, le nombre de suppressions d'emploi " +
        "et les catégories professionnelles concernées, et les modalités de mise en oeuvre des " +
        "mesures de formation, d'adaptation et de reclassement." });
    b.push({ k: "h1", t: "Les pièces jointes" });
    b.push({ k: "puce", t: "- " + (d.accord ? "L'accord collectif signé." : "Le document unilatéral.") });
    b.push({ k: "puce", t: "- Le plan de sauvegarde de l'emploi." });
    b.push({ k: "puce", t: "- Les convocations, ordres du jour et procès-verbaux des réunions du " +
      "comité des " + dateFr(d.reunion1) + " et " + dateFr(d.reunion2) + "." });
    b.push({ k: "puce", t: "- La réponse motivée aux suggestions et propositions du comité." });
    b.push({ k: "puce", t: "- Le cas échéant, le rapport de l'expert désigné par le comité." });
    b.push({ k: "puce", t: "- La liste des postes de reclassement diffusée le " +

    b.push({ k: "p", t: "La décision nous sera notifiée dans un délai de " +
      (d.accord ? "quinze jours à compter de la réception de l'accord"

      ", soit au plus tard le " + dateFr(d.decision) +
      ". Le silence gardé pendant ce délai vaut décision d'acceptation ; nous transmettrions alors " +
      "au comité social et économique" + (d.accord ? " et aux organisations syndicales signataires" : "") +
      " une copie de la présente demande accompagnée de son accusé de réception." });
    b.push({ k: "p", t: "La décision, ou à défaut ces documents, ainsi que les voies et délais de " +
      "recours, seront portés à la connaissance des salariés par voie d'affichage sur leurs lieux de " +
      "travail." });
    signer(b);
    return b;

  /* 7. La lettre de licenciement, qui ne part qu'après la décision. */
  function docLettre(d) {
    var b = [], nomS = d.nom || "[nom et prénom du salarié]", civ = civiliteDe(nomS);
    var poste = d.poste || "[emploi occupé]", cloture = clotureCandidatures(d.publication);
    b.push({ k: "t1", t: "Notification d'un licenciement pour motif économique" });
    b.push({ k: "p", t: profil.denomination });
    if (profil.adresse) b.push({ k: "p", t: profil.adresse });
    b.push({ k: "vide", t: "" });
    b.push({ k: "p", t: nomS });
    b.push({ k: "p", t: d.adresse || "[adresse du salarié]" });
    b.push({ k: "vide", t: "" });
    b.push({ k: "p", t: ville() + ", le [date, après la décision de l'administration]" });
    b.push({ k: "p", t: "Lettre recommandée avec avis de réception" });
    b.push({ k: "p", t: "Objet : notification de votre licenciement pour motif économique" });
    b.push({ k: "vide", t: "" });
    b.push({ k: "p", t: civ + "," });
    b.push({ k: "p", t: "Par décision du [date], l'autorité administrative a " +

    b.push({ k: "p", t: "Nous vous notifions par la présente votre licenciement pour motif " +
      "économique, pour les motifs suivants." });
    b.push({ k: "h2", t: "La cause économique" });

    (d.faits ? d.faits.split(/\n+/) : ["[Éléments chiffrés et datés qui l'établissent. Ce sont eux, " +
      "et eux seuls, qui la démontreront : la lettre fixe les limites du litige.]"])

    b.push({ k: "h2", t: "L'incidence sur votre emploi" });
    b.push({ k: "p", t: "Votre poste de " + poste + " est supprimé. L'application des critères " +
      "d'ordre des licenciements au sein de votre catégorie professionnelle, dans le périmètre " +
      "défini par le plan, vous a désigné." });
    b.push({ k: "h2", t: "Le reclassement" });
    b.push({ k: "p", t: "La liste des postes disponibles vous a été diffusée le " +
      dateFr(d.publication) + ", avec les critères de départage entre candidatures multiples et le " +
      "délai de candidature, expirant le " + (cloture ? dateFr(cloture) : "[date]") + ". " +
      "[Indiquez la suite donnée à votre candidature, ou l'absence de candidature, qui vaut refus " +
      "des offres.]" });
    b.push({ k: "h2", t: "La priorité de réembauche" });
    b.push({ k: "p", t: "Vous bénéficiez d'une priorité de réembauche pendant un délai d'un an à " +
      "compter de la date de rupture de votre contrat, à condition d'en faire la demande au cours de " +
      "ce même délai. Si vous formez cette demande, nous vous informerons de tout emploi devenu " +
      "disponible et compatible avec votre qualification. Si vous acquérez une nouvelle " +
      "qualification, vous bénéficierez également de la priorité au titre de celle-ci, à condition " +
      "de nous en informer." });
    b.push({ k: "p", t: mille
      ? "Le congé de reclassement vous a été proposé ; vous disposez du délai indiqué dans cette " +
        "proposition pour nous faire connaître votre réponse."

        "joint à la présente." });
    b.push({ k: "p", t: "Nous vous prions d'agréer, " + civ + ", l'expression de nos salutations " +
      "distinguées." });
    b.push({ k: "sign", t: "\n" + signataire() + "\n" + profil.denomination });
    return b;
  }

  function rendreOui() {

    var r = POINTS.map(function (p) {

      if (trouve && p.aussi) trouve = p.aussi.every(function (x) { return x.test(t); });
      return { p: p, trouve: trouve };
    });
    var abs = r.filter(function (x) { return !x.trouve; }).length;
    var h = '<div class="chiffre">' +
      (abs === 0
        ? "Les " + POINTS.length + " points cherchés figurent dans le plan déposé. Les trouver ne " +
          "prouve pas qu'ils sont bien traités : c'est un repérage de mots, il conduit la lecture, " +
          "il ne la remplace pas."
        : abs + " point" + (abs > 1 ? "s" : "") + " ne se trouve" + (abs > 1 ? "nt" : "") +

        ech(x.p.fond.join(" · ")) + (x.p.arret ? " · " + ech(ARRET.ref) : "") + "</span></span></div>";
      if (!x.trouve) {
        h += '<div class="texte"><p>' + ech(x.p.pourquoi) + "</p>" +

  function u16(v, i) { return v.getUint16(i, true); }

    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(v, fin + 10), pos = u32(v, fin + 16), dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(v, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(v, pos + 10), taille = u32(v, pos + 20);
      var lnom = u16(v, pos + 28), lextra = u16(v, pos + 30), lcom = u16(v, pos + 32);
      var debut = u32(v, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      if (nom === nomVoulu) {
        var ln = u16(v, debut + 26), lx = u16(v, debut + 28);
        return { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      }
      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word.");
  }
  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier."));
    return new Response(new Blob([u8]).stream()
      .pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  function texteDeXml(xml) {
    return xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
  }
  function lireDocx(f) {
    return f.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) {
        return new TextDecoder("utf-8").decode(new Uint8Array(b));
      });
    }).then(texteDeXml);
  }
  $("#depot").addEventListener("input", rendreOui);
  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    $("#lecture").innerHTML = '<div class="chiffre">Lecture de ' + ech(f.name) + "...</div>";
    var suite = (window.LirePdf && window.LirePdf.estPdf(f)) ? window.LirePdf.texte(f)
      : (/\.docx$/i.test(f.name) ? lireDocx(f) : f.text());
    suite.then(function (t) {
      $("#depot").value = t;
      $("#lecture").innerHTML = '<div class="chiffre">' + ech(f.name) + " lu : " +
        t.length.toLocaleString("fr-FR") + " caractères.</div>";
      rendreOui();
    }).catch(function (e) {
      $("#lecture").innerHTML = '<div class="alerte">Ce fichier n\'a pas pu être lu : ' +
        ech(e.message) + " Ouvrez le document, copiez son texte et collez-le ci-dessous.</div>";
    });
  });

  /* ═══════════════════════════════════ la question, et ce qu'elle commande */
  function ecran(nom) {
    $("#ecran-question").hidden = nom !== "question";
    $("#ecran-doc").hidden = nom !== "doc";
    $("#ecran-oui").hidden = nom !== "oui";
    $("#marque").textContent = nom === "question" ? "Plan de sauvegarde"
      : (nom === "doc" ? courant.nom : "Contrôle du plan");
    window.scrollTo(0, 0);
  }
  $("#rep-non").addEventListener("click", function () { ecran("doc"); rendre(); });
  $("#rep-oui").addEventListener("click", function () { ecran("oui"); });
  /* Le bouton Retour du bandeau, posé par droits.js : depuis le document ou le
     contrôle, il revient à la question ; depuis la question, il quitte la page. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || !$("#ecran-question").hidden) return;
    ev.preventDefault(); ev.stopPropagation();
    ecran("question");
  }, true);

  /* Le seuil, avant la question. Le plan n'est dû que dans les entreprises
     d'au moins cinquante salariés (L. 1233-61) : sous cet effectif, la
     question ne se pose pas, la page dit « pas dû avant 50 » et renvoie à
     l'écran du licenciement économique. */
  (function fiche() {
    var t = ech(profil.denomination) + " · " + effectif + " salarié" + (effectif > 1 ? "s" : "");
    if (effectif < 50) {
      $("#q-titre").textContent = "Plan de sauvegarde de l'emploi";
      $("#q-deux").hidden = true;
      $("#q-renvoi").hidden = false;
      t += " · pas dû avant 50 salariés (" + ref(["L1233-61"]) + ")";
    } else {
      t += " · dû à partir de 50 salariés et de dix licenciements sur trente jours (" +
        ref(["L1233-61"]) + ")";
    }
    $("#fiche-rappel").innerHTML = t;
  })();

  try {
    fetch("manifest-audit-pse.json", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (m) { if (m && m.version) $("#etat-version").textContent = m.version; })
      .catch(function () {});
  } catch (e) {}

  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("#maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update().catch(function () {}); });
    });
  }
  $("#btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>

     tout le reste, il masque la page tant que l'utilisateur n'est pas identifié.

<!-- LA MÊME LISTE QUE GERER.HTML, ET LE MÊME ÉCRAN DE DOCUMENT.

     Écran 4 : un groupe en capitales, puis un document par ligne. Un mot, un
     document. Écran 5 : le document seul à l'écran, déjà rempli avec la fiche
     d'entreprise, ses champs en tête qui se glissent dans le texte à chaque
     frappe, Télécharger en Word, Imprimer, « Voir le texte de loi » replié.
     Le bouton Retour du bandeau, posé par droits.js, revient à la liste.

     Les vingt-trois modèles : convocation et ordre du jour du comité, trame
     de procès-verbal, accord de méthode et procès-verbal de désaccord de la
     négociation obligatoire, note d'information, réponse à une réclamation,
     procédure de signalement harcèlement, canevas d'enquête interne ; côté
     discipline, convocation à entretien préalable à sanction, notification
     d'avertissement, notification de mise à pied disciplinaire, échelle des
     sanctions du règlement intérieur ; les cinq trames appelées par les
     parcours guidés (mise en demeure, courrier d'alerte, compte rendu de
     commission, délibération de désignation, résolution de recours à
     l'expert) ; et les six trames de l'installation du comité (convocation et
     ordre du jour d'installation, procès-verbal d'installation, règlement
     intérieur du comité, demande de la documentation économique et
     financière de L. 2312-57, procès-verbal de remise-reprise, qui porte un
     avertissement parce qu'aucun article lu n'organise cette remise).

     La page accepte « ?modele=<clé>&pre=<JSON encodé> » : elle ouvre le modèle
     demandé et y verse les valeurs transmises, dans les seuls champs que le
     modèle déclare et seulement là où le brouillon est vide.

     Tout se passe dans le navigateur. Rien n'est envoyé, rien n'est conservé
     ailleurs que sur ce poste (localStorage).

     Chaque mention juridique s'appuie sur un article lu à la source et
     identifié par sa version (LEGIARTI), repris des textes vérifiés du
     dépôt (moteur/cse/textes_cse.json, moteur/nao/textes-nao.json,
     moteur/sst/textes-sst.json, moteur/discipline/textes-discipline.json) ou de
     docs/textes-documents.json pour les compléments vérifiés au relais. -->

<style>
  body{font-size:18px;line-height:1.45}
  main.wrap{max-width:560px;padding:0 16px var(--e7)}
  main.wrap.large{max-width:760px}
  .rappel-fiche{margin:14px 0 0;font-size:var(--t2);color:var(--texte-2)}
  button.doc-ligne{width:100%;border:0;border-bottom:1px solid var(--filet);border-radius:0;background:none;
    color:var(--encre);font:400 18px/1.3 system-ui;text-align:left;justify-content:space-between;min-height:52px;padding:14px 0}
  button.doc-ligne:hover{background:var(--creux);color:var(--accent);border-color:var(--filet)}

  /* écran 5 : les champs, la feuille, les boutons */
  .champs{margin:14px 0 0}
  .champs label.ch.plein>.nom{color:var(--vert)}
  .champs .cases{margin:0}
  .barre{margin:14px 0 0}
  details.loi{margin:var(--e2) 0 var(--e5)}
  details.loi .c{font-size:var(--t2);line-height:1.5;color:var(--texte-2);padding:0 0 var(--e3)}
  details.loi .ident{font-size:11px}
  #avis{margin:14px 0 0}

  /* le document : une feuille */
  .feuille{margin:14px 0 0;font:15.5px/1.6 Georgia,"Times New Roman",serif;color:var(--encre)}
  .feuille .entete{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    margin:0 0 22px;font-size:14px;color:var(--texte-2)}
  .feuille .entete b{font-size:15.5px;color:var(--encre)}
  .feuille h2.titre-doc{font:700 18px/1.3 Georgia,serif;color:var(--encre);text-align:center;
    margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .feuille .sous-titre{text-align:center;font-size:14px;color:var(--texte-2);margin:0 0 22px}
  .feuille h3{font:700 15.5px/1.4 Georgia,serif;color:var(--encre);margin:20px 0 6px}
  .feuille p{margin:0 0 10px}
  .feuille ol,.feuille ul{margin:0 0 10px;padding-left:22px}
  .feuille li{margin:0 0 5px}
  .feuille table{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px}
  .feuille th,.feuille td{border:1px solid var(--filet-2);padding:6px 9px;text-align:left;vertical-align:top}
  .feuille th{background:var(--creux);font-weight:700}
  .feuille .tab{overflow-x:auto}
  .feuille .signatures{display:flex;gap:24px;flex-wrap:wrap;margin-top:30px}
  .feuille .signatures>div{flex:1 1 200px;border-top:1px solid var(--filet-2);padding-top:8px;font-size:14px}
  .feuille .champ-vide{color:var(--texte-3);font-style:italic}
  .feuille .pied-textes{margin-top:30px;padding-top:10px;border-top:1px solid var(--filet);
    font:12px/1.55 system-ui;color:var(--texte-3)}
  .feuille .pied-textes .ident{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
  .feuille .renvoi-jx{display:none}

  [hidden]{display:none !important}
  @media print{
    body{background:#fff}
    header.site,.rappel-fiche,.champs,.barre,details,#avis,#e-liste{display:none !important}
    .wrap{max-width:none;padding:0}
    .feuille{border:none;border-radius:0;max-width:none;padding:0;font-size:12pt;margin:0}
    .feuille .pied-textes{font-size:8pt}
  }
</style>
</head>

</main>

    "L2312-64": { id: "LEGIARTI000035611001", quoi: "le comité ou la commission économique peut se faire assister une fois par exercice de l'expert-comptable, convoquer le commissaire aux comptes et s'adjoindre deux salariés avec voix consultative" },
    "L2312-65": { id: "LEGIARTI000035611003", quoi: "le rapport conclut en émettant un avis sur l'opportunité de saisir l'organe d'administration ou de surveillance ; le comité en décide à la majorité des membres présents" },
    /* Installation du comité, règlement intérieur du comité, budgets, comptes
       et transition entre comités, articles ajoutés pour les six modèles du
       parcours « Installer le CSE : la première réunion ». Provenance :
       moteur/parcours/textes-installation.json, capture du 22 août 2026, deux
       lectures espacées concordantes chacune, filtre par NOM du code
       (« Code du travail ») et critère de contenu contre les homonymes. */
    "L2315-23": { id: "LEGIARTI000035624835", quoi: "le comité est doté de la personnalité civile et gère son patrimoine ; il est présidé par l'employeur ou son représentant, assisté éventuellement de trois collaborateurs qui ont voix consultative ; le comité désigne, parmi ses membres titulaires, un secrétaire et un trésorier" },
    "L2315-24": { id: "LEGIARTI000036761946", quoi: "le comité détermine, dans un règlement intérieur, les modalités de son fonctionnement et celles de ses rapports avec les salariés ; sauf accord de l'employeur, ce règlement ne peut comporter de clauses lui imposant des obligations ne résultant pas de dispositions légales, cet accord constitue un engagement unilatéral de l'employeur, dénonçable à l'issue d'un délai raisonnable et après information des membres" },
    "L2315-3":  { id: "LEGIARTI000035651256", quoi: "secret professionnel pour les questions relatives aux procédés de fabrication ; obligation de discrétion à l'égard des informations revêtant un caractère confidentiel et présentées comme telles par l'employeur" },
    "L2315-4":  { id: "LEGIARTI000035651253", quoi: "le recours à la visioconférence peut être autorisé par accord entre l'employeur et les membres élus ; en l'absence d'accord, il est limité à trois réunions par année civile" },
    "L2315-7":  { id: "LEGIARTI000035651243", quoi: "l'employeur laisse le temps nécessaire à l'exercice de leurs fonctions aux titulaires et, à partir de cinq cent un salariés, aux représentants syndicaux ; le nombre d'heures fixé par décret ne peut être inférieur à dix heures par mois en dessous de cinquante salariés et à seize heures dans les autres entreprises" },
    "R2314-1":  { id: "LEGIARTI000036481896", quoi: "à défaut de stipulations d'accord, le nombre de membres de la délégation du personnel et le nombre mensuel d'heures de délégation sont fixés par le tableau de cet article selon l'effectif ; ce nombre d'heures peut être augmenté en cas de circonstances exceptionnelles" },
    "L2315-15": { id: "LEGIARTI000035621173", quoi: "les membres de la délégation du personnel peuvent faire afficher les renseignements qu'ils ont pour rôle de porter à la connaissance du personnel, sur les emplacements destinés aux communications syndicales et aux portes d'entrée des lieux de travail" },
    "L2315-25": { id: "LEGIARTI000035624843", quoi: "l'employeur met à la disposition du comité un local aménagé et le matériel nécessaire à l'exercice de ses fonctions" },
    "L2315-18": { id: "LEGIARTI000043894249", quoi: "formation santé, sécurité et conditions de travail : cinq jours au moins lors du premier mandat ; en cas de renouvellement, trois jours par élu et cinq jours pour les membres de la commission santé-sécurité à partir de trois cents salariés ; financement à la charge de l'employeur ; le référent harcèlement en bénéficie" },
    "L2315-63": { id: "LEGIARTI000043975219", quoi: "à partir de cinquante salariés, les titulaires élus pour la première fois bénéficient d'un stage de formation économique d'une durée maximale de cinq jours, financé par le comité et imputé sur le congé de formation économique, sociale, environnementale et syndicale" },
    "L2312-57": { id: "LEGIARTI000035610702", quoi: "à défaut d'accord, un mois après chaque élection du comité, l'employeur lui communique une documentation économique et financière précisant la forme juridique de l'entreprise et son organisation, les perspectives économiques, le cas échéant la position de l'entreprise au sein du groupe, et, compte tenu des informations dont il dispose, la répartition du capital entre les actionnaires détenant plus de 10 % du capital et la position de l'entreprise dans la branche" },
    "L2312-15": { id: "LEGIARTI000038791194", quoi: "le comité émet des avis et des vœux ; il dispose d'un délai d'examen suffisant et d'informations précises et écrites transmises ou mises à disposition par l'employeur, ainsi que de sa réponse motivée à ses observations" },
    "L2312-18": { id: "LEGIARTI000052437125", quoi: "une base de données économiques, sociales et environnementales rassemble l'ensemble des informations nécessaires aux consultations et informations récurrentes que l'employeur met à disposition du comité" },
    "L2312-36": { id: "LEGIARTI000048533625", quoi: "en l'absence d'accord, la base de données rassemble les informations énumérées par cet article et est accessible en permanence aux membres de la délégation du personnel du comité, à ceux du comité central et aux délégués syndicaux" },
    "L2315-44": { id: "LEGIARTI000036262426", quoi: "à défaut d'accord, le règlement intérieur du comité définit les modalités de mise en place des commissions ; à défaut de l'accord de L. 2315-43, l'employeur peut fixer leur nombre et leur périmètre" },
    "L2315-61": { id: "LEGIARTI000036761916", quoi: "subvention de fonctionnement annuelle de 0,20 % de la masse salariale brute de cinquante à moins de deux mille salariés, de 0,22 % à partir de deux mille ; elle s'ajoute à la contribution aux activités sociales et culturelles ; le comité peut, par délibération, en affecter une partie à la formation des délégués syndicaux et des représentants de proximité" },
    "L2312-81": { id: "LEGIARTI000036761976", quoi: "la contribution versée chaque année par l'employeur pour financer les institutions sociales du comité est fixée par accord d'entreprise ; à défaut, son rapport à la masse salariale brute ne peut être inférieur au même rapport existant pour l'année précédente" },
    "L2312-83": { id: "LEGIARTI000036761969", quoi: "la masse salariale brute est constituée de l'ensemble des gains et rémunérations soumis à cotisations de sécurité sociale, à l'exception des indemnités versées à l'occasion de la rupture du contrat à durée indéterminée" },
    "L2312-84": { id: "LEGIARTI000035611325", quoi: "en cas de reliquat budgétaire, les élus peuvent décider par délibération de transférer tout ou partie de l'excédent annuel du budget des activités sociales et culturelles au budget de fonctionnement ou à des associations" },
    "R2312-51": { id: "LEGIARTI000036413338", quoi: "ce transfert est possible dans la limite de 10 % de l'excédent ; la somme et ses modalités d'utilisation sont inscrites dans les comptes annuels et dans le rapport de gestion" },
    "L2315-64": { id: "LEGIARTI000035627352", quoi: "le comité est soumis aux obligations comptables de l'article L. 123-12 du code de commerce ; ses comptes annuels sont établis selon un règlement de l'Autorité des normes comptables ; en dessous de deux des trois seuils fixés par décret, il peut adopter une présentation simplifiée" },
    "L2315-65": { id: "LEGIARTI000035627354", quoi: "le comité dont les ressources annuelles n'excèdent pas un seuil fixé par décret peut tenir un livre retraçant chronologiquement les dépenses et les recettes et établir une fois par an un état de synthèse simplifié sur son patrimoine et ses engagements en cours" },
    "L2315-68": { id: "LEGIARTI000035627360", quoi: "les comptes annuels sont arrêtés, selon des modalités prévues par le règlement intérieur du comité, par des membres élus désignés par lui et en son sein ; ils sont approuvés par les membres élus réunis en séance plénière, consacrée à ce seul sujet et faisant l'objet d'un procès-verbal spécifique" },
    "L2315-69": { id: "LEGIARTI000036262535", quoi: "le comité établit, selon des modalités prévues par son règlement intérieur, un rapport présentant des informations qualitatives sur ses activités et sur sa gestion financière, présenté aux élus lors de la séance plénière d'approbation des comptes" },
    "L2315-70": { id: "LEGIARTI000035627364", quoi: "le trésorier ou, le cas échéant, le commissaire aux comptes présente un rapport sur les conventions passées, directement ou indirectement, entre le comité et l'un de ses membres" },
    "L2315-71": { id: "LEGIARTI000036262527", quoi: "au plus tard trois jours avant la séance plénière d'approbation, les membres chargés d'arrêter les comptes les communiquent aux membres du comité, accompagnés du rapport de gestion" },
    "L2315-72": { id: "LEGIARTI000035627368", quoi: "le comité porte à la connaissance des salariés de l'entreprise, par tout moyen, ses comptes annuels accompagnés du rapport de gestion" },
    "L2315-75": { id: "LEGIARTI000035627374", quoi: "les comptes annuels et les pièces justificatives qui s'y rapportent sont conservés pendant dix ans à compter de la clôture de l'exercice auquel ils se rapportent" },
    "R2312-52": { id: "LEGIARTI000036413340", quoi: "en cas de cessation définitive de l'activité de l'entreprise, le comité décide de l'affectation des biens dont il dispose ; la dévolution du solde se fait au crédit d'un autre comité ou d'institutions sociales d'intérêt général, les biens ne peuvent être répartis entre les salariés ou entre les membres du comité" }
  };
  function refArt(n) { return n.replace(/^([LRD])(\d)/, "$1. $2"); }

  /* ------------------------------------------------------------------ */
  /* Outillage : échappement, dates, champs.                             */
  /* ------------------------------------------------------------------ */
  function e(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function dateFr(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }
  function vide(txt) { return '<span class="champ-vide">[' + e(txt) + "]</span>"; }
  function ch(valeur, blanc) { return valeur ? e(valeur) : vide(blanc); }
  function chDate(iso, blanc) { return iso ? e(dateFr(iso)) : vide(blanc); }
  function lignes(txt) {
    return String(txt || "").split(/\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  }
  function joursEntre(a, b) {
    if (!a || !b) return null;
    return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
  }

  /* Les jours ouvrables, tous les jours sauf le dimanche et les jours fériés.
     Cette page ne tient pas le calendrier des jours fériés : elle compte les
     jours non dominicaux et le dit là où le résultat est serré. */
  function joursOuvrablesEntre(a, b) {
    if (!a || !b) return null;
    var t = new Date(a + "T12:00:00Z"), fin = new Date(b + "T12:00:00Z"), n = 0;
    if (fin < t) return null;
    while (t < fin) { t.setUTCDate(t.getUTCDate() + 1); if (t.getUTCDay() !== 0) n++; }
    return n;
  }
  /* Le même quantième, n mois plus tard : la règle de comptage de R. 1332-3,
     qui vaut aussi pour les deux mois de L. 1332-4. */
  function moisApres(iso, n) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ""))) return null;
    var m = iso.split("-").map(Number), an = m[0] + Math.floor((m[1] - 1 + n) / 12),
        mo = ((m[1] - 1 + n) % 12) + 1;
    var dernier = new Date(Date.UTC(an, mo, 0)).getUTCDate();
    var j = Math.min(m[2], dernier);
    return an + "-" + String(mo).padStart(2, "0") + "-" + String(j).padStart(2, "0");
  }
  /* L'exemple fictif : une valeur plausible, marquée comme telle, là où le
     formulaire est vide. Un modèle sans exemple n'est qu'une coquille ; un
     exemple non marqué serait un piège. */
  function exemple(txt) { return '<span class="champ-vide">' + e(txt) + " [exemple]</span>"; }
  function chEx(valeur, exempleTxt) { return valeur ? e(valeur) : exemple(exempleTxt); }
  function chExDate(iso, exempleIso) {
    return iso ? e(dateFr(iso)) : exemple(dateFr(exempleIso) || exempleIso);
  }
  /* Les champs à personnaliser, listés à la fin du document. */
  function aPersonnaliser(liste) {
    return '<div class="pied-textes"><b>À personnaliser avant usage :</b> ' +
      liste.map(function (x) { return e(x); }).join(" · ") + ".</div>";
  }

  /* Pied de document : les articles cités, avec leur version. */
  function piedTextes(numeros) {
    var morceaux = numeros.map(function (n) {
      return "art. " + refArt(n) + ' <span class="ident">' + TEXTES[n].id + "</span>";
    });
    return '<div class="pied-textes">Textes cités, lus à la source, code du travail, ' +
      morceaux.join(" · ") +
      ". Document préparé avec l'application Jurisprudence ; il reste à relire et à adapter avant usage.</div>";
  }

  function enteteFeuille(entreprise, lieuDate) {
    return '<div class="entete"><div><b>' + ch(entreprise, "dénomination de l'entreprise") +
      "</b></div><div>" + (lieuDate || "") + "</div></div>";
  }

  /* ------------------------------------------------------------------ */
  /* Profil d'entreprise : si une autre page l'a rempli, on préremplit.  */
  /* ------------------------------------------------------------------ */
  /* La fiche client est tenue par docs/profil.js : une seule définition pour
     toute l'application. Si elle n'est pas chargée, la lecture directe de la
     clé reste en place, cette page n'a jamais dépendu d'un autre script. */
  function lireProfil() {
    try {
      var p = window.Profil ? window.Profil.lire()
        : JSON.parse(localStorage.getItem("profil-entreprise") || "null");
      if (!p || typeof p !== "object") return {};
      return {
        entreprise: p.denomination || p.denominationSociale || p.entreprise || p.nom || "",
        effectif: p.effectif || "",
        adresse: p.adresse || p.siege || "",
        responsable: p.responsable || "",
        courriel: p.courriel || "",
        telephone: p.telephone || "",
        siret: p.siret || "",
        conventionCollective: p.conventionCollective || p.convention || p.idcc || ""
      };
    } catch (_) { return {}; }
  }

  /* ------------------------------------------------------------------ */
  /* Les six modèles : champs, puis composition du document.             */
  /* Types de champ : text, date, time, number, select, textarea, cases. */
  /* ------------------------------------------------------------------ */
  var MODELES = [
  {
    cle: "convocation",
    nom: "Convocation + ordre du jour CSE",
    resume: "Réunion ordinaire : convocation du président et ordre du jour établi conjointement avec le secrétaire, communiqué trois jours au moins avant.",
    articles: ["L2315-29", "L2315-30", "L2315-28", "L2315-27", "L2312-22"],
    sections: [

        { c: "entreprise", nom: "Dénomination de l'entreprise", t: "text", profil: "entreprise" },

        { c: "secretaire", nom: "Secrétaire du CSE (nom)", t: "text" },

        { c: "heure", nom: "Heure", t: "time" },
        { c: "lieu", nom: "Lieu (et lien de visioconférence, le cas échéant)", t: "text" },

          aide: "L'ordre du jour est communiqué trois jours au moins avant la réunion (art. L. 2315-30)." }
      ]},
      { titre: "L'ordre du jour", champs: [
        { c: "consultations", nom: "Consultations récurrentes à inscrire (inscrites de plein droit, art. L. 2315-29)", t: "cases", pleine: true, options: [
          "Consultation sur les orientations stratégiques de l'entreprise",
          "Consultation sur la situation économique et financière de l'entreprise",
          "Consultation sur la politique sociale, les conditions de travail et l'emploi"
        ], aide: "À défaut d'accord d'adaptation, ces trois consultations ont lieu chaque année (art. L. 2312-22)." },
        { c: "pointSSCT", nom: "Points santé, sécurité et conditions de travail", t: "cases", pleine: true, options: [

        { c: "points", nom: "Autres points (un par ligne)", t: "textarea", pleine: true,

      ]}
    ],
    composer: function (v) {
      var pts = [];
      (v.consultations || []).forEach(function (c) { pts.push(c); });
      if ((v.pointSSCT || []).length)
        pts.push("Santé, sécurité et conditions de travail (réunion consacrée, en tout ou partie, à ces attributions, art. L. 2315-27 du code du travail)");
      lignes(v.points).forEach(function (l) { pts.push(l); });
      var liste = pts.length
        ? "<ol>" + pts.map(function (p) { return "<li>" + e(p) + "</li>"; }).join("") + "</ol>"
        : "<p>" + vide("points à l'ordre du jour") + "</p>";

      var eff = parseInt(v.effectif, 10);
      var periodicite = isNaN(eff) ? "" :
        (eff >= 300
          ? "Il est rappelé qu'à défaut d'accord, le comité se réunit au moins une fois par mois (art. L. 2315-28 du code du travail)."

      return enteteFeuille(v.entreprise, chDate(v.dateEnvoi, "date d'envoi")) +
        '<h2 class="titre-doc">Convocation à la réunion ordinaire<br>du comité social et économique</h2>' +

        "<p>Le présent ordre du jour est communiqué aux membres du comité, à l'agent de contrôle de " +

        "Les consultations rendues obligatoires par une disposition législative ou réglementaire ou " +

        (periodicite ? "<p>" + periodicite + "</p>" : "") +

  {

        { c: "secretaire", nom: "Secrétaire (rédacteur du procès-verbal)", t: "text" },

          aide: "À défaut d'accord, le procès-verbal contient au moins le résumé des délibérations et la décision motivée de l'employeur sur les propositions de la précédente réunion (art. D. 2315-26)." },
        { c: "reponsesEmployeur", nom: "Décision motivée de l'employeur sur les propositions de la précédente réunion", t: "textarea", pleine: true }
      ]}
    ],
    composer: function (v) {
      var pts = lignes(v.points);
      var corps = pts.length
        ? pts.map(function (p, i) {
            var m = p.split(/\s+-\s+|\s+--\s+/);
            return "<h3>" + (i + 1) + ". " + e(m[0]) + "</h3><p>" +
              (m.length > 1 ? e(m.slice(1).join(", ")) : vide("résumé des échanges, délibération, résultat du vote")) + "</p>";
          }).join("")
        : "<p>" + vide("points examinés et délibérations") + "</p>";
      return enteteFeuille(v.entreprise, chDate(v.dateReunion, "date de la réunion")) +
        '<h2 class="titre-doc">Procès-verbal de la réunion<br>du comité social et économique</h2>' +

  ];
  function modele(cle) { return MODELES.filter(function (m) { return m.cle === cle; })[0] || null; }

  function rendreListe() {
    var h = "", vus = {};
    GROUPES.forEach(function (g) {
      h += '<p class="groupe">' + e(g[0]) + "</p>";
      g[1].forEach(function (cle) {
        var m = modele(cle); if (!m) return;
        vus[cle] = true;
        h += '<button type="button" class="doc-ligne" data-doc="' + e(cle) + '">' + e(m.nom) + "</button>";
      });
    });
    /* Un modèle qui n'est dans aucun groupe s'affiche quand même : rien ne se perd. */
    var reste = MODELES.filter(function (m) { return !vus[m.cle]; });
    if (reste.length) {
      h += '<p class="groupe">Autres</p>';
      reste.forEach(function (m) {
        h += '<button type="button" class="doc-ligne" data-doc="' + e(m.cle) + '">' + e(m.nom) + "</button>";
      });
    }
    $("liste").innerHTML = h;
  }

  /* ------------------------------------------------------------------ */
  var CLE_BROUILLON = "documents-brouillon";

  function lireBrouillons() {
    try { return JSON.parse(localStorage.getItem(CLE_BROUILLON) || "{}") || {}; }
    catch (_) { return {}; }
  }
  function ecrireBrouillon(cle, valeurs) {
    var b = lireBrouillons();
    b[cle] = valeurs;
    try { localStorage.setItem(CLE_BROUILLON, JSON.stringify(b)); } catch (_) {}
  }

  function champHtml(champ) {
    var pleine = champ.pleine || champ.t === "textarea" || champ.t === "cases";
    if (champ.t === "cases") {
      return '<div class="ch' + (pleine ? " pleine" : "") + '"><span class="nom">' + e(champ.nom) + "</span>" +
        '<div class="cases">' + champ.options.map(function (o, i) {
          return '<label class="case"><input type="checkbox" name="' + champ.c + '" value="' + e(o) + '" id="' + champ.c + "-" + i + '"> <span>' + e(o) + "</span></label>";
        }).join("") + "</div></div>";
    }
    var interieur;
    if (champ.t === "textarea")
      interieur = '<textarea id="ch-' + champ.c + '" name="' + champ.c + '"></textarea>';
    else if (champ.t === "select")
      interieur = '<select id="ch-' + champ.c + '" name="' + champ.c + '"><option value=""></option>' +
        champ.options.map(function (o) { return '<option value="' + e(o) + '">' + e(o) + "</option>"; }).join("") +
        "</select>";
    else
      interieur = '<input id="ch-' + champ.c + '" name="' + champ.c + '" type="' + champ.t + '"' +
        (champ.t === "number" ? ' min="0" step="1"' : "") + ">";
    return '<label class="ch' + (pleine ? " pleine" : "") + '"><span class="nom">' + e(champ.nom) + "</span>" + interieur + "</label>";
  }

  function champsDe(m) {
    var out = [];
    m.sections.forEach(function (s) { s.champs.forEach(function (c) { out.push(c); }); });
    return out;
  }

  function construireFormulaire(m) {
    $("formulaire").innerHTML = champsDe(m).map(champHtml).join("");
  }

  function lireValeurs(m) {
    var v = {};
    champsDe(m).forEach(function (c) {
      if (c.t === "cases") {
        v[c.c] = [].slice.call(document.querySelectorAll('input[name="' + c.c + '"]:checked'))
          .map(function (x) { return x.value; });
      } else {
        var el = $("ch-" + c.c);
        v[c.c] = el ? el.value.trim() : "";
      }
    });
    return v;
  }

  function remplir(m, valeurs) {
    champsDe(m).forEach(function (c) {
      if (c.t === "cases") {
        var cochees = valeurs[c.c] || [];
        [].slice.call(document.querySelectorAll('input[name="' + c.c + '"]')).forEach(function (x) {
          x.checked = cochees.indexOf(x.value) !== -1;
        });
      } else {
        var el = $("ch-" + c.c);
        if (el) el.value = valeurs[c.c] || "";
      }
    });
  }

  /* Le repli « Voir le texte de loi » : les articles du modèle, avec leur

    }).join("");
  }

    ecrireBrouillon(actif.cle, v);
    var alerte = actif.verifier ? actif.verifier(v) : "";
    $("avis").innerHTML = alerte ? '<div class="avis att">' + e(alerte) + "</div>" : "";
    $("feuille").innerHTML = actif.composer(v);
    champsDe(actif).forEach(function (c) {
      var el = $("ch-" + c.c);
      if (el && el.closest) el.closest("label").classList.toggle("plein", String(el.value).trim() !== "");
    });
  }

  function ouvrir(m) {
    actif = m;
    construireFormulaire(m);
    var brouillon = lireBrouillons()[m.cle];
    if (brouillon) remplir(m, brouillon);
    else {
      var profil = lireProfil(), v = {};
      champsDe(m).forEach(function (c) { if (c.profil && profil[c.profil]) v[c.c] = profil[c.profil]; });
      if (Object.keys(v).length) remplir(m, v);
    }
    $("loi").innerHTML = loiHtml(m);
    rendreDoc();
    $("e-liste").hidden = true;
    $("e-doc").hidden = false;
    $("main").classList.add("large");
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + m.cle); } catch (_) {}
  }
  function revenir() {
    actif = null;
    $("e-doc").hidden = true;
    $("e-liste").hidden = false;
    $("main").classList.remove("large");
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", location.pathname); } catch (_) {}
  }

  $("liste").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button[data-doc]") : null;
    var m = b && modele(b.getAttribute("data-doc"));
    if (m) ouvrir(m);
  });
  $("formulaire").addEventListener("input", rendreDoc);
  $("formulaire").addEventListener("change", rendreDoc);
  /* Le bouton Retour du bandeau, posé par droits.js : depuis le document, il
     revient à la liste ; depuis la liste, il quitte la page. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || !actif) return;
    ev.preventDefault(); ev.stopPropagation();
    revenir();
  }, true);

  /* ------------------------------------------------------------------ */
  /* Word et impression. La feuille est lue telle qu'elle est à l'écran. */
  /* ------------------------------------------------------------------ */
  function texteDe(el) { return String(el.innerText || el.textContent || "").replace(/\s+/g, " ").trim(); }
  function itemsDeFeuille() {
    var items = [];
    Array.prototype.forEach.call($("feuille").children, function (el) {
      var tag = el.tagName;
      if (el.classList.contains("renvoi-jx")) return;
      if (tag === "H2") items.push({ k: "t1", t: texteDe(el) });
      else if (tag === "H3") items.push({ k: "h2", t: texteDe(el) });
      else if (el.classList.contains("sous-titre")) items.push({ k: "sur", t: texteDe(el) });
      else if (el.classList.contains("pied-textes")) items.push({ k: "note", t: texteDe(el) });
      else if (el.classList.contains("entete") || el.classList.contains("signatures"))
        Array.prototype.forEach.call(el.children, function (c) { items.push({ k: "p", t: texteDe(c) }); });
      else if (tag === "UL" || tag === "OL")
        Array.prototype.forEach.call(el.querySelectorAll("li"), function (li) { items.push({ k: "puce", t: texteDe(li) }); });
      else if (tag === "TABLE" || el.querySelector("table")) {
        var t = tag === "TABLE" ? el : el.querySelector("table");
        var head = Array.prototype.map.call(t.querySelectorAll("thead th, tr:first-child th"), texteDe);
        var rows = Array.prototype.filter.call(t.querySelectorAll("tr"), function (tr) { return tr.querySelector("td"); })
          .map(function (tr) { return Array.prototype.map.call(tr.querySelectorAll("td"), texteDe); });
        if (!head.length && rows.length) head = rows.shift();
        items.push({ k: "table", head: head, rows: rows });
      }
      else { var t2 = texteDe(el); if (t2) items.push({ k: "p", t: t2 }); }
    });
    return items;
  }
  function slug(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "document";
  }
  $("word").addEventListener("click", function () {
    if (!actif) return;
    var items = itemsDeFeuille();
    var titre = items.length && items[0].k === "t1" ? items.shift().t : actif.nom;
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, titre),
      slug(actif.nom) + "-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  $("imprimer").addEventListener("click", function () { window.print(); });

  /* ------------------------------------------------------------------ */
  /* Ouverture d'un modèle pré-rempli depuis une autre page.             */
  /*                                                                     */
  /* « documents.html?modele=<clé>&pre=<JSON encodé> » ouvre le modèle   */
  /* demandé et y verse les valeurs transmises. Ce sont les parcours     */
  /* guidés qui s'en servent. Les valeurs transmises ne sont versées que */
  /* dans les champs que le modèle déclare, et seulement là où le        */
  /* brouillon est vide : ce que l'utilisateur a saisi l'emporte.        */
  /* ------------------------------------------------------------------ */
  function appliquerPre(m, pre) {
    var v = lireValeurs(m), touche = false;
    champsDe(m).forEach(function (c) {
      if (!(c.c in pre)) return;
      var val = pre[c.c];
      if (c.t === "cases") {
        if (!Array.isArray(val) || !val.length) return;
        if ((v[c.c] || []).length) return;
        val = val.filter(function (x) { return c.options.indexOf(x) >= 0; });
        if (!val.length) return;
      } else {
        if (val === null || val === undefined || String(val) === "") return;
        if (v[c.c]) return;
        val = String(val);
      }
      v[c.c] = val;
      touche = true;
    });
    if (!touche) return false;
    remplir(m, v);
    rendreDoc();
    return true;
  }

  (function rappel() {
    var p = lireProfil(), n = Number(p.effectif), t = p.entreprise || "";
    if (isFinite(n) && String(p.effectif || "").trim() !== "") t += (t ? " · " : "") + n + " salarié" + (n > 1 ? "s" : "");
    $("rappel-fiche").textContent = t;
  })();
  rendreListe();

  var params = new URLSearchParams(location.search);
  var demande = params.get("modele") || (location.hash || "").replace(/^#/, "");
  var vise = modele(demande);
  if (vise) {
    ouvrir(vise);
    var pre = null;
    try { pre = JSON.parse(params.get("pre") || "null"); } catch (_) { pre = null; }
    if (pre && typeof pre === "object" && !Array.isArray(pre)) appliquerPre(vise, pre);
  }
  window.addEventListener("hashchange", function () {
    var m = modele((location.hash || "").replace(/^#/, ""));
    if (m) { if (m !== actif) ouvrir(m); }
    else if (actif) revenir();
  });

  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
})();
</script>
<script src="assistant.js" defer></script>
</body>

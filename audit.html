<!--
  CE QUE FAIT CETTE PAGE.

  Une question, et une seule : « Avez-vous engagé la procédure de licenciement
  pour motif économique ? »

  « Non » ouvre les documents, déjà écrits à partir de la fiche d'entreprise,
  un onglet par document : la convocation à l'entretien préalable, la
  proposition du contrat de sécurisation professionnelle (ou du congé de
  reclassement à partir de mille salariés), la liste des postes de
  reclassement, les critères d'ordre, la lettre de licenciement. Sur chaque
  onglet : deux ou trois champs en tête qui se glissent dans le texte, le
  document seul, Télécharger en Word, Imprimer, « Voir le texte de loi »
  replié, et Retour. C'est l'écran 5 de la maquette validée le 8 septembre
  2026. Rien d'autre : ni chapeau, ni étape, ni exposé du droit avant d'agir.

  « Oui » prend le document existant, le confronte aux mentions que le code
  impose, et rend pour chaque manque le texte à insérer, prêt à coller.

  LE POINT QUI FAIT PERDRE LES DOSSIERS. La liste des offres de reclassement
  diffusée doit porter les critères de départage entre salariés en cas de
  candidatures multiples et le délai de candidature (D. 1233-2-1, III). La
  chambre sociale l'a jugé le 8 janvier 2025 (pourvoi n° 22-24.724, publié).
  Les deux mentions sont écrites d'office dans la liste que produit cette
  page, et leur absence est le premier manque que la branche « oui » cherche.

  LES TEXTES. Les articles cités ont été lus au relais Légifrance le
  7 septembre 2026, deux fois à quelques minutes d'intervalle, avec le même
  identifiant de version et le même texte aux deux lectures. L'identifiant
  LEGIARTI figure à côté de chaque article dans la table TEXTES et sous
  « Voir le texte de loi » : un article change sans changer de numéro, et
  seul l'identifiant dit lequel a été lu.

  CE QUI RESTE ENTRE CROCHETS. Ce que l'application ne sait pas : le service
  de l'administration compétent, l'adresse du salarié, les éléments chiffrés
  du dossier. Un crochet est un champ à remplir, jamais une affirmation.

  Rien ne sort du poste : tout est calculé et rédigé dans le navigateur.
-->

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  /* ═══════════════════════════════════════════════════════════════════════
     LES TEXTES.

     Chacun a été interrogé deux fois au relais Légifrance le 7 septembre 2026,
     à quelques minutes d'intervalle, et les deux lectures ont rendu le même
     identifiant de version et le même texte, caractère pour caractère.

  var TEXTES = {
    "L1233-3": { id: "LEGIARTI000036762081",
      dit: "constitue un licenciement économique celui fondé sur un motif non inhérent à la personne, résultant d'une suppression ou transformation d'emploi ou d'une modification refusée d'un élément essentiel du contrat, consécutives notamment à des difficultés économiques, des mutations technologiques, une réorganisation nécessaire à la sauvegarde de la compétitivité ou une cessation d'activité" },

    "D1233-2-1": { id: "LEGIARTI000036248612",

    "L1233-5": { id: "LEGIARTI000036261856",
      dit: "critères d'ordre : charges de famille, ancienneté, caractéristiques sociales rendant la réinsertion difficile, qualités professionnelles ; un critère peut être privilégié à condition de tenir compte de tous les autres ; périmètre au moins égal à la zone d'emplois à défaut d'accord" },
    "L1233-7": { id: "LEGIARTI000006901019",
      dit: "en cas de licenciement individuel pour motif économique, l'employeur prend en compte, dans le choix du salarié, les critères de l'article L. 1233-5" },
    "L1233-8": { id: "LEGIARTI000036261850",
      dit: "licenciement de moins de dix salariés sur trente jours : consultation du comité social et économique dans les entreprises d'au moins onze salariés ; avis rendu dans un délai qui ne peut excéder un mois" },
    "L1233-11": { id: "LEGIARTI000006901023",

    "L1233-12": { id: "LEGIARTI000006901024",

    "L1233-15": { id: "LEGIARTI000032344944",

    "L1233-16": { id: "LEGIARTI000036762077",

    "L1233-19": { id: "LEGIARTI000006901031",

    "D1233-3": { id: "LEGIARTI000022348560",
      dit: "information écrite de l'administration dans les huit jours de l'envoi des lettres, avec le nom et l'adresse de l'employeur, la nature de l'activité et l'effectif, l'identité et la qualification des salariés licenciés et la date de notification" },
    "L1233-42": { id: "LEGIARTI000036762064",
      dit: "la lettre de licenciement comporte l'énoncé des motifs économiques et mentionne la priorité de réembauche" },
    "L1233-45": { id: "LEGIARTI000029144908",
      dit: "priorité de réembauche pendant un an à compter de la rupture, si le salarié en fait la demande dans ce délai ; l'employeur l'informe alors de tout emploi devenu disponible et compatible avec sa qualification" },
    "L1233-65": { id: "LEGIARTI000024422267",
      dit: "le contrat de sécurisation professionnelle a pour objet un parcours de retour à l'emploi, débutant par un prébilan, une évaluation des compétences et une orientation professionnelle" },
    "L1233-66": { id: "LEGIARTI000031013988",
      dit: "dans les entreprises non soumises au congé de reclassement, l'employeur propose le contrat de sécurisation professionnelle lors de l'entretien préalable ou à l'issue de la dernière réunion des représentants du personnel ; à défaut, contribution de deux mois de salaire brut" },
    "L1233-67": { id: "LEGIARTI000031014016",
      dit: "l'adhésion emporte rupture du contrat, sans préavis ni indemnité compensatrice, avec droit à l'indemnité de licenciement ; la contestation se prescrit par douze mois, délai opposable seulement s'il figure dans la proposition" },
    "L1233-71": { id: "LEGIARTI000042683537",
      dit: "dans les entreprises ou établissements d'au moins mille salariés, congé de reclassement proposé à chaque salarié, d'une durée qui ne peut excéder douze mois, portés à vingt-quatre en cas de formation de reconversion" },

    "R1233-19": { id: "LEGIARTI000036483206",
      dit: "lors de l'entretien préalable, en cas de licenciement de moins de dix salariés sur trente jours, l'employeur informe le salarié des conditions de mise en oeuvre du congé de reclassement" },
    "L1233-61": { id: "LEGIARTI000036261733",
      dit: "dans les entreprises d'au moins cinquante salariés, lorsque le projet concerne au moins dix salariés sur trente jours, l'employeur établit et met en oeuvre un plan de sauvegarde de l'emploi" },
    "L1234-1": { id: "LEGIARTI000006901112",
      dit: "préavis d'un mois de six mois à deux ans d'ancienneté, de deux mois au-delà, sauf disposition plus favorable" },
    "L1234-9": { id: "LEGIARTI000035644154",

  /* ═══════════════════════════════════════════════════════ dates et calculs */
  function paques(an) {
    var a = an % 19, b = Math.floor(an / 100), c = an % 100;
    var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var mois = Math.floor((h + l - 7 * m + 114) / 31);
    var jourM = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(an, mois - 1, jourM);
  }
  var cacheFeries = {};
  function feries(an) {
    if (cacheFeries[an]) return cacheFeries[an];
    var p = paques(an), j = 86400000, l = {};
    function pose(d) { l[d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate()] = true; }
    [[0, 1], [4, 1], [4, 8], [6, 14], [7, 15], [10, 1], [10, 11], [11, 25]].forEach(function (x) {
      pose(new Date(an, x[0], x[1]));
    });
    pose(new Date(p.getTime() + j));
    pose(new Date(p.getTime() + 39 * j));
    pose(new Date(p.getTime() + 50 * j));
    cacheFeries[an] = l;
    return l;
  }
  function estFerie(d) {
    return !!feries(d.getFullYear())[d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate()];
  }
  /* Jour ouvrable : tous les jours de la semaine sauf le dimanche et les jours

  function estOuvrable(d) { return d.getDay() !== 0 && !estFerie(d); }
  function jour(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function prochainOuvrable(d) { var x = new Date(d.getTime()); while (!estOuvrable(x)) x = jour(x, 1); return x; }
  function apresJoursOuvrables(depart, n) {
    var d = new Date(depart.getTime()), compte = 0;
    while (compte < n) { d = jour(d, 1); if (estOuvrable(d)) compte++; }
    return prochainOuvrable(jour(d, 1));

  function analyser(texte) {

      return { p: p, trouve: trouve };
    });

        "contient pas serait dit absent.</div>";

    var r = analyser(t);
    var abs = r.filter(function (x) { return !x.trouve; }).length;
    var h = '<div class="chiffre">' +
      (abs === 0 ? "Les huit mentions cherchées figurent dans le texte déposé. Les trouver ne prouve " +
        "pas qu'elles sont bien rédigées : c'est un repérage de mots, il conduit la lecture, il ne " +
        "la remplace pas."
       : abs + " mention" + (abs > 1 ? "s" : "") + " ne se trouve" + (abs > 1 ? "nt" : "") +
         " pas dans le texte déposé. Le texte à insérer est donné pour chacune, prêt à coller.") +
      "</div>";
    r.forEach(function (x) {
      h += '<div class="manque"><div class="tt"><span class="etat ' +
        (x.trouve ? "present" : "absent") + '">' + (x.trouve ? "présente" : "absente") + "</span>" +
        '<span><span class="obj">' + ech(x.p.objet) + '</span><span class="fond">' +
        ech(x.p.fond.join(" · ")) + (x.p.arret ? " · " + ech(ARRET.ref) : "") + "</span></span></div>";
      if (!x.trouve) {
        h += '<div class="texte"><p>' + ech(x.p.pourquoi) + "</p>" +
          (x.p.arret ? "<p>« " + ech(ARRET.dit) + " » (" + ech(ARRET.ref) + ").</p>" : "") +
          '<div class="pret">' + ech(x.p.texte) + "</div></div>";
      }
      h += "</div>";
    });
    $("#o-resultat").innerHTML = h;
  }

  /* La lecture d'un .docx, sans bibliothèque : un .docx est une archive zip, et
     le texte vit dans word/document.xml. Aucun octet ne sort de la page. */
  function u16(v, i) { return v.getUint16(i, true); }
  function u32(v, i) { return v.getUint32(i, true); }
  function entreeZip(buf, nomVoulu) {
    var v = new DataView(buf), n = buf.byteLength, fin = -1;
    for (var i = n - 22; i >= 0 && i > n - 65558; i--) if (u32(v, i) === 0x06054b50) { fin = i; break; }
    if (fin < 0) throw new Error("Ce fichier n'est pas une archive lisible.");
    var nb = u16(v, fin + 10), pos = u32(v, fin + 16), dec = new TextDecoder("utf-8");
    for (var k = 0; k < nb; k++) {
      if (u32(v, pos) !== 0x02014b50) throw new Error("Répertoire de l'archive illisible.");
      var methode = u16(v, pos + 10), taille = u32(v, pos + 20);
      var lnom = u16(v, pos + 28), lextra = u16(v, pos + 30), lcom = u16(v, pos + 32);
      var debut = u32(v, pos + 42);
      var nom = dec.decode(new Uint8Array(buf, pos + 46, lnom));
      if (nom === nomVoulu) {
        var ln = u16(v, debut + 26), lx = u16(v, debut + 28);
        return { methode: methode, data: new Uint8Array(buf, debut + 30 + ln + lx, taille) };
      }
      pos += 46 + lnom + lextra + lcom;
    }
    throw new Error("Le fichier ne contient pas de document Word.");
  }
  function inflater(u8) {
    if (typeof DecompressionStream !== "function")
      return Promise.reject(new Error("Ce navigateur ne sait pas décomprimer le fichier."));
    return new Response(new Blob([u8]).stream()
      .pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
  }
  function texteDeXml(xml) {
    return xml.replace(/<w:tab[^>]*\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n")
      .replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
  }
  function lireDocx(f) {
    return f.arrayBuffer().then(function (buf) {
      var e = entreeZip(buf, "word/document.xml");
      if (e.methode === 0) return new TextDecoder("utf-8").decode(e.data);
      if (e.methode !== 8) throw new Error("Compression inconnue dans ce .docx.");
      return inflater(e.data).then(function (b) {
        return new TextDecoder("utf-8").decode(new Uint8Array(b));
      });
    }).then(texteDeXml);
  }
  $("#depot").addEventListener("input", rendreOui);
  $("#fichier").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    $("#lecture").innerHTML = '<div class="chiffre">Lecture de ' + ech(f.name) + "...</div>";
    var suite = (window.LirePdf && window.LirePdf.estPdf(f)) ? window.LirePdf.texte(f)
      : (/\.docx$/i.test(f.name) ? lireDocx(f) : f.text());
    suite.then(function (t) {
      $("#depot").value = t;
      $("#lecture").innerHTML = '<div class="chiffre">' + ech(f.name) + " lu : " +
        t.length.toLocaleString("fr-FR") + " caractères.</div>";
      rendreOui();
    }).catch(function (e) {
      $("#lecture").innerHTML = '<div class="alerte">Ce fichier n\'a pas pu être lu : ' +
        ech(e.message) + " Ouvrez le document, copiez son texte et collez-le ci-dessous.</div>";
    });
  });

  /* ═══════════════════════════════════ la question, et ce qu'elle commande */
  function ecran(nom) {
    $("#ecran-question").hidden = nom !== "question";
    $("#ecran-doc").hidden = nom !== "doc";
    $("#ecran-oui").hidden = nom !== "oui";
    $("#marque").textContent = nom === "question" ? "Motif économique"
      : (nom === "doc" ? courant.nom : "Contrôle du document");
    window.scrollTo(0, 0);
  }
  $("#rep-non").addEventListener("click", function () { ecran("doc"); rendre(); });
  $("#rep-oui").addEventListener("click", function () { ecran("oui"); });
  /* Le bouton Retour du bandeau, posé par droits.js : depuis le document ou le
     contrôle, il revient à la question ; depuis la question, il quitte la page. */
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest ? ev.target.closest("header.site a.retour") : null;
    if (!a || !$("#ecran-question").hidden) return;
    ev.preventDefault(); ev.stopPropagation();
    ecran("question");
  }, true);
  $("#onglets").addEventListener("click", function () { $("#marque").textContent = courant.nom; });

  /* Sous la question : l'entreprise et son effectif. À partir de cinquante
     salariés, le lien vers le plan de sauvegarde, dû dès dix licenciements
     sur trente jours (L. 1233-61). */
  (function fiche() {
    var t = ech(profil.denomination) + " · " + effectif + " salarié" + (effectif > 1 ? "s" : "");
    if (effectif >= 50) {
      t += ' · dix licenciements ou plus : <a href="audit-pse.html">plan de sauvegarde</a>';
    }
    $("#fiche-rappel").innerHTML = t;
  })();

  try {
    fetch("manifest-audit.json", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (m) { if (m && m.version) $("#etat-version").textContent = m.version; })
      .catch(function () {});
  } catch (e) {}

  if ("serviceWorker" in navigator) {
    var dejaControlee = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (dejaControlee) $("#maj-dispo").classList.add("visible");
      dejaControlee = true;
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) { reg.update().catch(function () {}); });
    });
  }
  $("#btn-maj").addEventListener("click", function () { location.reload(); });
})();
</script>

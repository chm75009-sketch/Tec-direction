# Le site de la SARL TEC, publié par Cloudflare depuis ce dépôt.
#
# Ce fichier existe pour que « npx wrangler deploy », la commande que le
# tableau de bord lance à chaque envoi sur main, sache quoi publier. Sans lui,
# la construction échoue et rien ne part.
#
# Le site n'est que des fichiers : pas de code serveur, pas de variable, pas
# de secret. Tout ce qu'il y a à dire tient dans le dossier des actifs.
#
# html_handling reste au réglage par défaut, celui qui sert index.html quand on
# ouvre la racine du site. Il avait été mis à « none » pour éviter la
# redirection 307 de « mes-documents.html » vers « mes-documents » : cette
# redirection ne gêne plus, puisque le service worker qui la refusait a été
# retiré, alors que « none » faisait répondre 404 à l'adresse d'accueil, ce
# qui est bien pire. Mesuré en ligne le 25 septembre 2026.

name = "tec-direction"
compatibility_date = "2026-09-23"

[assets]
directory = "./"
not_found_handling = "none"

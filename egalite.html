<!--
  LE PLAN D'ACTION, EN PREMIER ET SEUL À L'ÉCRAN.

  Le plan d'action annuel pour l'égalité professionnelle entre les femmes et
  les hommes est dû à défaut d'accord (L. 2242-3). Cette page l'écrit au nom de
  l'entreprise, déjà rempli avec la fiche : la dénomination, l'adresse, le
  signataire, l'effectif. Trois champs en tête le complètent frappe par
  frappe : l'année du plan et les domaines d'action retenus à côté de la
  rémunération effective, que R. 2242-2 impose. À partir de trois cents
  salariés, un quatrième domaine apparaît : c'est le minimum que le même
  article fixe à cet effectif.

  C'est l'écran 5 de la maquette validée le 8 septembre 2026 : les champs en
  tête, la feuille, Télécharger en Word, Imprimer, « Voir le texte de loi »
  replié, et Retour. Rien d'autre : ni chapeau, ni étape, ni exposé du droit
  avant d'agir. Les huit onglets qui occupaient cette page (le cadre, l'année
  écoulée, les objectifs, les actions, l'index, le dépôt, le report, le
  document) ont été retirés le 8 septembre 2026. Quand un accord ou un plan
  existe déjà, c'est controler-egalite.html qui le prend et le complète.

  L'ORDRE DU DOCUMENT EST CELUI DU TEXTE. L. 2242-3 : « après avoir évalué les
  objectifs fixés et les mesures prises au cours de l'année écoulée, ce plan
  d'action [...] détermine les objectifs de progression prévus pour l'année à
  venir, définit les actions qualitatives et quantitatives permettant de les
  atteindre et évalue leur coût. Ce plan d'action est déposé auprès de
  l'autorité administrative. » L'évaluation vient donc en premier, les
  objectifs et les actions ensuite, le coût, puis le dépôt.

  LES TEXTES. Chaque article cité a été demandé deux fois au relais Légifrance
  le 8 septembre 2026, à plusieurs minutes d'intervalle, filtre par nom du
  code ; les deux lectures ont rendu le même identifiant de version et le même
  texte. L'identifiant LEGIARTI est dans la table TEXTES, à côté du numéro.

  CE QUI RESTE ENTRE CROCHETS. Les chiffres de l'entreprise : le taux de
  départ, la cible, l'enveloppe, le coût, le résultat de l'index. Un crochet
  est un champ à remplir, jamais une affirmation : aucun chiffre n'est inventé.

  Rien ne sort du poste : tout est rédigé dans le navigateur.
-->

<style>
  /* Ce qui est propre à cette page. Tout le reste vient de style.css. */
  #ecran-doc{margin:var(--e4) 0 0}
  #ecran-doc .champs{margin:0 0 var(--e4)}
  #ecran-doc .barre{margin:var(--e4) 0}
  #ecran-doc details{margin:var(--e2) 0 var(--e6)}
  #sources{margin-top:8px;font-size:var(--t1);line-height:1.6;color:var(--texte-2)}
  #sources div{margin:0 0 6px}
  #sources b{color:var(--encre)}

  /* La feuille : le document tel qu'il sortira sur le papier. */
  .feuille [contenteditable]{outline:none}
  .feuille [contenteditable]:focus{background:#fffbe9;border-radius:3px}
  .feuille .modifie{border-left:2px solid var(--vert);padding-left:8px;margin-left:-10px}
  .feuille .b-t1{font:700 18px/1.35 system-ui;margin:0 0 6px;text-align:center}
  .feuille .b-st{font:600 13.5px/1.4 system-ui;margin:0 0 22px;text-align:center;color:var(--texte-2)}
  .feuille .b-h1{font:700 15px/1.35 system-ui;margin:20px 0 7px}
  .feuille .b-h2{font:600 14px/1.35 system-ui;margin:15px 0 5px}
  .feuille .b-p{margin:0 0 9px;font-size:14.5px;line-height:1.68}
  .feuille .b-puce{margin:0 0 5px 18px;font-size:14.5px;line-height:1.6}
  /* Une note de marge s'adresse à l'employeur : elle ne part pas dans le
     fichier emporté, elle doit donc se voir comme telle. */
  .feuille .b-note{margin:9px 0 12px;padding:0 0 0 10px;border-left:2px dashed var(--filet-2);
    font-size:12.5px;font-style:italic;line-height:1.55;color:var(--texte-3)}
  .feuille .b-vide{height:9px}
  .feuille .b-trait{border:0;border-top:1px solid var(--filet);margin:20px 0}
  .feuille .b-sign{margin:20px 0 0;font-size:14.5px;white-space:pre-wrap;line-height:1.7}

  /* L'index : une carte par salarié, parce qu'un tableau de quatre colonnes
     avec deux champs de saisie ne se lit pas sur un téléphone. */
  #ecran-index{margin:var(--e4) 0 0}
  .ix-note{font:600 34px/1 system-ui;color:var(--encre)}
  .ix-note small{display:block;font:600 13px/1.4 system-ui;color:var(--texte-3);margin:6px 0 0}
  .ix-s{border:1px solid var(--filet);border-left:3px solid var(--filet-2);
    border-radius:10px;padding:11px 12px;margin:0 0 8px;background:var(--surface)}
  .ix-s.ix-hors{opacity:.62}
  .ix-s .n{display:block;font:600 15.5px/1.35 system-ui;color:var(--encre)}
  .ix-s .e{display:block;font-size:13.5px;color:var(--texte-3);margin:2px 0 0}
  .ix-s .deux{display:grid;grid-template-columns:1fr;gap:8px;margin:9px 0 0}
  @media (min-width:460px){.ix-s .deux{grid-template-columns:1fr 1fr}}
  .ix-s label{font:600 13px/1.3 system-ui;color:var(--texte-3);display:block}
  .ix-s select,.ix-s input{display:block;margin:5px 0 0;width:100%;box-sizing:border-box;
    font-size:16px;padding:9px 10px;min-height:44px;border:1px solid var(--filet-2);
    border-radius:8px;background:var(--surface);color:var(--encre)}
  .ix-s .case{margin:8px 0 0}
  .ix-i{border:1px solid var(--filet);border-radius:10px;padding:11px 12px;margin:0 0 8px;
    background:var(--surface)}
  .ix-i .t{display:block;font:600 14.5px/1.4 system-ui;color:var(--encre)}
  .ix-i .r{display:block;font-size:14px;line-height:1.5;color:var(--texte-2);margin:4px 0 0}
  .ix-i .pts{float:right;font:600 15px/1 system-ui;color:var(--encre);margin:2px 0 0 10px}
  .ix-i.ix-ko{border-left:3px solid var(--rouge,#c0392b)}
  .ix-i.ix-ok{border-left:3px solid var(--vert)}
  .ix-i.ix-att{border-left:3px solid var(--ambre)}

  @media print{
    .champs,.barre,details,.b-note{display:none !important}
  }
</style>

<header class="site">
  <div class="wrap">
    <p class="marque">Égalité professionnelle</p>
    <div class="outils">
      <a href="index.html">Accueil</a>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ═══════════ LE PLAN D'ACTION, SEUL À L'ÉCRAN ═══════════ -->
  <section id="ecran-doc">
    <form class="champs" id="champs" autocomplete="off" onsubmit="return false">
      <label class="ch"><span class="nom">Année du plan</span>
        <input type="number" id="c-annee" min="2000" max="2100"></label>
      <label class="ch"><span class="nom">Deuxième domaine d'action</span>
        <select id="c-dom2"></select></label>
      <label class="ch"><span class="nom">Troisième domaine d'action</span>
        <select id="c-dom3"></select></label>
      <label class="ch" id="w-dom4" hidden><span class="nom">Quatrième domaine d'action</span>
        <select id="c-dom4"></select></label>
    </form>

    <div id="doc"></div>

    <div class="barre pile">
      <button type="button" id="btn-word">Télécharger en Word</button>
      <button type="button" class="second" id="btn-imprimer">Imprimer</button>
      <button type="button" class="second" id="vers-index" hidden>Calculer l'index</button>
    </div>

    <details>
      <summary>Voir le texte de loi</summary>
      <div id="sources"></div>
    </details>
  </section>

  <!-- ═══════════ L'INDEX, CALCULÉ SUR LE REGISTRE ET LES SALAIRES ═══════════ -->
  <section id="ecran-index" hidden>
    <form class="champs" id="ix-champs" autocomplete="off" onsubmit="return false">
      <label class="ch"><span class="nom">Année de référence</span>
        <input type="number" id="ix-annee" min="2000" max="2100"></label>
      <label class="ch"><span class="nom">Postes équivalents comparés par</span>
        <select id="ix-base">
          <option value="coef">coefficient ou niveau hiérarchique (seuil de 2 %)</option>
          <option value="csp">catégorie socioprofessionnelle (seuil de 5 %)</option>
        </select></label>
      <label class="ch"><span class="nom">Ce que porte la colonne rémunération</span>
        <select id="ix-unite">
          <option value="horaire">taux horaire brut</option>
          <option value="annuel">rémunération annuelle brute en équivalent temps plein</option>
        </select></label>
    </form>

    <div id="ix-resultat"></div>
    <div id="ix-chiffres"></div>

    <details id="ix-detail">
      <summary>Les salariés pris en compte, et leur rémunération</summary>
      <div id="ix-salaries"></div>
    </details>

    <details>
      <summary>Les groupes de comparaison</summary>
      <div id="ix-groupes"></div>
    </details>

    <div class="barre pile">
      <button type="button" id="ix-word">Télécharger le relevé en Word</button>
      <button type="button" class="second" id="ix-retour">Retour au plan d'action</button>
    </div>

    <details>
      <summary>Voir le texte de loi</summary>
      <div id="ix-sources"></div>
    </details>
  </section>

</main>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };

  /* ═══════════════════════════════════════════════════════════════════════
     LES TEXTES.

     Chacun a été demandé deux fois au relais Légifrance le 8 septembre 2026,
     à plusieurs minutes d'intervalle, filtre par nom du code ; les deux
     lectures ont rendu le même identifiant et le même texte. La colonne
     « dit » ne reprend que ce qui sert à la rédaction, dans les mots de
     l'article.
     ══════════════════════════════════════════════════════════════════════ */
  var TEXTES = {
    "L2242-1": { id: "LEGIARTI000043893962",
      dit: "dans les entreprises où sont constituées une ou plusieurs sections syndicales d'organisations représentatives, l'employeur engage au moins une fois tous les quatre ans une négociation sur l'égalité professionnelle entre les femmes et les hommes, portant notamment sur les mesures visant à supprimer les écarts de rémunération, et la qualité de vie et des conditions de travail (2°)" },
    "L2242-3": { id: "LEGIARTI000037389684",
      dit: "en l'absence d'accord relatif à l'égalité professionnelle à l'issue de la négociation du 2° de l'article L. 2242-1, l'employeur établit un plan d'action annuel ; après avoir évalué les objectifs fixés et les mesures prises au cours de l'année écoulée, ce plan, fondé sur des critères clairs, précis et opérationnels, détermine les objectifs de progression prévus pour l'année à venir, définit les actions qualitatives et quantitatives permettant de les atteindre et évalue leur coût ; il est déposé auprès de l'autorité administrative" },
    "L2242-8": { id: "LEGIARTI000051289082",
      dit: "les entreprises d'au moins cinquante salariés sont soumises à une pénalité en l'absence d'accord relatif à l'égalité professionnelle ou, à défaut d'accord, de plan d'action ; dans les entreprises d'au moins 300 salariés, ce défaut d'accord est attesté par un procès-verbal de désaccord ; le montant de la pénalité est fixé au maximum à 1 % des rémunérations et gains versés au cours des périodes non couvertes, et fixé par l'autorité administrative en fonction des efforts constatés" },
    "R2242-2": { id: "LEGIARTI000038430967",
      dit: "l'accord ou, à défaut, le plan d'action fixe les objectifs de progression et les actions permettant de les atteindre portant sur au moins trois des domaines d'action mentionnés au 2° de l'article L. 2312-36 pour les entreprises de moins de 300 salariés et sur au moins quatre pour les entreprises de 300 salariés et plus : embauche, formation, promotion professionnelle, qualification, classification, conditions de travail, sécurité et santé au travail, rémunération effective et articulation entre l'activité professionnelle et la vie personnelle et familiale ; les objectifs et les actions sont accompagnés d'indicateurs chiffrés ; la rémunération effective est obligatoirement comprise dans les domaines retenus ; dans les entreprises d'au moins cinquante salariés, les objectifs, actions et indicateurs de ce domaine tiennent compte des indicateurs de l'article L. 1142-8 et, le cas échéant, des mesures de correction de l'article L. 1142-9" },
    "L1142-8": { id: "LEGIARTI000044605453",
      dit: "dans les entreprises d'au moins cinquante salariés, l'employeur publie chaque année l'ensemble des indicateurs relatifs aux écarts de rémunération entre les femmes et les hommes et aux actions mises en œuvre pour les supprimer, selon des modalités et une méthodologie définies par décret" }
  };
  /* « L2242-3 » s'écrit « L. 2242-3 » dans un document. */
  function ref(nums) {
    return nums.map(function (n) { return n.replace(/^([LRD])(\d)/, "$1. $2"); }).join(", ");
  }

  /* ═════════════════════════════════════════════ le profil de l'entreprise */
  var profil = null;
  try { profil = JSON.parse(localStorage.getItem("profil-entreprise") || "null"); } catch (e) {}
  if ((!profil || !profil.denomination) && window.Profil) profil = window.Profil.lire();
  if (!profil) profil = {};

  function nomSociete() { return profil.denomination || "[dénomination de l'entreprise]"; }
  function societe() {
    var t = nomSociete();
    if (profil.adresse) t += ", dont le siège social est situé " + profil.adresse;
    if (profil.siret) t += ", identifiée sous le numéro SIRET " + profil.siret;
    return t;
  }
  /* LE SIGNATAIRE, DANS LES DEUX FORMES DE LA FICHE. « responsable » est
     l'ancien champ unique ; la fiche range depuis le 26 septembre 2026 le nom
     et la qualité séparément, si bien que les documents sortaient avec le
     crochet « [nom et qualité du signataire] » sur une fiche complète, jusque
     sur un certificat de travail. Relevé le 28 septembre 2026. */
  function respFiche() {
    var p = profil || {};
    var s = String(p.responsable || "").trim();
    if (s) return s;
    return [String(p.responsableNom || "").trim(), String(p.responsableQualite || "").trim()]
      .filter(Boolean).join(", ");
  }

  function signataire() { return respFiche() || "[nom et qualité du signataire]"; }
  /* LA VILLE. La fiche la porte parfois dans son propre champ, sinon elle est
     dans le code postal de l'adresse. Le crochet ne sert que si les deux
     manquent. */
  function ville() {
    var v = String(profil.ville || "").trim();
    if (v) return v;
    var m = String(profil.adresse || "").match(/\d{5}\s+([^,;]+)\s*$/);
    return m ? m[1].trim() : "[ville]";
  }
  function effectif() {
    var n = Number(profil.effectif);
    return isFinite(n) && n > 0 ? n : null;
  }
  /* R. 2242-2 : trois domaines au moins sous trois cents salariés, quatre à
     partir de trois cents. */
  function minimumDomaines() { var n = effectif(); return n !== null && n >= 300 ? 4 : 3; }

  var MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
    "septembre", "octobre", "novembre", "décembre"];
  function dateFr(d) {
    if (!d) return "[date]";
    return (d.getDate() === 1 ? "1er" : d.getDate()) + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LES NEUF DOMAINES D'ACTION DE R. 2242-2, dans l'ordre et les mots du
     texte. La rémunération effective est toujours retenue ; les autres se
     choisissent en tête. Chaque domaine porte un objectif de progression, des
     actions et des indicateurs chiffrés : les valeurs propres à l'entreprise
     restent entre crochets.
     ══════════════════════════════════════════════════════════════════════ */
  var DOMAINES = [
    { cle: "embauche", nom: "Embauche",
      objectif: function (an) { return "Porter la part du sexe sous-représenté parmi les recrutements en contrat à durée indéterminée de [__] %, taux constaté en " + (an - 1) + ", à [__] % au 31 décembre " + an + ", sur les emplois où ce sexe représente moins de 40 % de l'effectif."; },
      actions: [
        "Rédiger toutes les offres d'emploi en double genre, sans mention d'âge ni de situation de famille, et les faire relire avant diffusion par [service ou personne désignée].",
        "Constituer pour chaque poste ouvert une liste courte comportant au moins une candidature de chaque sexe lorsque des candidatures des deux sexes ont été reçues, et consigner par écrit le motif du choix retenu.",
        "Former à la non-discrimination à l'embauche toutes les personnes qui conduisent des entretiens de recrutement : [__] sessions dans l'année."],
      indicateurs: [
        "Nombre de candidatures reçues, par sexe et par emploi.",
        "Nombre d'embauches, par sexe, par catégorie professionnelle et par type de contrat.",
        "Part des listes courtes mixtes ; nombre de recruteurs formés dans l'année."] },
    { cle: "formation", nom: "Formation",
      objectif: function (an) { return "Ramener à [2] points au plus l'écart entre le taux d'accès à la formation des femmes et celui des hommes au 31 décembre " + an + ", et proposer une action de formation à 100 % des salariés de retour d'un congé de maternité, d'adoption ou parental de plus de [4] mois, dans les [3] mois de leur reprise."; },
      actions: [
        "Programmer les formations sur le temps de travail et prévenir les participants au moins [15] jours avant.",
        "Proposer à tout salarié de retour de congé familial un entretien de reprise, puis une action de remise à niveau adaptée au poste retrouvé.",
        "Réserver [__] % des heures du plan de développement des compétences aux salariés à temps partiel."],
      indicateurs: [
        "Nombre d'heures de formation suivies, par sexe et par catégorie professionnelle.",
        "Taux d'accès à la formation par sexe, et écart entre les deux taux.",
        "Nombre de retours de congé familial ayant donné lieu à une formation."] },
    { cle: "promotion", nom: "Promotion professionnelle",
      objectif: function (an) { return "Porter à [__] % la part des femmes parmi les promotions prononcées dans l'année, part au moins égale à celle qu'elles représentent dans l'effectif de la catégorie d'origine, au 31 décembre " + an + "."; },
      actions: [
        "Tenir chaque année, avant arbitrage, une revue des promotions envisagées présentant la répartition par sexe et par catégorie, et écrire le motif de tout écart supérieur à [5] points.",
        "Neutraliser les périodes de congé de maternité, d'adoption et de congé parental dans le décompte de l'ancienneté servant aux critères de promotion.",
        "Tenir un entretien professionnel au retour de chaque congé familial, dans les [2] mois de la reprise."],
      indicateurs: [
        "Taux de promotion par sexe et par catégorie professionnelle.",
        "Ancienneté moyenne dans le poste avant promotion, par sexe.",
        "Part des femmes et des hommes dans chaque niveau d'encadrement."] },
    { cle: "qualification", nom: "Qualification",
      objectif: function (an) { return "Porter à [__] le nombre de salariés du sexe sous-représenté accédant chaque année à une qualification supérieure reconnue (certification, titre professionnel, validation des acquis de l'expérience), au 31 décembre " + an + "."; },
      actions: [
        "Recenser les emplois où un sexe est représenté à moins de 30 % et ouvrir [__] parcours qualifiants par an sur ces emplois.",
        "Financer [__] démarches de validation des acquis de l'expérience par an, avec [__] heures d'accompagnement chacune, sur le temps de travail.",
        "Proposer un entretien de positionnement à tout salarié à temps partiel dont la qualification n'a pas évolué depuis [5] ans."],
      indicateurs: [
        "Nombre de qualifications obtenues dans l'année, par sexe.",
        "Répartition des femmes et des hommes par niveau de qualification.",
        "Nombre de démarches de validation des acquis engagées, et nombre abouties."] },
    { cle: "classification", nom: "Classification",
      objectif: function (an) { return "Ramener à zéro, au 31 décembre " + an + ", le nombre de situations où une femme et un homme exerçant des fonctions de valeur égale sont positionnés à des coefficients différents sans qu'un critère objectif l'explique. Nombre de situations examinées dans l'année : [__]."; },
      actions: [
        "Comparer, coefficient par coefficient, les emplois occupés par des femmes et par des hommes, sur des critères écrits et objectifs : contenu du travail, technicité, autonomie, responsabilités, charge physique et charge nerveuse.",
        "Écrire, pour chaque écart constaté, soit le critère objectif qui l'explique, soit la correction retenue et sa date d'effet, au plus tard [__] mois après le constat.",
        "Remplacer les intitulés d'emploi genrés par des intitulés neutres dans la grille, les fiches de poste et les bulletins de paie."],
      indicateurs: [
        "Répartition des femmes et des hommes par coefficient et par niveau.",
        "Nombre de situations examinées, nombre corrigées, nombre expliquées.",
        "Coût des corrections de positionnement, en euros."] },
    { cle: "conditions", nom: "Conditions de travail",
      objectif: function (an) { return "Aménager [__] postes par an parmi ceux dont les contraintes actuelles font obstacle à la mixité (port de charges, horaires, équipements, locaux), et ramener à [__] le nombre de postes non mixtes pour ce motif au 31 décembre " + an + "."; },
      actions: [
        "Recenser, unité de travail par unité de travail, les postes dont l'aménagement conditionne l'accès de l'autre sexe, et arrêter un programme daté d'aménagement.",
        "Fournir des équipements de protection individuelle adaptés à la morphologie de chacun : [__] postes équipés dans l'année.",
        "Examiner par écrit, dans un délai de [__] jours, toute demande de passage à temps partiel, de retour à temps plein ou d'aménagement d'horaire, et motiver tout refus."],
      indicateurs: [

      actions: [
        "Fixer les réunions dans la plage horaire commune et diffuser convocation et ordre du jour au moins [5] jours à l'avance.",
        "Ouvrir le télétravail à [__] jours par semaine pour les emplois qui le permettent, sans distinction de sexe ni de situation de famille.",
        "Tenir un entretien avant le départ et au retour de tout congé de maternité, d'adoption ou parental."],
      indicateurs: [
        "Nombre de réunions tenues hors de la plage horaire retenue.",
        "Nombre de demandes d'aménagement d'horaire reçues, acceptées, refusées, et délai moyen de réponse.",
        "Nombre de jours de télétravail pris, par sexe."] }
  ];
  function domaine(cle) {
    return DOMAINES.filter(function (d) { return d.cle === cle; })[0];
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LE RENDU.

     Un document est une liste de blocs. Chaque bloc devient une ligne
     modifiable à l'écran et repart telle quelle dans le .docx. Quand les
     champs changent, tout est réécrit, sauf les blocs corrigés à la main : la
     correction est retenue sur une empreinte du texte d'origine, pas sur la
     place du bloc.
     ══════════════════════════════════════════════════════════════════════ */
  var corrections = {};
  function empreinte(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return "b" + (h >>> 0).toString(36);
  }
  function feuilleHtml(blocs) {
    var h = '<div class="feuille" id="feuille">';
    blocs.forEach(function (b) {
      if (b.k === "trait") { h += '<hr class="b-trait">'; return; }
      if (b.k === "vide") { h += '<div class="b-vide"></div>'; return; }
      var cle = empreinte(b.t);
      var texte = Object.prototype.hasOwnProperty.call(corrections, cle) ? corrections[cle] : b.t;
      h += '<div class="b-' + b.k + (texte !== b.t ? " modifie" : "") +
        '" contenteditable="true" data-k="' + b.k + '" data-o="' + cle + '">' +
        ech(texte) + "</div>";
    });
    return h + "</div>";
  }
  function texteDe(el) {
    var t = el.innerText !== undefined && el.innerText !== null ? el.innerText : el.textContent;
    return String(t).replace(/ /g, " ");
  }
  function relire() {
    var out = [];
    document.querySelectorAll("#feuille > *").forEach(function (el) {
      if (el.tagName === "HR") { out.push({ k: "trait", t: "" }); return; }
      if (el.classList.contains("b-vide")) { out.push({ k: "p", t: "" }); return; }
      out.push({ k: el.getAttribute("data-k"), t: texteDe(el) });
    });
    return out;
  }
  var VERS_EXPORT = { t1: "t1", st: "sur", h1: "h1", h2: "h2", p: "p", puce: "puce",
    note: "note", sign: "p", trait: "trait" };
  /* Ce qui part dans le fichier : le plan, et lui seul. Les notes de marge
     s'adressent à l'employeur, elles restent à l'écran. */
  function pourFichier() {
    var blocs = relire().filter(function (b) { return b.k !== "note"; });
    var titre = blocs.length && blocs[0].k === "t1" ? blocs.shift().t : "";
    return { titre: titre, blocs: blocs };
  }

  /* ═══════════════════════════════════════════════════ la lecture des champs */
  function lire() {
    var an = Number($("#c-annee").value);
    if (!isFinite(an) || an < 2000) an = new Date().getFullYear();
    var choisis = ["remuneration"];
    ["#c-dom2", "#c-dom3", "#c-dom4"].forEach(function (id, i) {
      if (i === 2 && minimumDomaines() < 4) return;
      var v = $(id).value;
      if (v && choisis.indexOf(v) < 0) choisis.push(v);
    });
    return { annee: an, domaines: choisis };
  }

  /* ═══════════════════════════════════════════════════════════════════════
     LE PLAN D'ACTION, dans l'ordre de L. 2242-3
     ══════════════════════════════════════════════════════════════════════ */
  function plan(d) {
    var b = [], n = 0, eff = effectif(), an = d.annee;
    function p(t) { b.push({ k: "p", t: t }); }
    function puce(t) { b.push({ k: "puce", t: t }); }
    function S(t) { n++; b.push({ k: "h1", t: n + ". " + t }); }

    b.push({ k: "t1", t: "PLAN D'ACTION ANNUEL POUR L'ÉGALITÉ PROFESSIONNELLE ENTRE LES FEMMES ET LES HOMMES" });
    b.push({ k: "st", t: nomSociete() + (eff !== null ? " - " + eff + " salariés" : "") + " - année " + an });

    p("Le présent plan d'action est établi par " + societe() + ", représentée par " + signataire() +
      ", en l'absence d'accord relatif à l'égalité professionnelle entre les femmes et les hommes " +
      "à l'issue de la négociation mentionnée au 2° de l'article " + ref(["L2242-1"]) +
      ", en application de l'article " + ref(["L2242-3"]) + " du code du travail.");

    S("Évaluation des objectifs fixés et des mesures prises au cours de l'année " + (an - 1));
    p("Objectifs fixés pour " + (an - 1) + " : [premier plan d'action de l'entreprise, aucun objectif " +
      "antérieur / reprendre ici chaque objectif du plan précédent].");
    puce("Objectif : [intitulé] ; indicateur : [ce qui se mesure] ; cible fixée : [valeur] ; " +
      "résultat constaté : [valeur] ; [atteint / partiellement atteint / non atteint].");
    puce("Mesures prises : [ce qui a été fait, quand, par qui]. Ce qui n'a pas été fait, et " +
      "pourquoi : [à renseigner, ou « sans objet »].");
    p("Modalités de suivi de la réalisation des objectifs et des mesures : [qui suit, à quelle " +
      "fréquence, sur quels indicateurs, devant quelle instance].");

    S("Objectifs de progression pour l'année " + an + ", et actions permettant de les atteindre");
    p("Le plan porte sur " + d.domaines.length + " domaines d'action parmi ceux mentionnés au 2° de " +
      "l'article L. 2312-36, le minimum applicable à l'entreprise étant de " + minimumDomaines() +
      ". La rémunération effective y est obligatoirement comprise. Chaque objectif et chaque " +
      "action sont accompagnés d'indicateurs chiffrés (" + ref(["R2242-2"]) + ").");
    d.domaines.forEach(function (cle, i) {
      var dom = domaine(cle);
      if (!dom) return;
      b.push({ k: "h2", t: "Domaine " + (i + 1) + " : " + dom.nom });
      p("Objectif de progression : " + dom.objectif(an));
      p("Actions retenues :");
      dom.actions.forEach(function (a) { puce(a); });
      p("Indicateurs chiffrés :");
      dom.indicateurs.forEach(function (x) { puce(x); });
      if (dom.obligatoire && eff !== null && eff >= 50)
        p("Les objectifs, les actions et les indicateurs de ce domaine tiennent compte des " +
          "indicateurs mentionnés à l'article " + ref(["L1142-8"]) + " et, le cas échéant, des " +
          "mesures de correction définies dans les conditions prévues à l'article L. 1142-9 (" +
          ref(["R2242-2"]) + ").");
      p("Échéance : 31 décembre " + an + ". Coût évalué des actions de ce domaine : [__] euros.");
    });

    S("Évaluation du coût des actions");
    p("Coût total évalué pour l'année " + an + " : [__] euros, somme des coûts évalués domaine par " +
      "domaine (" + ref(["L2242-3"]) + ").");

    if (eff !== null && eff >= 50) {
      S("Indicateurs relatifs aux écarts de rémunération");
      p("L'entreprise, qui compte " + eff + " salariés, publie chaque année l'ensemble des " +
        "indicateurs relatifs aux écarts de rémunération entre les femmes et les hommes et aux " +
        "actions mises en œuvre pour les supprimer (" + ref(["L1142-8"]) + ").");
      /* LE CHIFFRE, QUAND IL EST CALCULÉ. Cette ligne portait « [__] points » en
         toute circonstance, alors que le registre et les taux relevés
         permettent le calcul : il se fait dans l'écran de l'index, et le plan
         reprend son résultat. Relevé le 28 septembre 2026. */
      var ix = resultatIndex();
      if (ix && ix.etat === "calcule")
        p("Résultat au titre de l'année " + ix.annee + " : " + ix.niveau + " points sur 100, " +
          "calculé sur les " + ix.pris + " salariés pris en compte selon les indicateurs de " +
          "l'article " + ix.article + " et le barème de l'annexe " + ix.annexe +
          ". Publication le [date] : [où].");
      else if (ix && ix.etat === "indeterminable")
        p("Le niveau de résultat ne peut pas être déterminé au titre de l'année " + ix.annee +
          " : le maximum atteignable, " + ix.maxAtteint + " points, est inférieur à " +
          "soixante-quinze points. Les indicateurs calculables sont mis à la disposition du " +
          "comité social et économique et transmis à l'administration.");
      else
        p("Résultat au titre de l'année " + (an - 1) + " : [__] points, publié le [date] : [où]. " +
          "Le calcul se fait dans l'écran de l'index, à partir du registre du personnel et des " +
          "rémunérations.");
    }

    S("Dépôt");
    p("Le présent plan d'action est déposé auprès de l'autorité administrative (" +
      ref(["L2242-3"]) + "). Dépôt le [date] ; récépissé : [référence].");
    if (eff !== null && eff >= 300)
      p("Le défaut d'accord est attesté par le procès-verbal de désaccord établi le [date] à " +
        "l'issue de la négociation (" + ref(["L2242-8"]) + ").");

    b.push({ k: "trait", t: "" });
    b.push({ k: "sign", t: "Fait à " + ville() + ", le " + dateFr(new Date()) + "\n\n" +
      signataire() + "\n" + nomSociete() });

    if (eff !== null && eff >= 50)
      b.push({ k: "note", t: "À " + eff + " salariés, l'absence d'accord ou, à défaut d'accord, de " +
        "plan d'action expose l'entreprise à une pénalité fixée au maximum à 1 % des rémunérations " +
        "et gains versés au cours des périodes non couvertes (" + ref(["L2242-8"]) + "). Le dépôt " +
        "établit la formalité : ne laissez aucun crochet dans le plan déposé." });
    else
      b.push({ k: "note", t: "La pénalité de l'article " + ref(["L2242-8"]) + " ne vise que les " +
        "entreprises d'au moins cinquante salariés. Ne laissez aucun crochet dans le plan déposé." });
    return b;
  }

  /* ═══════════════════════════════════════════════════════════════ le rendu */
  var BLOCS = [];
  function rendre() {
    $("#w-dom4").hidden = minimumDomaines() < 4;
    BLOCS = plan(lire());
    $("#doc").innerHTML = feuilleHtml(BLOCS);
    sources();
  }

  /* Les textes que le document cite, avec leur identifiant de version. */
  function sources() {
    var cites = {};
    BLOCS.forEach(function (b) {
      var m = String(b.t).match(/\b[LRD]\. \d{4}-\d{1,2}\b/g) || [];
      m.forEach(function (x) { cites[x.replace(". ", "")] = true; });
    });
    var h = "";
    Object.keys(TEXTES).forEach(function (k) {
      if (!cites[k]) return;
      h += "<div><b>" + ech(ref([k])) + "</b> · " + ech(TEXTES[k].dit) + " · " + TEXTES[k].id + "</div>";
    });
    $("#sources").innerHTML = "<div>Code du travail, lu au relais Légifrance le 8 septembre 2026, " +
      "deux lectures concordantes par article.</div>" + h;
  }

  /* Chaque frappe réécrit le document. */
  $("#champs").addEventListener("input", rendre);
  $("#champs").addEventListener("change", rendre);

  /* Une correction faite à la main dans le document est retenue sur le texte
     d'origine du bloc : elle survit à la réécriture des autres. */
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el || !el.getAttribute || !el.hasAttribute("contenteditable")) return;
    if (!el.closest("#feuille")) return;
    corrections[el.getAttribute("data-o")] = texteDe(el);
    el.classList.add("modifie");
  });

  $("#btn-word").addEventListener("click", function () {
    var f = pourFichier();
    /* Les puces partent en paragraphes précédés du trait d'union : le rendu
       « puce » d'audit-export.js les ferait précéder d'un tiret long. */
    var items = f.blocs.map(function (b) {
      if (b.k === "puce") return { k: "p", t: "- " + b.t };
      return { k: VERS_EXPORT[b.k] || "p", t: b.t };
    });
    window.AuditExport.telecharger(
      window.AuditExport.docx(items, f.titre || "Plan d'action pour l'égalité professionnelle"),
      "plan-egalite-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  $("#btn-imprimer").addEventListener("click", function () { window.print(); });

  /* Les valeurs de départ, pour que le plan soit écrit avant la première
     frappe : l'année en cours, puis l'embauche, la formation et, à partir de
     trois cents salariés, la promotion professionnelle, à côté de la
     rémunération effective. */
  (function depart() {
    var options = DOMAINES.filter(function (d) { return !d.obligatoire; }).map(function (d) {
      return '<option value="' + d.cle + '">' + ech(d.nom) + "</option>";
    }).join("");
    ["#c-dom2", "#c-dom3", "#c-dom4"].forEach(function (id) { $(id).innerHTML = options; });
    $("#c-dom2").value = "embauche";
    $("#c-dom3").value = "formation";
    $("#c-dom4").value = "promotion";
    $("#c-annee").value = new Date().getFullYear();
  })();

  /* ═══════════════════════════════════════════════════════════════════════
     L'INDEX DE L'ÉGALITÉ PROFESSIONNELLE, CALCULÉ ICI.

     Jusqu'au 28 septembre 2026, la section du plan d'action portait « [__]
     points » : le chiffre était laissé à l'employeur, alors que l'application
     tient le registre du personnel et, par l'écran des minima, les taux
     horaires versés. Le calcul se fait donc ici, et l'écran ne demande que ce
     que l'application ne peut pas savoir : les augmentations de l'année, les
     promotions et les retours de congé de maternité.

     Le calcul lui-même est dans index-egalite.js, avec les textes lus à la
     source et le barème des annexes. Cet écran ne fait que rassembler les
     données et les montrer.
     ══════════════════════════════════════════════════════════════════════ */
  var CLE_IX = "egalite-index";
  function lireIx() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(CLE_IX) || "null"); } catch (e) {}
    o = o || {};
    o.sal = o.sal || {};
    o.aug = o.aug || {};
    o.promo = o.promo || {};
    o.aug2 = o.aug2 || {};
    o.mat = o.mat || {};
    return o;
  }
  function garderIx(o) {
    try { localStorage.setItem(CLE_IX, JSON.stringify(o)); } catch (e) {}
  }
  var IX = lireIx();

  /* Les salariés du registre présents au cours de l'année de référence. Celui
     qui est entré après le 31 décembre, ou sorti avant le 1er janvier, n'en
     fait pas partie. */
  function salariesIx(annee) {
    var R = null;
    try { R = JSON.parse(localStorage.getItem("registre-personnel") || "null"); } catch (e) {}
    var L = (R && R.salaries) || [];
    var debut = annee + "-01-01", fin = annee + "-12-31";
    return L.filter(function (s) {
      if (!s || s.ex) return false;
      if (!String(s.nom || "").trim() && !String(s.pre || "").trim()) return false;
      var e = String(s.ent || "").trim(), o = String(s.sor || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(e) || e > fin) return false;
      if (/^\d{4}-\d{2}-\d{2}$/.test(o) && o < debut) return false;
      return true;
    });
  }
  function idIx(s) { return String(s.id || (s.nom + "|" + s.pre)); }

  /* Les taux horaires relevés par l'écran des minima : la seule rémunération
     que l'application détienne déjà. */
  function tauxMinima() {
    try { return JSON.parse(localStorage.getItem("minima-salaires") || "{}") || {}; }
    catch (e) { return {}; }
  }
  function nombre(v) {
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isFinite(n) ? n : NaN;
  }

  /* LA CATÉGORIE SOCIOPROFESSIONNELLE, PROPOSÉE D'APRÈS L'EMPLOI. C'est
     l'employeur qui la fixe, après consultation du comité : la proposition est
     affichée comme telle, et elle se change dans la liste. Un emploi que ces
     mots ne reconnaissent pas reste sans catégorie. */
  function cspProposee(emploi) {
    var t = String(emploi || "").toLowerCase()
      .normalize ? String(emploi || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
                 : String(emploi || "").toLowerCase();
    if (!t) return "";
    if (/cadre|ingenieur|directeur|directrice|gerant|president/.test(t)) return "cadres";
    if (/technicien|agent de maitrise|chef d'equipe|chef d equipe|contremaitre/.test(t)) return "tam";
    if (/conducteur|conductrice|chauffeur|livreur|livreuse|manutention|magasinier|magasiniere|mecanic|cariste|ouvrier|ouvriere|agent de quai|preparateur|preparatrice/.test(t))
      return "ouvriers";
    if (/secretaire|assistant|assistante|comptable|employe|employee|standardiste|facturier|facturiere/.test(t))
      return "employes";
    return "";
  }
  function coefIx(s, SAL) {
    var m = SAL[idIx(s)] || {};
    var c = String(m.coef || "").trim();
    if (c) return c;
    return String(s.qua || "").trim();
  }

  /* Ce qui est envoyé au calcul : un salarié par ligne, avec son sexe, sa date
     de naissance, sa catégorie, son coefficient, sa rémunération et le motif
     qui l'écarte s'il y en a un. */
  function entreeIx() {
    /* Les trois choix de l'écran sont enregistrés : le document du parcours
       les relit pour calculer le même index, sans qu'on ait à rouvrir cet
       écran. Le rassemblement des données, lui, vit dans index-egalite.js
       depuis le 29 septembre 2026, pour que les deux s'en servent. */
    var choix = {
      annee: Number($("#ix-annee").value) || new Date().getFullYear() - 1,
      base: $("#ix-base").value === "csp" ? "csp" : "coef",
      unite: $("#ix-unite").value !== "annuel" ? "horaire" : "annuel",
    };
    IX.annee = choix.annee; IX.base = choix.base; IX.unite = choix.unite;
    garderIx(IX);
    return window.IndexEgalite.entree(choix);
  }

  var DERNIER = null;
  function euros(x) {
    return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function nomUnite(e) {
    return e.unite === "horaire" ? "taux horaire brut" : "rémunération annuelle brute";
  }

  /* LA SAISIE D'UNE CARTE NE REFAIT PAS LES CARTES.

     Chaque changement réécrivait les quatre-vingt-deux cartes de salariés :
     le champ qu'on venait de quitter disparaissait avec son voisin, et une
     saisie enchaînée n'atteignait que la première ligne. Relevé le
     28 septembre 2026. Quand le changement vient d'une carte, seuls le
     résultat, les groupes et les chiffres attendus sont réécrits. */
  function rendreIx(gardeCartes) {
    var e = entreeIx();
    var r = window.IndexEgalite.calculer(e);
    DERNIER = { entree: e, sortie: r };

    /* LE RÉSULTAT, EN PREMIER ET EN GRAND. */
    var h = "";
    if (r.etat === "calcule") {
      h += '<div class="carte"><p class="ix-note">' + r.niveau + " / 100" +
        "<small>Index au titre de l'année " + r.annee + ", annexe " + r.annexe +
        " (" + r.article + "), " + r.pris + " salariés pris en compte" +
        (r.proportionnalite ? ", total de " + r.points + " points sur " + r.maxAtteint +
          " atteignables, ramené sur cent" : "") + "</small></p>";
      h += r.niveau < 75
        ? '<p class="avis non"><b>Sous soixante-quinze points</b>Les mesures de correction et, ' +
          "le cas échéant, la programmation de mesures financières de rattrapage salarial " +
          "doivent être mises en œuvre (D. 1142-6, L. 1142-9). Trois ans pour se mettre en " +
          "conformité, puis une pénalité au maximum de 1 % des rémunérations (L. 1142-10).</p>"
        : '<p class="avis ok"><b>Au moins soixante-quinze points</b>Aucune mesure de correction ' +
          "n'est due à ce titre. La publication reste due au plus tard le 1er mars " +
          (r.annee + 1) + " (D. 1142-4).</p>";
      h += "</div>";
    } else if (r.etat === "indeterminable") {
      h += '<div class="carte"><p class="ix-note">non déterminable' +
        "<small>Le maximum atteignable, " + r.maxAtteint + " points, est inférieur à " +
        "soixante-quinze : le niveau de résultat ne peut pas être déterminé pour l'année " +
        r.annee + " (annexe " + r.annexe + ", 5.1)</small></p>" +
        '<p class="avis att"><b>Les indicateurs restent dus</b>Ceux qui sont calculables sont ' +
        "mis à la disposition du comité social et économique et transmis aux services du " +
        "ministre chargé du travail (D. 1142-5).</p></div>";
    } else {
      h += '<div class="carte"><p class="ix-note">' + r.points + " points" +
        "<small>Somme provisoire : " + r.manquants + (r.manquants > 1 ? " indicateurs" : " indicateur") +
        " attendent encore un chiffre. Ce n'est pas l'index tant qu'ils manquent.</small></p></div>";
    }

    /* LES INDICATEURS, UN PAR CARTE. */
    r.indicateurs.forEach(function (i) {
      var classe = i.etat === "calcule" ? (i.points === i.max ? "ix-ok" : "ix-att")
                 : (i.etat === "manque" ? "ix-ko" : "ix-att");
      h += '<div class="ix-i ' + classe + '"><span class="pts">' +
        (i.etat === "calcule" ? i.points + " / " + i.max : "- / " + i.max) + "</span>" +
        '<span class="t">' + ech(i.nom) + "</span>";
      if (i.etat === "calcule") h += '<span class="r">' + ech(direIx(i, e)) + "</span>";
      else h += '<span class="r">' + (i.etat === "incalculable" ? "Non calculable : " : "Il manque : ") +
        ech(i.pourquoi) + (i.etat === "incalculable"
          ? ". Les autres indicateurs sont calculés, et le total est ramené sur cent." : "") + "</span>";
      if (i.repli)
        h += '<span class="r">Le classement par coefficient ne réunissait pas assez de groupes ' +
          "de trois femmes et trois hommes : les salariés sont regroupés par catégorie " +
          "socioprofessionnelle, comme le prévoit l'annexe, et le seuil de pertinence passe à " +
          "5 %.</span>";
      if (i.correction)
        h += '<span class="r">Maximum acquis au titre du 5.2 de l\'annexe : les écarts ' +
          "constatés ici favorisent la population la moins payée (" + i.pointsAvant +
          " points sans cette règle).</span>";
      h += "</div>";
    });
    $("#ix-resultat").innerHTML = h;

    $("#ix-chiffres").innerHTML = chiffresHtml(e, r);
    if (!gardeCartes) $("#ix-salaries").innerHTML = salariesHtml(e);
    $("#ix-groupes").innerHTML = groupesHtml(e, r);
    sourcesIx();
  }

  /* Ce que dit un indicateur calculé, en une phrase. */
  function direIx(i, e) {
    if (i.cle === "remuneration") {
      var sens = i.signe > 0 ? "au désavantage des femmes"
               : (i.signe < 0 ? "au désavantage des hommes" : "nul");
      var nb = i.groupes.filter(function (g) { return g.pris; }).length;
      return "Écart global de " + String(i.resultat).replace(".", ",") + " %, " + sens +
        ", sur " + i.retenu + " salariés réunis dans " + nb + (nb > 1 ? " groupes" : " groupe") +
        ", seuil de pertinence de " + i.seuil + " %, base " + nomUnite(e) + ".";
    }
    if (i.cle === "augmentations" && i.tauxF !== undefined)
      return "Taux d'augmentation de " + String(i.tauxF).replace(".", ",") + " % chez les femmes " +
        "et de " + String(i.tauxH).replace(".", ",") + " % chez les hommes, soit un écart de " +
        String(i.resultat).replace(".", ",") + " points de pourcentage, ou " +
        String(i.salaries).replace(".", ",") + (i.salaries >= 2 ? " salariés." : " salarié.");
    if (i.cle === "augmentations" || i.cle === "promotions")
      return "Écart global de " + String(i.resultat).replace(".", ",") + " points de pourcentage, " +
        "sur " + i.retenu + " salariés réunis dans les catégories qui comptent au moins dix " +
        "femmes et dix hommes.";
    if (i.cle === "maternite")
      return i.augmentees + " salariée" + (i.augmentees > 1 ? "s" : "") + " augmentée" +
        (i.augmentees > 1 ? "s" : "") + " sur " + i.retours + " retour" +
        (i.retours > 1 ? "s" : "") + " de congé de maternité, soit " +
        String(i.resultat).replace(".", ",") + " %.";
    if (i.cle === "hautes")
      return "Parmi les dix plus hautes rémunérations : " + i.femmes + " femme" +
        (i.femmes > 1 ? "s" : "") + " et " + i.hommes + " homme" + (i.hommes > 1 ? "s" : "") +
        ", soit " + i.resultat + " pour le sexe sous-représenté.";
    return "";
  }

  /* LES CHIFFRES QUE L'APPLICATION NE DÉTIENT PAS. Le registre ne dit pas qui a
     été augmenté, ni qui est revenu de congé de maternité : ces champs-là sont
     les seuls à remplir, et ils sont retenus d'une fois sur l'autre. */
  function chiffresHtml(e, r) {

    if (r.annexe === "II") {
      h += '<div class="ix-s"><span class="n">Augmentations individuelles de l\'année ' +
        e.annee + '</span><span class="e">Toutes les augmentations individuelles du salaire ' +
        "de base, qu'elles correspondent ou non à une promotion. Effectif pris en compte : " +
        f + " femmes, " + m + " hommes.</span>" +
        '<div class="deux"><label>Femmes augmentées' +
        '<input type="number" min="0" max="9999" data-ix="aug2.f" value="' +
        ech(IX.aug2.f === undefined ? "" : IX.aug2.f) + '"></label>' +
        '<label>Hommes augmentés<input type="number" min="0" max="9999" data-ix="aug2.h" value="' +
        ech(IX.aug2.h === undefined ? "" : IX.aug2.h) + '"></label></div></div>';
    } else {
      h += '<div class="ix-s"><span class="n">Augmentations hors promotion, et promotions</span>' +

        "moins dix femmes et dix hommes entrent dans le calcul ; les autres sont laissées " +
        "vides.</span>";
      window.IndexEgalite.CSP.forEach(function (c) {
        var nf = e.salaries.filter(function (s) { return !s.ecarte && s.csp === c.cle && s.sexe === "F"; }).length;
        var nh = e.salaries.filter(function (s) { return !s.ecarte && s.csp === c.cle && s.sexe === "H"; }).length;
        var pris = nf >= 10 && nh >= 10;
        h += '<div class="ix-s' + (pris ? "" : " ix-hors") + '"><span class="n">' + c.nom +
          '</span><span class="e">' + nf + " femmes, " + nh + " hommes" +
          (pris ? "" : " : catégorie non retenue, il en faut dix de chaque") + "</span>";
        if (pris)
          h += '<div class="deux"><label>Femmes augmentées hors promotion' +
            '<input type="number" min="0" data-ix="aug.' + c.cle + '.f" value="' +
            ech(((IX.aug[c.cle] || {}).f) === undefined ? "" : IX.aug[c.cle].f) + '"></label>' +
            '<label>Hommes augmentés hors promotion<input type="number" min="0" data-ix="aug.' +
            c.cle + '.h" value="' + ech(((IX.aug[c.cle] || {}).h) === undefined ? "" : IX.aug[c.cle].h) +
            '"></label><label>Femmes promues<input type="number" min="0" data-ix="promo.' + c.cle +
            '.f" value="' + ech(((IX.promo[c.cle] || {}).f) === undefined ? "" : IX.promo[c.cle].f) +
            '"></label><label>Hommes promus<input type="number" min="0" data-ix="promo.' + c.cle +
            '.h" value="' + ech(((IX.promo[c.cle] || {}).h) === undefined ? "" : IX.promo[c.cle].h) +
            "\"></label></div>";
        h += "</div>";
      });
      h += "</div>";
    }
    h += '<div class="ix-s"><span class="n">Retours de congé de maternité</span>' +
      '<span class="e">Les salariées revenues de congé de maternité pendant l\'année ' + e.annee +
      ", et celles qui ont été augmentées à leur retour.</span>" +
      '<div class="deux"><label>Retours dans l\'année' +
      '<input type="number" min="0" data-ix="mat.retours" value="' +
      ech(IX.mat.retours === undefined ? "" : IX.mat.retours) + '"></label>' +
      '<label>Augmentées à leur retour<input type="number" min="0" data-ix="mat.augmentees" value="' +
      ech(IX.mat.augmentees === undefined ? "" : IX.mat.augmentees) + '"></label>' +
      "<label>Des augmentations sont-elles intervenues pendant ces congés ?" +
      '<select data-ix="mat.pendant"><option value="">à répondre</option>' +
      '<option value="oui"' + (IX.mat.pendant === "oui" ? " selected" : "") + ">oui</option>" +
      '<option value="non"' + (IX.mat.pendant === "non" ? " selected" : "") + ">non</option>" +
      "</select></label></div></div>";
    return h;
  }

  /* LES SALARIÉS. Une carte par personne : la catégorie, la rémunération, et la
     case qui l'écarte du calcul. */
  function salariesHtml(e) {
    if (!e.salaries.length)
      return '<p class="aide">Le registre du personnel ne porte aucun salarié présent en ' +
        e.annee + ". Inscrivez-les au registre, et le calcul se fera ici, nom par nom.</p>";
    var sansRem = e.salaries.filter(function (s) {
      return !s.ecarte && !(isFinite(s.rem) && s.rem > 0); }).length;
    var h = "";
    if (sansRem)
      h += '<p class="aide">' + sansRem + " salarié" + (sansRem > 1 ? "s" : "") +
        " sans rémunération connue : " + (sansRem > 1 ? "ils ne comptent" : "il ne compte") +
        " dans aucun groupe. L'écran des minima, dans les contrats, relève les taux horaires ; " +
        "ils se portent aussi ici.</p>";
    e.salaries.forEach(function (s) {
      var mien = IX.sal[s.id] || {};
      h += '<div class="ix-s' + (s.ecarte ? " ix-hors" : "") + '"><span class="n">' +
        ech(s.nom.trim()) + "</span>" +
        '<span class="e">' + ech(s.emp || "emploi non renseigné") +
        (s.sexe ? "" : " · sexe non renseigné au registre") +
        (s.coef ? " · " + ech(s.coef) : " · sans coefficient") +
        (s.motif ? " · écarté : " + ech(s.motif) : "") + "</span>";
      h += '<div class="deux"><label>Catégorie socioprofessionnelle' +
        (s.proposee ? " (proposée)" : "") + '<select data-sal="' + ech(s.id) + '" data-ch="csp">' +
        '<option value="">à choisir</option>' +
        window.IndexEgalite.CSP.map(function (c) {
          return '<option value="' + c.cle + '"' + (s.csp === c.cle ? " selected" : "") + ">" +
            ech(c.nom) + "</option>";
        }).join("") + "</select></label>" +
        "<label>" + (e.unite === "horaire" ? "Taux horaire brut" : "Rémunération annuelle brute") +
        '<input type="text" inputmode="decimal" data-sal="' + ech(s.id) + '" data-ch="' +
        (e.unite === "horaire" ? "rem" : "remAn") + '" value="' +
        ech(isFinite(s.rem) && s.rem > 0 ? String(s.rem).replace(".", ",") : "") +
        '" placeholder="' + (e.unite === "horaire" ? "par exemple 12,45" : "par exemple 26 400") +
        '"></label></div>';
      if (!/apprenti|professionnalisation/.test(s.motif))
        h += '<label class="case"><input type="checkbox" data-sal="' + ech(s.id) +
          '" data-ch="ecarte"' + (mien.ecarte ? " checked" : "") + "> " +
          "À écarter : absent plus de la moitié de l'année, mis à disposition ou expatrié</label>";
      h += "</div>";
    });
    return h;
  }

  /* LES GROUPES DE COMPARAISON, pour que le chiffre soit vérifiable. */
  function groupesHtml(e, r) {
    var un = r.indicateurs[0];
    if (!un.groupes.length)
      return '<p class="aide">Aucun groupe : il manque la catégorie, la date de naissance ou ' +
        "la rémunération.</p>";
    var h = '<div class="tab"><table><caption>Comparaison par ' +
      (un.base === "coef" ? "coefficient" : "catégorie socioprofessionnelle") +
      " et par tranche d'âge, seuil de pertinence de " + un.seuil +
      " %.</caption><thead><tr><th>Groupe</th><th>F</th><th>H</th><th>Moyenne F</th>" +
      "<th>Moyenne H</th><th>Écart</th><th>Après seuil</th></tr></thead><tbody>";
    un.groupes.forEach(function (g) {
      h += "<tr><td>" + ech(g.nom) + (g.pris ? "" : " (non retenu)") + "</td><td>" + g.nbF +
        "</td><td>" + g.nbH + "</td>";
      if (!g.pris) { h += '<td colspan="4">il faut trois femmes et trois hommes</td></tr>'; return; }
      h += "<td>" + euros(g.moyF) + "</td><td>" + euros(g.moyH) + "</td><td>" +
        String(Math.round(g.ecart * 10) / 10).replace(".", ",") + " %</td><td>" +
        String(Math.round(g.ajuste * 10) / 10).replace(".", ",") + " %</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  /* Les textes de l'index, avec leur identifiant de version. */
  var TEXTES_IX = [
    ["L. 1142-8", "LEGIARTI000044605453",
     "publication annuelle de l'ensemble des indicateurs relatifs aux écarts de rémunération"],

    ["D. 1142-3", "LEGIARTI000038026019",

    ["D. 1142-4", "LEGIARTI000045250060",

  ];
  function sourcesIx() {
    var h = "<div>Code du travail, lu au relais Légifrance le 28 septembre 2026, deux lectures " +
      "concordantes par article. Les articles D. 1142-2 à D. 1142-11 portent l'état « abrogé à " +
      "effet différé » : ils sont applicables à ce jour. Les annexes I et II ne sont pas servies " +
      "par le relais, qui ne connaît que les articles numérotés : leur texte a été lu dans la " +

  /* LE RELEVÉ EN WORD. Ce qui a été calculé, daté, avec les groupes : un index
     publié sans son calcul ne se défend pas devant l'inspection. */
  function motsIx() {
    var e = DERNIER.entree, r = DERNIER.sortie;
    var items = [
      { k: "sur", t: [nomSociete(), profil.siret ? "SIRET " + profil.siret : ""]

        : r.effectif + " salariés") + ". Indicateurs de l'article " + r.article +
        ", calculés selon l'annexe " + r.annexe + " du chapitre II bis. Salariés pris en compte : " +
        r.pris + (r.ecartes ? ", " + r.ecartes + " écartés (apprentis, contrats de " +

      { k: "p", t: "Base de comparaison des rémunérations : " + nomUnite(e) +

        "accessoires payés par l'employeur en raison de l'emploi (L. 3221-3) ; elle est " +
        "reconstituée en équivalent temps plein." },
      { k: "h1", t: "Le niveau de résultat" },
      { k: "p", t: r.etat === "calcule"
        ? "Niveau de résultat : " + r.niveau + " points sur 100" +
          (r.proportionnalite ? ", obtenus par proportionnalité à partir de " + r.points +
            " points sur " + r.maxAtteint + " atteignables" : "") + "."
        : (r.etat === "indeterminable"
          ? "Le niveau de résultat ne peut pas être déterminé : le maximum atteignable, " +
            r.maxAtteint + " points, est inférieur à soixante-quinze points (annexe " +

          : "Le niveau de résultat n'est pas encore déterminé : " + r.manquants +
            " indicateur(s) attendent un chiffre que l'entreprise seule détient.") },
      { k: "table", head: ["Indicateur", "Résultat", "Points", "Maximum"],
        rows: r.indicateurs.map(function (i) {
          return [i.nom,
            i.etat === "calcule" ? direIx(i, e)
              : (i.etat === "incalculable" ? "Non calculable : " + i.pourquoi
                                          : "Il manque : " + i.pourquoi),
            i.etat === "calcule" ? String(i.points) : "-", String(i.max)];
        }) }
    ];
    var un = r.indicateurs[0];
    if (un.groupes.length) {
      items.push({ k: "h1", t: "Les groupes de comparaison" });
      items.push({ k: "p", t: "Comparaison par " +
        (un.base === "coef" ? "coefficient ou niveau hiérarchique" : "catégorie socioprofessionnelle") +
        " et par tranche d'âge. Seuil de pertinence de " + un.seuil +
        " %. Seuls les groupes comptant au moins trois femmes et trois hommes sont retenus." });
      items.push({ k: "table",
        head: ["Groupe", "Femmes", "Hommes", "Moyenne femmes", "Moyenne hommes", "Écart", "Après seuil"],
        rows: un.groupes.map(function (g) {
          if (!g.pris) return [g.nom, String(g.nbF), String(g.nbH), "-", "-", "non retenu", "-"];
          return [g.nom, String(g.nbF), String(g.nbH), euros(g.moyF), euros(g.moyH),
            String(Math.round(g.ecart * 10) / 10).replace(".", ",") + " %",

    items.push({ k: "puce", t: "Publication du niveau de résultat et du résultat de chaque " +
      "indicateur au plus tard le 1er mars " + (r.annee + 1) + ", de manière visible et lisible, " +
      "sur le site internet de l'entreprise lorsqu'il en existe un, et à défaut par tout moyen " +
      "(D. 1142-4)." });
    items.push({ k: "puce", t: "Mise à disposition du comité social et économique, les résultats " +
      "présentés par catégorie socioprofessionnelle, niveau ou coefficient hiérarchique, avec la " +
      "méthodologie appliquée et la répartition des salariés (D. 1142-5)." });
    items.push({ k: "puce", t: "Télédéclaration aux services du ministre chargé du travail " +
      "(D. 1142-5)." });
    if (r.etat === "calcule" && r.niveau < 75)
      items.push({ k: "puce", t: "Niveau inférieur à soixante-quinze points : mesures de " +
        "correction et, le cas échéant, programmation de mesures financières de rattrapage " +
        "salarial, par accord ou par décision de l'employeur après consultation du comité, " +
        "déposée auprès de l'autorité administrative et publiée (D. 1142-6, L. 1142-9)." });
    items.push({ k: "p", t: "Fait à " + ville() + ", le " + dateFr(new Date()) });
    items.push({ k: "p", t: signataire() + "\n" + nomSociete() });
    return items;
  }

  /* ═══════════════════════════════════════════════════════════ le câblage */
  function ouvrirIx(ouvert) {
    $("#ecran-doc").hidden = !!ouvert;
    $("#ecran-index").hidden = !ouvert;
    if (ouvert) { rendreIx(); window.scrollTo(0, 0); }
    else { rendre(); window.scrollTo(0, 0); }
  }
  (function departIx() {
    var eff = effectif();
    $("#vers-index").hidden = !(eff !== null && eff >= 50);
    $("#ix-annee").value = IX.annee || new Date().getFullYear() - 1;
    $("#ix-base").value = IX.base === "csp" ? "csp" : "coef";
    $("#ix-unite").value = IX.unite === "annuel" ? "annuel" : "horaire";
  })();
  $("#vers-index").addEventListener("click", function () { ouvrirIx(true); });
  $("#ix-retour").addEventListener("click", function () { ouvrirIx(false); });
  $("#ix-champs").addEventListener("change", function () {
    IX.annee = Number($("#ix-annee").value) || IX.annee;
    IX.base = $("#ix-base").value;
    IX.unite = $("#ix-unite").value;
    garderIx(IX);
    rendreIx();
  });
  $("#ix-champs").addEventListener("input", function () {
    IX.annee = Number($("#ix-annee").value) || IX.annee;
    garderIx(IX);
    rendreIx();
  });

  /* La saisie des chiffres et des salariés. Un seul écouteur, sur la section :
     les cartes sont réécrites à chaque frappe, un écouteur par champ ne
     survivrait pas. */
  function poser(chemin, valeur) {
    var p = String(chemin).split(".");
    var o = IX;
    for (var i = 0; i < p.length - 1; i++) { o[p[i]] = o[p[i]] || {}; o = o[p[i]]; }
    o[p[p.length - 1]] = valeur;
  }
  $("#ecran-index").addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var ch = t.getAttribute("data-ix");
    if (ch) { poser(ch, t.value); garderIx(IX); rendreIx(); return; }
    var id = t.getAttribute("data-sal");
    if (!id) return;
    var quoi = t.getAttribute("data-ch");
    IX.sal[id] = IX.sal[id] || {};
    if (quoi === "ecarte") IX.sal[id].ecarte = !!t.checked;
    else IX.sal[id][quoi] = t.value;
    garderIx(IX);
    /* Une case cochée change la liste des salariés retenus : la carte, elle,
       reste en place. */
    rendreIx(true);
  });

  $("#ix-word").addEventListener("click", function () {
    if (!DERNIER) return;
    window.AuditExport.telecharger(
      window.AuditExport.docx(motsIx(), "Index de l'égalité professionnelle", { sansTitre: true }),
      "index-egalite-" + new Date().toISOString().slice(0, 10) + ".docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });

  /* Le plan d'action lit le même calcul : la section des indicateurs porte le
     chiffre au lieu du crochet dès qu'il est déterminé. */
  function resultatIndex() {
    if (!window.IndexEgalite) return null;
    try {
      var sauve = $("#ix-annee");
      if (!sauve) return null;
      return window.IndexEgalite.calculer(entreeIx());
    } catch (e) { return null; }
  }

  rendre();
})();
</script>
<script>
  if ("serviceWorker" in navigator)
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
</script>
